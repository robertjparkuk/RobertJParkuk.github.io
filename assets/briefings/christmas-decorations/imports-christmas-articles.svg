<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">UK imports of Christmas articles, 2025, by country (£ million)</title><desc id="d">China 206.7; Netherlands 15.2; India 5.3; Hong Kong 3.7; Poland 3.6; Vietnam 2.6; Denmark 2.5; all others 12.7. Total 252.3 million pounds. China is 81.9 per cent by value and 91.3 per cent by weight.</desc><rect width="720" height="400" fill="#fff"/><text x="0" y="22" font-size="17" font-weight="700" fill="#1A1A1A">UK imports of Christmas articles, 2025, by country (£ million)</text><text x="250" y="73.68" font-size="13" text-anchor="end" fill="#1A1A1A">China</text><g><title>China: £206.7m (81.9%)</title><rect x="260" y="56" width="285.0" height="26" rx="4" fill="#A61C1C"/></g><text x="553.0" y="73.68" font-size="13" fill="#1A1A1A" font-weight="600">£206.7m (81.9%)</text><text x="250" y="111.68" font-size="13" text-anchor="end" fill="#1A1A1A">Netherlands</text><g><title>Netherlands: £15.2m</title><rect x="260" y="94" width="21.0" height="26" rx="4" fill="#8C8C8C"/></g><text x="289.0" y="111.68" font-size="13" fill="#1A1A1A" font-weight="600">£15.2m</text><text x="250" y="149.68" font-size="13" text-anchor="end" fill="#1A1A1A">India</text><g><title>India: £5.3m</title><rect x="260" y="132" width="7.3" height="26" rx="4" fill="#8C8C8C"/></g><text x="275.3" y="149.68" font-size="13" fill="#1A1A1A" font-weight="600">£5.3m</text><text x="250" y="187.68" font-size="13" text-anchor="end" fill="#1A1A1A">Hong Kong</text><g><title>Hong Kong: £3.7m</title><rect x="260" y="170" width="5.1" height="26" rx="4" fill="#8C8C8C"/></g><text x="273.1" y="187.68" font-size="13" fill="#1A1A1A" font-weight="600">£3.7m</text><text x="250" y="225.68" font-size="13" text-anchor="end" fill="#1A1A1A">Poland</text><g><title>Poland: £3.6m</title><rect x="260" y="208" width="5.0" height="26" rx="4" fill="#8C8C8C"/></g><text x="273.0" y="225.68" font-size="13" fill="#1A1A1A" font-weight="600">£3.6m</text><text x="250" y="263.68" font-size="13" text-anchor="end" fill="#1A1A1A">Vietnam</text><g><title>Vietnam: £2.6m</title><rect x="260" y="246" width="3.6" height="26" rx="4" fill="#8C8C8C"/></g><text x="271.6" y="263.68" font-size="13" fill="#1A1A1A" font-weight="600">£2.6m</text><text x="250" y="301.68" font-size="13" text-anchor="end" fill="#1A1A1A">Denmark</text><g><title>Denmark: £2.5m</title><rect x="260" y="284" width="3.4" height="26" rx="4" fill="#8C8C8C"/></g><text x="271.4" y="301.68" font-size="13" fill="#1A1A1A" font-weight="600">£2.5m</text><text x="250" y="339.68" font-size="13" text-anchor="end" fill="#1A1A1A">All others</text><g><title>All others: £12.7m</title><rect x="260" y="322" width="17.5" height="26" rx="4" fill="#8C8C8C"/></g><text x="285.5" y="339.68" font-size="13" fill="#1A1A1A" font-weight="600">£12.7m</text><line x1="260" y1="50" x2="260" y2="366" stroke="#1A1A1A" stroke-width="1"/><text x="0" y="390" font-size="11" fill="#5A5A5A">HMRC Overseas Trade Statistics, code 9505 10, calendar 2025 (total £252.3m; 48,520 tonnes). EU figures are by country of dispatch.</text></svg>