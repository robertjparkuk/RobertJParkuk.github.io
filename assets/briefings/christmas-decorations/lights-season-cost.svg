<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 286" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Running one string of lights for the season, Northern Ireland prices</title><desc id="d">Cost of 240 hours (6 hours a day for 40 days) at the Power NI unit rate of 34.15p per kWh including VAT, with the GB price cap rate of 26.32p in brackets. C9 incandescent string £14.34; C7 £10.25; mini incandescent £3.28; LED 100-bulb £1.64; LED 70-bulb £0.16.</desc><rect width="720" height="286" fill="#fff"/><text x="0" y="22" font-size="17" font-weight="700" fill="#1A1A1A">Running one string of lights for the season, Northern Ireland prices</text><text x="250" y="73.68" font-size="13" text-anchor="end" fill="#1A1A1A">C9 bulbs, 25 × 7 W</text><g><title>C9 bulbs, 25 × 7 W: £14.34 (GB £11.05)</title><rect x="260" y="56" width="285.0" height="26" rx="4" fill="#A61C1C"/></g><text x="553.0" y="73.68" font-size="13" fill="#1A1A1A" font-weight="600">£14.34 (GB £11.05)</text><text x="250" y="111.68" font-size="13" text-anchor="end" fill="#1A1A1A">C7 bulbs, 25 × 5 W</text><g><title>C7 bulbs, 25 × 5 W: £10.25 (GB £7.90)</title><rect x="260" y="94" width="203.6" height="26" rx="4" fill="#A61C1C"/></g><text x="471.6" y="111.68" font-size="13" fill="#1A1A1A" font-weight="600">£10.25 (GB £7.90)</text><text x="250" y="149.68" font-size="13" text-anchor="end" fill="#1A1A1A">Mini incandescent, 100 bulbs (≈40 W)*</text><g><title>Mini incandescent, 100 bulbs (≈40 W)*: £3.28 (GB £2.53)</title><rect x="260" y="132" width="65.1" height="26" rx="4" fill="#A61C1C"/></g><text x="333.1" y="149.68" font-size="13" fill="#1A1A1A" font-weight="600">£3.28 (GB £2.53)</text><text x="250" y="187.68" font-size="13" text-anchor="end" fill="#1A1A1A">LED, 100 bulbs (Energy Star ceiling 20 W)</text><g><title>LED, 100 bulbs (Energy Star ceiling 20 W): £1.64 (GB £1.26)</title><rect x="260" y="170" width="32.6" height="26" rx="4" fill="#8C8C8C"/></g><text x="300.6" y="187.68" font-size="13" fill="#1A1A1A" font-weight="600">£1.64 (GB £1.26)</text><text x="250" y="225.68" font-size="13" text-anchor="end" fill="#1A1A1A">LED, 70 bulbs (2 W)</text><g><title>LED, 70 bulbs (2 W): £0.16 (GB £0.13)</title><rect x="260" y="208" width="3.3" height="26" rx="4" fill="#8C8C8C"/></g><text x="271.3" y="225.68" font-size="13" fill="#1A1A1A" font-weight="600">£0.16 (GB £0.13)</text><line x1="260" y1="50" x2="260" y2="252" stroke="#1A1A1A" stroke-width="1"/><text x="0" y="276" font-size="11" fill="#5A5A5A">240 hours. Power NI 34.15p/kWh incl. VAT (from 1 Jul 2026); GB cap 26.32p (1 Oct–31 Dec 2026). *Assumed.</text></svg>