<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Years an artificial tree must be reused to beat a real tree on climate, by study</title><desc id="d">Ellipsos 2009: about 20 years. Carbon Trust advice 2023: 7 to 20 years. Dovetail 2018: 15 to 20 years on climate alone. Figures quoted by BCTGA and attributed to the Carbon Trust: 11.4 years against a chipped real tree. PE Americas 2010 (paid for by the American Christmas Tree Association): 4 to 9 years. WAP Sustainability 2018 (same funder): 5 years.</desc><rect width="720" height="392" fill="#fff"/><text x="0" y="22" font-size="17" font-weight="700" fill="#1A1A1A">Years of reuse before an artificial tree beats a real one</text><line x1="300.0" y1="48" x2="300.0" y2="342" stroke="#E6E2E0"/><text x="300.0" y="358" font-size="12" text-anchor="middle" fill="#5A5A5A">0</text><line x1="372.5" y1="48" x2="372.5" y2="342" stroke="#E6E2E0"/><text x="372.5" y="358" font-size="12" text-anchor="middle" fill="#5A5A5A">5</text><line x1="445.0" y1="48" x2="445.0" y2="342" stroke="#E6E2E0"/><text x="445.0" y="358" font-size="12" text-anchor="middle" fill="#5A5A5A">10</text><line x1="517.5" y1="48" x2="517.5" y2="342" stroke="#E6E2E0"/><text x="517.5" y="358" font-size="12" text-anchor="middle" fill="#5A5A5A">15</text><line x1="590.0" y1="48" x2="590.0" y2="342" stroke="#E6E2E0"/><text x="590.0" y="358" font-size="12" text-anchor="middle" fill="#5A5A5A">20</text><text x="290" y="69.2" font-size="13" text-anchor="end" fill="#1A1A1A">Ellipsos, Canada (2009)</text><text x="290" y="83.2" font-size="11" text-anchor="end" fill="#5A5A5A">Funder not stated</text><g><title>Ellipsos, Canada (2009): about 20 years (Funder not stated)</title><rect x="585.0" y="56" width="10.0" height="24" rx="4" fill="#1A1A1A"/></g><text x="600.0" y="72.32" font-size="13" font-weight="600" fill="#1A1A1A">about 20 yrs</text><text x="290" y="115.2" font-size="13" text-anchor="end" fill="#1A1A1A">Carbon Trust&#x27;s own advice (2023)</text><text x="290" y="129.2" font-size="11" text-anchor="end" fill="#5A5A5A">Carbon Trust</text><g><title>Carbon Trust&#x27;s own advice (2023): 7–20 years (Carbon Trust)</title><rect x="396.5" y="102" width="198.5" height="24" rx="4" fill="#1A1A1A"/></g><text x="600.0" y="118.32" font-size="13" font-weight="600" fill="#1A1A1A">7–20 yrs</text><text x="290" y="161.2" font-size="13" text-anchor="end" fill="#1A1A1A">Dovetail review (2018), climate only</text><text x="290" y="175.2" font-size="11" text-anchor="end" fill="#5A5A5A">Non-profit review</text><g><title>Dovetail review (2018), climate only: 15–20 years (Non-profit review)</title><rect x="512.5" y="148" width="82.5" height="24" rx="4" fill="#1A1A1A"/></g><text x="600.0" y="164.32" font-size="13" font-weight="600" fill="#1A1A1A">15–20 yrs</text><text x="290" y="207.2" font-size="13" text-anchor="end" fill="#1A1A1A">Quoted figures, chipped (computed)</text><text x="290" y="221.2" font-size="11" text-anchor="end" fill="#5A5A5A">BCTGA, attributed to Carbon Trust</text><g><title>Quoted figures, chipped (computed): 11.4 years (BCTGA, attributed to Carbon Trust)</title><rect x="460.3" y="194" width="10.0" height="24" rx="4" fill="#1A1A1A"/></g><text x="475.3" y="210.32" font-size="13" font-weight="600" fill="#1A1A1A">11.4 yrs</text><text x="290" y="253.2" font-size="13" text-anchor="end" fill="#1A1A1A">PE Americas (2010)</text><text x="290" y="267.2" font-size="11" text-anchor="end" fill="#5A5A5A">Paid for by artificial-tree trade body</text><g><title>PE Americas (2010): 4–9 years (Paid for by artificial-tree trade body)</title><rect x="353.0" y="240" width="82.5" height="24" rx="4" fill="#A61C1C"/></g><text x="440.5" y="256.32" font-size="13" font-weight="600" fill="#1A1A1A">4–9 yrs</text><text x="290" y="299.2" font-size="13" text-anchor="end" fill="#1A1A1A">WAP Sustainability (2018)</text><text x="290" y="313.2" font-size="11" text-anchor="end" fill="#5A5A5A">Paid for by artificial-tree trade body</text><g><title>WAP Sustainability (2018): 5 years (Paid for by artificial-tree trade body)</title><rect x="367.5" y="286" width="10.0" height="24" rx="4" fill="#A61C1C"/></g><text x="382.5" y="302.32" font-size="13" font-weight="600" fill="#1A1A1A">5 yrs</text><text x="0" y="384" font-size="11" fill="#5A5A5A">Red: paid for by the American Christmas Tree Association, the artificial-tree makers' body.</text></svg>