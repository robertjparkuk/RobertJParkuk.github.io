<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Maximum fixed penalties: Northern Ireland and England</title><desc id="d">Fly-tipping: England up to £5,000 since 1 September 2026; Northern Ireland up to £400. Dropping litter: England up to £750 since 1 September 2026; Northern Ireland up to £200 since 30 December 2022.</desc><rect width="720" height="248" fill="#fff"/><text x="0" y="22" font-size="17" font-weight="700" fill="#1A1A1A">Maximum fixed penalties: Northern Ireland and England</text><text x="250" y="73.68" font-size="13" text-anchor="end" fill="#1A1A1A">Fly-tipping, England</text><g><title>Fly-tipping, England: £5,000</title><rect x="260" y="56" width="285.0" height="26" rx="4" fill="#8C8C8C"/></g><text x="553.0" y="73.68" font-size="13" fill="#1A1A1A" font-weight="600">£5,000</text><text x="250" y="111.68" font-size="13" text-anchor="end" fill="#1A1A1A">Fly-tipping, Northern Ireland</text><g><title>Fly-tipping, Northern Ireland: £400</title><rect x="260" y="94" width="22.8" height="26" rx="4" fill="#A61C1C"/></g><text x="290.8" y="111.68" font-size="13" fill="#1A1A1A" font-weight="600">£400</text><text x="250" y="149.68" font-size="13" text-anchor="end" fill="#1A1A1A">Litter, England</text><g><title>Litter, England: £750</title><rect x="260" y="132" width="42.8" height="26" rx="4" fill="#8C8C8C"/></g><text x="310.8" y="149.68" font-size="13" fill="#1A1A1A" font-weight="600">£750</text><text x="250" y="187.68" font-size="13" text-anchor="end" fill="#1A1A1A">Litter, Northern Ireland</text><g><title>Litter, Northern Ireland: £200</title><rect x="260" y="170" width="11.4" height="26" rx="4" fill="#A61C1C"/></g><text x="279.4" y="187.68" font-size="13" fill="#1A1A1A" font-weight="600">£200</text><line x1="260" y1="50" x2="260" y2="214" stroke="#1A1A1A" stroke-width="1"/><text x="0" y="238" font-size="11" fill="#5A5A5A">England: S.I. 2026/816, from 1 Sep 2026 (GOV.UK, 15 Jul 2026). NI: SR 2012/35 as amended; 1997 Order, art. 4A.</text></svg>