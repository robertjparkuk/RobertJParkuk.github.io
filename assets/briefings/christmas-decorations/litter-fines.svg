<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 172" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Maximum fixed penalty for dropping litter</title><desc id="d">England: up to £500 since 31 July 2023. Northern Ireland: up to £200 since 30 December 2022.</desc><rect width="720" height="172" fill="#fff"/><text x="0" y="22" font-size="17" font-weight="700" fill="#1A1A1A">Maximum fixed penalty for dropping litter</text><text x="250" y="73.68" font-size="13" text-anchor="end" fill="#1A1A1A">England (since 31 Jul 2023)</text><g><title>England (since 31 Jul 2023): £500</title><rect x="260" y="56" width="285.0" height="26" rx="4" fill="#8C8C8C"/></g><text x="553.0" y="73.68" font-size="13" fill="#1A1A1A" font-weight="600">£500</text><text x="250" y="111.68" font-size="13" text-anchor="end" fill="#1A1A1A">Northern Ireland (since 30 Dec 2022)</text><g><title>Northern Ireland (since 30 Dec 2022): £200</title><rect x="260" y="94" width="114.0" height="26" rx="4" fill="#A61C1C"/></g><text x="382.0" y="111.68" font-size="13" fill="#1A1A1A" font-weight="600">£200</text><line x1="260" y1="50" x2="260" y2="138" stroke="#1A1A1A" stroke-width="1"/><text x="0" y="162" font-size="11" fill="#5A5A5A">SI 2023/770 (England); SR 2012/35 reg 3 as amended by SR 2022/302 (NI). Councils set the amount within the range.</text></svg>