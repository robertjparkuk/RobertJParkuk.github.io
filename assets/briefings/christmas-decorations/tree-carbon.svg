<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Carbon footprint of a 2 m Christmas tree (kg CO2e)</title><desc id="d">Artificial PVC tree about 40 kg CO2e; real tree landfilled about 16 kg; real tree chipped about 3.5 kg.</desc><rect width="720" height="210" fill="#fff"/><text x="0" y="22" font-size="17" font-weight="700" fill="#1A1A1A">Carbon footprint of a 2 m Christmas tree (kg CO2e)</text><text x="250" y="73.68" font-size="13" text-anchor="end" fill="#1A1A1A">Artificial (PVC), made once</text><g><title>Artificial (PVC), made once: ≈40 kg</title><rect x="260" y="56" width="285.0" height="26" rx="4" fill="#8C8C8C"/></g><text x="553.0" y="73.68" font-size="13" fill="#1A1A1A" font-weight="600">≈40 kg</text><text x="250" y="111.68" font-size="13" text-anchor="end" fill="#1A1A1A">Real, sent to landfill</text><g><title>Real, sent to landfill: ≈16 kg</title><rect x="260" y="94" width="114.0" height="26" rx="4" fill="#A61C1C"/></g><text x="382.0" y="111.68" font-size="13" fill="#1A1A1A" font-weight="600">≈16 kg</text><text x="250" y="149.68" font-size="13" text-anchor="end" fill="#1A1A1A">Real, chipped or burned</text><g><title>Real, chipped or burned: ≈3.5 kg</title><rect x="260" y="132" width="24.9" height="26" rx="4" fill="#A61C1C"/></g><text x="292.9" y="149.68" font-size="13" fill="#1A1A1A" font-weight="600">≈3.5 kg</text><line x1="260" y1="50" x2="260" y2="176" stroke="#1A1A1A" stroke-width="1"/><text x="0" y="200" font-size="11" fill="#5A5A5A">As quoted by the British Christmas Tree Growers Association (trade body), attributed to the Carbon Trust. Unverified at source.</text></svg>