<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Fires involving Christmas decorations, England and Wales, 24–31 December 1959</title><desc id="d">Fourteen fires: naked lights 5, electrical faults 4, decorations falling on fires 4, soot 1.</desc><rect width="720" height="248" fill="#fff"/><text x="0" y="22" font-size="17" font-weight="700" fill="#1A1A1A">Fires involving Christmas decorations, England and Wales, 24–31 December 1959</text><text x="250" y="73.68" font-size="13" text-anchor="end" fill="#1A1A1A">Naked lights (candles, matches)</text><g><title>Naked lights (candles, matches): 5</title><rect x="260" y="56" width="285.0" height="26" rx="4" fill="#A61C1C"/></g><text x="553.0" y="73.68" font-size="13" fill="#1A1A1A" font-weight="600">5</text><text x="250" y="111.68" font-size="13" text-anchor="end" fill="#1A1A1A">Electrical faults</text><g><title>Electrical faults: 4</title><rect x="260" y="94" width="228.0" height="26" rx="4" fill="#A61C1C"/></g><text x="496.0" y="111.68" font-size="13" fill="#1A1A1A" font-weight="600">4</text><text x="250" y="149.68" font-size="13" text-anchor="end" fill="#1A1A1A">Decorations fell on fires</text><g><title>Decorations fell on fires: 4</title><rect x="260" y="132" width="228.0" height="26" rx="4" fill="#A61C1C"/></g><text x="496.0" y="149.68" font-size="13" fill="#1A1A1A" font-weight="600">4</text><text x="250" y="187.68" font-size="13" text-anchor="end" fill="#1A1A1A">Soot</text><g><title>Soot: 1</title><rect x="260" y="170" width="57.0" height="26" rx="4" fill="#A61C1C"/></g><text x="325.0" y="187.68" font-size="13" fill="#1A1A1A" font-weight="600">1</text><line x1="260" y1="50" x2="260" y2="214" stroke="#1A1A1A" stroke-width="1"/><text x="0" y="238" font-size="11" fill="#5A5A5A">Hansard, written answer, 8 December 1960.</text></svg>