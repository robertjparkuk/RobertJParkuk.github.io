<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" role="img" aria-labelledby="t2 d2" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t2">Northern Ireland greenhouse gas emissions by sector, 2024: what the carbon deal touches</title><desc id="d2">Agriculture 31.4 per cent, transport 21.3 per cent and buildings 15.5 per cent are outside any emissions trading scheme, apart from larger ships. Power and industry, about a sixth, are the sectors the deal touches.</desc><rect width="720" height="294" fill="#fff"/><text x="0" y="22" font-size="17" font-weight="700" fill="#1A1A1A">The deal touches about a sixth of NI's emissions</text><text x="0" y="42" font-size="13" fill="#5A5A5A">Share of Northern Ireland's greenhouse gas emissions, 2024. </text><rect x="0" y="52" width="12" height="12" fill="#A61C1C"/><text x="18" y="63" font-size="12" fill="#1A1A1A">Power stations and larger industrial sites: in an ETS</text><rect x="290" y="52" width="12" height="12" fill="#8C8C8C"/><text x="308" y="63" font-size="12" fill="#1A1A1A">Outside any scheme (larger ships aside, since July 2026)</text><text x="190" y="97" font-size="14" text-anchor="end" fill="#1A1A1A">Agriculture</text><g><title>Agriculture: 31.4% of NI emissions</title><rect x="200" y="80" width="331.9" height="24" rx="4" fill="#8C8C8C"/></g><text x="539.9" y="97" font-size="14" font-weight="600" fill="#1A1A1A">31.4%</text><text x="190" y="137" font-size="14" text-anchor="end" fill="#1A1A1A">Transport</text><g><title>Transport: 21.3% of NI emissions</title><rect x="200" y="120" width="225.2" height="24" rx="4" fill="#8C8C8C"/></g><text x="433.2" y="137" font-size="14" font-weight="600" fill="#1A1A1A">21.3%</text><text x="190" y="177" font-size="14" text-anchor="end" fill="#1A1A1A">Buildings</text><g><title>Buildings: 15.5% of NI emissions</title><rect x="200" y="160" width="163.9" height="24" rx="4" fill="#8C8C8C"/></g><text x="371.9" y="177" font-size="14" font-weight="600" fill="#1A1A1A">15.5%</text><text x="190" y="217" font-size="14" text-anchor="end" fill="#1A1A1A">Power and industry</text><g><title>Power and industry: about a sixth of NI emissions</title><rect x="200" y="200" width="176.5" height="24" rx="4" fill="#A61C1C"/></g><text x="384.5" y="217" font-size="14" font-weight="600" fill="#1A1A1A">about a sixth</text><line x1="200" y1="72" x2="200" y2="238" stroke="#1A1A1A"/><text x="0" y="282" font-size="11" fill="#5A5A5A">DAERA and NISRA, Northern Ireland greenhouse gas statistics 1990–2024, 9 June 2026. Other sectors not shown.</text></svg>