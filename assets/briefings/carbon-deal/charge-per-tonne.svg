<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">UK CBAM: carbon charge per tonne of goods, on HMRC default values and illustrative rates</title><desc id="d">Fabricated steelwork about 48 to 63 pounds a tonne; steel sections 24 to 45; plate 25 to 42; hot-rolled coil 26 to 37; ribbed rebar about 29; Portland cement about 12; calcium ammonium nitrate about 3; urea about 2. Illustrative only.</desc><rect width="720" height="418" fill="#fff"/><text x="0" y="22" font-size="17" font-weight="700" fill="#1A1A1A">What the UK carbon border charge adds, per tonne</text><text x="0" y="42" font-size="13" fill="#5A5A5A">On HMRC default values at its illustrative rates. Goods of EU origin would pay nothing if the intended exemption is made.</text><line x1="250.0" y1="52" x2="250.0" y2="352" stroke="#E6E2E0"/><text x="250.0" y="368" font-size="12" text-anchor="middle" fill="#5A5A5A">£0</text><line x1="311.5" y1="52" x2="311.5" y2="352" stroke="#E6E2E0"/><text x="311.5" y="368" font-size="12" text-anchor="middle" fill="#5A5A5A">£10</text><line x1="373.1" y1="52" x2="373.1" y2="352" stroke="#E6E2E0"/><text x="373.1" y="368" font-size="12" text-anchor="middle" fill="#5A5A5A">£20</text><line x1="434.6" y1="52" x2="434.6" y2="352" stroke="#E6E2E0"/><text x="434.6" y="368" font-size="12" text-anchor="middle" fill="#5A5A5A">£30</text><line x1="496.2" y1="52" x2="496.2" y2="352" stroke="#E6E2E0"/><text x="496.2" y="368" font-size="12" text-anchor="middle" fill="#5A5A5A">£40</text><line x1="557.7" y1="52" x2="557.7" y2="352" stroke="#E6E2E0"/><text x="557.7" y="368" font-size="12" text-anchor="middle" fill="#5A5A5A">£50</text><line x1="619.2" y1="52" x2="619.2" y2="352" stroke="#E6E2E0"/><text x="619.2" y="368" font-size="12" text-anchor="middle" fill="#5A5A5A">£60</text><text x="240" y="78" font-size="14" text-anchor="end" fill="#1A1A1A">Fabricated steelwork (7308)</text><g><title>Fabricated steelwork (7308): £48–£63 a tonne</title><rect x="545.4" y="64" width="92.3" height="18" rx="9" fill="#A61C1C"/></g><text x="645.7" y="78" font-size="14" font-weight="600" fill="#1A1A1A">£48–£63</text><text x="240" y="114" font-size="14" text-anchor="end" fill="#1A1A1A">Steel sections (7216)</text><g><title>Steel sections (7216): £24–£45 a tonne</title><rect x="397.7" y="100" width="129.2" height="18" rx="9" fill="#A61C1C"/></g><text x="534.9" y="114" font-size="14" font-weight="600" fill="#1A1A1A">£24–£45</text><text x="240" y="150" font-size="14" text-anchor="end" fill="#1A1A1A">Steel plate (7208)</text><g><title>Steel plate (7208): £25–£42 a tonne</title><rect x="403.8" y="136" width="104.6" height="18" rx="9" fill="#A61C1C"/></g><text x="516.5" y="150" font-size="14" font-weight="600" fill="#1A1A1A">£25–£42</text><text x="240" y="186" font-size="14" text-anchor="end" fill="#1A1A1A">Hot-rolled coil</text><g><title>Hot-rolled coil: £26–£37 a tonne</title><rect x="410.0" y="172" width="67.7" height="18" rx="9" fill="#A61C1C"/></g><text x="485.7" y="186" font-size="14" font-weight="600" fill="#1A1A1A">£26–£37</text><text x="240" y="222" font-size="14" text-anchor="end" fill="#1A1A1A">Ribbed rebar</text><g><title>Ribbed rebar: about £29 a tonne</title><circle cx="428.5" cy="217" r="7" fill="#A61C1C"/></g><text x="442.5" y="222" font-size="14" font-weight="600" fill="#1A1A1A">about £29</text><text x="240" y="258" font-size="14" text-anchor="end" fill="#1A1A1A">Portland cement</text><g><title>Portland cement: about £12 a tonne</title><circle cx="323.8" cy="253" r="7" fill="#8C8C8C"/></g><text x="337.8" y="258" font-size="14" font-weight="600" fill="#1A1A1A">about £12</text><text x="240" y="294" font-size="14" text-anchor="end" fill="#1A1A1A">Calcium ammonium nitrate</text><g><title>Calcium ammonium nitrate: about £3 a tonne</title><circle cx="268.5" cy="289" r="7" fill="#8C8C8C"/></g><text x="282.5" y="294" font-size="14" font-weight="600" fill="#1A1A1A">about £3</text><text x="240" y="330" font-size="14" text-anchor="end" fill="#1A1A1A">Urea</text><g><title>Urea: about £2 a tonne</title><circle cx="262.3" cy="325" r="7" fill="#8C8C8C"/></g><text x="276.3" y="330" font-size="14" font-weight="600" fill="#1A1A1A">about £2</text><text x="0" y="392" font-size="11" fill="#5A5A5A">HMRC default values; illustrative CBAM rates of 16 October 2026 (steel £9.69, cement £8.78, fertiliser £1.45 per tonne CO2e).</text><text x="0" y="408" font-size="11" fill="#5A5A5A">Illustrative, not the rates that will apply. Actual emissions data can lower the charge. Ranges span commodity codes.</text></svg>