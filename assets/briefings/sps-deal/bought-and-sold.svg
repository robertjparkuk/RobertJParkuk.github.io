<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="NI processors bought £886m from GB and £969m from the EU in 2022, and sold £3,162m to GB and £1,710m to the EU" font-family="'Source Sans 3','Segoe UI',Arial,sans-serif">
<rect width="900" height="330" fill="#fff"/>
<text x="24" y="34" font-size="21" font-weight="700" fill="#1a1a1a">Bought in from GB and the EU, made in NI, sold back to both</text>
<text x="24" y="58" font-size="14" fill="#5a5a5a">NI food and drink processors, 2022, £m: inputs bought from, and sales to, each market</text>
<text x="24" y="95" font-size="16" font-weight="700" fill="#1a1a1a">Great Britain</text>
<text x="24" y="125" font-size="14" fill="#5a5a5a">Bought from</text><rect x="140" y="109" width="156.9" height="24" fill="#b8b0a8"/><text x="304.9" y="126" font-size="14" fill="#1a1a1a">£886m</text>
<text x="24" y="157" font-size="14" fill="#5a5a5a">Sold to</text><rect x="140" y="141" width="560.0" height="24" fill="#a61c1c"/><text x="708.0" y="158" font-size="14" fill="#1a1a1a">£3,162m</text>
<text x="24" y="200" font-size="16" font-weight="700" fill="#1a1a1a">Ireland and rest of EU</text>
<text x="24" y="230" font-size="14" fill="#5a5a5a">Bought from</text><rect x="140" y="214" width="171.6" height="24" fill="#b8b0a8"/><text x="319.6" y="231" font-size="14" fill="#1a1a1a">£969m</text>
<text x="24" y="262" font-size="14" fill="#5a5a5a">Sold to</text><rect x="140" y="246" width="302.8" height="24" fill="#a61c1c"/><text x="450.8" y="263" font-size="14" fill="#1a1a1a">£1,710m</text>
<text x="24" y="318" font-size="12" fill="#5a5a5a">Source: DAERA, NI Food and Drinks Processing Report 2022, Tables 11b and 16b (purchases are experimental statistics). robertjpark.co.uk</text></svg>