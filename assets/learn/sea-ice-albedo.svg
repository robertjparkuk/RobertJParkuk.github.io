<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Albedo of ocean and sea ice</title><desc id="d">Typical albedo, the share of sunlight reflected: open ocean about 0.06; bare sea ice 0.5 to 0.7; snow-covered sea ice up to about 0.9. Replacing ice with open sea means most sunlight is absorbed instead of reflected.</desc><rect width="900" height="300" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Albedo: how much sunlight a surface reflects</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Share of sunlight reflected (0 = none, 1 = all). Typical values; they vary with conditions.</text><text x="248.0" y="104.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >Open ocean</text><rect x="260" y="86" width="33.6" height="30" rx="4" fill="#1f3b57" stroke="#8C8C8C"/><text x="303.6" y="107.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >about 0.06</text><text x="248.0" y="162.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >Bare sea ice</text><rect x="260" y="144" width="392.0" height="30" rx="4" fill="#9fb6c9" stroke="#8C8C8C"/><text x="662.0" y="165.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >0.5–0.7</text><text x="248.0" y="220.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >Snow-covered sea ice</text><rect x="260" y="202" width="504.0" height="30" rx="4" fill="#dfe8ef" stroke="#8C8C8C"/><text x="774.0" y="223.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >up to about 0.9</text><text x="20.0" y="270.0" font-size="12.5" fill="#A61C1C" text-anchor="start" font-weight="700" >Replace ice with open sea and the surface absorbs most of the sunlight it used to reflect: the ice–albedo feedback.</text></svg>