<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Ocean acidification chemistry</title><desc id="d">Carbon dioxide dissolves into seawater and forms carbonic acid (CO2 plus H2O), which splits into bicarbonate and a hydrogen ion, and bicarbonate into carbonate and another hydrogen ion. The extra hydrogen ions combine with carbonate ions to make more bicarbonate, leaving less carbonate for shell-building (calcium plus carbonate gives calcium carbonate), so oysters, mussels, sea snails and corals must spend more energy or their shells thin. Compared with acid rain, which came from sulphur and nitrogen oxides, was local and fast and has largely been fixed, ocean acidification comes from CO2, is global and slow, and is still rising. The sea is not acid; it is becoming less alkaline.</desc><rect width="960" height="520" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A6A8A"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >What CO₂ does to seawater</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >The second and third steps release hydrogen ions (H⁺). More H⁺ means lower pH and fewer carbonate ions for shells.</text><rect x="20" y="70" width="920" height="70" rx="8" fill="#f1f4f7" stroke="#E6E2E0"/><text x="480.0" y="112.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="700" >CO₂ in the air  ⇌  CO₂ dissolved in the sea</text><line x1="480.0" y1="140.0" x2="480.0" y2="170.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="30" y="175" width="280" height="90" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="170.0" y="202.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Carbonic acid</text><text x="170.0" y="232.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">CO₂ + H₂O ⇌ H₂CO₃</text><line x1="314.0" y1="220.0" x2="336.0" y2="220.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="340" y="175" width="280" height="90" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="480.0" y="202.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Bicarbonate</text><text x="480.0" y="232.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">H₂CO₃ ⇌ H⁺ + HCO₃⁻</text><line x1="624.0" y1="220.0" x2="646.0" y2="220.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><text x="480.0" y="255.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="700" >releases H⁺</text><rect x="650" y="175" width="280" height="90" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="790.0" y="202.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Carbonate</text><text x="790.0" y="232.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">HCO₃⁻ ⇌ H⁺ + CO₃²⁻</text><text x="790.0" y="255.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="700" >releases H⁺</text><rect x="20" y="290" width="450" height="210" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="245.0" y="316.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >The squeeze on shells</text><text x="245.0" y="344.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Extra H⁺ grabs carbonate ions:</text><text x="245.0" y="362.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >H⁺ + CO₃²⁻ → HCO₃⁻</text><text x="245.0" y="400.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Less carbonate is left to build shells:</text><text x="245.0" y="418.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Ca²⁺ + CO₃²⁻ → CaCO₃</text><text x="245.0" y="460.0" font-size="12.5" fill="#A61C1C" text-anchor="middle" font-weight="700" >Oysters, mussels, sea snails and corals pay</text><text x="245.0" y="480.0" font-size="12.5" fill="#A61C1C" text-anchor="middle" font-weight="400" >more energy to build, or their shells thin</text><rect x="490" y="290" width="450" height="210" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="715.0" y="316.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Acid rain and acid seas compared</text><text x="715.0" y="344.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Acid rain: sulphur and nitrogen oxides</text><text x="715.0" y="363.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >SO₂ → H₂SO₄, NOx → HNO₃</text><text x="715.0" y="382.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Local, fast, and largely fixed</text><text x="715.0" y="416.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Acid seas: carbon dioxide</text><text x="715.0" y="435.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >CO₂ → H₂CO₃</text><text x="715.0" y="454.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Global, slow, and still rising</text><text x="715.0" y="485.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >The sea is not acid: it is becoming less alkaline.</text></svg>