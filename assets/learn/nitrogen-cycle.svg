<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The nitrogen cycle on a farm, with the losses</title><desc id="d">Nitrogen gas in the air is fixed into ammonia by the Haber–Bosch process (N2 plus 3 H2 gives 2 NH3, at 400 to 500 °C with an iron catalyst) or by bacteria in clover root nodules, about 150 kg of nitrogen per hectare a year. It reaches the soil as ammonium, which bacteria turn into nitrate (nitrification), leaking some nitrous oxide. Grass and crops take up nitrate and turn it into protein; manure and residues return it to the soil. Losses, in red: ammonia gas escapes from urea and slurry; nitrate leaches to rivers and loughs; in wet, airless soil, bacteria turn nitrate back through nitrite, nitric oxide and nitrous oxide to nitrogen gas (denitrification), releasing nitrous oxide, a greenhouse gas.</desc><rect width="960" height="660" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4E7D4E"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A6A8A"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The nitrogen cycle on a Northern Ireland farm</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Black arrows: the useful cycle. Red arrows: losses to air and water, and where nitrous oxide is made.</text><rect x="20" y="70" width="920" height="80" rx="8" fill="#f1f4f7" stroke="#E6E2E0"/><text x="480.0" y="100.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >The air: 78% nitrogen gas (N₂), held by a triple bond</text><text x="480.0" y="122.0" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Plants cannot use N₂ until it is “fixed” into ammonia or nitrate</text><rect x="20" y="430" width="920" height="210" rx="8" fill="#f7f3ee" stroke="#E6E2E0"/><text x="36.0" y="452.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="700" >Soil and water</text><rect x="40.0" y="195.0" width="180" height="70" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/><text x="130.0" y="218.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Haber–Bosch</text><text x="130.0" y="236.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >N₂ + 3H₂ → 2NH₃</text><text x="130.0" y="251.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >400–500 °C, iron catalyst</text><rect x="240.0" y="195.0" width="180" height="70" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/><text x="330.0" y="218.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Clover</text><text x="330.0" y="236.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Bacteria in root nodules</text><text x="330.0" y="251.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >about 150 kg N/ha a year</text><rect x="140.0" y="475.0" width="180" height="70" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/><text x="230.0" y="498.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Ammonium NH₄⁺</text><text x="230.0" y="516.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >from fertiliser, slurry,</text><text x="230.0" y="531.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >rotting plants</text><rect x="430.0" y="475.0" width="180" height="70" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/><text x="520.0" y="498.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Nitrate NO₃⁻</text><text x="520.0" y="516.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >the form most plants</text><text x="520.0" y="531.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >take up</text><rect x="430.0" y="195.0" width="180" height="70" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/><text x="520.0" y="218.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Grass and crops</text><text x="520.0" y="236.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >protein in silage,</text><text x="520.0" y="251.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >grain, milk, meat</text><rect x="710.0" y="475.0" width="180" height="70" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.6"/><text x="800.0" y="498.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Wet, airless soil</text><text x="800.0" y="516.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >NO₃⁻ → NO₂⁻ → NO</text><text x="800.0" y="531.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >→ N₂O → N₂</text><line x1="130.0" y1="150.0" x2="130.0" y2="193.0" stroke="#1A1A1A" stroke-width="2.2" marker-end="url(#a0)"/><line x1="330.0" y1="150.0" x2="330.0" y2="193.0" stroke="#4E7D4E" stroke-width="2.2" marker-end="url(#a0)"/><line x1="150.0" y1="267.0" x2="215.0" y2="473.0" stroke="#1A1A1A" stroke-width="2.2" marker-end="url(#a0)"/><line x1="310.0" y1="267.0" x2="245.0" y2="473.0" stroke="#4E7D4E" stroke-width="2.2" marker-end="url(#a0)"/><text x="178.0" y="330.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >spread as</text><text x="178.0" y="344.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >fertiliser</text><line x1="322.0" y1="510.0" x2="428.0" y2="510.0" stroke="#1A1A1A" stroke-width="2.2" marker-end="url(#a0)"/><text x="375.0" y="495.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Nitrification</text><text x="375.0" y="572.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >NH₄⁺ → NO₂⁻ → NO₃⁻</text><text x="375.0" y="588.0" font-size="11.5" fill="#A61C1C" text-anchor="middle" font-weight="600" >leaks some N₂O</text><line x1="520.0" y1="473.0" x2="520.0" y2="267.0" stroke="#1A1A1A" stroke-width="2.2" marker-end="url(#a0)"/><text x="530.0" y="380.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >uptake</text><line x1="470.0" y1="267.0" x2="255.0" y2="473.0" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a0)" stroke-dasharray="5 4"/><text x="408.0" y="330.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >manure, slurry,</text><text x="408.0" y="344.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >crop residues</text><line x1="612.0" y1="510.0" x2="708.0" y2="510.0" stroke="#A61C1C" stroke-width="2.2" marker-end="url(#a1)"/><line x1="800.0" y1="473.0" x2="800.0" y2="152.0" stroke="#A61C1C" stroke-width="2.2" marker-end="url(#a1)"/><text x="790.0" y="300.0" font-size="12" fill="#A61C1C" text-anchor="end" font-weight="700" >N₂O (a greenhouse gas)</text><text x="790.0" y="316.0" font-size="11.5" fill="#5A5A5A" text-anchor="end" font-weight="400" >and N₂ back to the air</text><polyline points="140,525 30,525 30,160" fill="none" stroke="#A61C1C" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a1)"/><text x="38.0" y="320.0" font-size="12" fill="#A61C1C" text-anchor="start" font-weight="700" >Ammonia</text><text x="38.0" y="335.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >NH₃ gas</text><text x="38.0" y="348.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >from urea</text><text x="38.0" y="361.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >and slurry</text><line x1="520.0" y1="547.0" x2="520.0" y2="610.0" stroke="#A61C1C" stroke-width="2.2" marker-end="url(#a1)"/><text x="530.0" y="600.0" font-size="12" fill="#A61C1C" text-anchor="start" font-weight="700" >Leaching: nitrate to rivers and loughs</text><line x1="612.0" y1="230.0" x2="690.0" y2="230.0" stroke="#1A1A1A" stroke-width="2.2" marker-end="url(#a0)"/><text x="760.0" y="222.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Food leaves</text><text x="760.0" y="238.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >the farm</text></svg>