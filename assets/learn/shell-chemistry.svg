<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 555" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Seashell chemistry and carbon</title><desc id="d">Four panels. Building a shell in the sea: calcium plus two bicarbonate ions give calcium carbonate, CO2 and water, so calcification releases CO2: in seawater about 0.6 CO2 per carbonate at 25 degrees, more in cold water. Burning shells for lime at about 900 degrees: calcium carbonate gives calcium oxide and CO2, 0.44 kilograms of CO2 per kilogram of carbonate plus kiln fuel, the same as limestone. Crushing shells unburned for liming, grit or aggregate: on acid soil carbonate neutralises acid and releases CO2, replacing quarried limestone that would release the same. Tipping shells, where allowed: the carbonate stays put, but attached flesh rots, it costs money, and a usable material is lost.</desc><rect width="960" height="555" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A6A8A"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4E7D4E"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Is a seashell a carbon store?</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Shells are calcium carbonate, but making them releases CO₂ in seawater, and burning them releases the rest.</text><rect x="20" y="75" width="450" height="220" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="245.0" y="99.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Building a shell (in the sea)</text><text x="245.0" y="117.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >calcification</text><text x="245.0" y="150.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',monospace">Ca²⁺ + 2HCO₃⁻ → CaCO₃ + CO₂ + H₂O</text><text x="245.0" y="185.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Seawater bicarbonate becomes shell,</text><text x="245.0" y="204.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >releasing CO₂. In seawater, about 0.6 CO₂</text><text x="245.0" y="223.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >is released per CaCO₃ at 25 °C, more</text><text x="245.0" y="242.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >in cold water (Frankignoulle et al. 1994).</text><rect x="490" y="75" width="450" height="220" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="715.0" y="99.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Burning shells for lime</text><text x="715.0" y="117.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >calcination, about 900 °C</text><text x="715.0" y="150.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',monospace">CaCO₃ → CaO + CO₂</text><text x="715.0" y="185.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Same reaction as burning limestone:</text><text x="715.0" y="204.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >0.44 kg CO₂ per kg of carbonate,</text><text x="715.0" y="223.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >plus the fuel for the kiln.</text><text x="715.0" y="242.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Shell lime is not carbon-free lime.</text><rect x="20" y="315" width="450" height="220" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="245.0" y="339.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Crushing shells unburned</text><text x="245.0" y="357.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >liming, grit, aggregate, filters</text><text x="245.0" y="395.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Spread on acid soil, carbonate neutralises acid:</text><text x="245.0" y="415.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >CaCO₃ + 2H⁺ → Ca²⁺ + CO₂ + H₂O</text><text x="245.0" y="435.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Replaces quarried limestone that would</text><text x="245.0" y="455.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >release the same CO₂ on the same field.</text><rect x="490" y="315" width="450" height="220" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="715.0" y="339.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Tipping shells</text><text x="715.0" y="357.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >where it is allowed</text><text x="715.0" y="395.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >The carbonate stays put,</text><text x="715.0" y="415.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >but any attached flesh rots,</text><text x="715.0" y="435.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >it costs money (over £80 a tonne in 2016),</text><text x="715.0" y="455.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >and a usable material is lost.</text></svg>