enturies (long)</text><text x="480.0" y="430.0" font-size="12.5" fill="#A61C1C" text-anchor="middle" font-weight="700" >Shaded area for methane ÷ shaded area for CO₂ over 100 years ≈ 28 (AR5) or 27.9 (AR6). Over 20 years ≈ 81. (CO₂ drawn 30 times taller than true scale.)</text><text x="480.0" y="452.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Change the period and the ratio changes: that is why every GWP needs a time horizon.</text></svg>