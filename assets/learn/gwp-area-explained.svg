<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">How a global warming potential is calculated</title><desc id="d">Two panels. One kilogram of methane traps far more heat at first but most has gone within a few decades, so its curve is tall and short. One kilogram of CO2 traps much less heat but stays for centuries, so its curve is low and long. The GWP is the area under the gas curve divided by the area under the CO2 curve over the chosen period: about 28 for methane over 100 years and about 81 over 20 years.</desc><rect width="960" height="470" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >What a GWP actually measures</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >GWP = the heat trapped over a set period by 1 kg of a gas, divided by the heat trapped by 1 kg of CO₂ over the same period.</text><rect x="30" y="70" width="440" height="330" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="250.0" y="94.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >1 kg of methane</text><polygon points="70.0,330 70.0,130.0 71.9,138.3 73.8,146.3 75.7,153.9 77.6,161.2 79.5,168.2 81.4,174.9 83.3,181.3 85.2,187.5 87.1,193.4 89.0,199.1 90.9,204.5 92.8,209.7 94.7,214.7 96.6,219.5 98.5,224.1 100.4,228.5 102.3,232.7 104.2,236.7 106.1,240.6 108.0,244.3 109.9,247.9 111.8,251.3 113.7,254.5 115.6,257.7 117.5,260.7 119.4,263.5 121.3,266.3 123.2,268.9 125.1,271.5 127.0,273.9 128.9,276.2 130.8,278.5 132.7,280.6 134.6,282.6 136.5,284.6 138.4,286.5 140.3,288.3 142.2,290.0 144.1,291.7 146.0,293.3 147.9,294.8 149.8,296.3 151.7,297.7 153.6,299.0 155.5,300.3 157.4,301.5 159.3,302.7 161.2,303.8 163.1,304.9 165.0,306.0 166.9,307.0 168.8,307.9 170.7,308.8 172.6,309.7 174.5,310.6 176.4,311.4 178.3,312.1 180.2,312.9 182.1,313.6 184.0,31