<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Northern Ireland greenhouse gas emissions in 2024 by gas and by sector</title><desc id="d">By gas: carbon dioxide 61.5%, methane 29.5%, nitrous oxide 8.0%, F-gases 0.9%. By sector: agriculture 31.4%, domestic transport 21.3%, buildings and product uses 15.5%, land use 11.7%, electricity supply 10.8%, industry 5.5%, waste 3.8%. Total 22.2 million tonnes CO2 equivalent, using AR5 100-year GWPs.</desc><rect width="900" height="330" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Northern Ireland emissions, 2024: by gas and by sector</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Share of 22.2 MtCO₂e (AR5, 100-year GWPs). Source: DAERA and NISRA, published 9 June 2026.</text><text x="108.0" y="120.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >By gas</text><rect x="120.0" y="90" width="465.9" height="50" fill="#1A1A1A"><title>Carbon dioxide: 61.5%</title></rect><text x="353.9" y="112.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700" >Carbon dioxide</text><text x="353.9" y="129.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" >61.5%</text><rect x="587.9" y="90" width="222.4" height="50" fill="#A61C1C"><title>Methane: 29.5%</title></rect><text x="700.1" y="112.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700" >Methane</text><text x="700.1" y="129.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" >29.5%</text><rect x="812.3" y="90" width="58.9" height="50" fill="#D98C8C"><title>Nitrous oxide: 8.0%</title></rect><rect x="873.2" y="90" width="4.8" height="50" fill="#8C8C8C"><title>F-gases: 0.9%</title></rect><text x="880.0" y="162.0" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="400" >F-gases 0.9%</text><rect x="784.8" y="152" width="11" height="11" fill="#8C8C8C"/><text x="770.8" y="162.0" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="400" >Nitrous oxide 8.0%</text><rect x="636.0" y="152" width="11" height="11" fill="#D98C8C"/><text x="108.0" y="240.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >By sector</text><rect x="120.0" y="210" width="236.6" height="50" fill="#A61C1C"><title>Agriculture: 31.4%</title></rect><text x="239.3" y="232.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700" >Agriculture</text><text x="239.3" y="249.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" >31.4%</text><rect x="358.6" y="210" width="159.9" height="50" fill="#1A1A1A"><title>Transport: 21.3%</title></rect><text x="439.6" y="232.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700" >Transport</text><text x="439.6" y="249.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" >21.3%</text><rect x="520.5" y="210" width="115.8" height="50" fill="#5A5A5A"><title>Buildings: 15.5%</title></rect><text x="579.4" y="232.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700" >Buildings</text><text x="579.4" y="249.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" >15.5%</text><rect x="638.3" y="210" width="86.9" height="50" fill="#8C8C8C"><title>Land use: 11.7%</title></rect><text x="682.8" y="232.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Land use</text><text x="682.8" y="249.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >11.7%</text><rect x="727.2" y="210" width="80.1" height="50" fill="#B8B8B8"><title>Electricity: 10.8%</title></rect><text x="768.3" y="232.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Electricity</text><text x="768.3" y="249.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >10.8%</text><rect x="809.3" y="210" width="39.8" height="50" fill="#D98C8C"><title>Industry: 5.5%</title></rect><rect x="851.1" y="210" width="26.9" height="50" fill="#F2D6D6"><title>Waste: 3.8%</title></rect><text x="880.0" y="282.0" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="400" >Waste 3.8%</text><rect x="798.0" y="272" width="11" height="11" fill="#F2D6D6"/><text x="784.0" y="282.0" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="400" >Industry 5.5%</text><rect x="682.2" y="272" width="11" height="11" fill="#D98C8C"/></svg>