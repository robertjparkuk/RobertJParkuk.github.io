<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 441" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Kilogram for kilogram: cradle-to-gate factors</title><desc id="d">Cradle-to-gate factors in kilograms of CO2 equivalent per kilogram: fired clay brick 0.21; softwood studs 0.26 excluding stored carbon; lightweight concrete block 0.28; cross-laminated timber 0.25 to 0.44; lime 0.75 for the process CO2 alone, plus fuel; world-average steel sections 1.55. Per kilogram comparisons mislead because walls use very different weights of each material; compare per square metre of wall or floor.</desc><rect width="900" height="441" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Kilogram for kilogram: cradle-to-gate factors</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >kg CO₂e per kg of material (A1–A3). ICE database v3 via IStructE (2020); CLT range IStructE 2021; lime from IPCC 2006 process factor.</text><text x="348.0" y="104.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Fired clay brick</text><rect x="360" y="86" width="50.9" height="28" rx="4" fill="#8C8C8C"/><text x="420.9" y="106.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >0.21</text><text x="348.0" y="150.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Softwood (studs), excl. stored carbon</text><rect x="360" y="132" width="62.8" height="28" rx="4" fill="#4E7D4E"/><text x="432.8" y="152.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >0.26</text><text x="348.0" y="196.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Lightweight concrete block</text><rect x="360" y="178" width="66.9" height="28" rx="4" fill="#8C8C8C"/><text x="436.9" y="198.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >0.28</text><text x="348.0" y="242.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Cross-laminated timber (CLT)</text><rect x="360" y="224" width="104.4" height="28" rx="4" fill="#4E7D4E"/><text x="474.4" y="244.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >0.25–0.44</text><text x="348.0" y="288.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Lime, process CO₂ only</text><rect x="360" y="270" width="179.2" height="28" rx="4" fill="#C9B79C"/><text x="549.2" y="290.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >0.75 + fuel</text><text x="348.0" y="334.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Steel sections, world average</text><rect x="360" y="316" width="370.3" height="28" rx="4" fill="#4A6A8A"/><text x="740.3" y="336.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >1.55</text><line x1="360" y1="80" x2="360" y2="356" stroke="#1A1A1A" stroke-width="1"/><text x="360.0" y="374.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >kg CO₂e per kg</text><text x="20.0" y="398.0" font-size="12.5" fill="#A61C1C" text-anchor="start" font-weight="700" >Per kg is not the whole story: a block wall weighs several times a timber-frame wall.</text><text x="20.0" y="417.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >Compare per m² of wall or floor at the same insulation level, as in the house chart.</text></svg>