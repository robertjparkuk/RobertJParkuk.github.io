<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Wet and drained peat compared</title><desc id="d">Two panels. A wet, intact bog: the water table sits at the surface, Sphagnum moss takes in CO2, dead moss barely rots without oxygen, a little methane is made (acetic acid gives methane and CO2), and peat builds up about a millimetre a year: a slow carbon store. A drained bog: air gets in above a lowered water table, peat oxidises (glucose plus oxygen gives CO2 and water), the ground sinks, dissolved carbon leaves as brown water, and dry peat can burn: a carbon source until it is rewetted.</desc><rect width="960" height="560" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A6A8A"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4E7D4E"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >A wet bog stores carbon; a drained bog breathes it out</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >The water table decides which microbes win, and so which gas leaves the peat.</text><rect x="20" y="70" width="450" height="470" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="245.0" y="94.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Wet, intact bog</text><rect x="45" y="170" width="400" height="250" fill="#5a4636" opacity="0.18"/><rect x="45" y="182" width="400" height="238" fill="#4A6A8A" opacity="0.18"/><line x1="45" y1="182" x2="445" y2="182" stroke="#4A6A8A" stroke-width="2" stroke-dasharray="6 4"/><text x="441.0" y="176.0" font-size="11.5" fill="#4A6A8A" text-anchor="end" font-weight="700" >water table</text><path d="M65 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#4E7D4E" stroke-width="3"/><path d="M105 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#4E7D4E" stroke-width="3"/><path d="M145 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#4E7D4E" stroke-width="3"/><path d="M185 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#4E7D4E" stroke-width="3"/><path d="M225 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#4E7D4E" stroke-width="3"/><path d="M265 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#4E7D4E" stroke-width="3"/><path d="M305 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#4E7D4E" stroke-width="3"/><path d="M345 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#4E7D4E" stroke-width="3"/><path d="M385 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#4E7D4E" stroke-width="3"/><path d="M425 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#4E7D4E" stroke-width="3"/><line x1="125.0" y1="110.0" x2="125.0" y2="160.0" stroke="#4E7D4E" stroke-width="2.5" marker-end="url(#a3)"/><text x="137.0" y="128.0" font-size="12" fill="#4E7D4E" text-anchor="start" font-weight="700" >CO₂ taken in by Sphagnum moss</text><line x1="345.0" y1="166.0" x2="345.0" y2="110.0" stroke="#A61C1C" stroke-width="1.5" marker-end="url(#a1)"/><text x="357.0" y="128.0" font-size="12" fill="#A61C1C" text-anchor="start" font-weight="400" >a little methane</text><text x="245.0" y="250.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >No oxygen below the water:</text><text x="245.0" y="268.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >dead moss barely rots</text><text x="245.0" y="300.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Methane-making microbes, slowly:</text><text x="245.0" y="318.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >CH₃COOH → CH₄ + CO₂</text><text x="245.0" y="360.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Peat builds up about 1 mm a year</text><text x="245.0" y="455.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Net result</text><text x="245.0" y="475.0" font-size="13" fill="#4E7D4E" text-anchor="middle" font-weight="700" >a slow, steady carbon store</text><text x="245.0" y="500.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >over thousands of years</text><rect x="490" y="70" width="450" height="470" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="715.0" y="94.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Drained bog</text><rect x="515" y="170" width="400" height="250" fill="#5a4636" opacity="0.18"/><rect x="515" y="290" width="400" height="130" fill="#4A6A8A" opacity="0.18"/><line x1="515" y1="290" x2="915" y2="290" stroke="#4A6A8A" stroke-width="2" stroke-dasharray="6 4"/><text x="911.0" y="284.0" font-size="11.5" fill="#4A6A8A" text-anchor="end" font-weight="700" >water table</text><path d="M535 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#9a9a6a" stroke-width="3"/><path d="M575 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#9a9a6a" stroke-width="3"/><path d="M615 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#9a9a6a" stroke-width="3"/><path d="M655 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#9a9a6a" stroke-width="3"/><path d="M695 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#9a9a6a" stroke-width="3"/><path d="M735 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#9a9a6a" stroke-width="3"/><path d="M775 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#9a9a6a" stroke-width="3"/><path d="M815 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#9a9a6a" stroke-width="3"/><path d="M855 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#9a9a6a" stroke-width="3"/><path d="M895 170 q4 -18 8 0 q4 -14 8 0" fill="none" stroke="#9a9a6a" stroke-width="3"/><line x1="635.0" y1="166.0" x2="635.0" y2="100.0" stroke="#A61C1C" stroke-width="4" marker-end="url(#a1)"/><text x="649.0" y="118.0" font-size="12.5" fill="#A61C1C" text-anchor="start" font-weight="700" >CO₂ from rotting peat</text><line x1="845.0" y1="200.0" x2="845.0" y2="390.0" stroke="#6B4F3A" stroke-width="3" marker-end="url(#a1)"/><text x="837.0" y="410.0" font-size="11.5" fill="#6B4F3A" text-anchor="end" font-weight="700" >brown water (dissolved carbon)</text><text x="685.0" y="215.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Air gets in above the water table:</text><text x="685.0" y="238.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O</text><text x="685.0" y="262.0" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >peat oxidises and the ground sinks</text><text x="685.0" y="330.0" font-size="12.5" fill="#A61C1C" text-anchor="middle" font-weight="400" >Dry peat can burn</text><text x="715.0" y="455.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Net result</text><text x="715.0" y="475.0" font-size="13" fill="#A61C1C" text-anchor="middle" font-weight="700" >a carbon source, year after year</text><text x="715.0" y="500.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >until it is rewetted</text></svg>