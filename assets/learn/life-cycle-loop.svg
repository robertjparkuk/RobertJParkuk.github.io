<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The carbon life cycle as a loop</title><desc id="d">Six stages in a circle, each releasing carbon: extract (mining, quarrying, felling, farming); make (refining, smelting, manufacture); move (shipping, haulage, delivery); use (installation, running, upkeep); end of life (demolition, landfill, burning); recover (reuse, repair, recycling), which feeds materials back to make. The arrow from recover back to make is dashed because most products never complete the loop.</desc><rect width="900" height="650" fill="#fff"/><text x="30" y="30" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The carbon life cycle as a loop</text><text x="30" y="52" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Carbon is released at every stage. The loop closes only if materials come back round.</text><line x1="504" y1="191" x2="536" y2="210" stroke="#A61C1C" stroke-width="3"/><path d="M0 -7 L12 0 L0 7 Z" fill="#A61C1C" transform="translate(536 210) rotate(30)"/><line x1="593" y1="304" x2="593" y2="342" stroke="#A61C1C" stroke-width="3"/><path d="M0 -7 L12 0 L0 7 Z" fill="#A61C1C" transform="translate(593 342) rotate(90)"/><line x1="539" y1="438" x2="507" y2="457" stroke="#A61C1C" stroke-width="3"/><path d="M0 -7 L12 0 L0 7 Z" fill="#A61C1C" transform="translate(507 457) rotate(150)"/><line x1="396" y1="459" x2="364" y2="441" stroke="#A61C1C" stroke-width="3"/><path d="M0 -7 L12 0 L0 7 Z" fill="#A61C1C" transform="translate(364 441) rotate(-150)"/><line x1="307" y1="346" x2="307" y2="308" stroke="#A61C1C" stroke-width="3"/><path d="M0 -7 L12 0 L0 7 Z" fill="#A61C1C" transform="translate(307 308) rotate(-90)"/><line x1="361" y1="212" x2="393" y2="193" stroke="#8C8C8C" stroke-width="3" stroke-dasharray="6 5"/><path d="M0 -7 L12 0 L0 7 Z" fill="#8C8C8C" transform="translate(393 193) rotate(-30)"/><circle cx="450" cy="160" r="58" fill="#FAF3F3" stroke="#A61C1C" stroke-width="2.5"/><text x="450.0" y="165.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Extract</text><text x="450.0" y="93.0" font-size="13" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Mining, quarrying, felling, farming</text><g opacity="0.85"><circle cx="488" cy="114" r="11" fill="#8C8C8C"/><circle cx="498" cy="108" r="8" fill="#8C8C8C"/><text x="490" y="118" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">CO₂</text></g><circle cx="593" cy="242" r="58" fill="#FAF3F3" stroke="#A61C1C" stroke-width="2.5"/><text x="592.8941916244323" y="247.5" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Make</text><text x="662.8941916244323" y="247.5" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Refining, smelting, manufacture</text><g opacity="0.85"><circle cx="631" cy="196" r="11" fill="#8C8C8C"/><circle cx="641" cy="190" r="8" fill="#8C8C8C"/><text x="633" y="200" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">CO₂</text></g><circle cx="593" cy="408" r="58" fill="#FAF3F3" stroke="#A61C1C" stroke-width="2.5"/><text x="592.8941916244323" y="412.5" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Move</text><text x="662.8941916244323" y="412.5" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Shipping, haulage, delivery</text><g opacity="0.85"><circle cx="631" cy="362" r="11" fill="#8C8C8C"/><circle cx="641" cy="356" r="8" fill="#8C8C8C"/><text x="633" y="366" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">CO₂</text></g><circle cx="450" cy="490" r="58" fill="#FAF3F3" stroke="#A61C1C" stroke-width="2.5"/><text x="450.0" y="495.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Use</text><text x="450.0" y="575.0" font-size="13" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Installation, running, upkeep</text><g opacity="0.85"><circle cx="488" cy="444" r="11" fill="#8C8C8C"/><circle cx="498" cy="438" r="8" fill="#8C8C8C"/><text x="490" y="448" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">CO₂</text></g><circle cx="307" cy="408" r="58" fill="#FAF3F3" stroke="#A61C1C" stroke-width="2.5"/><text x="307.1058083755677" y="412.50000000000006" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="700" >End of life</text><text x="237.10580837556768" y="412.50000000000006" font-size="13" fill="#5A5A5A" text-anchor="end" font-weight="400" >Demolition, landfill, burning</text><g opacity="0.85"><circle cx="269" cy="362" r="11" fill="#8C8C8C"/><circle cx="279" cy="356" r="8" fill="#8C8C8C"/><text x="271" y="366" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">CO₂</text></g><circle cx="307" cy="242" r="58" fill="#f4f4f4" stroke="#8C8C8C" stroke-width="2.5"/><text x="307.1058083755676" y="247.5" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Recover</text><text x="237.10580837556762" y="247.5" font-size="13" fill="#5A5A5A" text-anchor="end" font-weight="400" >Reuse, repair, recycling</text><text x="450" y="319" font-size="14" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Each stage</text><text x="450" y="339" font-size="14" fill="#5A5A5A" text-anchor="middle" font-weight="400" >emits carbon</text><text x="30" y="636" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >Robert J. Park · robertjpark.co.uk/learn · The dashed arrow is the step most products miss.</text></svg>