<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The life cycle of a carbon credit</title><desc id="d">A six-step cycle: a project starts, such as planting trees or rewetting a bog; it is validated against a code; it issues pending units, a promise of future carbon; carbon is measured and pending units become verified units; a buyer retires them and makes a claim, each tonne used once; the project is monitored for decades because fire, felling or drainage can reverse it. Under the UK Woodland Carbon Code and Peatland Code 20% of units go into a buffer pool to cover losses.</desc><rect width="900" height="640" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The life cycle of a carbon credit</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >From project to claim, and why the story does not end when you buy it.</text><circle cx="450" cy="345" r="215" fill="none" stroke="#E6E2E0" stroke-width="12"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(557.5 158.8) rotate(30.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(665.0 345.0) rotate(90.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(557.5 531.2) rotate(150.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(342.5 531.2) rotate(210.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(235.0 345.0) rotate(270.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(342.5 158.8) rotate(330.0)"/><rect x="362.0" y="93.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="450.0" y="118.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Project starts</text><text x="450.0" y="137.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >trees planted, bog</text><text x="450.0" y="152.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >rewetted, stoves sold</text><rect x="548.2" y="200.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="636.2" y="225.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Validated</text><text x="636.2" y="244.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >checked against a code</text><text x="636.2" y="259.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >before any claim</text><rect x="548.2" y="415.5" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="636.2" y="440.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Pending units</text><text x="636.2" y="459.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >a promise of future</text><text x="636.2" y="474.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >carbon (WCC: PIUs)</text><rect x="362.0" y="523.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="450.0" y="548.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Verified units</text><text x="450.0" y="567.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >carbon measured on</text><text x="450.0" y="582.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >the ground</text><rect x="175.8" y="415.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="263.8" y="440.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Retired and claimed</text><text x="263.8" y="459.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >one tonne, used once,</text><text x="263.8" y="474.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >by one buyer</text><rect x="175.8" y="200.5" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="263.8" y="225.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Monitored for decades</text><text x="263.8" y="244.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >fire, felling, drainage</text><text x="263.8" y="259.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >can reverse it</text><text x="450.0" y="325.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >20% buffer pool</text><text x="450.0" y="345.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >set aside to cover</text><text x="450.0" y="365.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >losses (UK codes)</text></svg>