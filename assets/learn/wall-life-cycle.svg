<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The life cycle of a wall</title><desc id="d">A six-step loop. Raw materials are quarried or felled: stone, clay, sand, timber and iron ore. Making the products in kilns, mills and sawmills is where most of the embodied carbon is released. Building adds transport and site waste. In use, over sixty years or more, come heating, repairs and replacements. At the end the wall is demolished or carefully dismantled, then reused, recycled as crushed hardcore, or tipped. These are life-cycle stages A to C in the standard BS EN 15978.</desc><rect width="920" height="620" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The life cycle of a wall</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Embodied carbon is mostly paid on the first day. How the wall is put together decides whether it can be used again.</text><circle cx="460" cy="335" r="215" fill="none" stroke="#E6E2E0" stroke-width="12"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(567.5 148.8) rotate(30.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(675.0 335.0) rotate(90.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(567.5 521.2) rotate(150.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(352.5 521.2) rotate(210.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(245.0 335.0) rotate(270.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(352.5 148.8) rotate(330.0)"/><rect x="372.0" y="83.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="460.0" y="108.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Quarry and forest</text><text x="460.0" y="127.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >stone, clay, sand,</text><text x="460.0" y="142.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >timber, iron ore</text><rect x="558.2" y="190.5" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="646.2" y="215.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Make the product</text><text x="646.2" y="234.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >kilns, mills, sawmills:</text><text x="646.2" y="249.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >most of the carbon</text><rect x="558.2" y="405.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="646.2" y="430.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Build</text><text x="646.2" y="449.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >transport, site</text><text x="646.2" y="464.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >waste, offcuts</text><rect x="372.0" y="513.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="460.0" y="538.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Use: 60+ years</text><text x="460.0" y="557.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >heating, repairs,</text><text x="460.0" y="572.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >replacement</text><rect x="185.8" y="405.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="273.8" y="430.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Take down</text><text x="273.8" y="449.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >demolish, or</text><text x="273.8" y="464.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >dismantle carefully</text><rect x="185.8" y="190.5" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="273.8" y="215.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Reuse, recycle or tip</text><text x="273.8" y="234.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >whole bricks and beams,</text><text x="273.8" y="249.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >crushed hardcore, landfill</text><text x="460.0" y="315.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Stages A to C</text><text x="460.0" y="335.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >cradle to grave</text><text x="460.0" y="355.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >(BS EN 15978)</text></svg>