<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Emissions per kilogram of hydrogen by production route</title><desc id="d">Horizontal ranges in kilograms of CO2 equivalent per kilogram of hydrogen: coal gasification 22 to 26; unabated gas reforming 10 to 12; reforming with about 60% capture 5 to 8; reforming with over 90% capture 0.8 to 6; renewable electrolysis 0.4 to 2.7, from building the generating equipment. The UK Low Carbon Hydrogen Standard ceiling is 2.4 and the EU ceiling about 3.4.</desc><rect width="960" height="470" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Emissions per kilogram of hydrogen</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >kg CO₂e per kg H₂ at production (IEA ranges). The dashed lines are the UK and EU “low-carbon” ceilings.</text><text x="288.0" y="127.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="600" >Coal gasification (brown/black)</text><rect x="787.1" y="111" width="88.6" height="26" rx="4" fill="#6B4F3A"><title>Coal gasification (brown/black): 22 to 26</title></rect><text x="883.7" y="129.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >22–26</text><text x="288.0" y="185.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="600" >Unabated gas reforming (grey)</text><rect x="521.4" y="169" width="44.3" height="26" rx="4" fill="#8C8C8C"><title>Unabated gas reforming (grey): 10 to 12</title></rect><text x="573.7" y="187.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >10–12</text><text x="288.0" y="243.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="600" >Reforming, about 60% captured (blue)</text><rect x="410.7" y="227" width="66.4" height="26" rx="4" fill="#4A6A8A"><title>Reforming, about 60% captured (blue): 5 to 8</title></rect><text x="485.1" y="245.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >5–8</text><text x="288.0" y="301.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="600" >Reforming, over 90% captured (blue)</text><rect x="317.7" y="285" width="115.1" height="26" rx="4" fill="#4A6A8A"><title>Reforming, over 90% captured (blue): 0.8 to 6</title></rect><text x="440.9" y="303.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >0.8–6</text><text x="288.0" y="359.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="600" >Renewable electrolysis (green)*</text><rect x="308.9" y="343" width="50.9" height="26" rx="4" fill="#4E7D4E"><title>Renewable electrolysis (green)*: 0.4 to 2.7</title></rect><text x="401.0" y="361.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >0.4–2.7</text><line x1="353.1" y1="80" x2="353.1" y2="395" stroke="#A61C1C" stroke-width="2" stroke-dasharray="6 4"/><text x="348.1" y="92.0" font-size="12" fill="#A61C1C" text-anchor="end" font-weight="700" >UK ceiling 2.4</text><line x1="374.8" y1="80" x2="374.8" y2="395" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="6 4"/><text x="379.8" y="92.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="700" >EU ceiling about 3.4</text><line x1="300.0" y1="395" x2="300.0" y2="401" stroke="#1A1A1A"/><text x="300.0" y="416.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >0</text><line x1="388.6" y1="395" x2="388.6" y2="401" stroke="#1A1A1A"/><text x="388.6" y="416.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >4</text><line x1="477.1" y1="395" x2="477.1" y2="401" stroke="#1A1A1A"/><text x="477.1" y="416.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >8</text><line x1="565.7" y1="395" x2="565.7" y2="401" stroke="#1A1A1A"/><text x="565.7" y="416.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >12</text><line x1="654.3" y1="395" x2="654.3" y2="401" stroke="#1A1A1A"/><text x="654.3" y="416.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >16</text><line x1="742.9" y1="395" x2="742.9" y2="401" stroke="#1A1A1A"/><text x="742.9" y="416.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >20</text><line x1="831.4" y1="395" x2="831.4" y2="401" stroke="#1A1A1A"/><text x="831.4" y="416.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >24</text><line x1="920.0" y1="395" x2="920.0" y2="401" stroke="#1A1A1A"/><text x="920.0" y="416.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >28</text><line x1="300" y1="395" x2="920" y2="395" stroke="#1A1A1A"/><text x="610.0" y="438.0" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >kg CO₂e per kg of hydrogen</text><text x="20.0" y="460.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >* Green hydrogen is zero at the electrolyser; 0.4–2.7 is the share of building the wind or solar kit, which most standards leave out.</text></svg>