<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The fingerprint test: Sun or greenhouse gases?</title><desc id="d">Two panels. If a brighter Sun were warming the planet, both the upper stratosphere and the troposphere would warm. If greenhouse gases are the cause, the troposphere warms while the upper stratosphere cools, because the extra carbon dioxide traps heat low down and radiates more of it away to space high up. The second pattern is what satellites and weather balloons measure.</desc><rect width="900" height="400" fill="#fff"/><defs><marker id="fu" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="fd" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4A6A8A"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The fingerprint test: Sun or greenhouse gases?</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >A brighter Sun would warm every layer. Extra CO₂ warms the lower air and cools the upper stratosphere.</text><rect x="20" y="70" width="420" height="300" rx="8" fill="#f6f6f6" stroke="#8C8C8C" stroke-width="1.5"/><text x="230.0" y="98.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >If the Sun were the cause</text><rect x="40" y="120" width="380" height="88" rx="6" fill="#fff" stroke="#E6E2E0"/><text x="56.0" y="158.0" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="700" >Upper stratosphere</text><text x="56.0" y="176.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >about 25–50 km</text><path d="M320 190 v-46" stroke="#A61C1C" stroke-width="5" marker-end="url(#fu)"/><text x="342.0" y="170.0" font-size="14" fill="#A61C1C" text-anchor="start" font-weight="700" >warmer</text><rect x="40" y="220" width="380" height="88" rx="6" fill="#fff" stroke="#E6E2E0"/><text x="56.0" y="258.0" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="700" >Troposphere</text><text x="56.0" y="276.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >0–12 km</text><path d="M320 290 v-46" stroke="#A61C1C" stroke-width="5" marker-end="url(#fu)"/><text x="342.0" y="270.0" font-size="14" fill="#A61C1C" text-anchor="start" font-weight="700" >warmer</text><circle cx="400" cy="98" r="0" fill="none"/><text x="230.0" y="350.0" font-size="13" fill="#5A5A5A" text-anchor="middle" font-weight="400" >What we would expect</text><rect x="460" y="70" width="420" height="300" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="670.0" y="98.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >If greenhouse gases are the cause</text><rect x="480" y="120" width="380" height="88" rx="6" fill="#fff" stroke="#E6E2E0"/><text x="496.0" y="158.0" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="700" >Upper stratosphere</text><text x="496.0" y="176.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >about 25–50 km</text><path d="M760 138 v46" stroke="#4A6A8A" stroke-width="5" marker-end="url(#fd)"/><text x="782.0" y="170.0" font-size="14" fill="#4A6A8A" text-anchor="start" font-weight="700" >cooler</text><rect x="480" y="220" width="380" height="88" rx="6" fill="#fff" stroke="#E6E2E0"/><text x="496.0" y="258.0" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="700" >Troposphere</text><text x="496.0" y="276.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >0–12 km</text><path d="M760 290 v-46" stroke="#A61C1C" stroke-width="5" marker-end="url(#fu)"/><text x="782.0" y="270.0" font-size="14" fill="#A61C1C" text-anchor="start" font-weight="700" >warmer</text><circle cx="840" cy="98" r="0" fill="none"/><text x="670.0" y="350.0" font-size="13" fill="#A61C1C" text-anchor="middle" font-weight="700" >What satellites and balloons measure</text></svg>