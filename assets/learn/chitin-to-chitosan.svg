<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Making chitosan from crustacean shells</title><desc id="d">A five-step process. Prawn and crab shell is chitin, protein and calcium carbonate. Dilute hydrochloric acid dissolves the carbonate, releasing CO2. Dilute sodium hydroxide or enzymes remove the protein. What is left is chitin, a sugar polymer like cellulose with acetyl-amino groups. Hot concentrated sodium hydroxide removes the acetyl groups to give chitosan, which is positively charged in mild acid and binds fats, dyes, metals and fine particles. It is used in water treatment, wound dressings, food coatings, cosmetics and seed treatments. The chemicals and heat have their own footprint.</desc><rect width="960" height="380" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >From prawn shell to chitosan</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Crustacean shell is a composite: chitin fibres, protein and calcium carbonate. Separating them takes acid, alkali and energy.</text><rect x="20" y="90" width="166" height="120" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="103.0" y="120.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Prawn and crab shell</text><text x="103.0" y="148.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >chitin + protein</text><text x="103.0" y="168.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >+ calcium carbonate</text><line x1="188.0" y1="150.0" x2="206.0" y2="150.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="208" y="90" width="166" height="120" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="291.0" y="120.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Demineralise</text><text x="291.0" y="148.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >dilute hydrochloric acid</text><text x="291.0" y="168.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >dissolves CaCO₃, frees CO₂</text><line x1="376.0" y1="150.0" x2="394.0" y2="150.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="396" y="90" width="166" height="120" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="479.0" y="120.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Deproteinise</text><text x="479.0" y="148.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >dilute NaOH (or enzymes)</text><text x="479.0" y="168.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >removes protein</text><line x1="564.0" y1="150.0" x2="582.0" y2="150.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="584" y="90" width="166" height="120" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="667.0" y="120.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Chitin</text><text x="667.0" y="148.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >a sugar polymer like cellulose,</text><text x="667.0" y="168.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >with –NHCOCH₃ groups</text><line x1="752.0" y1="150.0" x2="770.0" y2="150.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="772" y="90" width="166" height="120" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="855.0" y="120.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Deacetylate</text><text x="855.0" y="148.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >hot concentrated NaOH</text><text x="855.0" y="168.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">–NHCOCH₃ → –NH₂</text><rect x="20" y="235" width="920" height="120" rx="8" fill="#f6f9f5" stroke="#4E7D4E"/><text x="480.0" y="262.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Chitosan: the product</text><text x="480.0" y="288.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Positively charged in mild acid, so it binds fats, dyes, metals and fine particles.</text><text x="480.0" y="310.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Uses: water treatment, wound dressings, food coatings, cosmetics, seed treatments.</text><text x="480.0" y="334.0" font-size="12.5" fill="#A61C1C" text-anchor="middle" font-weight="700" >The chemicals and heat have their own footprint: check the process, not just the shell.</text></svg>