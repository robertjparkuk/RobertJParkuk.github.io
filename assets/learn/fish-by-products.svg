<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">One fish, many products</title><desc id="d">A whole fish or prawn splits into five streams: the fillet, used as food; heads and frames, used for fishmeal, oil and stock; guts, used for oil, silage and enzymes; skin and scales, used for collagen, gelatine and leather; and shells from shellfish, used for lime, grit and chitin. If nobody takes them, by-products go to rendering or incineration at a cost; fish waste must not be landfilled, and animal by-products rules apply. The higher-value order is food and supplements first, then feed, then fertiliser and energy.</desc><rect width="960" height="540" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4E7D4E"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >One fish, many products</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >A skinless fillet is about a third of a cod or haddock. What happens to the rest decides whether it is waste or a resource.</text><rect x="20" y="210" width="170" height="90" rx="8" fill="#1A1A1A"/><text x="105.0" y="248.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >Whole fish</text><text x="105.0" y="270.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >or prawns</text><path d="M190 255 C 250 255, 250 110, 300 110" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="302" y="80" width="230" height="60" rx="8" fill="#f6f9f5" stroke="#8C8C8C" stroke-width="1.5"/><text x="417.0" y="106.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Fillet</text><text x="417.0" y="126.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >food</text><path d="M190 255 C 250 255, 250 200, 300 200" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="302" y="170" width="230" height="60" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.5"/><text x="417.0" y="196.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Heads and frames</text><text x="417.0" y="216.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >fishmeal, oil, stock</text><line x1="534.0" y1="200.0" x2="600.0" y2="200.0" stroke="#4E7D4E" stroke-width="2" marker-end="url(#a2)"/><path d="M190 255 C 250 255, 250 290, 300 290" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="302" y="260" width="230" height="60" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.5"/><text x="417.0" y="286.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Guts (viscera)</text><text x="417.0" y="306.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >oil, silage, enzymes</text><line x1="534.0" y1="290.0" x2="600.0" y2="290.0" stroke="#4E7D4E" stroke-width="2" marker-end="url(#a2)"/><path d="M190 255 C 250 255, 250 380, 300 380" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="302" y="350" width="230" height="60" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.5"/><text x="417.0" y="376.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Skin and scales</text><text x="417.0" y="396.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >collagen, gelatine, leather</text><line x1="534.0" y1="380.0" x2="600.0" y2="380.0" stroke="#4E7D4E" stroke-width="2" marker-end="url(#a2)"/><path d="M190 255 C 250 255, 250 470, 300 470" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="302" y="440" width="230" height="60" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.5"/><text x="417.0" y="466.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Shells (shellfish)</text><text x="417.0" y="486.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >lime, grit, chitin</text><line x1="534.0" y1="470.0" x2="600.0" y2="470.0" stroke="#4E7D4E" stroke-width="2" marker-end="url(#a2)"/><rect x="604" y="160" width="336" height="200" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="772.0" y="186.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Or, if nobody takes them</text><text x="772.0" y="214.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Rendering or incineration: a cost</text><text x="772.0" y="236.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Fish waste must not be landfilled</text><text x="772.0" y="258.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Animal by-products rules apply</text><text x="772.0" y="280.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Value and nutrients lost</text><text x="772.0" y="330.0" font-size="12.5" fill="#A61C1C" text-anchor="middle" font-weight="700" >The same tonne can earn or cost money.</text><rect x="604" y="380" width="336" height="130" rx="8" fill="#f6f9f5" stroke="#4E7D4E"/><text x="772.0" y="406.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >The higher-value routes</text><text x="772.0" y="432.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Food and supplements first,</text><text x="772.0" y="451.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >then feed, then fertiliser and energy:</text><text x="772.0" y="470.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >the biological loop of the</text><text x="772.0" y="489.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >circular economy.</text></svg>