<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">GWP over 20 and 100 years for seven gases</title><desc id="d">IPCC AR6 values. HFO-1234yf, 12 days: 1.81 over 20 years, 0.501 over 100. Methane, 11.8 years: 81.2 and 27.9. HFC-32, 5.4 years: 2,690 and 771. HFC-134a, 14 years: 4,140 and 1,530. Nitrous oxide, 109 years: 273 and 273. CF4, 50,000 years: 5,300 and 7,380. SF6, 1,000 years: 18,200 and 24,300. Short-lived gases fall between 20 and 100 years; long-lived ones hold or rise.</desc><rect width="960" height="520" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Same gas, two numbers: GWP over 20 and 100 years</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >IPCC AR6 values, log scale. Short-lived gases fall sharply between 20 and 100 years; long-lived ones hold or rise.</text><text x="238.0" y="107.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="700" >HFO-1234yf (12 days)</text><rect x="250" y="85" width="136.2" height="18" fill="#A61C1C" opacity="0.85"><title>HFO-1234yf (12 days) GWP-20 1.81</title></rect><rect x="250" y="106" width="75.8" height="18" fill="#1A1A1A"><title>HFO-1234yf (12 days) GWP-100 0.501</title></rect><text x="392.2" y="99.0" font-size="11.5" fill="#A61C1C" text-anchor="start" font-weight="700" >1.81</text><text x="331.8" y="120.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >0.501</text><text x="238.0" y="165.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="700" >Methane (11.8 years)</text><rect x="250" y="143" width="315.2" height="18" fill="#A61C1C" opacity="0.85"><title>Methane (11.8 years) GWP-20 81.2</title></rect><rect x="250" y="164" width="264.9" height="18" fill="#1A1A1A"><title>Methane (11.8 years) GWP-100 27.9</title></rect><text x="571.2" y="157.0" font-size="11.5" fill="#A61C1C" text-anchor="start" font-weight="700" >81.2</text><text x="520.9" y="178.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >27.9</text><text x="238.0" y="223.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="700" >HFC-32 (5.4 years)</text><rect x="250" y="201" width="479.9" height="18" fill="#A61C1C" opacity="0.85"><title>HFC-32 (5.4 years) GWP-20 2690</title></rect><rect x="250" y="222" width="421.1" height="18" fill="#1A1A1A"><title>HFC-32 (5.4 years) GWP-100 771</title></rect><text x="735.9" y="215.0" font-size="11.5" fill="#A61C1C" text-anchor="start" font-weight="700" >2,690</text><text x="677.1" y="236.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >771</text><text x="238.0" y="281.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="700" >HFC-134a (14 years)</text><rect x="250" y="259" width="500.2" height="18" fill="#A61C1C" opacity="0.85"><title>HFC-134a (14 years) GWP-20 4140</title></rect><rect x="250" y="280" width="453.3" height="18" fill="#1A1A1A"><title>HFC-134a (14 years) GWP-100 1530</title></rect><text x="756.2" y="273.0" font-size="11.5" fill="#A61C1C" text-anchor="start" font-weight="700" >4,140</text><text x="709.3" y="294.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >1,530</text><text x="238.0" y="339.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="700" >Nitrous oxide (109 years)</text><rect x="250" y="317" width="372.3" height="18" fill="#A61C1C" opacity="0.85"><title>Nitrous oxide (109 years) GWP-20 273</title></rect><rect x="250" y="338" width="372.3" height="18" fill="#1A1A1A"><title>Nitrous oxide (109 years) GWP-100 273</title></rect><text x="628.3" y="331.0" font-size="11.5" fill="#A61C1C" text-anchor="start" font-weight="700" >273</text><text x="628.3" y="352.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >273</text><text x="238.0" y="397.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="700" >CF₄ (50,000 years)</text><rect x="250" y="375" width="511.8" height="18" fill="#A61C1C" opacity="0.85"><title>CF₄ (50,000 years) GWP-20 5300</title></rect><rect x="250" y="396" width="527.4" height="18" fill="#1A1A1A"><title>CF₄ (50,000 years) GWP-100 7380</title></rect><text x="767.8" y="389.0" font-size="11.5" fill="#A61C1C" text-anchor="start" font-weight="700" >5,300</text><text x="783.4" y="410.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >7,380</text><text x="238.0" y="455.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="700" >SF₆ (1,000 years)</text><rect x="250" y="433" width="569.8" height="18" fill="#A61C1C" opacity="0.85"><title>SF₆ (1,000 years) GWP-20 18200</title></rect><rect x="250" y="454" width="583.4" height="18" fill="#1A1A1A"><title>SF₆ (1,000 years) GWP-100 24300</title></rect><text x="825.8" y="447.0" font-size="11.5" fill="#A61C1C" text-anchor="start" font-weight="700" >18,200</text><text x="839.4" y="468.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >24,300</text><line x1="250.0" y1="490" x2="250.0" y2="496" stroke="#1A1A1A"/><text x="250.0" y="512.0" font-size="11.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >0.1</text><line x1="358.3" y1="490" x2="358.3" y2="496" stroke="#1A1A1A"/><text x="358.3" y="512.0" font-size="11.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >1</text><line x1="466.7" y1="490" x2="466.7" y2="496" stroke="#1A1A1A"/><text x="466.7" y="512.0" font-size="11.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >10</text><line x1="575.0" y1="490" x2="575.0" y2="496" stroke="#1A1A1A"/><text x="575.0" y="512.0" font-size="11.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >100</text><line x1="683.3" y1="490" x2="683.3" y2="496" stroke="#1A1A1A"/><text x="683.3" y="512.0" font-size="11.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >1,000</text><line x1="791.7" y1="490" x2="791.7" y2="496" stroke="#1A1A1A"/><text x="791.7" y="512.0" font-size="11.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >10,000</text><line x1="900.0" y1="490" x2="900.0" y2="496" stroke="#1A1A1A"/><text x="900.0" y="512.0" font-size="11.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >100,000</text><line x1="250" y1="490" x2="900" y2="490" stroke="#1A1A1A"/><rect x="700" y="62" width="12" height="12" fill="#A61C1C"/><text x="718.0" y="73.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="400" >GWP-20</text><rect x="790" y="62" width="12" height="12" fill="#1A1A1A"/><text x="808.0" y="73.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="400" >GWP-100</text></svg>