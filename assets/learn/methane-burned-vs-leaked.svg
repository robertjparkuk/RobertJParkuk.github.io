<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 334" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">One kilogram of methane: burned or leaked</title><desc id="d">One kilogram of methane burned gives 2.74 kg of CO2. Leaked unburned, it counts as 28 kg of CO2 equivalent on the 100-year AR5 value used in UK reporting, 29.8 kg on the AR6 100-year value for fossil methane, and 82.5 kg on the AR6 20-year value.</desc><rect width="900" height="334" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >One kilogram of methane: burned or leaked</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >kg CO₂e. Burning: CH₄ + 2O₂ → CO₂ + 2H₂O (44 ÷ 16). Leaking: GWP values from IPCC AR5 and AR6.</text><text x="318.0" y="104.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Burned: CO₂ from combustion</text><rect x="330" y="86" width="13.4" height="28" rx="4" fill="#1A1A1A"/><text x="353.4" y="106.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >2.74 kg CO₂</text><text x="318.0" y="150.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Leaked, GWP-100 (AR5, UK reporting)</text><rect x="330" y="132" width="136.9" height="28" rx="4" fill="#A61C1C"/><text x="476.9" y="152.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >28 kg CO₂e</text><text x="318.0" y="196.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Leaked, GWP-100 (AR6, fossil)</text><rect x="330" y="178" width="145.7" height="28" rx="4" fill="#A61C1C"/><text x="485.7" y="198.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >29.8 kg CO₂e</text><text x="318.0" y="242.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Leaked, GWP-20 (AR6, fossil)</text><rect x="330" y="224" width="403.3" height="28" rx="4" fill="#A61C1C"/><text x="743.3" y="244.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >82.5 kg CO₂e</text><line x1="330" y1="80" x2="330" y2="264" stroke="#1A1A1A" stroke-width="1"/><text x="330.0" y="282.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >kg CO₂e per kg of methane</text><text x="20.0" y="306.0" font-size="12.5" fill="#A61C1C" text-anchor="start" font-weight="700" >A leak is ten to thirty times worse than burning the same gas, depending on the time horizon.</text></svg>