<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Linear economy against circular loops</title><desc id="d">At the top, the linear economy: take, make, sell, use, bin. Below, a product in use sits at the centre of four loops, from the tightest to the widest: maintain, repair and share, which keeps almost everything; reuse and refurbish, which keeps the product; remanufacture, which keeps the parts; and recycle, which keeps only the material. Smaller loops come first because they keep the energy and carbon already spent. A biological loop runs alongside: food, wood and other living materials are used, then fed to animals, then composted or digested, returning nutrients to the soil.</desc><rect width="960" height="640" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4E7D4E"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A6A8A"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Linear, recycling and circular</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >The tighter the loop, the more of the original effort (and carbon) is kept. Recycling is the outermost loop, not the first.</text><text x="20.0" y="110.0" font-size="14" fill="#A61C1C" text-anchor="start" font-weight="700" >Linear:</text><rect x="110" y="82" width="120" height="44" rx="6" fill="#f4f4f4" stroke="#8C8C8C" stroke-width="1.5"/><text x="170.0" y="110.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Take</text><line x1="232.0" y1="104.0" x2="276.0" y2="104.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="278" y="82" width="120" height="44" rx="6" fill="#f4f4f4" stroke="#8C8C8C" stroke-width="1.5"/><text x="338.0" y="110.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Make</text><line x1="400.0" y1="104.0" x2="444.0" y2="104.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="446" y="82" width="120" height="44" rx="6" fill="#f4f4f4" stroke="#8C8C8C" stroke-width="1.5"/><text x="506.0" y="110.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Sell</text><line x1="568.0" y1="104.0" x2="612.0" y2="104.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="614" y="82" width="120" height="44" rx="6" fill="#f4f4f4" stroke="#8C8C8C" stroke-width="1.5"/><text x="674.0" y="110.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Use</text><line x1="736.0" y1="104.0" x2="780.0" y2="104.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="782" y="82" width="120" height="44" rx="6" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="842.0" y="110.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Bin</text><text x="20.0" y="170.0" font-size="14" fill="#4E7D4E" text-anchor="start" font-weight="700" >Circular:</text><path d="M390 450 C 278.0 359.0, 682.0 359.0, 570 450" fill="none" stroke="#4E7D4E" stroke-width="3" marker-end="url(#a2)"/><text x="480.0" y="359.8" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Maintain, repair, share</text><text x="480.0" y="374.8" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >keeps almost everything</text><path d="M390 450 C 190.0 287.5, 770.0 287.5, 570 450" fill="none" stroke="#4E7D4E" stroke-width="3" marker-end="url(#a2)"/><text x="480.0" y="306.1" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Reuse, refurbish</text><text x="480.0" y="321.1" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >keeps the product</text><path d="M390 450 C 102.0 216.0, 858.0 216.0, 570 450" fill="none" stroke="#4A6A8A" stroke-width="3" marker-end="url(#a3)"/><text x="480.0" y="252.5" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Remanufacture</text><text x="480.0" y="267.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >keeps the parts</text><path d="M390 450 C 14.0 144.5, 946.0 144.5, 570 450" fill="none" stroke="#8C8C8C" stroke-width="3" marker-end="url(#a0)"/><text x="480.0" y="198.9" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Recycle</text><text x="480.0" y="213.9" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >keeps only the material</text><rect x="390" y="420" width="180" height="60" rx="8" fill="#1A1A1A"/><text x="480.0" y="446.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Product in use</text><text x="480.0" y="466.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" >by a customer</text><text x="480.0" y="506.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Smaller loops come first: they keep the energy and carbon already spent.</text><rect x="20" y="530" width="920" height="90" rx="8" fill="#f6f9f5" stroke="#4E7D4E"/><text x="480.0" y="556.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >The biological loop runs alongside it</text><text x="480.0" y="578.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Food, wood and other living materials: eat or use first, then feed animals, then compost or anaerobic digestion,</text><text x="480.0" y="598.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >returning nutrients to the soil. Fish guts, shells, food waste and timber offcuts sit here.</text></svg>