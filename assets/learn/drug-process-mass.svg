<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Process mass intensity of sildenafil</title><desc id="d">Kilograms of material used per kilogram of sildenafil, on a log scale: the first laboratory route 17,675; the optimised laboratory route 116; the commercial route 60. Solvents and water were about four-fifths of the mass. One worked example from Cespi and colleagues in Green Chemistry, not an industry average.</desc><rect width="900" height="330" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >How much material goes into 1 kg of a drug?</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Process mass intensity (kg of everything in per kg of product), sildenafil. Cespi et al., Green Chemistry, about 2015. Log scale.</text><line x1="220.0" y1="75" x2="220.0" y2="230" stroke="#E6E2E0"/><text x="220.0" y="248.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >10</text><line x1="377.5" y1="75" x2="377.5" y2="230" stroke="#E6E2E0"/><text x="377.5" y="248.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >100</text><line x1="535.1" y1="75" x2="535.1" y2="230" stroke="#E6E2E0"/><text x="535.1" y="248.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >1,000</text><line x1="692.6" y1="75" x2="692.6" y2="230" stroke="#E6E2E0"/><text x="692.6" y="248.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >10,000</text><text x="208.0" y="107.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >First lab route</text><rect x="220" y="89" width="511.5" height="28" rx="4" fill="#8C8C8C"/><text x="741.5" y="109.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >17,675 kg</text><text x="208.0" y="155.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Optimised lab route</text><rect x="220" y="137" width="167.7" height="28" rx="4" fill="#4A6A8A"/><text x="397.7" y="157.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >116 kg</text><text x="208.0" y="203.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Commercial route</text><rect x="220" y="185" width="122.6" height="28" rx="4" fill="#4E7D4E"/><text x="352.6" y="205.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >60 kg</text><text x="20.0" y="282.0" font-size="12.5" fill="#A61C1C" text-anchor="start" font-weight="700" >Solvents and water were about four-fifths of the mass. Redesigning the route cut it by more than 99%.</text><text x="20.0" y="302.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >One worked example, not an industry average.</text></svg>