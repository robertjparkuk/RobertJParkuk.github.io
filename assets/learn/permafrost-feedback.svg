<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The permafrost carbon feedback</title><desc id="d">A four-step feedback loop. A warmer Arctic, warming faster than the global average, thaws permafrost, deepening the active layer and collapsing the ground. Thousands of years of frozen plant carbon starts to rot: with air it gives CO2, without air methane. The extra greenhouse gas adds to warming everywhere, which thaws more permafrost.</desc><rect width="900" height="560" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The permafrost carbon feedback</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >A feedback: warming thaws carbon that causes more warming. Real and irreversible for centuries, but not “runaway” (IPCC).</text><circle cx="450" cy="310" r="175" fill="none" stroke="#E6E2E0" stroke-width="12"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(573.7 186.3) rotate(45.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(573.7 433.7) rotate(135.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(326.3 433.7) rotate(225.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(326.3 186.3) rotate(315.0)"/><rect x="362.0" y="98.0" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="450.0" y="123.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Warmer Arctic</text><text x="450.0" y="142.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >warming faster than</text><text x="450.0" y="157.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >the world as a whole</text><rect x="537.0" y="273.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="625.0" y="298.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Permafrost thaws</text><text x="625.0" y="317.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >deeper active layer,</text><text x="625.0" y="332.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >collapsing ground</text><rect x="362.0" y="448.0" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="450.0" y="473.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Old carbon rots</text><text x="450.0" y="492.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >with air: CO₂</text><text x="450.0" y="507.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >without air: methane</text><rect x="187.0" y="273.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="275.0" y="298.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >More greenhouse gas</text><text x="275.0" y="317.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >adds to warming</text><text x="275.0" y="332.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >everywhere</text><text x="450.0" y="290.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Feedback</text><text x="450.0" y="310.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >warming causes</text><text x="450.0" y="330.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >more warming</text></svg>