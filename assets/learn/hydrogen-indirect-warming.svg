<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Hydrogen is not a greenhouse gas, but a leak still warms</title><desc id="d">A four-step loop. Hydrogen leaks from pipes, valves and storage. It reacts with the hydroxyl radical, H2 plus OH gives water and a hydrogen atom, using up the atmosphere’s main cleaning agent. With less OH, methane lasts longer. The chemistry also produces more ozone and stratospheric water vapour. The result: hydrogen has an estimated 100-year global warming potential of about 11.6, plus or minus 2.8.</desc><rect width="900" height="560" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Hydrogen is not a greenhouse gas, but a leak still warms</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >It competes with methane for the hydroxyl radical (OH). Estimated 100-year GWP: 11.6 ± 2.8 (Sand et al. 2023).</text><circle cx="450" cy="310" r="175" fill="none" stroke="#E6E2E0" stroke-width="12"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(573.7 186.3) rotate(45.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(573.7 433.7) rotate(135.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(326.3 433.7) rotate(225.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(326.3 186.3) rotate(315.0)"/><rect x="362.0" y="98.0" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="450.0" y="123.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Hydrogen leaks</text><text x="450.0" y="142.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >from pipes, valves</text><text x="450.0" y="157.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >and storage</text><rect x="537.0" y="273.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="625.0" y="298.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Mops up OH</text><text x="625.0" y="317.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >H₂ + OH → H₂O + H</text><text x="625.0" y="332.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >the air’s “detergent”</text><rect x="362.0" y="448.0" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="450.0" y="473.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Methane lasts longer</text><text x="450.0" y="492.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >less OH to break</text><text x="450.0" y="507.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >it down</text><rect x="187.0" y="273.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="275.0" y="298.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >More ozone and</text><text x="275.0" y="317.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >stratospheric water</text><text x="275.0" y="332.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >vapour</text><text x="450.0" y="290.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Indirect warming</text><text x="450.0" y="310.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >about 12 × CO₂ per kg</text><text x="450.0" y="330.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >over 100 years</text></svg>