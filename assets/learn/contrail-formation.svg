<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">How a contrail forms</title><desc id="d">Burning kerosene with air gives CO2, water vapour and soot; roughly, two molecules of C12H26 and 37 of oxygen give 24 of CO2 and 26 of water, so each kilogram of fuel gives about 3.16 kg of CO2 and 1.2 kg of water. The hot, wet exhaust mixes with air at about minus 40 degrees or colder, and droplets freeze on soot and other particles into ice crystals. In dry air the ice evaporates within seconds or minutes. In ice-supersaturated air the crystals grow and spread into contrail cirrus lasting hours. Contrails need cold enough air, the Schmidt-Appleman criterion, and persist only in thin layers saturated with respect to ice, so a plane a few hundred metres higher or lower may leave no lasting trail.</desc><rect width="960" height="520" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A6A8A"/></marker></defs><rect x="0" y="0" width="960" height="520" fill="#EAF1F7"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >How a contrail forms</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >A contrail is a man-made cloud of ice crystals. Whether it lasts seconds or hours depends on the air the plane flies through.</text><rect x="20" y="90" width="175" height="92" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="107.5" y="118.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >1. Burn fuel</text><text x="107.5" y="142.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >kerosene + air →</text><text x="107.5" y="160.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >CO₂ + water vapour + soot</text><rect x="210" y="90" width="175" height="92" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="297.5" y="118.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >2. Hot, wet exhaust</text><text x="297.5" y="142.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >mixes with air</text><text x="297.5" y="160.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >at about −40 °C or colder</text><rect x="400" y="90" width="175" height="92" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="487.5" y="118.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >3. Droplets freeze</text><text x="487.5" y="142.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >on soot and other</text><text x="487.5" y="160.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >particles: ice crystals</text><rect x="590" y="70" width="350" height="92" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="765.0" y="98.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >4a. Dry air</text><text x="765.0" y="122.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >ice evaporates</text><text x="765.0" y="140.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >within seconds or minutes</text><rect x="590" y="200" width="350" height="92" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="765.0" y="228.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >4b. Ice-supersaturated air</text><text x="765.0" y="252.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >crystals grow and spread</text><text x="765.0" y="270.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >into contrail cirrus for hours</text><line x1="197.0" y1="136.0" x2="208.0" y2="136.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><line x1="387.0" y1="136.0" x2="398.0" y2="136.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><line x1="577.0" y1="120.0" x2="588.0" y2="112.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><line x1="577.0" y1="150.0" x2="588.0" y2="230.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><text x="20.0" y="230.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="700" >Kerosene, roughly:</text><text x="20.0" y="254.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',monospace">2C₁₂H₂₆ + 37O₂ → 24CO₂ + 26H₂O</text><text x="20.0" y="298.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >(idealised; real kerosene is a mixture)</text><text x="20.0" y="280.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >Each kg of fuel gives about 3.16 kg CO₂ and 1.2 kg of water.</text><rect x="20" y="320" width="920" height="180" rx="8" fill="#fff" stroke="#E6E2E0"/><text x="480.0" y="346.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Why two planes at the same time can look so different</text><text x="480.0" y="372.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Contrails need cold enough air (the Schmidt–Appleman criterion). Below that height, no trail.</text><text x="480.0" y="396.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >They persist only where the air is already saturated with respect to ice: a thin, invisible layer.</text><text x="480.0" y="420.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >A plane a few hundred metres higher or lower may miss that layer entirely.</text><text x="480.0" y="444.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Persistent trails spreading into a sheet of cloud are contrail cirrus: the part that matters for climate.</text></svg>