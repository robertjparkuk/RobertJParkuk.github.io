<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 349" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Reuse only pays if you actually reuse</title><desc id="d">Environment Agency life-cycle study of carrier bags, 2011: to beat a single-use plastic carrier on climate impact, a paper bag must be used 3 times, a plastic bag for life 4 times, a non-woven polypropylene bag 11 times and a cotton bag 131 times. If every plastic carrier is reused as a bin liner the numbers rise to 7, 9, 26 and 327.</desc><rect width="900" height="349" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Reuse only pays if you actually reuse</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Times each bag must be used to have a lower carbon footprint than a single-use plastic bag used once. Environment Agency, 2011 (2006 bags).</text><text x="318.0" y="104.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Paper bag</text><rect x="330" y="86" width="10.1" height="28" rx="4" fill="#C9B79C"/><text x="350.1" y="106.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >3 uses</text><text x="318.0" y="150.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >“Bag for life” (LDPE)</text><rect x="330" y="132" width="13.4" height="28" rx="4" fill="#8C8C8C"/><text x="353.4" y="152.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >4</text><text x="318.0" y="196.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Non-woven polypropylene</text><rect x="330" y="178" width="36.9" height="28" rx="4" fill="#4A6A8A"/><text x="376.9" y="198.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >11</text><text x="318.0" y="242.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Cotton bag</text><rect x="330" y="224" width="439.8" height="28" rx="4" fill="#4E7D4E"/><text x="779.8" y="244.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >131</text><line x1="330" y1="80" x2="330" y2="264" stroke="#1A1A1A" stroke-width="1"/><text x="330.0" y="282.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >number of uses</text><text x="20.0" y="306.0" font-size="12.5" fill="#A61C1C" text-anchor="start" font-weight="700" >If every single-use bag is reused as a bin liner, the numbers rise to 7, 9, 26 and 327.</text><text x="20.0" y="325.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >Climate only, and old data: the point is the shape, not the decimals.</text></svg>