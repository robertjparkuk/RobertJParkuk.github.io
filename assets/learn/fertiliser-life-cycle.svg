<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The life cycle of nitrogen fertiliser and what CBAM counts</title><desc id="d">Seven stages left to right: natural gas, with methane leaks in supply; hydrogen made by steam reforming, releasing the most CO2; ammonia made by Haber–Bosch, needing energy; nitric acid, which releases nitrous oxide unless abated; ammonium nitrate, CAN or urea, using electricity; shipping and haulage, using fuel; and the field, where nitrous oxide and ammonia are released. The carbon border taxes count the emissions at the production plants, from hydrogen to finished fertiliser, for CO2 and nitrous oxide; EU CBAM also counts electricity, UK CBAM direct emissions only. Neither counts methane leaks in gas supply or emissions on the field. A farm or food footprint should include all seven stages.</desc><rect width="960" height="470" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The life cycle of a bag of nitrogen fertiliser</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Where the emissions are, and which part a carbon border tax counts.</text><rect x="20" y="120" width="118" height="92" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/><text x="79.0" y="144.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Natural gas</text><text x="79.0" y="168.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >the hydrogen</text><text x="79.0" y="184.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >source</text><line x1="79.0" y1="216.0" x2="79.0" y2="260.0" stroke="#A61C1C" stroke-width="2" marker-end="url(#a1)"/><text x="79.0" y="278.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="600" >Methane leaks</text><line x1="140.0" y1="166.0" x2="152.0" y2="166.0" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#a0)"/><rect x="154" y="120" width="118" height="92" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/><text x="213.0" y="144.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Hydrogen</text><text x="213.0" y="168.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">CH₄ + 2H₂O</text><text x="213.0" y="184.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">→ CO₂ + 4H₂</text><line x1="213.0" y1="216.0" x2="213.0" y2="260.0" stroke="#A61C1C" stroke-width="2" marker-end="url(#a1)"/><text x="213.0" y="278.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="600" >CO₂ (the</text><text x="213.0" y="293.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="600" >biggest)</text><line x1="274.0" y1="166.0" x2="286.0" y2="166.0" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#a0)"/><rect x="288" y="120" width="118" height="92" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/><text x="347.0" y="144.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Ammonia</text><text x="347.0" y="168.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">N₂ + 3H₂</text><text x="347.0" y="184.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">→ 2NH₃</text><line x1="347.0" y1="216.0" x2="347.0" y2="260.0" stroke="#A61C1C" stroke-width="2" marker-end="url(#a1)"/><text x="347.0" y="278.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="600" >Energy for heat</text><text x="347.0" y="293.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="600" >and pressure</text><line x1="408.0" y1="166.0" x2="420.0" y2="166.0" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#a0)"/><rect x="422" y="120" width="118" height="92" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/><text x="481.0" y="144.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Nitric acid</text><text x="481.0" y="168.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">NH₃ + 2O₂</text><text x="481.0" y="184.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">→ HNO₃ + H₂O</text><line x1="481.0" y1="216.0" x2="481.0" y2="260.0" stroke="#A61C1C" stroke-width="2" marker-end="url(#a1)"/><text x="481.0" y="278.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="600" >N₂O (unless</text><text x="481.0" y="293.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="600" >abated)</text><line x1="542.0" y1="166.0" x2="554.0" y2="166.0" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#a0)"/><rect x="556" y="120" width="118" height="92" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/><text x="615.0" y="144.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Fertiliser</text><text x="615.0" y="168.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >ammonium nitrate,</text><text x="615.0" y="184.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >CAN or urea</text><line x1="615.0" y1="216.0" x2="615.0" y2="260.0" stroke="#A61C1C" stroke-width="2" marker-end="url(#a1)"/><text x="615.0" y="278.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="600" >Electricity</text><line x1="676.0" y1="166.0" x2="688.0" y2="166.0" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#a0)"/><rect x="690" y="120" width="118" height="92" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/><text x="749.0" y="144.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Ship and lorry</text><text x="749.0" y="168.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >to the</text><text x="749.0" y="184.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >merchant</text><line x1="749.0" y1="216.0" x2="749.0" y2="260.0" stroke="#A61C1C" stroke-width="2" marker-end="url(#a1)"/><text x="749.0" y="278.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="600" >Fuel</text><line x1="810.0" y1="166.0" x2="822.0" y2="166.0" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#a0)"/><rect x="824" y="120" width="118" height="92" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.6"/><text x="883.0" y="144.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >The field</text><text x="883.0" y="168.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >spread on</text><text x="883.0" y="184.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >grass or crops</text><line x1="883.0" y1="216.0" x2="883.0" y2="260.0" stroke="#A61C1C" stroke-width="2" marker-end="url(#a1)"/><text x="883.0" y="278.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="600" >N₂O and ammonia</text><path d="M154 108 v-8 H674 v8" fill="none" stroke="#A61C1C" stroke-width="2.5"/><text x="414.0" y="92.0" font-size="13" fill="#A61C1C" text-anchor="middle" font-weight="700" >Counted by CBAM: emissions at the plants (CO₂, N₂O); EU CBAM also counts electricity</text><path d="M20 360 v8 H942 v-8" fill="none" stroke="#1A1A1A" stroke-width="2.5"/><text x="481.0" y="388.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Cradle to field: what a farm or food carbon footprint should include</text><text x="20.0" y="430.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >Neither CBAM counts methane leaks in gas supply or anything that happens on the field.</text><text x="20.0" y="448.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >EU CBAM also counts the electricity used (indirect emissions) for fertilisers; UK CBAM counts direct emissions only from 1 January 2027.</text></svg>