<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Industrial routes to aspirin and paracetamol</title><desc id="d">Aspirin: benzene is turned into phenol by the cumene process using propylene and air; phenol is turned into salicylic acid by the Kolbe-Schmitt reaction with sodium hydroxide, CO2 and heat; salicylic acid is acetylated with acetic anhydride to give aspirin. Paracetamol: benzene to phenol by the cumene process; phenol is nitrated and reduced to 4-aminophenol, which is acetylated with acetic anhydride to give paracetamol. Paracetamol has 8 carbon atoms, all from fossil feedstocks on this route; aspirin has 9, one of which comes from the CO2 used in the Kolbe-Schmitt step. Bio-based phenol and acetic acid exist, but most of the footprint is process energy and solvents, not the atoms in the tablet.</desc><rect width="960" height="470" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Two everyday medicines, from benzene</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Simplified textbook routes; manufacturers vary them. Each arrow is a reactor, energy, solvent and waste.</text><text x="20.0" y="80.0" font-size="15" fill="#A61C1C" text-anchor="start" font-weight="700" >Aspirin</text><rect x="20" y="90" width="118" height="62" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="79.0" y="117.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Benzene</text><text x="79.0" y="136.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >C₆H₆</text><line x1="139.0" y1="121.0" x2="151.0" y2="121.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="152" y="90" width="118" height="62" rx="8" fill="#f4f4f4" stroke="#8C8C8C" stroke-width="1.5"/><text x="211.0" y="117.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Cumene process</text><text x="211.0" y="136.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >+ propylene, air</text><line x1="271.0" y1="121.0" x2="283.0" y2="121.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="284" y="90" width="118" height="62" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="343.0" y="117.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Phenol</text><text x="343.0" y="136.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >C₆H₅OH</text><line x1="403.0" y1="121.0" x2="415.0" y2="121.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="416" y="90" width="118" height="62" rx="8" fill="#f4f4f4" stroke="#8C8C8C" stroke-width="1.5"/><text x="475.0" y="117.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Kolbe–Schmitt</text><text x="475.0" y="136.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >+ NaOH, CO₂, heat</text><line x1="535.0" y1="121.0" x2="547.0" y2="121.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="548" y="90" width="118" height="62" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="607.0" y="117.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Salicylic acid</text><text x="607.0" y="136.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" ></text><line x1="667.0" y1="121.0" x2="679.0" y2="121.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="680" y="90" width="118" height="62" rx="8" fill="#f4f4f4" stroke="#8C8C8C" stroke-width="1.5"/><text x="739.0" y="117.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Acetylate</text><text x="739.0" y="136.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >+ acetic anhydride</text><line x1="799.0" y1="121.0" x2="811.0" y2="121.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="812" y="90" width="128" height="62" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="876.0" y="117.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Aspirin</text><text x="876.0" y="136.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >acetylsalicylic acid</text><text x="20.0" y="250.0" font-size="15" fill="#A61C1C" text-anchor="start" font-weight="700" >Paracetamol</text><rect x="20" y="260" width="118" height="62" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="79.0" y="287.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Benzene</text><text x="79.0" y="306.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >C₆H₆</text><line x1="139.0" y1="291.0" x2="151.0" y2="291.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="152" y="260" width="118" height="62" rx="8" fill="#f4f4f4" stroke="#8C8C8C" stroke-width="1.5"/><text x="211.0" y="287.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Cumene process</text><text x="211.0" y="306.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >+ propylene, air</text><line x1="271.0" y1="291.0" x2="283.0" y2="291.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="284" y="260" width="118" height="62" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="343.0" y="287.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Phenol</text><text x="343.0" y="306.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >C₆H₅OH</text><line x1="403.0" y1="291.0" x2="415.0" y2="291.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="416" y="260" width="118" height="62" rx="8" fill="#f4f4f4" stroke="#8C8C8C" stroke-width="1.5"/><text x="475.0" y="287.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Nitrate, reduce</text><text x="475.0" y="306.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >via 4-nitrophenol</text><line x1="535.0" y1="291.0" x2="547.0" y2="291.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="548" y="260" width="118" height="62" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="607.0" y="287.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >4-aminophenol</text><text x="607.0" y="306.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" ></text><line x1="667.0" y1="291.0" x2="679.0" y2="291.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="680" y="260" width="118" height="62" rx="8" fill="#f4f4f4" stroke="#8C8C8C" stroke-width="1.5"/><text x="739.0" y="287.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Acetylate</text><text x="739.0" y="306.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >+ acetic anhydride</text><line x1="799.0" y1="291.0" x2="811.0" y2="291.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="812" y="260" width="128" height="62" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="876.0" y="287.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Paracetamol</text><text x="876.0" y="306.0" font-size="10.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >acetaminophen in the US</text><rect x="20" y="360" width="920" height="90" rx="8" fill="#fff" stroke="#E6E2E0"/><text x="480.0" y="386.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Paracetamol: 8 carbon atoms, all from fossil feedstocks. Aspirin: 9, one of them from the CO₂ in Kolbe–Schmitt.</text><text x="480.0" y="408.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Bio-based phenol and acetic acid exist, and could replace some fossil carbon,</text><text x="480.0" y="428.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >but most of the footprint is process energy and solvents, not the atoms in the tablet.</text></svg>