<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Where the NHS footprint comes from (England)</title><desc id="d">NHS England reports these shares of its emissions: non-medical supply chain 42%; medicines and chemicals 25%; buildings and estates 15%; travel 14%; food 6%; inhalers 3%; anaesthetic gases 2%. The categories come from different footprint scopes and do not sum to 100. No equivalent figure was found for Health and Social Care in Northern Ireland.</desc><rect width="900" height="444" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Where the NHS footprint comes from (England)</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Share of NHS England emissions by area, as NHS England reports them. Greener NHS, from Delivering a “Net Zero” NHS (2020, updated 2022).</text><text x="278.0" y="104.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Non-medical supply chain</text><rect x="290" y="86" width="436.8" height="28" rx="4" fill="#8C8C8C"/><text x="736.8" y="106.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >42%</text><text x="278.0" y="146.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Medicines and chemicals</text><rect x="290" y="128" width="260.0" height="28" rx="4" fill="#A61C1C"/><text x="560.0" y="148.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >25%</text><text x="278.0" y="188.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Buildings and estates</text><rect x="290" y="170" width="156.0" height="28" rx="4" fill="#8C8C8C"/><text x="456.0" y="190.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >15%</text><text x="278.0" y="230.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Travel</text><rect x="290" y="212" width="145.6" height="28" rx="4" fill="#8C8C8C"/><text x="445.6" y="232.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >14%</text><text x="278.0" y="272.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Food</text><rect x="290" y="254" width="62.4" height="28" rx="4" fill="#8C8C8C"/><text x="362.4" y="274.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >6%</text><text x="278.0" y="314.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Inhalers</text><rect x="290" y="296" width="31.2" height="28" rx="4" fill="#A61C1C"/><text x="331.2" y="316.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >3%</text><text x="278.0" y="356.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Anaesthetic gases</text><rect x="290" y="338" width="20.8" height="28" rx="4" fill="#A61C1C"/><text x="320.8" y="358.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >2%</text><line x1="290" y1="80" x2="290" y2="374" stroke="#1A1A1A" stroke-width="1"/><text x="290.0" y="392.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >per cent of NHS England emissions (categories overlap; they do not sum to 100)</text><text x="20.0" y="416.0" font-size="12.5" fill="#A61C1C" text-anchor="start" font-weight="700" >A quarter of the NHS footprint is medicines. No equivalent figure is published for HSC in Northern Ireland.</text></svg>