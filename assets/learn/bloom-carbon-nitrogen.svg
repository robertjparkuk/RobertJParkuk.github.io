<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">A bloom’s carbon and nitrogen</title><desc id="d">A six-step loop. A bloom grows, taking CO2 from the water by photosynthesis, and from the air when the water runs short; it grows faster in warm water. Some species, such as Dolichospermum and Aphanizomenon, fix nitrogen gas into ammonia in heterocysts; Microcystis cannot. Some make toxins: microcystins attack the liver, anatoxin-a the nerves. The bloom dies and sinks, leaking nitrogen and phosphorus into the water. It rots: with oxygen back to CO2, without oxygen to methane. The nutrients, with phosphorus released from the mud, feed the next bloom. The carbon is only borrowed, and a greener lake is a bigger methane source.</desc><rect width="920" height="620" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >A bloom’s carbon and nitrogen</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >The carbon is only borrowed, and some comes back as methane. Fixed nitrogen and recycled phosphorus feed the next bloom.</text><circle cx="460" cy="335" r="215" fill="none" stroke="#E6E2E0" stroke-width="12"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(567.5 148.8) rotate(30.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(675.0 335.0) rotate(90.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(567.5 521.2) rotate(150.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(352.5 521.2) rotate(210.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(245.0 335.0) rotate(270.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(352.5 148.8) rotate(330.0)"/><rect x="372.0" y="83.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="460.0" y="108.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Bloom grows</text><text x="460.0" y="127.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >photosynthesis takes CO₂;</text><text x="460.0" y="142.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >faster when warm</text><rect x="558.2" y="190.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="646.2" y="215.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Some fix nitrogen</text><text x="646.2" y="234.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >e.g. Dolichospermum:</text><text x="646.2" y="249.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >N₂ → NH₃ in heterocysts</text><rect x="558.2" y="405.5" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="646.2" y="430.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Toxins</text><text x="646.2" y="449.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >microcystins (liver),</text><text x="646.2" y="464.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >anatoxin-a (nerves)</text><rect x="372.0" y="513.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="460.0" y="538.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Dies and sinks</text><text x="460.0" y="557.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >leaks nitrogen and</text><text x="460.0" y="572.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >phosphorus into the water</text><rect x="185.8" y="405.5" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="273.8" y="430.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Rots</text><text x="273.8" y="449.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >with oxygen: CO₂ back;</text><text x="273.8" y="464.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >without: methane (CH₄)</text><rect x="185.8" y="190.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="273.8" y="215.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Next bloom</text><text x="273.8" y="234.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >fed by the nutrients</text><text x="273.8" y="249.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >and phosphorus from the mud</text><text x="460.0" y="315.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Borrowed carbon</text><text x="460.0" y="335.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >a greener lake is a</text><text x="460.0" y="355.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >bigger methane source</text></svg>