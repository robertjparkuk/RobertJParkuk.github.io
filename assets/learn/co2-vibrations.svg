<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The three ways a carbon dioxide molecule vibrates</title><desc id="d">Symmetric stretch: both oxygens move out together, no change in dipole, so it does not absorb infrared. Bend: absorbs at 15 micrometres (667 per centimetre), right where Earth emits most heat. Asymmetric stretch: absorbs at 4.3 micrometres (2,349 per centimetre).</desc><rect width="900" height="330" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5A5A5A"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Why carbon dioxide absorbs heat: three ways to wobble</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Infrared is absorbed only by a vibration that changes the molecule’s electrical balance (its dipole).</text><rect x="20" y="70" width="280" height="240" rx="8" fill="#f6f6f6" stroke="#8C8C8C" stroke-width="1.5"/><text x="160.0" y="96.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Symmetric stretch</text><line x1="160.0" y1="171.0" x2="218.0" y2="171.0" stroke="#1A1A1A" stroke-width="2.2"/><line x1="160.0" y1="179.0" x2="218.0" y2="179.0" stroke="#1A1A1A" stroke-width="2.2"/><line x1="160.0" y1="179.0" x2="102.0" y2="179.0" stroke="#1A1A1A" stroke-width="2.2"/><line x1="160.0" y1="171.0" x2="102.0" y2="171.0" stroke="#1A1A1A" stroke-width="2.2"/><g><circle cx="160.0" cy="175.0" r="17" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.5"/><text x="160.0" y="179.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >C</text></g><g><circle cx="218.0" cy="175.0" r="17" fill="#A61C1C" stroke="#1A1A1A" stroke-width="1.5"/><text x="218.0" y="179.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >O</text></g><g><circle cx="102.0" cy="175.0" r="17" fill="#A61C1C" stroke="#1A1A1A" stroke-width="1.5"/><text x="102.0" y="179.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >O</text></g><path d="M80.0 175.0 h-22" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#arg)"/><path d="M240.0 175.0 h22" stroke="#5A5A5A" stroke-width="2.5" marker-end="url(#arg)"/><text x="160.0" y="238.0" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Both oxygens move out together</text><text x="160.0" y="262.0" font-size="13" fill="#5A5A5A" text-anchor="middle" font-weight="700" >No dipole change: infrared-blind</text><text x="160.0" y="284.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Seen only by Raman spectroscopy</text><rect x="310" y="70" width="280" height="240" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="450.0" y="96.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Bend</text><line x1="451.0" y1="161.1" x2="507.1" y2="176.1" stroke="#1A1A1A" stroke-width="2.2"/><line x1="449.0" y1="168.9" x2="505.0" y2="183.9" stroke="#1A1A1A" stroke-width="2.2"/><line x1="451.0" y1="168.9" x2="395.0" y2="183.9" stroke="#1A1A1A" stroke-width="2.2"/><line x1="449.0" y1="161.1" x2="392.9" y2="176.1" stroke="#1A1A1A" stroke-width="2.2"/><g><circle cx="450.0" cy="165.0" r="17" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.5"/><text x="450.0" y="169.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >C</text></g><g><circle cx="506.0" cy="180.0" r="17" fill="#A61C1C" stroke="#1A1A1A" stroke-width="1.5"/><text x="506.0" y="184.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >O</text></g><g><circle cx="394.0" cy="180.0" r="17" fill="#A61C1C" stroke="#1A1A1A" stroke-width="1.5"/><text x="394.0" y="184.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >O</text></g><path d="M394.0 187.0 v22" stroke="#A61C1C" stroke-width="2.5" marker-end="url(#ar)"/><path d="M506.0 187.0 v22" stroke="#A61C1C" stroke-width="2.5" marker-end="url(#ar)"/><path d="M450.0 141.0 v-22" stroke="#A61C1C" stroke-width="2.5" marker-end="url(#ar)"/><text x="450.0" y="238.0" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >The molecule flexes like a hinge</text><text x="450.0" y="262.0" font-size="13" fill="#A61C1C" text-anchor="middle" font-weight="700" >Dipole changes: absorbs at 15 µm</text><text x="450.0" y="284.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >667 cm⁻¹, right where Earth glows</text><rect x="600" y="70" width="280" height="240" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="740.0" y="96.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Asymmetric stretch</text><line x1="740.0" y1="171.0" x2="798.0" y2="171.0" stroke="#1A1A1A" stroke-width="2.2"/><line x1="740.0" y1="179.0" x2="798.0" y2="179.0" stroke="#1A1A1A" stroke-width="2.2"/><line x1="740.0" y1="179.0" x2="682.0" y2="179.0" stroke="#1A1A1A" stroke-width="2.2"/><line x1="740.0" y1="171.0" x2="682.0" y2="171.0" stroke="#1A1A1A" stroke-width="2.2"/><g><circle cx="740.0" cy="175.0" r="17" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.5"/><text x="740.0" y="179.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >C</text></g><g><circle cx="798.0" cy="175.0" r="17" fill="#A61C1C" stroke="#1A1A1A" stroke-width="1.5"/><text x="798.0" y="179.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >O</text></g><g><circle cx="682.0" cy="175.0" r="17" fill="#A61C1C" stroke="#1A1A1A" stroke-width="1.5"/><text x="682.0" y="179.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >O</text></g><path d="M660.0 175.0 h-22" stroke="#A61C1C" stroke-width="2.5" marker-end="url(#ar)"/><path d="M820.0 175.0 h22" stroke="#A61C1C" stroke-width="2.5" marker-end="url(#ar)" transform="rotate(180 831.0 175.0)"/><path d="M732.0 149.0 h16" stroke="#A61C1C" stroke-width="2.5" marker-end="url(#ar)"/><text x="740.0" y="238.0" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Oxygens shift one way, carbon the other</text><text x="740.0" y="262.0" font-size="13" fill="#A61C1C" text-anchor="middle" font-weight="700" >Dipole changes: absorbs at 4.3 µm</text><text x="740.0" y="284.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >2,349 cm⁻¹</text></svg>