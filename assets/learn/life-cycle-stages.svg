<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The carbon life cycle, stage by stage</title><desc id="d">Six blocks from left to right: A1 to A3 product stage; A4 to A5 construction; B1 to B5 upkeep in use; B6 to B7 energy and water used in operation; C1 to C4 end of life; D reuse and recycling beyond the system boundary, reported separately. Cradle to gate covers A1 to A3. Upfront carbon covers A1 to A5. Embodied carbon covers everything from A to C except B6 and B7. Operational carbon is B6 and B7. Cradle to grave, or whole-life carbon, covers A to C. Adding D gives cradle to cradle.</desc><rect width="900" height="470" fill="#fff"/><text x="30" y="30" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The carbon life cycle, stage by stage</text><text x="30" y="52" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Module letters as used in the European standards for buildings and construction products (EN 15978, EN 15804)</text><rect x="30" y="190" width="145" height="74" rx="6" fill="#FAF3F3" stroke="#A61C1C" stroke-width="2"><title>A1–A3 Product: Raw materials, transport to factory, manufacture</title></rect><text x="102.5" y="217" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="700" >A1–A3</text><text x="102.5" y="238" font-size="13" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Product</text><rect x="181" y="190" width="115" height="74" rx="6" fill="#FAF3F3" stroke="#A61C1C" stroke-width="2"><title>A4–A5 Construction: Transport to site, building or installing</title></rect><text x="238.5" y="217" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="700" >A4–A5</text><text x="238.5" y="238" font-size="13" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Construction</text><rect x="302" y="190" width="155" height="74" rx="6" fill="#FAF3F3" stroke="#A61C1C" stroke-width="2"><title>B1–B5 Use: upkeep: Use, maintenance, repair, replacement, refurbishment</title></rect><text x="379.5" y="217" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="700" >B1–B5</text><text x="379.5" y="238" font-size="13" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Use: upkeep</text><rect x="463" y="190" width="115" height="74" rx="6" fill="#fff" stroke="#8C8C8C" stroke-width="2"><title>B6–B7 Use: running: Energy and water used to run it</title></rect><text x="520.5" y="217" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="700" >B6–B7</text><text x="520.5" y="238" font-size="13" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Use: running</text><rect x="584" y="190" width="150" height="74" rx="6" fill="#FAF3F3" stroke="#A61C1C" stroke-width="2"><title>C1–C4 End of life: Demolition, transport, waste processing, disposal</title></rect><text x="659.0" y="217" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="700" >C1–C4</text><text x="659.0" y="238" font-size="13" fill="#5A5A5A" text-anchor="middle" font-weight="400" >End of life</text><rect x="740" y="190" width="115" height="74" rx="6" fill="#f4f4f4" stroke="#8C8C8C" stroke-width="2" stroke-dasharray="5 4"><title>D Beyond: Reuse, recovery, recycling: reported separately</title></rect><text x="797.5" y="217" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="700" >D</text><text x="797.5" y="238" font-size="13" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Beyond</text><path d="M30 178 v-8 H175 v8" fill="none" stroke="#1A1A1A" stroke-width="2.5"/><text x="102.5" y="162" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Cradle to gate</text><path d="M30 128 v-8 H296 v8" fill="none" stroke="#A61C1C" stroke-width="2.5"/><text x="163.0" y="112" font-size="14" fill="#A61C1C" text-anchor="middle" font-weight="700" >Upfront carbon (A1–A5)</text><path d="M30 282 v10 H457 v-10" fill="none" stroke="#A61C1C" stroke-width="2.5"/><path d="M584 282 v10 H734 v-10" fill="none" stroke="#A61C1C" stroke-width="2.5"/><path d="M457 292 H584" fill="none" stroke="#A61C1C" stroke-width="1.5" stroke-dasharray="3 4"/><text x="382.0" y="314" font-size="14" fill="#A61C1C" text-anchor="middle" font-weight="700" >Embodied carbon: everything except running the building or product (B6–B7)</text><path d="M463 332 v10 H578 v-10" fill="none" stroke="#8C8C8C" stroke-width="2.5"/><text x="520.5" y="360" font-size="14" fill="#5A5A5A" text-anchor="middle" font-weight="700" >Operational carbon</text><path d="M30 382 v10 H734 v-10" fill="none" stroke="#1A1A1A" stroke-width="2.5"/><text x="382.0" y="410" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Cradle to grave = whole-life carbon (A to C)</text><text x="797.5" y="410" font-size="13" fill="#5A5A5A" text-anchor="middle" font-weight="400" >+ D: cradle to cradle</text><text x="30" y="456" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >Robert J. Park · robertjpark.co.uk/learn · Simplified; see the standards for the full module definitions.</text></svg>