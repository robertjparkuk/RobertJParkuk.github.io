<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">From oil and gas to medicines</title><desc id="d">Crude oil and natural gas are refined, cracked and reformed into building blocks: benzene and toluene, which are aromatic rings; ethylene and propylene; methanol and ammonia from natural gas; and solvents such as acetone, toluene and DMF. Benzene leads via cumene to phenol, which leads to aspirin, paracetamol and many other active ingredients. Ethylene and propylene make plastics for syringes, IV bags and blister packs. Methanol and ammonia are building blocks for many active ingredients. Solvents are used and then recovered or burned, often the biggest mass in the process. The carbon in the molecule is small; the energy, solvents and waste needed to make it are not.</desc><rect width="960" height="600" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8C8C8C"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >From oil and gas to the medicine cabinet</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Most synthetic medicines, and almost all medical plastics, start from a handful of petrochemical building blocks.</text><rect x="20" y="80" width="200" height="440" rx="8" fill="#f4f4f4" stroke="#8C8C8C"/><text x="120.0" y="106.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Crude oil and</text><text x="120.0" y="124.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >natural gas</text><text x="120.0" y="160.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Refining and</text><text x="120.0" y="178.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >steam cracking</text><text x="120.0" y="196.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" ></text><text x="120.0" y="214.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Reforming</text><line x1="222.0" y1="135.0" x2="290.0" y2="135.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="292" y="110" width="210" height="58" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="397.0" y="135.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Benzene, toluene</text><text x="397.0" y="154.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >aromatic rings</text><line x1="222.0" y1="235.0" x2="290.0" y2="235.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="292" y="210" width="210" height="58" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="397.0" y="235.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Ethylene, propylene</text><text x="397.0" y="254.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >small building blocks</text><line x1="222.0" y1="335.0" x2="290.0" y2="335.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="292" y="310" width="210" height="58" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="397.0" y="335.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Methanol, ammonia</text><text x="397.0" y="354.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >from natural gas</text><line x1="222.0" y1="435.0" x2="290.0" y2="435.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="292" y="410" width="210" height="58" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="397.0" y="435.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Solvents</text><text x="397.0" y="454.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >acetone, toluene, DMF…</text><path d="M504 139 C 545 139, 545 115, 585 115" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="588" y="90" width="352" height="56" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.5"/><text x="764.0" y="114.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Phenol</text><text x="764.0" y="133.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >via cumene</text><path d="M504 139 C 545 139, 545 185, 585 185" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="588" y="160" width="352" height="56" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="764.0" y="184.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Aspirin, paracetamol</text><text x="764.0" y="203.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >and many more APIs</text><path d="M504 239 C 545 239, 545 265, 585 265" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="588" y="240" width="352" height="56" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.5"/><text x="764.0" y="264.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Plastics</text><text x="764.0" y="283.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >syringes, IV bags, blister packs</text><path d="M504 339 C 545 339, 545 345, 585 345" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="588" y="320" width="352" height="56" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.5"/><text x="764.0" y="344.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Building blocks</text><text x="764.0" y="363.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >for many active ingredients</text><path d="M504 439 C 545 439, 545 445, 585 445" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><rect x="588" y="420" width="352" height="56" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.5"/><text x="764.0" y="444.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Used, then recovered or burned</text><text x="764.0" y="463.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >often the biggest mass in the process</text><line x1="764.0" y1="146.0" x2="764.0" y2="158.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><text x="480.0" y="560.0" font-size="13" fill="#A61C1C" text-anchor="middle" font-weight="700" >The carbon in the molecule is small. The energy, solvents and waste needed to make it are not.</text></svg>