<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">From melting ice to a slower ocean</title><desc id="d">A six-step loop. More CO2 and heat melt sea ice; white ice reflects most sunlight while dark sea absorbs it. Melting ice adds fresh water that dilutes the North Atlantic, and less salty water sinks less readily, so the overturning circulation slows. Seas warm and stratify, so layers stop mixing, with more blooms and less oxygen. Warmer water holds less gas, so the sea absorbs less CO2, adding to warming.</desc><rect width="900" height="640" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >From melting ice to a slower ocean</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Linked feedbacks in the North Atlantic. Each one is real; how far and how fast they go is still being studied.</text><circle cx="450" cy="345" r="215" fill="none" stroke="#E6E2E0" stroke-width="12"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(557.5 158.8) rotate(30.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(665.0 345.0) rotate(90.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(557.5 531.2) rotate(150.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(342.5 531.2) rotate(210.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(235.0 345.0) rotate(270.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(342.5 158.8) rotate(330.0)"/><rect x="362.0" y="93.0" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="450.0" y="118.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >More CO₂ and heat</text><text x="450.0" y="137.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >from burning fossil</text><text x="450.0" y="152.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >fuels</text><rect x="548.2" y="200.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="636.2" y="225.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Ice melts</text><text x="636.2" y="244.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >white ice reflects most</text><text x="636.2" y="259.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >sunlight; dark sea absorbs it</text><rect x="548.2" y="415.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="636.2" y="440.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Fresh water floods in</text><text x="636.2" y="459.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >melting ice dilutes</text><text x="636.2" y="474.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >the North Atlantic</text><rect x="362.0" y="523.0" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="450.0" y="548.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Circulation slows</text><text x="450.0" y="567.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >less salty water sinks</text><text x="450.0" y="582.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >less readily</text><rect x="175.8" y="415.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="263.8" y="440.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Seas warm and stratify</text><text x="263.8" y="459.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >layers stop mixing;</text><text x="263.8" y="474.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >blooms, less oxygen</text><rect x="175.8" y="200.5" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="263.8" y="225.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Seas absorb less CO₂</text><text x="263.8" y="244.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >warm water holds</text><text x="263.8" y="259.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >less gas</text><text x="450.0" y="315.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Ocean feedbacks</text><text x="450.0" y="335.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >warming changes</text><text x="450.0" y="355.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >the sea, which</text><text x="450.0" y="375.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >changes warming</text></svg>