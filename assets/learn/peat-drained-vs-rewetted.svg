<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Emissions from drained and rewetted peat grassland</title><desc id="d">Stacked bars, tonnes of CO2 equivalent per hectare per year, from IPCC 2013 Wetlands Supplement factors with AR5 GWPs, illustrative: deep-drained nutrient-rich peat grassland about 29, mostly CO2 from rotting peat (22.4) with some methane, nitrous oxide and dissolved carbon; rewetted about 11, with CO2 down to 1.8 but methane up to 8.1. Net saving about 18 tonnes per hectare a year.</desc><rect width="900" height="400" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >One hectare of peat grassland: drained against rewetted</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Tonnes CO₂e per hectare per year, IPCC 2013 Wetlands Supplement factors, AR5 GWPs. Illustrative arithmetic; real sites vary widely.</text><text x="248.0" y="118.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >Drained (deep, nutrient-rich)</text><rect x="260.0" y="90" width="418.1" height="44" fill="#6B4F3A"><title>CO₂ from rotting peat 22.4: 22.4</title></rect><text x="469.1" y="117.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >CO₂ from rotting peat 22.4</text><rect x="678.1" y="90" width="38.3" height="44" fill="#A61C1C"><title>methane: 2.05</title></rect><rect x="716.4" y="90" width="63.5" height="44" fill="#D98C8C"><title>N₂O: 3.4</title></rect><rect x="779.9" y="90" width="16.8" height="44" fill="#8C8C8C"><title>dissolved carbon: 0.9</title></rect><text x="806.7" y="118.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >about 29</text><text x="248.0" y="228.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >Rewetted</text><rect x="260.0" y="200" width="33.6" height="44" fill="#6B4F3A"><title>CO₂: 1.8</title></rect><rect x="293.6" y="200" width="151.2" height="44" fill="#A61C1C"><title>methane 8.1: 8.1</title></rect><text x="369.2" y="227.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >methane 8.1</text><rect x="444.8" y="200" width="16.8" height="44" fill="#8C8C8C"><title>dissolved carbon: 0.9</title></rect><text x="471.6" y="228.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >about 11</text><rect x="260" y="318" width="12" height="12" fill="#6B4F3A"/><text x="278.0" y="329.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="400" >CO₂ from the peat</text><rect x="419" y="318" width="12" height="12" fill="#A61C1C"/><text x="437.0" y="329.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="400" >Methane</text><rect x="508" y="318" width="12" height="12" fill="#D98C8C"/><text x="526.0" y="329.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="400" >Nitrous oxide</text><rect x="639" y="318" width="12" height="12" fill="#8C8C8C"/><text x="657.0" y="329.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="400" >Dissolved carbon (as CO₂)</text><text x="20.0" y="372.0" font-size="12.5" fill="#A61C1C" text-anchor="start" font-weight="700" >Rewetting cuts CO₂ sharply and adds some methane. The net saving here is about 18 t CO₂e per hectare a year.</text></svg>