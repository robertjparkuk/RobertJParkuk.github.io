<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Turning carbon back into stone</title><desc id="d">A four-step cycle. Limestone, calcium carbonate made from ancient shells and corals, is heated in a kiln to make lime and cement, releasing CO2: CaCO3 gives CaO plus CO2, about 0.52 tonnes of CO2 per tonne of clinker. Lime mortar and concrete slowly re-absorb some CO2 as calcium hydroxide turns back into calcium carbonate. Captured CO2 pumped into basalt with water turns into carbonate rock in under two years, as at CarbFix in Iceland, and so back to stone.</desc><rect width="900" height="600" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Turning carbon back into stone</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >The carbonate cycle links seashells, cement kilns, lime mortar and the newest way to store CO₂: mineralisation.</text><circle cx="450" cy="330" r="190" fill="none" stroke="#E6E2E0" stroke-width="12"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(584.4 195.6) rotate(45.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(584.4 464.4) rotate(135.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(315.6 464.4) rotate(225.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(315.6 195.6) rotate(315.0)"/><rect x="362.0" y="103.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="450.0" y="128.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Limestone CaCO₃</text><text x="450.0" y="147.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >shells and corals</text><text x="450.0" y="162.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >turned to rock</text><rect x="552.0" y="293.0" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="640.0" y="318.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Kiln: lime and cement</text><text x="640.0" y="337.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >CaCO₃ → CaO + CO₂</text><text x="640.0" y="352.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >0.52 t CO₂ per t clinker</text><rect x="362.0" y="483.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="450.0" y="508.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Mortar and concrete</text><text x="450.0" y="527.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >slowly re-absorb CO₂</text><text x="450.0" y="542.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Ca(OH)₂ + CO₂ → CaCO₃</text><rect x="172.0" y="293.0" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="260.0" y="318.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Captured CO₂ in rock</text><text x="260.0" y="337.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >basalt + CO₂ + water</text><text x="260.0" y="352.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >→ carbonate in &lt;2 years</text><text x="450.0" y="310.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Carbonate minerals</text><text x="450.0" y="330.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >made, broken and</text><text x="450.0" y="350.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >made again</text></svg>