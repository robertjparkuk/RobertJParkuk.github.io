<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 349" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">What warms the climate in aviation (2018)</title><desc id="d">Effective radiative forcing from aviation in 2018, in milliwatts per square metre, from Lee and colleagues 2021: contrail cirrus 57.4; CO2 from all flights since 1940, 34.3; all other effects net 9.2; aviation total net 100.9, with a range of 55 to 145. Non-CO2 effects were about two-thirds of the total, but they are much less certain than the CO2 effect.</desc><rect width="900" height="349" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >What warms the climate in aviation (2018)</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >mW/m² of effective radiative forcing (Lee et al. 2021). “Other” = NOx, water vapour, soot and sulphate, net (my arithmetic).</text><text x="288.0" y="104.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Contrail cirrus</text><rect x="300" y="86" width="179.9" height="28" rx="4" fill="#A61C1C"/><text x="489.9" y="106.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >57.4</text><text x="288.0" y="150.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >CO₂ from all flights since 1940</text><rect x="300" y="132" width="107.5" height="28" rx="4" fill="#1A1A1A"/><text x="417.5" y="152.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >34.3</text><text x="288.0" y="196.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >All other effects, net</text><rect x="300" y="178" width="28.8" height="28" rx="4" fill="#8C8C8C"/><text x="338.8" y="198.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >9.2</text><text x="288.0" y="242.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Aviation total, net</text><rect x="300" y="224" width="316.2" height="28" rx="4" fill="#4A6A8A"/><text x="626.2" y="244.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >100.9 (range 55–145)</text><line x1="300" y1="80" x2="300" y2="264" stroke="#1A1A1A" stroke-width="1"/><text x="300.0" y="282.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >mW/m², effective radiative forcing</text><text x="20.0" y="306.0" font-size="12.5" fill="#A61C1C" text-anchor="start" font-weight="700" >Contrails warmed more than all the CO₂ aviation has ever emitted, but with a much wider uncertainty.</text><text x="20.0" y="325.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >Contrail warming stops within hours if flights stop; CO₂ stays for centuries.</text></svg>