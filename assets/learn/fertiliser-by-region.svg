<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Carbon footprint of ammonium nitrate by region of production</title><desc id="d">Kilograms of CO2 equivalent per kilogram of nitrogen, cradle to gate, from an industry-published study using 2013–14 data: European average 3.32; North America 6.71; Russia and neighbouring states 7.11; Middle East 7.15; China, coal-based, 10.88. The main difference is that most European nitric acid plants abate their nitrous oxide.</desc><rect width="900" height="380" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Same bag, different footprint: ammonium nitrate by where it was made</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >kg CO₂e per kg of nitrogen, cradle to gate. Industry-published figures from 2013–14 data: the gap matters more than the exact values.</text><text x="258.0" y="102.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="600" >European average</text><rect x="270" y="86" width="157.7" height="26" rx="4" fill="#A61C1C"><title>European average: 3.32</title></rect><text x="435.7" y="104.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="700" >3.32</text><text x="258.0" y="150.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="600" >North America</text><rect x="270" y="134" width="318.7" height="26" rx="4" fill="#8C8C8C"><title>North America: 6.71</title></rect><text x="596.7" y="152.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="700" >6.71</text><text x="258.0" y="198.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="600" >Russia and neighbours</text><rect x="270" y="182" width="337.7" height="26" rx="4" fill="#8C8C8C"><title>Russia and neighbours: 7.11</title></rect><text x="615.7" y="200.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="700" >7.11</text><text x="258.0" y="246.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="600" >Middle East</text><rect x="270" y="230" width="339.6" height="26" rx="4" fill="#8C8C8C"><title>Middle East: 7.15</title></rect><text x="617.6" y="248.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="700" >7.15</text><text x="258.0" y="294.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="600" >China (coal-based)</text><rect x="270" y="278" width="516.8" height="26" rx="4" fill="#1A1A1A"><title>China (coal-based): 10.88</title></rect><text x="794.8" y="296.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="700" >10.88</text><line x1="270.0" y1="320" x2="270.0" y2="326" stroke="#1A1A1A"/><text x="270.0" y="342.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >0</text><line x1="365.0" y1="320" x2="365.0" y2="326" stroke="#1A1A1A"/><text x="365.0" y="342.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >2</text><line x1="460.0" y1="320" x2="460.0" y2="326" stroke="#1A1A1A"/><text x="460.0" y="342.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >4</text><line x1="555.0" y1="320" x2="555.0" y2="326" stroke="#1A1A1A"/><text x="555.0" y="342.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >6</text><line x1="650.0" y1="320" x2="650.0" y2="326" stroke="#1A1A1A"/><text x="650.0" y="342.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >8</text><line x1="745.0" y1="320" x2="745.0" y2="326" stroke="#1A1A1A"/><text x="745.0" y="342.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >10</text><line x1="840.0" y1="320" x2="840.0" y2="326" stroke="#1A1A1A"/><text x="840.0" y="342.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >12</text><line x1="270" y1="320" x2="840" y2="320" stroke="#1A1A1A"/><text x="20.0" y="370.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >The main difference: most European nitric acid plants now destroy their nitrous oxide; elsewhere many do not.</text></svg>