<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Ice sheets and permafrost compared</title><desc id="d">A comparison table. Ice sheets in Greenland and Antarctica are ice on land kilometres thick; melting them raises the sea, releases almost no carbon, takes centuries to millennia and is worse for coasts and cities. Permafrost is frozen soil full of old plant remains; thawing it releases CO2 and methane, billions of tonnes over centuries, gradually and in sudden collapses, and is worse for the carbon budget. Neither can be undone on human timescales.</desc><rect width="960" height="440" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Ice caps or permafrost: which is worse?</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >They do different damage. Ice sheets raise the sea; permafrost adds carbon to the air.</text><rect x="20" y="75" width="206" height="46" fill="#f4f4f4" stroke="#E6E2E0"/><text x="32.0" y="103.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" ></text><rect x="230" y="75" width="366" height="46" fill="#f4f4f4" stroke="#E6E2E0"/><text x="242.0" y="103.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >Ice sheets (Greenland, Antarctica)</text><rect x="600" y="75" width="336" height="46" fill="#f4f4f4" stroke="#E6E2E0"/><text x="612.0" y="103.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >Permafrost</text><rect x="20" y="125" width="206" height="46" fill="#fff" stroke="#E6E2E0"/><text x="32.0" y="153.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >What melts</text><rect x="230" y="125" width="366" height="46" fill="#fff" stroke="#E6E2E0"/><text x="242.0" y="153.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Ice on land, kilometres thick</text><rect x="600" y="125" width="336" height="46" fill="#fff" stroke="#E6E2E0"/><text x="612.0" y="153.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Frozen soil full of old plants</text><rect x="20" y="175" width="206" height="46" fill="#faf9f8" stroke="#E6E2E0"/><text x="32.0" y="203.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >Main harm</text><rect x="230" y="175" width="366" height="46" fill="#faf9f8" stroke="#E6E2E0"/><text x="242.0" y="203.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Sea-level rise</text><rect x="600" y="175" width="336" height="46" fill="#faf9f8" stroke="#E6E2E0"/><text x="612.0" y="203.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >CO₂ and methane: more warming</text><rect x="20" y="225" width="206" height="46" fill="#fff" stroke="#E6E2E0"/><text x="32.0" y="253.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >Carbon released</text><rect x="230" y="225" width="366" height="46" fill="#fff" stroke="#E6E2E0"/><text x="242.0" y="253.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Almost none</text><rect x="600" y="225" width="336" height="46" fill="#FAF3F3" stroke="#A61C1C"/><text x="612.0" y="253.0" font-size="13" fill="#A61C1C" text-anchor="start" font-weight="700" >Billions of tonnes, over centuries</text><rect x="20" y="275" width="206" height="46" fill="#faf9f8" stroke="#E6E2E0"/><text x="32.0" y="303.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >Speed</text><rect x="230" y="275" width="366" height="46" fill="#faf9f8" stroke="#E6E2E0"/><text x="242.0" y="303.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Centuries to millennia</text><rect x="600" y="275" width="336" height="46" fill="#faf9f8" stroke="#E6E2E0"/><text x="612.0" y="303.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Gradual, plus sudden collapses</text><rect x="20" y="325" width="206" height="46" fill="#fff" stroke="#E6E2E0"/><text x="32.0" y="353.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >Can it be undone?</text><rect x="230" y="325" width="366" height="46" fill="#fff" stroke="#E6E2E0"/><text x="242.0" y="353.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Not on human timescales</text><rect x="600" y="325" width="336" height="46" fill="#fff" stroke="#E6E2E0"/><text x="612.0" y="353.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Not on human timescales</text><rect x="20" y="375" width="206" height="46" fill="#faf9f8" stroke="#E6E2E0"/><text x="32.0" y="403.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >Worse for…</text><rect x="230" y="375" width="366" height="46" fill="#faf9f8" stroke="#E6E2E0"/><text x="242.0" y="403.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >coasts and cities</text><rect x="600" y="375" width="336" height="46" fill="#FAF3F3" stroke="#A61C1C"/><text x="612.0" y="403.0" font-size="13" fill="#A61C1C" text-anchor="start" font-weight="700" >the carbon budget</text></svg>