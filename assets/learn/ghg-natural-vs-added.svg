<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Natural and human-added shares of each greenhouse gas</title><desc id="d">Share of today’s concentration that was there before industry: carbon dioxide about 65% (426.8 ppm in 2025, 153% of 1750); methane about 37% (1,948 ppb, 267% of 1750); nitrous oxide about 79% (339.1 ppb, 126% of 1750); CF4 about 41% (34 ppt natural background from rocks, 83 ppt by 2016); SF6, C2F6, NF3 and HFCs entirely man-made.</desc><rect width="960" height="500" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >How much of each gas is natural, and how much have we added?</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Share of today’s concentration that was there before industry (grey) and that people have added (red).</text><text x="238.0" y="109.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >Carbon dioxide</text><rect x="250" y="91" width="351.0" height="28" fill="#8C8C8C"/><rect x="601.0" y="91" width="189.0" height="28" fill="#A61C1C"/><text x="425.5" y="110.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >65% natural</text><text x="695.5" y="110.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >35% added</text><text x="802.0" y="103.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >426.8 ppm in 2025</text><text x="802.0" y="117.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >153% of 1750</text><text x="238.0" y="171.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >Methane</text><rect x="250" y="153" width="199.8" height="28" fill="#8C8C8C"/><rect x="449.8" y="153" width="340.2" height="28" fill="#A61C1C"/><text x="349.9" y="172.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >37% natural</text><text x="619.9" y="172.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >63% added</text><text x="802.0" y="165.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >1,948 ppb in 2025</text><text x="802.0" y="179.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >267% of 1750</text><text x="238.0" y="233.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >Nitrous oxide</text><rect x="250" y="215" width="426.6" height="28" fill="#8C8C8C"/><rect x="676.6" y="215" width="113.4" height="28" fill="#A61C1C"/><text x="463.3" y="234.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >79% natural</text><text x="733.3" y="234.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >21% added</text><text x="802.0" y="227.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >339.1 ppb in 2025</text><text x="802.0" y="241.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >126% of 1750</text><text x="238.0" y="295.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >CF₄ (a PFC)</text><rect x="250" y="277" width="221.4" height="28" fill="#8C8C8C"/><rect x="471.4" y="277" width="318.6" height="28" fill="#A61C1C"/><text x="360.7" y="296.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >41% natural</text><text x="630.7" y="296.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >59% added</text><text x="802.0" y="289.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >34 ppt natural (rocks)</text><text x="802.0" y="303.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >83 ppt in 2016</text><text x="238.0" y="357.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >SF₆</text><rect x="250" y="339" width="0.0" height="28" fill="#8C8C8C"/><rect x="250.0" y="339" width="540.0" height="28" fill="#A61C1C"/><text x="520.0" y="358.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >100% added</text><text x="802.0" y="351.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >12.2 ppt in 2025</text><text x="802.0" y="365.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >man-made</text><text x="238.0" y="419.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >C₂F₆, NF₃, HFCs</text><rect x="250" y="401" width="0.0" height="28" fill="#8C8C8C"/><rect x="250.0" y="401" width="540.0" height="28" fill="#A61C1C"/><text x="520.0" y="420.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >100% added</text><text x="802.0" y="413.0" font-size="11" fill="#5A5A5A" text-anchor="start" font-weight="400" >Entirely man-made</text><text x="20.0" y="470.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >From WMO 2025 concentrations as a share of 1750 levels (my arithmetic). CF₄ from Trudinger et al. 2016 and AGAGE. Rounded.</text></svg>