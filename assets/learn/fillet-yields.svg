<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">How much of a fish is fillet?</title><desc id="d">Skinless fillet yield as a share of the whole fish, from FAO: whiting 32%, Atlantic cod 34%, haddock 35%, Atlantic herring 46%, Atlantic mackerel 54%. The rest, about half to two-thirds, is heads, frames, guts and skin. FAO says yields vary widely.</desc><rect width="900" height="380" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >How much of a fish is fillet?</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Skinless fillet as a share of whole fish weight. FAO Fisheries Technical Paper 309. Yields vary widely with size, season and skill.</text><text x="238.0" y="104.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Whiting</text><rect x="250" y="86" width="166.4" height="28" rx="4" fill="#8C8C8C"/><text x="426.4" y="106.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >32%</text><text x="238.0" y="150.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Atlantic cod</text><rect x="250" y="132" width="176.8" height="28" rx="4" fill="#8C8C8C"/><text x="436.8" y="152.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >34%</text><text x="238.0" y="196.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Haddock</text><rect x="250" y="178" width="182.0" height="28" rx="4" fill="#8C8C8C"/><text x="442.0" y="198.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >35%</text><text x="238.0" y="242.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Atlantic herring</text><rect x="250" y="224" width="239.2" height="28" rx="4" fill="#4A6A8A"/><text x="499.2" y="244.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >46%</text><text x="238.0" y="288.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Atlantic mackerel</text><rect x="250" y="270" width="280.8" height="28" rx="4" fill="#4A6A8A"/><text x="540.8" y="290.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >54%</text><line x1="250" y1="80" x2="250" y2="310" stroke="#1A1A1A" stroke-width="1"/><text x="250.0" y="328.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >per cent of whole weight that is fillet; the rest is heads, frames, guts, skin</text><text x="20.0" y="352.0" font-size="12.5" fill="#A61C1C" text-anchor="start" font-weight="700" >For whitefish about two-thirds of the catch is not fillet. FAO puts by-products at 30–70% of the fish.</text></svg>