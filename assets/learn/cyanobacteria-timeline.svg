<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">A short history of cyanobacteria</title><desc id="d">A timeline. About 3 billion years ago or more cyanobacteria became the first organisms to split water and release oxygen. About 2.4 billion years ago the Great Oxidation Event saw oxygen build up in the air. Later they were swallowed by other cells and became chloroplasts, the green engines of plants. Today they make oxygen, fix nitrogen and feed lake and ocean food webs. Since 2023 they have formed toxic blooms on Lough Neagh.</desc><rect width="960" height="330" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Cyanobacteria: the bacteria that made our air</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Billions of years of history, from the first oxygen to this decade’s blooms. Not to scale.</text><line x1="50" y1="170" x2="910" y2="170" stroke="#1A1A1A" stroke-width="3"/><circle cx="50" cy="170" r="9" fill="#4E7D4E"/><text x="50.0" y="100.0" font-size="13" fill="#4E7D4E" text-anchor="start" font-weight="700" >About 3 billion years ago or more</text><text x="50.0" y="119.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="400" >First to split water</text><text x="50.0" y="135.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="400" >and release oxygen</text><circle cx="240" cy="170" r="9" fill="#4E7D4E"/><text x="240.0" y="210.0" font-size="13" fill="#4E7D4E" text-anchor="middle" font-weight="700" >About 2.4 billion years ago</text><text x="240.0" y="229.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >The Great Oxidation Event:</text><text x="240.0" y="245.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >oxygen builds up in the air</text><circle cx="430" cy="170" r="9" fill="#4E7D4E"/><text x="430.0" y="100.0" font-size="13" fill="#4E7D4E" text-anchor="middle" font-weight="700" >Much later</text><text x="430.0" y="119.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Swallowed by other cells:</text><text x="430.0" y="135.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >they become chloroplasts</text><circle cx="620" cy="170" r="9" fill="#4E7D4E"/><text x="620.0" y="210.0" font-size="13" fill="#4E7D4E" text-anchor="middle" font-weight="700" >Today</text><text x="620.0" y="229.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Make oxygen, fix nitrogen,</text><text x="620.0" y="245.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >feed lake and ocean food webs</text><circle cx="910" cy="170" r="9" fill="#A61C1C"/><text x="910.0" y="100.0" font-size="13" fill="#A61C1C" text-anchor="end" font-weight="700" >Since 2023</text><text x="910.0" y="119.0" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="400" >Toxic blooms on</text><text x="910.0" y="135.0" font-size="12" fill="#1A1A1A" text-anchor="end" font-weight="400" >Lough Neagh</text><text x="20.0" y="315.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >Ages are approximate and debated by geologists; see the page for sources.</text></svg>