<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The 11-year solar cycle</title><desc id="d">A ring showing the four phases of the solar cycle: solar minimum with few sunspots and the lowest ultraviolet; a rising phase of about four years; solar maximum with the most sunspots, flares and aurora, when the Sun is about 0.1% brighter; and a declining phase of about seven years. The magnetic field flips every cycle, giving a 22-year Hale cycle. Solar Cycle 25 peaked in October 2024. Over a cycle total sunlight changes by about 0.1%, ultraviolet by much more. There has been no upward trend in total sunlight since 1978.</desc><rect width="900" height="580" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The solar cycle: about 11 years, minimum to minimum</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Solar Cycle 25 peaked in October 2024 (smoothed sunspot number 161) and is now declining.</text><circle cx="330" cy="310" r="145" fill="none" stroke="#E6E2E0" stroke-width="14"/><circle cx="330.0" cy="165.0" r="24" fill="#fff" stroke="#A61C1C" stroke-width="2.5"/><text x="330.0" y="103.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Solar minimum</text><text x="330.0" y="120.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Few or no sunspots</text><text x="330.0" y="135.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Ultraviolet at its lowest</text><circle cx="475.0" cy="310.0" r="24" fill="#fff" stroke="#A61C1C" stroke-width="2.5"/><text x="517.0" y="304.0" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="700" >Rising</text><text x="517.0" y="321.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >Spots appear</text><text x="517.0" y="336.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >about 4 years</text><circle cx="330.0" cy="455.0" r="30" fill="#A61C1C" stroke="#A61C1C" stroke-width="2.5"/><line x1="366.0" y1="455.0" x2="376.0" y2="455.0" stroke="#A61C1C" stroke-width="2"/><line x1="361.2" y1="473.0" x2="369.8" y2="478.0" stroke="#A61C1C" stroke-width="2"/><line x1="348.0" y1="486.2" x2="353.0" y2="494.8" stroke="#A61C1C" stroke-width="2"/><line x1="330.0" y1="491.0" x2="330.0" y2="501.0" stroke="#A61C1C" stroke-width="2"/><line x1="312.0" y1="486.2" x2="307.0" y2="494.8" stroke="#A61C1C" stroke-width="2"/><line x1="298.8" y1="473.0" x2="290.2" y2="478.0" stroke="#A61C1C" stroke-width="2"/><line x1="294.0" y1="455.0" x2="284.0" y2="455.0" stroke="#A61C1C" stroke-width="2"/><line x1="298.8" y1="437.0" x2="290.2" y2="432.0" stroke="#A61C1C" stroke-width="2"/><line x1="312.0" y1="423.8" x2="307.0" y2="415.2" stroke="#A61C1C" stroke-width="2"/><line x1="330.0" y1="419.0" x2="330.0" y2="409.0" stroke="#A61C1C" stroke-width="2"/><line x1="348.0" y1="423.8" x2="353.0" y2="415.2" stroke="#A61C1C" stroke-width="2"/><line x1="361.2" y1="437.0" x2="369.8" y2="432.0" stroke="#A61C1C" stroke-width="2"/><text x="330.0" y="519.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Solar maximum</text><text x="330.0" y="536.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Most spots, flares, aurora</text><text x="330.0" y="551.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >About 0.1% brighter</text><circle cx="185.0" cy="310.0" r="24" fill="#fff" stroke="#A61C1C" stroke-width="2.5"/><text x="143.0" y="304.0" font-size="14" fill="#1A1A1A" text-anchor="end" font-weight="700" >Declining</text><text x="143.0" y="321.0" font-size="12" fill="#5A5A5A" text-anchor="end" font-weight="400" >Spots fade</text><text x="143.0" y="336.0" font-size="12" fill="#5A5A5A" text-anchor="end" font-weight="400" >about 7 years</text><path d="M-7 -6 L7 0 L-7 6 z" fill="#A61C1C" transform="translate(432.5 207.5) rotate(45)"/><path d="M-7 -6 L7 0 L-7 6 z" fill="#A61C1C" transform="translate(432.5 412.5) rotate(135)"/><path d="M-7 -6 L7 0 L-7 6 z" fill="#A61C1C" transform="translate(227.5 412.5) rotate(225)"/><path d="M-7 -6 L7 0 L-7 6 z" fill="#A61C1C" transform="translate(227.5 207.5) rotate(-45)"/><text x="330.0" y="304.0" font-size="18" fill="#1A1A1A" text-anchor="middle" font-weight="700" >≈ 11 years</text><text x="330.0" y="326.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >magnetic field flips</text><text x="330.0" y="341.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >every cycle (22-year Hale cycle)</text><rect x="620" y="90" width="260" height="400" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="638.0" y="120.0" font-size="13.5" fill="#A61C1C" text-anchor="start" font-weight="700" >What changes over a cycle</text><text x="638.0" y="142.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >Total sunlight: about 0.1%,</text><text x="638.0" y="164.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >roughly 1 W/m² in a strong cycle</text><text x="638.0" y="196.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >Ultraviolet: much more than</text><text x="638.0" y="218.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >total sunlight, enough to</text><text x="638.0" y="240.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >alter the stratosphere</text><text x="638.0" y="272.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >Solar wind and flares: space</text><text x="638.0" y="294.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >weather, aurora, radio and</text><text x="638.0" y="316.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >satellite disruption</text><text x="638.0" y="348.0" font-size="13.5" fill="#A61C1C" text-anchor="start" font-weight="700" >What has not changed</text><text x="638.0" y="370.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >No upward trend in total</text><text x="638.0" y="392.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >sunlight since satellites</text><text x="638.0" y="414.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >began measuring in 1978</text></svg>