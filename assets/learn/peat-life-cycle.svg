<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The life cycle of a bog</title><desc id="d">A loop. Sphagnum moss grows and takes in CO2. It dies and stays wet, so with no oxygen and acid water it barely rots. Peat builds up about a millimetre a year, metres over thousands of years. Draining, cutting or burning lets oxygen in and releases thousands of years of carbon in decades. Rewetting raises the water table and lets the moss return.</desc><rect width="900" height="580" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The life cycle of a bog</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Peat is made slowly and lost quickly. Rewetting closes the loop and lets the moss grow again.</text><circle cx="450" cy="320" r="185" fill="none" stroke="#E6E2E0" stroke-width="12"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(580.8 189.2) rotate(45.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(580.8 450.8) rotate(135.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(319.2 450.8) rotate(225.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(319.2 189.2) rotate(315.0)"/><rect x="362.0" y="98.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="450.0" y="123.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Moss grows</text><text x="450.0" y="142.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Sphagnum takes in</text><text x="450.0" y="157.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >CO₂ from the air</text><rect x="547.0" y="283.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="635.0" y="308.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Dies, stays wet</text><text x="635.0" y="327.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >no oxygen, acid</text><text x="635.0" y="342.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >water: barely rots</text><rect x="362.0" y="468.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="450.0" y="493.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Peat builds up</text><text x="450.0" y="512.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >about 1 mm a year,</text><text x="450.0" y="527.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >metres over millennia</text><rect x="177.0" y="283.0" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="265.0" y="308.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Drain, dig or burn</text><text x="265.0" y="327.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >oxygen gets in:</text><text x="265.0" y="342.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >carbon out in decades</text><text x="450.0" y="300.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Rewet it</text><text x="450.0" y="320.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >raise the water table</text><text x="450.0" y="340.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >and the moss returns</text></svg>