<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The molecules behind the greenhouse gas numbers</title><desc id="d">Eight panels of simplified ball-and-stick models. Nitrogen and oxygen, each two identical atoms with no dipole, are not greenhouse gases. Carbon dioxide is linear and absorbs at 15 micrometres. Water is bent at 104.5 degrees and absorbs widely. Methane is tetrahedral and absorbs at 3.3 and 7.7 micrometres. Nitrous oxide is linear and absorbs at 4.5, 7.8 and 17 micrometres. Sulphur hexafluoride is octahedral and absorbs at 10.5 micrometres. Nitrogen trifluoride is a pyramid of about 102 degrees and absorbs near 11 micrometres. Tetrafluoromethane is tetrahedral, absorbs at 7.8 micrometres and lasts about 50,000 years.</desc><rect width="960" height="640" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The molecules behind the numbers</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Simplified 2D models. Bond angles from standard references. Paler atoms sit behind the page.</text><rect x="20" y="70" width="222" height="268" rx="8" fill="#f6f6f6" stroke="#8C8C8C" stroke-width="1.5"/><text x="131.0" y="94.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Nitrogen and oxygen</text><text x="131.0" y="111.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >N₂ and O₂: 99% of dry air</text><text x="131.0" y="308.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Two identical atoms</text><text x="131.0" y="325.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="600" >No dipole to shake: not a GHG</text><line x1="90.0" y1="173.6" x2="132.0" y2="173.6" stroke="#1A1A1A" stroke-width="2.2"/><line x1="90.0" y1="180.0" x2="132.0" y2="180.0" stroke="#1A1A1A" stroke-width="2.2"/><line x1="90.0" y1="186.4" x2="132.0" y2="186.4" stroke="#1A1A1A" stroke-width="2.2"/><g><circle cx="90.0" cy="180.0" r="17" fill="#5A5A5A" stroke="#1A1A1A" stroke-width="1.5"/><text x="90.0" y="184.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >N</text></g><g><circle cx="132.0" cy="180.0" r="17" fill="#5A5A5A" stroke="#1A1A1A" stroke-width="1.5"/><text x="132.0" y="184.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >N</text></g><line x1="130.0" y1="241.0" x2="172.0" y2="241.0" stroke="#1A1A1A" stroke-width="2.2"/><line x1="130.0" y1="249.0" x2="172.0" y2="249.0" stroke="#1A1A1A" stroke-width="2.2"/><g><circle cx="130.0" cy="245.0" r="17" fill="#A61C1C" stroke="#1A1A1A" stroke-width="1.5"/><text x="130.0" y="249.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >O</text></g><g><circle cx="172.0" cy="245.0" r="17" fill="#A61C1C" stroke="#1A1A1A" stroke-width="1.5"/><text x="172.0" y="249.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >O</text></g><rect x="256" y="70" width="222" height="268" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="367.0" y="94.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Carbon dioxide</text><text x="367.0" y="111.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >CO₂</text><text x="367.0" y="308.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Linear, 180°</text><text x="367.0" y="325.0" font-size="11.5" fill="#A61C1C" text-anchor="middle" font-weight="600" >Bends and stretches: absorbs at 15 µm</text><line x1="367.0" y1="206.0" x2="419.0" y2="206.0" stroke="#1A1A1A" stroke-width="2.2"/><line x1="367.0" y1="214.0" x2="419.0" y2="214.0" stroke="#1A1A1A" stroke-width="2.2"/><line x1="367.0" y1="214.0" x2="315.0" y2="214.0" stroke="#1A1A1A" stroke-width="2.2"/><line x1="367.0" y1="206.0" x2="315.0" y2="206.0" stroke="#1A1A1A" stroke-width="2.2"/><