<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Contrail warming by day and night</title><desc id="d">Two panels. By day a contrail reflects some sunlight back to space, which cools, and traps heat rising from the ground, which warms; the net effect is smaller and depends on the sun angle and the surface below. By night there is no sunlight to reflect, so only the heat-trapping effect remains and the net effect is warming; night flights cause a large share of contrail warming. It is the same physics as a cloudy night feeling milder than a clear, frosty one.</desc><rect width="960" height="330" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A6A8A"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Contrails by day and by night</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >The same ice cloud can cool or warm. Overall, the warming wins.</text><rect x="20" y="75" width="450" height="200" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="245.0" y="99.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Daytime</text><text x="245.0" y="117.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >two effects pull against each other</text><text x="245.0" y="150.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Reflects some sunlight back to space: cooling</text><text x="245.0" y="174.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Traps heat rising from the ground: warming</text><text x="245.0" y="198.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Net: smaller, depends on sun angle</text><text x="245.0" y="222.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >and what lies below</text><rect x="490" y="75" width="450" height="200" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="715.0" y="99.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Night-time</text><text x="715.0" y="117.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >no sunlight to reflect</text><text x="715.0" y="150.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Only the heat-trapping effect remains</text><text x="715.0" y="174.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Net: warming</text><text x="715.0" y="198.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Night flights cause a large share</text><text x="715.0" y="222.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >of contrail warming</text><text x="480.0" y="305.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >The same physics as a cloudy night feeling milder than a clear, frosty one.</text></svg>