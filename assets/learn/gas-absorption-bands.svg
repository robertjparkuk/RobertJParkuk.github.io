<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Where each greenhouse gas absorbs infrared</title><desc id="d">A chart of main infrared absorption bands from 2 to 30 micrometres against Earth’s thermal emission, which peaks near 10 micrometres. Water vapour absorbs at 2.7 and 6.3 micrometres and across a rotational band beyond about 18 micrometres. Carbon dioxide at 4.3 and 15. Methane at 3.3 and 7.7. Nitrous oxide at 4.5, 7.8 and 17. Ozone at 9.6. The fluorinated gases CF4, C2F6, HFC-134a, sulphur hexafluoride at 10.5 and nitrogen trifluoride at 11 all absorb inside the 8 to 14 micrometre atmospheric window, where little else does, which is why each molecule is so potent.</desc><rect width="960" height="660" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Where each gas catches Earth’s heat</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Main infrared absorption bands (wavelength in micrometres, log scale). Earth radiates most strongly around 10 µm.</text><rect x="598.1" y="92" width="140.5" height="520" fill="#FAF3F3"/><text x="668.4" y="102.0" font-size="12.5" fill="#A61C1C" text-anchor="middle" font-weight="700" >The “atmospheric window”, 8–14 µm</text><path d="M250.0 170.0 L262.3 170.0 L273.9 170.0 L285.1 170.0 L295.8 170.0 L306.0 170.0 L315.9 170.0 L325.4 169.9 L334.5 169.9 L343.3 169.9 L351.8 169.8 L360.0 169.7 L368.0 169.6 L375.7 169.4 L383.2 169.2 L390.5 168.9 L397.6 168.6 L404.5 168.2 L411.2 167.8 L417.7 167.2 L424.1 166.7 L430.3 166.0 L436.3 165.2 L442.2 164.4 L448.0 163.5 L453.6 162.6 L459.1 161.5 L464.5 160.4 L469.8 159.2 L475.0 158.0 L480.1 156.7 L485.1 155.3 L489.9 153.9 L494.7 152.5 L499.4 151.0 L504.0 149.5 L508.5 147.9 L513.0 146.4 L517.4 144.8 L521.6 143.2 L525.9 141.7 L530.0 140.1 L534.1 138.5 L538.1 137.0 L542.1 13