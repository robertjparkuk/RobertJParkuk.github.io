<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">A quality ladder for carbon offsets</title><desc id="d">Five rungs from best to worst. Good: durable removals such as direct air capture, bioenergy with carbon capture and mineralisation, stored for 10,000 years or more but expensive and scarce. Good: verified UK woodland and peat units, checked on site by independent verifiers with a 20% buffer, lasting decades to centuries. Ugly: pending UK units, promises of future carbon that cannot yet be used to report emissions. Ugly: renewable energy credits, often for projects that would have been built anyway and not eligible for the ICVCM quality label. Harmful: over-credited avoidance credits; studies found about 6% of REDD+ forest credits represented real reductions and cookstove credits were over-credited about nine times.</desc><rect width="960" height="560" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Offsets: the good, the ugly and the harmful</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >A quality ladder. Higher rungs are more likely to be real, extra and lasting. Evidence from the studies cited on the page.</text><rect x="20" y="80" width="920" height="78" rx="8" fill="#fff" stroke="#4E7D4E" stroke-width="2.5"/><rect x="20" y="80" width="96" height="78" rx="8" fill="#4E7D4E"/><text x="68.0" y="125.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Good</text><text x="132.0" y="106.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Durable removals</text><text x="132.0" y="126.0" font-size="12.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >Direct air capture, BECCS, mineralisation</text><text x="132.0" y="144.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >Stored for 10,000+ years; expensive and scarce</text><rect x="56" y="172" width="848" height="78" rx="8" fill="#fff" stroke="#4E7D4E" stroke-width="2.5"/><rect x="56" y="172" width="96" height="78" rx="8" fill="#4E7D4E"/><text x="104.0" y="217.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Good</text><text x="168.0" y="198.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Verified UK woodland and peat units</text><text x="168.0" y="218.0" font-size="12.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >Woodland Carbon Code, Peatland Code</text><text x="168.0" y="236.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >Checked on site by verifiers; 20% buffer; lasts decades to centuries</text><rect x="92" y="264" width="776" height="78" rx="8" fill="#fff" stroke="#B0A060" stroke-width="2.5"/><rect x="92" y="264" width="96" height="78" rx="8" fill="#B0A060"/><text x="140.0" y="309.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Ugly</text><text x="204.0" y="290.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Pending UK units</text><text x="204.0" y="310.0" font-size="12.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >Promises of future carbon</text><text x="204.0" y="328.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >Cannot yet be used to report emissions</text><rect x="128" y="356" width="704" height="78" rx="8" fill="#fff" stroke="#C98B3A" stroke-width="2.5"/><rect x="128" y="356" width="96" height="78" rx="8" fill="#C98B3A"/><text x="176.0" y="401.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Ugly</text><text x="240.0" y="382.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Renewable energy credits</text><text x="240.0" y="402.0" font-size="12.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >Wind and solar abroad</text><text x="240.0" y="420.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >Often built anyway; not eligible for the ICVCM quality label</text><rect x="164" y="448" width="632" height="78" rx="8" fill="#fff" stroke="#A61C1C" stroke-width="2.5"/><rect x="164" y="448" width="96" height="78" rx="8" fill="#A61C1C"/><text x="212.0" y="493.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Harmful</text><text x="276.0" y="474.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Over-credited avoidance</text><text x="276.0" y="494.0" font-size="12.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >Some forest protection (REDD+) and cookstove credits</text><text x="276.0" y="512.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >Studies: about 6% of REDD+ credits real; cookstoves over-credited about 9 times</text></svg>