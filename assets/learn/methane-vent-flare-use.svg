<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">What happens to one tonne of methane if it is vented, flared or used</title><desc id="d">One tonne of methane vented to the air counts as 28 tonnes of CO2 equivalent (GWP-100, AR5). Flared, it burns (methane plus two oxygen gives CO2 and two water) to 2.75 tonnes of CO2, about 90% less warming. Burned for heat or power, it gives the same 2.75 tonnes but replaces fossil fuel that would otherwise be burned. If the methane is biogenic, inventories count the CO2 as zero. Flares are not perfect and some methane slips through.</desc><rect width="960" height="540" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4E7D4E"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A6A8A"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >One tonne of methane: vent it, burn it or use it</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Burning turns a potent gas into a weaker one. Using it to replace fossil fuel does better still.</text><rect x="20" y="210" width="190" height="110" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="115.0" y="240.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="700" >1 t methane</text><text x="115.0" y="262.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >from landfill, slurry,</text><text x="115.0" y="278.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >a gas leak or a mine</text><line x1="212.0" y1="265.0" x2="420.0" y2="135.0" stroke="#A61C1C" stroke-width="2.5" marker-end="url(#a1)"/><rect x="425" y="90" width="510" height="95" rx="8" fill="#fff" stroke="#A61C1C" stroke-width="2"/><text x="445.0" y="118.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Vented to air</text><text x="445.0" y="142.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >CH₄ escapes unchanged</text><text x="915.0" y="124.0" font-size="17" fill="#A61C1C" text-anchor="end" font-weight="700" >28 t CO₂e</text><text x="915.0" y="148.0" font-size="12" fill="#5A5A5A" text-anchor="end" font-weight="400" >GWP-100, AR5 (non-fossil)</text><line x1="212.0" y1="265.0" x2="420.0" y2="285.0" stroke="#C98B3A" stroke-width="2.5" marker-end="url(#a0)"/><rect x="425" y="240" width="510" height="95" rx="8" fill="#fff" stroke="#C98B3A" stroke-width="2"/><text x="445.0" y="268.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Flared</text><text x="445.0" y="292.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',monospace">CH₄ + 2O₂ → CO₂ + 2H₂O</text><text x="915.0" y="274.0" font-size="17" fill="#C98B3A" text-anchor="end" font-weight="700" >2.75 t CO₂</text><text x="915.0" y="298.0" font-size="12" fill="#5A5A5A" text-anchor="end" font-weight="400" >about 90% less warming*</text><line x1="212.0" y1="265.0" x2="420.0" y2="435.0" stroke="#4E7D4E" stroke-width="2.5" marker-end="url(#a2)"/><rect x="425" y="390" width="510" height="95" rx="8" fill="#fff" stroke="#4E7D4E" stroke-width="2"/><text x="445.0" y="418.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Burned for heat or power</text><text x="445.0" y="442.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >same reaction, useful energy</text><text x="915.0" y="424.0" font-size="17" fill="#4E7D4E" text-anchor="end" font-weight="700" >2.75 t CO₂ and</text><text x="915.0" y="448.0" font-size="12" fill="#5A5A5A" text-anchor="end" font-weight="400" >fossil gas not burned</text><text x="20.0" y="512.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >* 16 g of methane burns to 44 g of CO₂, so 1 t becomes 2.75 t. If the methane is biogenic (landfill, slurry), inventories count that CO₂ as zero and the saving is close to 100%.</text><text x="20.0" y="530.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >Flares are not perfect: some methane slips through unburned, which is why EU rules set flare-efficiency requirements.</text></svg>