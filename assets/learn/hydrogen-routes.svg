<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">How each colour of hydrogen is made</title><desc id="d">Seven rows. Grey: natural gas and steam reformed, CH4 plus 2 H2O gives CO2 plus 4 H2, with the CO2 released. Blue: the same with most CO2 captured and stored. Brown or black: coal or lignite gasified, the most CO2 of any route. Turquoise: methane pyrolysis, CH4 gives solid carbon and 2 H2. Green: water split by electrolysis using renewable power, 2 H2O gives 2 H2 and O2. Pink: the same using nuclear power. White or gold: natural hydrogen drilled from rocks; one producing well, in Mali.</desc><rect width="960" height="640" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Hydrogen by colour: one molecule, many routes</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >The colour names are informal. What matters is the emissions per kilogram, shown in the next chart.</text><text x="24.0" y="86.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="700" >Colour</text><text x="169.0" y="86.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="700" >Feedstock</text><text x="374.0" y="86.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="700" >Process</text><text x="599.0" y="86.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="700" >Overall reaction</text><text x="824.0" y="86.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="700" >By-product</text><rect x="20" y="100" width="920" height="64" rx="6" fill="#faf9f8" stroke="#E6E2E0"/><rect x="20" y="100" width="10" height="64" fill="#8C8C8C"/><text x="42.0" y="137.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Grey</text><text x="169.0" y="137.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Natural gas + steam</text><text x="374.0" y="137.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Steam methane reforming</text><text x="599.0" y="137.0" font-size="12" fill="#A61C1C" text-anchor="start" font-weight="600" font-family="'IBM Plex Mono',monospace">CH₄ + 2H₂O → CO₂ + 4H₂</text><text x="824.0" y="137.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >CO₂ to air</text><line x1="147.0" y1="132.0" x2="161.0" y2="132.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="352.0" y1="132.0" x2="366.0" y2="132.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="577.0" y1="132.0" x2="591.0" y2="132.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><rect x="20" y="174" width="920" height="64" rx="6" fill="#fff" stroke="#E6E2E0"/><rect x="20" y="174" width="10" height="64" fill="#4A6A8A"/><text x="42.0" y="211.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Blue</text><text x="169.0" y="211.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Natural gas + steam</text><text x="374.0" y="211.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Reforming with carbon capture</text><text x="599.0" y="211.0" font-size="12" fill="#A61C1C" text-anchor="start" font-weight="600" font-family="'IBM Plex Mono',monospace">CH₄ + 2H₂O → CO₂ + 4H₂</text><text x="824.0" y="211.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >Most CO₂ stored</text><line x1="147.0" y1="206.0" x2="161.0" y2="206.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="352.0" y1="206.0" x2="366.0" y2="206.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="577.0" y1="206.0" x2="591.0" y2="206.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><rect x="20" y="248" width="920" height="64" rx="6" fill="#faf9f8" stroke="#E6E2E0"/><rect x="20" y="248" width="10" height="64" fill="#6B4F3A"/><text x="42.0" y="285.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Brown / black</text><text x="169.0" y="285.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Lignite or coal</text><text x="374.0" y="285.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Gasification</text><text x="599.0" y="285.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="600" font-family="'IBM Plex Mono',monospace">C + H₂O → CO + H₂ (+ shift)</text><text x="824.0" y="285.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >Most CO₂ of all</text><line x1="147.0" y1="280.0" x2="161.0" y2="280.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="352.0" y1="280.0" x2="366.0" y2="280.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="577.0" y1="280.0" x2="591.0" y2="280.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><rect x="20" y="322" width="920" height="64" rx="6" fill="#fff" stroke="#E6E2E0"/><rect x="20" y="322" width="10" height="64" fill="#3E8E8E"/><text x="42.0" y="359.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Turquoise</text><text x="169.0" y="359.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Natural gas</text><text x="374.0" y="359.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Methane pyrolysis</text><text x="599.0" y="359.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="600" font-family="'IBM Plex Mono',monospace">CH₄ → C (solid) + 2H₂</text><text x="824.0" y="359.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >Solid carbon</text><line x1="147.0" y1="354.0" x2="161.0" y2="354.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="352.0" y1="354.0" x2="366.0" y2="354.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="577.0" y1="354.0" x2="591.0" y2="354.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><rect x="20" y="396" width="920" height="64" rx="6" fill="#faf9f8" stroke="#E6E2E0"/><rect x="20" y="396" width="10" height="64" fill="#4E7D4E"/><text x="42.0" y="433.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Green</text><text x="169.0" y="433.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Water + renewable power</text><text x="374.0" y="433.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Electrolysis</text><text x="599.0" y="433.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="600" font-family="'IBM Plex Mono',monospace">2H₂O → 2H₂ + O₂</text><text x="824.0" y="433.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >Oxygen only</text><line x1="147.0" y1="428.0" x2="161.0" y2="428.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="352.0" y1="428.0" x2="366.0" y2="428.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="577.0" y1="428.0" x2="591.0" y2="428.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><rect x="20" y="470" width="920" height="64" rx="6" fill="#fff" stroke="#E6E2E0"/><rect x="20" y="470" width="10" height="64" fill="#C77C9A"/><text x="42.0" y="507.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >Pink</text><text x="169.0" y="507.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Water + nuclear power</text><text x="374.0" y="507.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Electrolysis</text><text x="599.0" y="507.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="600" font-family="'IBM Plex Mono',monospace">2H₂O → 2H₂ + O₂</text><text x="824.0" y="507.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >Oxygen only</text><line x1="147.0" y1="502.0" x2="161.0" y2="502.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="352.0" y1="502.0" x2="366.0" y2="502.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="577.0" y1="502.0" x2="591.0" y2="502.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><rect x="20" y="544" width="920" height="64" rx="6" fill="#faf9f8" stroke="#E6E2E0"/><rect x="20" y="544" width="10" height="64" fill="#B0A060"/><text x="42.0" y="581.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >White / gold</text><text x="169.0" y="581.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Rocks underground</text><text x="374.0" y="581.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="400" >Natural (geological) hydrogen</text><text x="599.0" y="581.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="600" font-family="'IBM Plex Mono',monospace">Drilled, like gas</text><text x="824.0" y="581.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >One well (Mali)</text><line x1="147.0" y1="576.0" x2="161.0" y2="576.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="352.0" y1="576.0" x2="366.0" y2="576.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><line x1="577.0" y1="576.0" x2="591.0" y2="576.0" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a0)"/><text x="940.0" y="628.0" font-size="11.5" fill="#5A5A5A" text-anchor="end" font-weight="400" >Reforming: CH₄ + H₂O → CO + 3H₂, then the water–gas shift CO + H₂O → CO₂ + H₂.</text></svg>