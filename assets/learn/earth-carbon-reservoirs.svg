<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Where Earth’s carbon is stored</title><desc id="d">Billions of tonnes of carbon on a log scale: atmosphere about 900; land plants about 450; soils in the top metre 1,500 to 2,400; permafrost region 1,300 to 1,600; oceans about 38,000; everything above the surface about 43,500, or 0.2% of the total; crust, mantle and core about 1.85 billion, or 99.8%. The air holds about 0.00005% of Earth’s carbon.</desc><rect width="960" height="520" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Where Earth’s carbon is: from the air to the mantle</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Billions of tonnes of carbon (GtC), log scale: each step is ten times the last. Estimates for the deep Earth are uncertain.</text><text x="288.0" y="102.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Atmosphere</text><rect x="300" y="86" width="71.6" height="26" rx="3" fill="#4A6A8A"/><text x="379.6" y="104.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >about 900</text><text x="288.0" y="158.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Land plants</text><rect x="300" y="142" width="49.0" height="26" rx="3" fill="#4E7D4E"/><text x="357.0" y="160.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >about 450</text><text x="288.0" y="214.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Soils (top metre)</text><rect x="300" y="198" width="103.5" height="26" rx="3" fill="#6B4F3A"/><rect x="388.2" y="198" width="15.3" height="26" fill="#fff" opacity="0.35"/><text x="411.5" y="216.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >1,500–2,400</text><text x="288.0" y="270.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Permafrost region</text><rect x="300" y="254" width="90.3" height="26" rx="3" fill="#9c7f66"/><rect x="383.5" y="254" width="6.8" height="26" fill="#fff" opacity="0.35"/><text x="398.3" y="272.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >1,300–1,600</text><text x="288.0" y="326.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Oceans</text><rect x="300" y="310" width="193.5" height="26" rx="3" fill="#1f3b57"/><text x="501.5" y="328.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >about 38,000</text><text x="288.0" y="382.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Everything above the surface</text><rect x="300" y="366" width="197.9" height="26" rx="3" fill="#8C8C8C"/><text x="505.9" y="384.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >about 43,500 (0.2%)</text><text x="288.0" y="438.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Crust, mantle and core</text><rect x="300" y="422" width="545.0" height="26" rx="3" fill="#1A1A1A"/><text x="837.0" y="440.0" font-size="12.5" fill="#fff" text-anchor="end" font-weight="700" >about 1,850,000,000 (99.8%)</text><line x1="300.0" y1="474" x2="300.0" y2="480" stroke="#1A1A1A"/><text x="300.0" y="495.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >100</text><line x1="375.0" y1="474" x2="375.0" y2="480" stroke="#1A1A1A"/><text x="375.0" y="495.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >1,000</text><line x1="450.0" y1="474" x2="450.0" y2="480" stroke="#1A1A1A"/><text x="450.0" y="495.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >10,000</text><line x1="525.0" y1="474" x2="525.0" y2="480" stroke="#1A1A1A"/><text x="525.0" y="495.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >100,000</text><line x1="600.0" y1="474" x2="600.0" y2="480" stroke="#1A1A1A"/><text x="600.0" y="495.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >1 million</text><line x1="675.0" y1="474" x2="675.0" y2="480" stroke="#1A1A1A"/><text x="675.0" y="495.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >10 million</text><line x1="750.0" y1="474" x2="750.0" y2="480" stroke="#1A1A1A"/><text x="750.0" y="495.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >100 million</text><line x1="825.0" y1="474" x2="825.0" y2="480" stroke="#1A1A1A"/><text x="825.0" y="495.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >1 billion</text><line x1="900.0" y1="474" x2="900.0" y2="480" stroke="#1A1A1A"/><text x="900.0" y="495.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >10 billion</text><line x1="300" y1="474" x2="900" y2="474" stroke="#1A1A1A"/><text x="20.0" y="515.0" font-size="11.5" fill="#A61C1C" text-anchor="start" font-weight="700" >The air holds about 0.00005% of Earth’s carbon. Fossil fuels are a small slice of the crust’s store, moved to the air in two centuries.</text></svg>