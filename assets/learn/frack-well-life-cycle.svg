<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The life of a fracked well</title><desc id="d">A six-step loop. A petroleum licence, planning and environmental permits; drilling down and then sideways through the shale; fracking, with water, sand and additives pumped at high pressure; flowback, when fluid and gas return and gas may be vented or flared; production for years, with small leaks adding up; and plugging and abandonment with cement plugs, after which old wells can leak. Methane can escape at almost every stage; the CO2 from burning the gas comes wherever it is used.</desc><rect width="920" height="620" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The life of a fracked well</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Methane can escape at almost every stage. The CO₂ from burning the gas comes at the end, wherever it is used.</text><circle cx="460" cy="335" r="215" fill="none" stroke="#E6E2E0" stroke-width="12"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(567.5 148.8) rotate(30.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(675.0 335.0) rotate(90.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(567.5 521.2) rotate(150.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(352.5 521.2) rotate(210.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(245.0 335.0) rotate(270.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(352.5 148.8) rotate(330.0)"/><rect x="372.0" y="83.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="460.0" y="108.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Licence and permits</text><text x="460.0" y="127.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >petroleum licence,</text><text x="460.0" y="142.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >planning, environment</text><rect x="558.2" y="190.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="646.2" y="215.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Drill</text><text x="646.2" y="234.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >down, then sideways</text><text x="646.2" y="249.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >through the shale</text><rect x="558.2" y="405.5" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="646.2" y="430.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Frack</text><text x="646.2" y="449.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >water, sand, additives</text><text x="646.2" y="464.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >pumped at high pressure</text><rect x="372.0" y="513.0" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="460.0" y="538.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Flowback</text><text x="460.0" y="557.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >fluid and gas return;</text><text x="460.0" y="572.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >venting or flaring</text><rect x="185.8" y="405.5" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="273.8" y="430.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Produce for years</text><text x="273.8" y="449.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >gas to the grid;</text><text x="273.8" y="464.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >small leaks add up</text><rect x="185.8" y="190.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="273.8" y="215.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Plug and abandon</text><text x="273.8" y="234.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >cement plugs;</text><text x="273.8" y="249.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >old wells can leak</text><text x="460.0" y="315.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Burned or leaked?</text><text x="460.0" y="335.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >burned: CO₂</text><text x="460.0" y="355.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >leaked: methane</text></svg>