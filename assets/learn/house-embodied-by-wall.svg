<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 349" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">One small house, four ways to build it</title><desc id="d">Embodied carbon of an 84 square metre social home in Ireland by wall type: brick-clad cavity 526 kg CO2e per square metre of floor; rendered block cavity 496; 215 mm single-leaf block with external insulation 492; timber frame with cellulose insulation, insulated foundations and 50% GGBS cement replacement 369. From an AECB study for the Passive House Association of Ireland, reported in 2021.</desc><rect width="900" height="349" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >One small house, four ways to build it</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >kg CO₂e per m² of floor, embodied carbon (stages as reported), 84 m² Irish social home. AECB study for the Passive House Association of Ireland, 2021.</text><text x="368.0" y="104.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Brick-clad cavity wall</text><rect x="380" y="86" width="385.7" height="28" rx="4" fill="#8C8C8C"/><text x="775.7" y="106.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >526</text><text x="368.0" y="150.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Rendered block cavity wall</text><rect x="380" y="132" width="363.7" height="28" rx="4" fill="#8C8C8C"/><text x="753.7" y="152.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >496</text><text x="368.0" y="196.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Single-leaf block + external insulation</text><rect x="380" y="178" width="360.8" height="28" rx="4" fill="#8C8C8C"/><text x="750.8" y="198.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >492</text><text x="368.0" y="242.0" font-size="13.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Timber frame, cellulose insulation*</text><rect x="380" y="224" width="270.6" height="28" rx="4" fill="#4E7D4E"/><text x="660.6" y="244.0" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >369</text><line x1="380" y1="80" x2="380" y2="264" stroke="#1A1A1A" stroke-width="1"/><text x="380.0" y="282.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >kg CO₂e per m² of floor area</text><text x="20.0" y="306.0" font-size="12.5" fill="#A61C1C" text-anchor="start" font-weight="700" >The timber house is 25–30% lower. The three masonry options are within 7% of each other.</text><text x="20.0" y="325.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="400" >* also with insulated foundations and 50% GGBS in the concrete, so not only the wall changed.</text></svg>