<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">How phosphorus feeds a cyanobacteria bloom</title><desc id="d">Phosphate from slurry, manure, fertiliser, septic tanks and wastewater, and from phosphorus stored in soils, washes into the lough with soil and runoff. In warm, calm, sunny water cyanobacteria float to the surface as a bloom, shading out other plants; some make toxins and some fix their own nitrogen. When they die and sink, rotting uses up the oxygen near the bed, and without oxygen iron releases its phosphate back into the water, so the lough feeds itself. Warmer summers, clearer water from zebra mussels, legacy phosphorus and overloaded wastewater works make it worse. Cutting the phosphorus coming in works, but the mud keeps releasing it for years.</desc><rect width="960" height="600" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A6A8A"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4E7D4E"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >How phosphorus feeds a bloom</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Phosphorus is the nutrient that usually limits algae in fresh water. Too much of it, plus warm, still water, and cyanobacteria take over.</text><rect x="20" y="80" width="380" height="250" rx="8" fill="#f7f3ee" stroke="#E6E2E0"/><text x="210.0" y="104.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >The catchment</text><text x="210.0" y="134.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Slurry, manure and fertiliser</text><text x="210.0" y="152.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Septic tanks and wastewater works</text><text x="210.0" y="170.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Phosphorus stored in soils for decades</text><text x="210.0" y="214.0" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Phosphate binds to soil particles:</text><text x="210.0" y="234.0" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >it moves when soil washes off fields</text><text x="210.0" y="254.0" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >or when soils are saturated with it</text><text x="210.0" y="300.0" font-size="15" fill="#A61C1C" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',monospace">PO₄³⁻ (phosphate)</text><line x1="400.0" y1="205.0" x2="520.0" y2="205.0" stroke="#A61C1C" stroke-width="3" marker-end="url(#a1)"/><text x="460.0" y="195.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="700" >runoff</text><text x="460.0" y="225.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="400" >and rivers</text><rect x="520" y="80" width="420" height="380" rx="8" fill="#e6eef5" stroke="#4A6A8A"/><text x="730.0" y="104.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >The lough</text><rect x="540" y="120" width="380" height="60" rx="6" fill="#7aa34a" opacity="0.75"/><text x="730.0" y="147.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >Bloom: cyanobacteria at the surface</text><text x="730.0" y="166.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" >shade out other plants; some make toxins</text><text x="730.0" y="210.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Warm, calm, sunny water lets them float up</text><text x="730.0" y="228.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Some fix their own nitrogen from the air</text><line x1="730.0" y1="255.0" x2="730.0" y2="330.0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#a0)"/><text x="742.0" y="290.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >they die and sink</text><rect x="540" y="340" width="380" height="100" rx="6" fill="#5a4636" opacity="0.25"/><text x="730.0" y="362.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Bed sediment</text><text x="730.0" y="384.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Rotting uses up the oxygen</text><text x="730.0" y="402.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Without oxygen, iron lets go of phosphate:</text><text x="730.0" y="420.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >FePO₄ + e⁻ → Fe²⁺ + PO₄³⁻ (simplified)</text><path d="M920 390 C 960 330, 960 210, 922 160" fill="none" stroke="#A61C1C" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a1)"/><text x="944.0" y="470.0" font-size="11.5" fill="#A61C1C" text-anchor="end" font-weight="700" >internal loading:</text><text x="944.0" y="486.0" font-size="11.5" fill="#A61C1C" text-anchor="end" font-weight="400" >the lough feeds itself</text><rect x="20" y="350" width="380" height="230" rx="8" fill="#fff" stroke="#E6E2E0"/><text x="210.0" y="374.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Making it worse</text><text x="210.0" y="400.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Warmer summers</text><text x="210.0" y="422.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Clearer water from zebra mussels</text><text x="210.0" y="444.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >(more light reaches the algae)</text><text x="210.0" y="466.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Legacy phosphorus in fields and mud</text><text x="210.0" y="488.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Wastewater works at capacity</text><text x="730.0" y="520.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Cut the phosphorus coming in, and wait:</text><text x="730.0" y="540.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" >the mud keeps releasing it for years.</text></svg>