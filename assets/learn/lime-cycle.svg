<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The lime cycle</title><desc id="d">A four-step loop. Limestone, calcium carbonate, is quarried. It is burned in a kiln at about 900 degrees, giving quicklime, calcium oxide, and releasing CO2. Quicklime is slaked with water to give calcium hydroxide, lime putty. As lime mortar sets in air it slowly takes CO2 back and turns into calcium carbonate again. The process CO2 is partly reabsorbed over years; the fuel burned to heat the kiln is not.</desc><rect width="900" height="580" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The lime cycle</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Air lime goes back to the stone it came from. The fuel burned to heat the kiln is never paid back.</text><circle cx="450" cy="320" r="185" fill="none" stroke="#E6E2E0" stroke-width="12"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(580.8 189.2) rotate(45.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(580.8 450.8) rotate(135.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(319.2 450.8) rotate(225.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(319.2 189.2) rotate(315.0)"/><rect x="362.0" y="98.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="450.0" y="123.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Limestone</text><text x="450.0" y="142.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >CaCO₃, quarried</text><text x="450.0" y="157.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >e.g. Antrim chalk</text><rect x="547.0" y="283.0" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="635.0" y="308.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Burn in a kiln</text><text x="635.0" y="327.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >about 900 °C</text><text x="635.0" y="342.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >CaCO₃ → CaO + CO₂</text><rect x="362.0" y="468.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="450.0" y="493.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Slake with water</text><text x="450.0" y="512.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >quicklime to lime putty</text><text x="450.0" y="527.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >CaO + H₂O → Ca(OH)₂</text><rect x="177.0" y="283.0" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="265.0" y="308.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Mortar sets in air</text><text x="265.0" y="327.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >takes CO₂ back slowly:</text><text x="265.0" y="342.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Ca(OH)₂+CO₂→CaCO₃+H₂O</text><text x="450.0" y="300.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Back to stone</text><text x="450.0" y="320.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >process CO₂ partly</text><text x="450.0" y="340.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >reabsorbed over years</text></svg>