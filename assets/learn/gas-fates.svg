<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Where in the atmosphere each greenhouse gas is destroyed</title><desc id="d">Water vapour rains out of the lower atmosphere in about nine days. HFC-134a (14 years) and methane (11.8 years) are broken down in the troposphere by the hydroxyl radical, which pulls off a hydrogen atom; methane ends up as carbon dioxide and water. Nitrous oxide (109 years) and nitrogen trifluoride (569 years) rise to the stratosphere and are split by ultraviolet light and excited oxygen atoms; some nitrous oxide becomes nitric oxide, which destroys ozone. Sulphur hexafluoride (about 1,000 years; IPCC used 3,200 until 2021) is destroyed only in the mesosphere by free electrons and hard ultraviolet. CF4 (50,000 years) survives almost everything.</desc><rect width="960" height="660" fill="#fff"/><defs><marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Where each gas meets its end</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Layers not to scale. Lifetimes are IPCC AR6 figures; the longer the climb, the longer the gas lasts.</text><rect x="150" y="70" width="790" height="70" fill="#f6f6f6" stroke="#E6E2E0"/><text x="140.0" y="105.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="700" >Thermosphere</text><text x="140.0" y="121.0" font-size="11.5" fill="#5A5A5A" text-anchor="end" font-weight="400" >above 85 km</text><rect x="150" y="140" width="790" height="110" fill="#FAF3F3" stroke="#E6E2E0"/><text x="140.0" y="195.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="700" >Mesosphere</text><text x="140.0" y="211.0" font-size="11.5" fill="#5A5A5A" text-anchor="end" font-weight="400" >50–85 km</text><rect x="150" y="250" width="790" height="150" fill="#fff" stroke="#E6E2E0"/><text x="140.0" y="325.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="700" >Stratosphere</text><text x="140.0" y="341.0" font-size="11.5" fill="#5A5A5A" text-anchor="end" font-weight="400" >12–50 km</text><rect x="150" y="400" width="790" height="170" fill="#f6f6f6" stroke="#E6E2E0"/><text x="140.0" y="485.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="700" >Troposphere</text><text x="140.0" y="501.0" font-size="11.5" fill="#5A5A5A" text-anchor="end" font-weight="400" >0–12 km</text><rect x="150" y="570" width="790" height="14" fill="#cfcfcf"/><text x="140.0" y="582.0" font-size="12" fill="#5A5A5A" text-anchor="end" font-weight="400" >Ground</text><line x1="206.4" y1="570" x2="206.4" y2="559" stroke="#A61C1C" stroke-width="3" marker-end="url(#up)"/><circle cx="206.4" cy="545.0" r="9" fill="#A61C1C"/><text x="206.4" y="600.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Water vapour</text><text x="206.4" y="614.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >about 9 days</text><text x="206.4" y="513.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Condenses and</text><text x="206.4" y="527.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >rains out</text><line x1="319.3" y1="570" x2="319.3" y2="459" stroke="#A61C1C" stroke-width="3" marker-end="url(#up)"/><circle cx="319.3" cy="445.0" r="9" fill="#A61C1C"/><text x="319.3" y="600.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >HFC-134a</text><text x="319.3" y="614.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >14 years</text><text x="319.3" y="399.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Hydroxyl radical</text><text x="319.3" y="413.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >(OH) pulls off a</text><text x="319.3" y="427.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >hydrogen</text><line x1="432.1" y1="570" x2="432.1" y2="459" stroke="#A61C1C" stroke-width="3" marker-end="url(#up)"/><circle cx="432.1" cy="445.0" r="9" fill="#A61C1C"/><text x="432.1" y="600.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Methane</text><text x="432.1" y="614.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >11.8 years</text><text x="432.1" y="399.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >OH pulls off a</text><text x="432.1" y="413.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >hydrogen → CO →</text><text x="432.1" y="427.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >CO₂ + water</text><line x1="545.0" y1="570" x2="545.0" y2="314" stroke="#A61C1C" stroke-width="3" marker-end="url(#up)"/><circle cx="545.0" cy="300.0" r="9" fill="#A61C1C"/><text x="545.0" y="600.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Nitrous oxide</text><text x="545.0" y="614.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >109 years</text><text x="545.0" y="240.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >UV splits it;</text><text x="545.0" y="254.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >O(¹D) turns some</text><text x="545.0" y="268.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >into NO, which</text><text x="545.0" y="282.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >eats ozone</text><line x1="657.9" y1="570" x2="657.9" y2="304" stroke="#A61C1C" stroke-width="3" marker-end="url(#up)"/><circle cx="657.9" cy="290.0" r="9" fill="#A61C1C"/><text x="657.9" y="600.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >NF₃</text><text x="657.9" y="614.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >569 years</text><text x="657.9" y="258.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Stratospheric UV</text><text x="657.9" y="272.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >and O(¹D)</text><line x1="770.7" y1="570" x2="770.7" y2="189" stroke="#A61C1C" stroke-width="3" marker-end="url(#up)"/><circle cx="770.7" cy="175.0" r="9" fill="#A61C1C"/><text x="770.7" y="600.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >SF₆</text><text x="770.7" y="614.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >1,000 years*</text><text x="770.7" y="129.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Grabs free</text><text x="770.7" y="143.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >electrons;</text><text x="770.7" y="157.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Lyman-α UV</text><line x1="883.6" y1="570" x2="883.6" y2="109" stroke="#A61C1C" stroke-width="3" marker-end="url(#up)"/><circle cx="883.6" cy="95.0" r="9" fill="#A61C1C"/><text x="883.6" y="600.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >CF₄</text><text x="883.6" y="614.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >50,000 years</text><text x="883.6" y="63.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Only the hardest</text><text x="883.6" y="77.0" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="400" >UV, or a furnace</text><text x="940.0" y="652.0" font-size="11" fill="#5A5A5A" text-anchor="end" font-weight="400" >* IPCC cut SF₆ from 3,200 to 1,000 years in 2021; recent studies range from about 850 to 1,300.</text></svg>