<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The waste hierarchy</title><desc id="d">An inverted pyramid, from most to least preferred: prevention, meaning using less and designing out waste; preparing for reuse, meaning checking, cleaning and repairing; recycling, including composting; other recovery such as energy from waste; and disposal, meaning landfill or burning without energy recovery. In Northern Ireland the duty sits in regulation 17 of the Waste Regulations (NI) 2011. In 2024/25 NI councils recycled 50.4% of the waste they collected, sent 34.3% to energy recovery and 14.0% to landfill.</desc><rect width="960" height="500" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The waste hierarchy</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >The order of preference in waste law (in NI, the Waste Regulations (NI) 2011, reg. 17). Departing from it needs a life-cycle reason.</text><path d="M20.0 75 L780.0 75 L730.0 147 L70.0 147 z" fill="#4E7D4E" opacity="0.9"/><text x="400.0" y="109.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >Prevention</text><text x="400.0" y="129.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >use less, design out waste</text><path d="M70.0 155 L730.0 155 L680.0 227 L120.0 227 z" fill="#4E7D4E" opacity="0.9"/><text x="400.0" y="189.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >Preparing for reuse</text><text x="400.0" y="209.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >check, clean, repair</text><path d="M120.0 235 L680.0 235 L630.0 307 L170.0 307 z" fill="#4A6A8A" opacity="0.9"/><text x="400.0" y="269.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >Recycling</text><text x="400.0" y="289.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >including composting</text><path d="M170.0 315 L630.0 315 L580.0 387 L220.0 387 z" fill="#8C8C8C" opacity="0.9"/><text x="400.0" y="349.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >Other recovery</text><text x="400.0" y="369.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >e.g. energy from waste</text><path d="M210.0 395 L590.0 395 L540.0 467 L260.0 467 z" fill="#A61C1C" opacity="0.9"/><text x="400.0" y="429.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >Disposal</text><text x="400.0" y="449.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >landfill; burning without recovery</text><text x="800.0" y="115.0" font-size="13" fill="#4E7D4E" text-anchor="start" font-weight="700" >↑ Most preferred</text><text x="800.0" y="435.0" font-size="13" fill="#A61C1C" text-anchor="start" font-weight="700" >↓ Least preferred</text><text x="800.0" y="260.0" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >NI 2024/25:</text><text x="800.0" y="280.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="400" >recycling 50.4%</text><text x="800.0" y="298.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="400" >energy recovery 34.3%</text><text x="800.0" y="316.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="400" >landfill 14.0%</text><text x="800.0" y="334.0" font-size="12" fill="#1A1A1A" text-anchor="start" font-weight="400" >(council-collected waste)</text></svg>