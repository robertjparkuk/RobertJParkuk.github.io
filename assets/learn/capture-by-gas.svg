<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Capture options for each greenhouse gas</title><desc id="d">Four columns. Carbon dioxide: captured from chimneys (CCS) or the air (DACCS) and stored or used; plants and soils too. Methane: collected from landfill, digesters, slurry stores and coal mines and burned for energy or flared; feed additives cut cow methane. Nitrous oxide: in factories, catalysts split it into nitrogen and oxygen (2 N2O gives 2 N2 plus O2); on fields there is no capture, only inhibitors and using less nitrogen. F-gases: recovered from equipment at service and end of life, then reclaimed, reused or destroyed at high temperature.</desc><rect width="960" height="430" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Can we capture it? Gas by gas</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >“Capture” means different things for different gases. For most, the answer is: stop it at source, or destroy it.</text><rect x="20" y="75" width="222" height="330" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="2"/><rect x="20" y="75" width="222" height="44" rx="8" fill="#1A1A1A"/><text x="131.0" y="104.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Carbon dioxide</text><text x="131.0" y="160.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Capture from chimneys (CCS)</text><text x="131.0" y="190.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Capture from air (DACCS)</text><text x="131.0" y="220.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Store in rock or use</text><text x="131.0" y="250.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Plants and soils too</text><rect x="32" y="330" width="198" height="56" rx="6" fill="#FAF3F3"/><text x="131.0" y="364.0" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Yes: capture and store</text><rect x="252" y="75" width="222" height="330" rx="8" fill="#fff" stroke="#A61C1C" stroke-width="2"/><rect x="252" y="75" width="222" height="44" rx="8" fill="#A61C1C"/><text x="363.0" y="104.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Methane</text><text x="363.0" y="160.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Collect from landfill, digesters,</text><text x="363.0" y="190.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >slurry stores, coal mines</text><text x="363.0" y="220.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Burn for energy or flare</text><text x="363.0" y="250.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Feed additives cut cow methane</text><rect x="264" y="330" width="198" height="56" rx="6" fill="#FAF3F3"/><text x="363.0" y="364.0" font-size="13.5" fill="#A61C1C" text-anchor="middle" font-weight="700" >Collect and burn it</text><rect x="484" y="75" width="222" height="330" rx="8" fill="#fff" stroke="#B05A5A" stroke-width="2"/><rect x="484" y="75" width="222" height="44" rx="8" fill="#B05A5A"/><text x="595.0" y="104.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Nitrous oxide</text><text x="595.0" y="160.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Factories: catalysts split it</text><text x="595.0" y="190.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">2N₂O → 2N₂ + O₂</text><text x="595.0" y="220.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Fields: no capture; use</text><text x="595.0" y="250.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >inhibitors and less N</text><rect x="496" y="330" width="198" height="56" rx="6" fill="#FAF3F3"/><text x="595.0" y="364.0" font-size="13.5" fill="#B05A5A" text-anchor="middle" font-weight="700" >Destroy at source</text><rect x="716" y="75" width="222" height="330" rx="8" fill="#fff" stroke="#4A6A8A" stroke-width="2"/><rect x="716" y="75" width="222" height="44" rx="8" fill="#4A6A8A"/><text x="827.0" y="104.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >F-gases</text><text x="827.0" y="160.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Recover from equipment</text><text x="827.0" y="190.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >at service and end of life</text><text x="827.0" y="220.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Reclaim, reuse or destroy</text><text x="827.0" y="250.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >at high temperature</text><rect x="728" y="330" width="198" height="56" rx="6" fill="#FAF3F3"/><text x="827.0" y="364.0" font-size="13.5" fill="#4A6A8A" text-anchor="middle" font-weight="700" >Recover and destroy</text></svg>