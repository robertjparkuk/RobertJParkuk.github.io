<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Cross-section of a fracked well</title><desc id="d">A schematic cross-section, not to scale. From the surface down: soil, a drinking-water aquifer, hundreds of metres to kilometres of overlying rock, and the gas-bearing shale. A well drops vertically from a well pad, then turns horizontal through the shale, where fractures are opened and held open by sand. Steel casing and cement seal the well from the aquifer. The main escape routes for gas are leaks and venting at the surface and failed casing or cement that lets gas migrate up the well.</desc><rect width="960" height="600" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A6A8A"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Inside a fracked well (not to scale)</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Shale is usually far below drinking-water aquifers. The main paths for gas to escape are the well itself and the surface equipment.</text><g transform="translate(0 40)"><rect x="20" y="80" width="920" height="60" fill="#f3efe6"/><text x="930.0" y="104.0" font-size="12.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Soil and drift</text><rect x="20" y="140" width="920" height="70" fill="#dbe8f2"/><text x="930.0" y="164.0" font-size="12.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Aquifer (drinking water)</text><rect x="20" y="210" width="920" height="170" fill="#e9e4dc"/><text x="930.0" y="234.0" font-size="12.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Overlying rock: hundreds of metres to kilometres</text><rect x="20" y="380" width="920" height="90" fill="#cfc6b8"/><text x="930.0" y="404.0" font-size="12.5" fill="#1A1A1A" text-anchor="end" font-weight="700" >Shale (gas held in tight rock)</text><rect x="20" y="470" width="920" height="60" fill="#e9e4dc"/><rect x="120" y="62" width="120" height="18" fill="#8C8C8C"/><text x="180.0" y="74.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" >Well pad</text><rect x="174" y="80" width="12" height="330" fill="#1A1A1A"/><path d="M180 405 Q 185 425 230 425 L 760 425" stroke="#1A1A1A" stroke-width="12" fill="none"/><line x1="300" y1="425" x2="286" y2="392" stroke="#A61C1C" stroke-width="2"/><line x1="300" y1="425" x2="312" y2="458" stroke="#A61C1C" stroke-width="2"/><line x1="370" y1="425" x2="356" y2="392" stroke="#A61C1C" stroke-width="2"/><line x1="370" y1="425" x2="382" y2="458" stroke="#A61C1C" stroke-width="2"/><line x1="440" y1="425" x2="426" y2="392" stroke="#A61C1C" stroke-width="2"/><line x1="440" y1="425" x2="452" y2="458" stroke="#A61C1C" stroke-width="2"/><line x1="510" y1="425" x2="496" y2="392" stroke="#A61C1C" stroke-width="2"/><line x1="510" y1="425" x2="522" y2="458" stroke="#A61C1C" stroke-width="2"/><line x1="580" y1="425" x2="566" y2="392" stroke="#A61C1C" stroke-width="2"/><line x1="580" y1="425" x2="592" y2="458" stroke="#A61C1C" stroke-width="2"/><line x1="650" y1="425" x2="636" y2="392" stroke="#A61C1C" stroke-width="2"/><line x1="650" y1="425" x2="662" y2="458" stroke="#A61C1C" stroke-width="2"/><line x1="720" y1="425" x2="706" y2="392" stroke="#A61C1C" stroke-width="2"/><line x1="720" y1="425" x2="732" y2="458" stroke="#A61C1C" stroke-width="2"/><text x="520.0" y="492.0" font-size="12" fill="#A61C1C" text-anchor="middle" font-weight="700" >Fractures, held open by sand, release gas from the shale</text><rect x="196" y="140" width="10" height="70" fill="none" stroke="#4A6A8A" stroke-width="2" stroke-dasharray="4 3"/><text x="212.0" y="168.0" font-size="12" fill="#4A6A8A" text-anchor="start" font-weight="700" >Steel casing and cement</text><text x="212.0" y="184.0" font-size="12" fill="#4A6A8A" text-anchor="start" font-weight="400" >seal the well from the aquifer</text><line x1="180.0" y1="62.0" x2="180.0" y2="30.0" stroke="#A61C1C" stroke-width="2" marker-end="url(#a1)"/><text x="192.0" y="40.0" font-size="12" fill="#A61C1C" text-anchor="start" font-weight="700" >Leaks and venting at the surface</text><line x1="170.0" y1="300.0" x2="120.0" y2="250.0" stroke="#A61C1C" stroke-width="2" marker-end="url(#a1)" stroke-dasharray="5 4"/><text x="30.0" y="316.0" font-size="12" fill="#A61C1C" text-anchor="start" font-weight="700" >Failed casing</text><text x="30.0" y="332.0" font-size="12" fill="#A61C1C" text-anchor="start" font-weight="400" >or cement: gas</text><text x="30.0" y="348.0" font-size="12" fill="#A61C1C" text-anchor="start" font-weight="400" >can rise up the well</text></g><text x="20.0" y="585.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >Typical UK target depths are over a kilometre; the depth of each layer varies by site.</text></svg>