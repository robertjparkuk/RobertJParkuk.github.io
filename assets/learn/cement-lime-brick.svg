<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Where the CO2 comes from in cement, lime and brick</title><desc id="d">Three panels. Portland cement: limestone and clay heated to about 1,450 degrees; calcium carbonate gives calcium oxide and CO2; the oxide reacts with clay to make clinker, ground with gypsum into cement. CO2 comes from the stone itself plus fuel for the hottest kiln; cement sets with water and takes back only a fraction of its CO2. Lime: limestone heated to about 900 degrees, giving calcium oxide and CO2, then slaked to calcium hydroxide; process CO2 plus fuel; air lime sets by taking CO2 back, and soft lime mortar lets bricks be reused. Fired clay brick: clay shaped, dried and fired at about 1,000 degrees; no limestone, so almost all its CO2 comes from fuel, mostly natural gas; it lasts centuries and can be reused if laid in lime mortar.</desc><rect width="960" height="545" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4E7D4E"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Cement, lime and fired clay: where the CO₂ comes from</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Two sources in every kiln: the fuel that heats it, and (for cement and lime) the CO₂ driven out of the stone itself.</text><rect x="20" y="75" width="290" height="425" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="165.0" y="99.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Portland cement</text><text x="165.0" y="117.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >for concrete block and mortar</text><text x="165.0" y="140.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Limestone + clay, heated to about 1,450 °C</text><text x="165.0" y="170.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">CaCO₃ → CaO + CO₂</text><text x="165.0" y="200.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >CaO reacts with clay to make clinker</text><text x="165.0" y="230.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Clinker ground with gypsum = cement</text><rect x="35" y="275" width="260" height="70" rx="6" fill="#FAF3F3" stroke="#A61C1C"/><text x="165.0" y="300.0" font-size="13" fill="#A61C1C" text-anchor="middle" font-weight="700" >Process CO₂ from the stone</text><text x="165.0" y="322.0" font-size="12.5" fill="#A61C1C" text-anchor="middle" font-weight="400" >plus fuel for the hottest kiln</text><text x="165.0" y="390.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Sets by reacting with water.</text><text x="165.0" y="412.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Takes back only a fraction of its CO₂.</text><rect x="335" y="75" width="290" height="425" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="480.0" y="99.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Lime</text><text x="480.0" y="117.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >for mortar, render, hempcrete</text><text x="480.0" y="140.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Limestone heated to about 900 °C</text><text x="480.0" y="170.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">CaCO₃ → CaO + CO₂</text><text x="480.0" y="200.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',monospace">Slaked: CaO + H₂O → Ca(OH)₂</text><text x="480.0" y="230.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Hydraulic limes also set with water</text><rect x="350" y="275" width="260" height="70" rx="6" fill="#FAF3F3" stroke="#A61C1C"/><text x="480.0" y="300.0" font-size="13" fill="#A61C1C" text-anchor="middle" font-weight="700" >Process CO₂ from the stone</text><text x="480.0" y="322.0" font-size="12.5" fill="#A61C1C" text-anchor="middle" font-weight="400" >plus fuel, at a lower temperature</text><text x="480.0" y="390.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Air lime sets by taking CO₂ back.</text><text x="480.0" y="412.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Soft mortar lets bricks be reused.</text><rect x="650" y="75" width="290" height="425" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="795.0" y="99.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Fired clay brick</text><text x="795.0" y="117.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >for facing and walls</text><text x="795.0" y="140.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Clay shaped and dried</text><text x="795.0" y="170.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Fired at about 1,000 °C</text><text x="795.0" y="200.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Minerals fuse into a hard body</text><text x="795.0" y="230.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >No limestone, little process CO₂</text><rect x="665" y="275" width="260" height="70" rx="6" fill="#FAF3F3" stroke="#A61C1C"/><text x="795.0" y="300.0" font-size="13" fill="#A61C1C" text-anchor="middle" font-weight="700" >Almost all CO₂ from fuel</text><text x="795.0" y="322.0" font-size="12.5" fill="#A61C1C" text-anchor="middle" font-weight="400" >(mostly natural gas)</text><text x="795.0" y="390.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Lasts centuries.</text><text x="795.0" y="412.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Reusable if laid in lime mortar.</text><text x="20.0" y="528.0" font-size="11.5" fill="#5A5A5A" text-anchor="start" font-weight="400" >Kiln temperatures are typical values; see the sources on the page.</text></svg>