<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">Absorption and adsorption compared</title><desc id="d">Left, absorption: carbon dioxide dissolves into a liquid amine solvent at about 40 °C and reacts, 2 RNH2 plus CO2 giving a carbamate; heating to 100 to 120 °C releases pure CO2 for storage. Used on power stations and cement kilns, with a 10 to 40% energy penalty. Right, adsorption: carbon dioxide sticks to the inner surfaces of a porous solid such as a zeolite, a metal–organic framework or amine-coated silica, and is released by heat, vacuum or a pressure drop. Used in many direct air capture machines.</desc><rect width="960" height="470" fill="#fff"/><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A61C1C"/></marker></defs><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >Absorption or adsorption? Two ways to catch CO₂</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Absorption takes the gas into the whole liquid. Adsorption holds it on the surface of a solid.</text><rect x="20" y="70" width="450" height="380" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.5"/><text x="245.0" y="96.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Absorption: like a sponge</text><rect x="80" y="130" width="330" height="150" rx="6" fill="#dde6ee" stroke="#4A6A8A"/><text x="245.0" y="150.0" font-size="12" fill="#4A6A8A" text-anchor="middle" font-weight="700" >Amine solvent, about 40 °C</text><circle cx="169.0" cy="219.4" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="207.3" cy="225.4" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="281.5" cy="171.6" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="103.8" cy="248.7" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="175.2" cy="188.4" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="388.7" cy="212.0" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="342.6" cy="212.6" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="285.3" cy="180.1" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="284.1" cy="251.8" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="251.7" cy="239.1" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="294.7" cy="171.4" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="319.9" cy="224.1" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="187.4" cy="168.1" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="351.0" cy="212.3" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="308.5" cy="252.9" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="307.1" cy="257.1" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="214.5" cy="245.1" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="228.9" cy="258.6" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="354.9" cy="174.7" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="139.4" cy="186.7" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="380.0" cy="208.6" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="281.7" cy="195.1" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="247.1" cy="203.6" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="201.8" cy="223.5" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="269.4" cy="255.4" r="5" fill="#A61C1C" opacity="0.85"/><circle cx="297.8" cy="257.9" r="5" fill="#A61C1C" opacity="0.85"/><text x="245.0" y="305.0" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',monospace">2 RNH₂ + CO₂ ⇌ RNHCOO⁻ + RNH₃⁺</text><text x="245.0" y="325.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >amine + CO₂ → carbamate</text><text x="245.0" y="360.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Heat to 100–120 °C and the CO₂ comes back out,</text><text x="245.0" y="378.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >pure enough to compress and store.</text><text x="245.0" y="410.0" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Used on power stations and cement kilns.</text><text x="245.0" y="428.0" font-size="12.5" fill="#A61C1C" text-anchor="middle" font-weight="600" >The heat is the cost: a 10–40% energy penalty.</text><rect x="490" y="70" width="450" height="380" rx="8" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><text x="715.0" y="96.0" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Adsorption: like Velcro</text><rect x="550" y="200" width="330" height="80" fill="#e8e4df" stroke="#8C8C8C"/><path d="M570 200 v40 h18 v-40" fill="#fff" stroke="#8C8C8C"/><circle cx="579" cy="232" r="5" fill="#A61C1C"/><circle cx="579" cy="193" r="5" fill="#A61C1C"/><path d="M615 200 v40 h18 v-40" fill="#fff" stroke="#8C8C8C"/><circle cx="624" cy="232" r="5" fill="#A61C1C"/><circle cx="624" cy="193" r="5" fill="#A61C1C"/><path d="M660 200 v40 h18 v-40" fill="#fff" stroke="#8C8C8C"/><circle cx="669" cy="232" r="5" fill="#A61C1C"/><circle cx="669" cy="193" r="5" fill="#A61C1C"/><path d="M705 200 v40 h18 v-40" fill="#fff" stroke="#8C8C8C"/><circle cx="714" cy="232" r="5" fill="#A61C1C"/><circle cx="714" cy="193" r="5" fill="#A61C1C"/><path d="M750 200 v40 h18 v-40" fill="#fff" stroke="#8C8C8C"/><circle cx="759" cy="232" r="5" fill="#A61C1C"/><circle cx="759" cy="193" r="5" fill="#A61C1C"/><path d="M795 200 v40 h18 v-40" fill="#fff" stroke="#8C8C8C"/><circle cx="804" cy="232" r="5" fill="#A61C1C"/><circle cx="804" cy="193" r="5" fill="#A61C1C"/><path d="M840 200 v40 h18 v-40" fill="#fff" stroke="#8C8C8C"/><circle cx="849" cy="232" r="5" fill="#A61C1C"/><circle cx="849" cy="193" r="5" fill="#A61C1C"/><circle cx="590" cy="150" r="5" fill="#A61C1C" opacity="0.5"/><circle cx="640" cy="168" r="5" fill="#A61C1C" opacity="0.5"/><circle cx="690" cy="150" r="5" fill="#A61C1C" opacity="0.5"/><circle cx="740" cy="168" r="5" fill="#A61C1C" opacity="0.5"/><circle cx="790" cy="150" r="5" fill="#A61C1C" opacity="0.5"/><circle cx="840" cy="168" r="5" fill="#A61C1C" opacity="0.5"/><text x="715.0" y="135.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >CO₂ in the passing air</text><text x="715.0" y="300.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >Porous solid: zeolite, metal–organic framework,</text><text x="715.0" y="316.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >or silica coated with amines</text><text x="715.0" y="360.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >CO₂ sticks to the inner surfaces. Release it with</text><text x="715.0" y="378.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="400" >heat, a vacuum or a pressure drop.</text><text x="715.0" y="410.0" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Used in many direct air capture machines.</text><text x="715.0" y="428.0" font-size="12.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >Huge surface in a small space: a gram can hide a football pitch.*</text><text x="940.0" y="465.0" font-size="10.5" fill="#5A5A5A" text-anchor="end" font-weight="400" >* Typical of the most porous frameworks; varies widely.</text></svg>