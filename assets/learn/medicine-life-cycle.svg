<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">The life cycle of a medicine</title><desc id="d">A six-step loop. Feedstocks come from oil, gas, plants or fermentation. Making the active ingredient takes many steps and solvents, often tens of kilograms of material per kilogram of product, and is a hotspot. Then formulation and packing into tablets, inhalers and blister packs; distribution, with a cold chain for some products; use, where inhaler propellants and anaesthetic gases are emitted, the second hotspot; and after use, when unused stock is wasted and residues reach water.</desc><rect width="920" height="620" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >The life cycle of a medicine</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Two hotspots: making the active ingredient, and the few products whose propellants or gases escape when used.</text><circle cx="460" cy="335" r="215" fill="none" stroke="#E6E2E0" stroke-width="12"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(567.5 148.8) rotate(30.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(675.0 335.0) rotate(90.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(567.5 521.2) rotate(150.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(352.5 521.2) rotate(210.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(245.0 335.0) rotate(270.0)"/><path d="M-8 -7 L8 0 L-8 7 z" fill="#A61C1C" transform="translate(352.5 148.8) rotate(330.0)"/><rect x="372.0" y="83.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="460.0" y="108.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Feedstocks</text><text x="460.0" y="127.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >oil, gas, plants,</text><text x="460.0" y="142.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >fermentation</text><rect x="558.2" y="190.5" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="646.2" y="215.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Make the ingredient</text><text x="646.2" y="234.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >many steps and solvents:</text><text x="646.2" y="249.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >often tens of kg per kg</text><rect x="558.2" y="405.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="646.2" y="430.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Formulate and pack</text><text x="646.2" y="449.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >tablets, inhalers,</text><text x="646.2" y="464.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >blister packs</text><rect x="372.0" y="513.0" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="460.0" y="538.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Distribute</text><text x="460.0" y="557.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >cold chain for</text><text x="460.0" y="572.0" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >some products</text><rect x="185.8" y="405.5" width="176" height="74" rx="8" fill="#FAF3F3" stroke="#A61C1C" stroke-width="1.8"/><text x="273.8" y="430.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Use</text><text x="273.8" y="449.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >inhaler propellants and</text><text x="273.8" y="464.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >anaesthetic gases emitted</text><rect x="185.8" y="190.5" width="176" height="74" rx="8" fill="#fff" stroke="#8C8C8C" stroke-width="1.8"/><text x="273.8" y="215.5" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="700" >After use</text><text x="273.8" y="234.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >unused stock wasted;</text><text x="273.8" y="249.5" font-size="11.5" fill="#5A5A5A" text-anchor="middle" font-weight="400" >residues reach water</text><text x="460.0" y="315.0" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700" >Patient need</text><text x="460.0" y="335.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" >comes first</text><text x="460.0" y="355.0" font-size="12" fill="#5A5A5A" text-anchor="middle" font-weight="400" ></text></svg>