<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro',Arial,sans-serif"><title id="t">How long each carbon removal method stores carbon</title><desc id="d">Typical storage times on a log scale: trees and new woodland, soil carbon and restored peat and wetlands, decades to centuries; biochar, centuries to millennia; rock weathering and mineralisation, bioenergy with carbon capture and storage, and direct air capture with geological storage, 10,000 years or more. Natural stores can be reversed by fire, felling, drainage or ploughing.</desc><rect width="960" height="500" fill="#fff"/><text x="20.0" y="30.0" font-size="20" fill="#1A1A1A" text-anchor="start" font-weight="700" >How long does each method lock carbon away?</text><text x="20.0" y="52.0" font-size="13" fill="#5A5A5A" text-anchor="start" font-weight="400" >Typical storage time, years (log scale). Source: IPCC AR6 Working Group III factsheet on carbon dioxide removal.</text><text x="288.0" y="106.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="600" >Trees and new woodland</text><rect x="300.0" y="91" width="229.0" height="24" rx="4" fill="#4E7D4E" opacity="0.9"><title>Trees and new woodland</title></rect><text x="288.0" y="156.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="600" >Soil carbon on farms</text><rect x="300.0" y="141" width="229.0" height="24" rx="4" fill="#4E7D4E" opacity="0.9"><title>Soil carbon on farms</title></rect><text x="288.0" y="206.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="600" >Restored peat and wetlands</text><rect x="300.0" y="191" width="229.0" height="24" rx="4" fill="#4E7D4E" opacity="0.9"><title>Restored peat and wetlands</title></rect><text x="288.0" y="256.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="600" >Biochar dug into soil</text><rect x="455.0" y="241" width="229.0" height="24" rx="4" fill="#6B4F3A" opacity="0.9"><title>Biochar dug into soil</title></rect><text x="288.0" y="306.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="600" >Rock weathering and mineralisation</text><rect x="765.0" y="291" width="155.0" height="24" rx="4" fill="#1A1A1A" opacity="0.9"><title>Rock weathering and mineralisation</title></rect><path d="M918.0 291 l14 12 l-14 12 z" fill="#1A1A1A"/><text x="288.0" y="356.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="600" >Bioenergy with CCS (BECCS)</text><rect x="765.0" y="341" width="155.0" height="24" rx="4" fill="#A61C1C" opacity="0.9"><title>Bioenergy with CCS (BECCS)</title></rect><path d="M918.0 341 l14 12 l-14 12 z" fill="#A61C1C"/><text x="288.0" y="406.0" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="600" >Direct air capture with storage</text><rect x="765.0" y="391" width="155.0" height="24" rx="4" fill="#A61C1C" opacity="0.9"><title>Direct air capture with storage</title></rect><path d="M918.0 391 l14 12 l-14 12 z" fill="#A61C1C"/><line x1="300.0" y1="440" x2="300.0" y2="446" stroke="#1A1A1A"/><text x="300.0" y="462.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >decades</text><line x1="300.0" y1="80" x2="300.0" y2="440" stroke="#E6E2E0"/><line x1="455.0" y1="440" x2="455.0" y2="446" stroke="#1A1A1A"/><text x="455.0" y="462.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >centuries</text><line x1="455.0" y1="80" x2="455.0" y2="440" stroke="#E6E2E0"/><line x1="610.0" y1="440" x2="610.0" y2="446" stroke="#1A1A1A"/><text x="610.0" y="462.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >millennia</text><line x1="610.0" y1="80" x2="610.0" y2="440" stroke="#E6E2E0"/><line x1="765.0" y1="440" x2="765.0" y2="446" stroke="#1A1A1A"/><text x="765.0" y="462.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >10,000 years</text><line x1="765.0" y1="80" x2="765.0" y2="440" stroke="#E6E2E0"/><line x1="920.0" y1="440" x2="920.0" y2="446" stroke="#1A1A1A"/><text x="920.0" y="462.0" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="400" >100,000</text><line x1="920.0" y1="80" x2="920.0" y2="440" stroke="#E6E2E0"/><line x1="300" y1="440" x2="920" y2="440" stroke="#1A1A1A"/><text x="20.0" y="490.0" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="400" >Natural stores (green) can be reversed by fire, felling, drainage or ploughing. Geological and mineral stores are close to permanent.</text></svg>