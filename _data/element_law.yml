H:
  z: 1
  name: Hydrogen
  html: '<h3>Where it comes from</h3><p>Almost all hydrogen is made, not mined. Most of it comes from natural gas by steam reforming, which releases carbon dioxide. A smaller share comes from splitting water by electrolysis. No licence is needed to make it, but a plant is caught by the planning, pressure and major-hazard rules below. Hydrogen made from natural gas depends on petroleum licensed under the Petroleum (Production) Act (Northern Ireland) 1964.</p><h3>Handling it</h3><p>Hydrogen is an extremely flammable gas with a very wide flammable range, and it leaks easily. It is carried as hydrogen, compressed (UN1049) or as a refrigerated liquid (UN1966) under the Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (Northern Ireland) 2010. Hydrogen is a named substance under the Control of Major Accident Hazards Regulations (Northern Ireland) 2015: 5 tonnes brings a site into the lower tier and 50 tonnes into the upper tier. Stores and refuelling points need a DSEAR (NI) 2003 risk assessment and zoning. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Hydrogen forms one bond. It joins carbon in fuels, oxygen in water, and nitrogen in ammonia, and it gives the acid in acids. The compounds that matter in law are ammonia (major-hazard and fertiliser rules) and hydrogen fluoride (see Fluorine).</p><h3>Climate, carbon and the environment</h3><p>Burning hydrogen gives only water, but making it from gas does not. Under the Greenhouse Gas Emissions Trading Scheme Order 2020, producing hydrogen and synthesis gas by reforming or partial oxidation with a capacity above 25 tonnes a day is a regulated UK ETS activity. Hydrogen is one of the five goods covered by UK CBAM, which applies in NI from 1 January 2027. Whether an import is caught depends on its commodity code: a customs specialist is needed. EU CBAM does not apply in NI.</p><h3>Not yet verified</h3><p>The CLP harmonised classification codes for hydrogen.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2015/325/schedule/1" target="_blank" rel="noopener">Control of Major Accident Hazards Regulations (Northern Ireland) 2015, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2020/1265/schedule/2" target="_blank" rel="noopener">Greenhouse Gas Emissions Trading Scheme Order 2020, Schedule 2 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (Northern Ireland) 2010 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li><li><a href="https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/2024-04/ERG2024-Eng-Web-a.pdf" target="_blank" rel="noopener">Emergency Response Guidebook 2024, UN number index (US Department of Transportation, 2024)</a></li></ul>'
He:
  z: 2
  name: Helium
  html: '<h3>Where it comes from</h3><p>Helium is recovered from certain natural gas fields, where it has built up from radioactive decay in the rock. It cannot be made economically, and once released it escapes to space. There is no helium production in NI; supply is imported in cylinders and cryogenic containers. Helium is on the list of critical raw materials in the Critical Raw Materials Act, Regulation (EU) 2024/1252 (Annex II), which applies in NI in part. The strategic-project and stockpiling parts do not apply in NI.</p><h3>Handling it</h3><p>Helium is not toxic and does not burn. The hazards are pressure, extreme cold in liquid form, and asphyxiation: in a closed space it pushes out oxygen without warning. Compressed helium is UN1046 under the Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (Northern Ireland) 2010. Cylinders and cryogenic plant fall under pressure systems law, and confined-space and oxygen-depletion risks belong in the COSHH (NI) 2003 or general risk assessment. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Helium is a noble gas. Its outer shell is full, so it forms no stable compounds in ordinary conditions. No compound rules apply.</p><h3>Climate, carbon and the environment</h3><p>Helium is not a greenhouse gas and does not pollute air, water or land. Its carbon footprint comes from the gas processing and liquefaction that produce it, and from transport. The practical issue is scarcity: users such as MRI scanners, laboratories and leak testing increasingly recover and recycle it.</p><h3>Not yet verified</h3><p>The UN number for refrigerated liquid helium; the source law on pressure systems (Pressure Systems Safety Regulations (Northern Ireland) 2004 SR number not found).</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex II (EUR-Lex)</a></li><li><a href="https://assets.publishing.service.gov.uk/media/680ba70911d566056bcae8ef/JC_decision_2.2025_clean_for_signature_UK_EU.docx.pdf" target="_blank" rel="noopener">Joint Committee Decision No 2/2025 (GOV.UK, 29 April 2025)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (Northern Ireland) 2010 (legislation.gov.uk)</a></li><li><a href="https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/2024-04/ERG2024-Eng-Web-a.pdf" target="_blank" rel="noopener">Emergency Response Guidebook 2024, UN number index (US Department of Transportation, 2024)</a></li></ul>'
Li:
  z: 3
  name: Lithium
  html: '<h3>Where it comes from</h3><p>Lithium is mined from hard rock (mainly spodumene) or pumped from salt-lake brines, then refined to the carbonate or hydroxide. Battery-grade lithium is a strategic raw material, and lithium a critical raw material, under the Critical Raw Materials Act, Regulation (EU) 2024/1252, which applies in NI in part. Any lithium deposit in NI would be a mineral under the Mineral Development Act (Northern Ireland) 1969, needing a Department for the Economy licence. Lithium compounds imported into NI at 1 tonne or more a year need EU REACH registration; a GB registration does not count.</p><h3>Handling it</h3><p>Lithium metal reacts with water to give flammable hydrogen, and it burns fiercely. It is carried as UN1415. Most people meet lithium in batteries: lithium-ion batteries are UN3480 (UN3481 when packed with or in equipment) and lithium metal batteries UN3090 (UN3091), under the Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (Northern Ireland) 2010. EH40/2005, approved for use with COSHH (NI) 2003, sets a short-term limit for lithium hydride of 0.02 mg/m³. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Lithium gives up one electron to form Li⁺ salts: the carbonate, hydroxide, chloride and the electrode materials in batteries. The main product law is the Batteries Regulation, Regulation (EU) 2023/1542, which applies in NI and covers carbon footprint, due diligence, labelling, recycled content and collection.</p><h3>Climate, carbon and the environment</h3><p>Lithium is central to electric vehicles and grid storage, but mining and refining use much energy and water. Waste batteries must not go in general waste: a battery in a bin lorry or waste site can start a fire. Collection and recycling run under the Batteries Regulation in NI and the waste electrical and electronic equipment rules for the products they sit in.</p><h3>Not yet verified</h3><p>The CLP harmonised classification codes for lithium; the Batteries Regulation''s lithium recovery and recycled-content figures.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2023/1542/oj" target="_blank" rel="noopener">Regulation (EU) 2023/1542 on batteries and waste batteries (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/apni/1969/35/contents" target="_blank" rel="noopener">Mineral Development Act (Northern Ireland) 1969 (legislation.gov.uk)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020 edition)</a></li><li><a href="https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/2024-04/ERG2024-Eng-Web-a.pdf" target="_blank" rel="noopener">Emergency Response Guidebook 2024, UN number index (US Department of Transportation, 2024)</a></li></ul>'
Be:
  z: 4
  name: Beryllium
  html: <h3>Where it comes from</h3><p>Beryllium is mined from beryl and bertrandite and refined into the metal, the oxide and copper-beryllium alloys. Beryllium is a critical raw material under the Critical Raw Materials Act, Regulation (EU) 2024/1252 (Annex II), which applies in NI in part. Imports of beryllium substances into NI at 1 tonne or more a year need EU REACH registration. There is no known commercial deposit in NI.</p><h3>Handling it</h3><p>Beryllium is one of the most hazardous metals at work. Breathing its dust or fume can cause chronic beryllium disease, a lasting lung condition, and it is a cause of lung cancer. Solid parts are safe to hold; the risk comes from machining, grinding, polishing or melting. EH40/2005, approved for use with COSHH (NI) 2003, sets a workplace exposure limit of 0.002 mg/m³ (8-hour, as Be) and marks it as a carcinogen, so exposure must be reduced as far as possible, not just kept under the limit. Beryllium powder is carried as UN1567. Work from the supplier's safety data sheet and get specialist advice before working beryllium alloys.</p><h3>How it forms compounds</h3><p>Beryllium forms two bonds, usually as Be²⁺ with a strongly covalent character. The oxide (beryllia) is a ceramic used in electronics, and copper-beryllium is used for springs, connectors and non-sparking tools. Beryllium is not one of the RoHS restricted substances, but its dust is treated with caution in electronics recycling.</p><h3>Climate, carbon and the environment</h3><p>Beryllium matters for aerospace, defence, nuclear and X-ray equipment, not for greenhouse gases. The environmental risk is dust from scrap and recycling. Waste containing beryllium dust is likely to be hazardous waste under the Hazardous Waste Regulations (Northern Ireland) 2005, and discarded electronics fall under the WEEE Regulations 2013.</p><h3>Not yet verified</h3><p>The CLP Annex VI harmonised classification codes for beryllium; whether beryllium items are listed under export control law.</p><h3>Sources</h3><ul><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020 edition)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex II (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2005/300/contents/made" target="_blank" rel="noopener">Hazardous Waste Regulations (Northern Ireland) 2005 (legislation.gov.uk)</a></li><li><a href="https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/2024-04/ERG2024-Eng-Web-a.pdf" target="_blank" rel="noopener">Emergency Response Guidebook 2024, UN number index (US Department of Transportation, 2024)</a></li></ul>
B:
  z: 5
  name: Boron
  html: '<h3>Where it comes from</h3><p>Boron is mined as borate minerals such as borax, mainly in Türkiye and the United States, and refined into boric acid, borax and boron compounds. Under the Critical Raw Materials Act, Regulation (EU) 2024/1252, boron is a critical raw material and metallurgy-grade boron a strategic one; the Act applies in NI in part. Borates imported into NI at 1 tonne or more a year need EU REACH registration. NI has no borate deposits.</p><h3>Handling it</h3><p>Most people meet boron as boric acid or borax in glass, ceramics, detergents, fertilisers, timber treatment and laboratory work. Some borates raise concerns about harm to fertility and the unborn child, so check the classification and label on the safety data sheet before use. EH40/2005, approved for use with COSHH (NI) 2003, sets 8-hour limits for disodium tetraborate of 1 mg/m³ (anhydrous and pentahydrate) and 5 mg/m³ (decahydrate). Boron trifluoride, a toxic gas used as a catalyst, is carried as UN1008. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Boron forms three bonds, usually to oxygen, giving borates and boric acid. It also forms very hard materials (boron carbide and boron nitride), and boron-10 absorbs neutrons, which is why it is used in nuclear control. Boron is a plant micronutrient, so it appears in fertilisers under the Fertilising Products Regulation, Regulation (EU) 2019/1009, which applies in NI.</p><h3>Climate, carbon and the environment</h3><p>Boron''s climate role is indirect: borosilicate glass, glass-fibre insulation and neodymium-iron-boron magnets in wind turbines and electric motors. In water it is a pollutant at higher levels. The Water Supply (Water Quality) Regulations (Northern Ireland) 2017 set a drinking-water standard of 1.0 mg/l for boron.</p><h3>Not yet verified</h3><p>The CLP Annex VI harmonised classification of boric acid and borax as toxic to reproduction, and their status on the REACH Candidate List.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (Northern Ireland) 2017, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020 edition)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1009/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1009, Fertilising Products Regulation (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006, REACH (EUR-Lex)</a></li></ul>'
C:
  z: 6
  name: Carbon
  html: '<h3>Where it comes from</h3><p>Carbon is extracted as coal, oil, natural gas and graphite. In NI, petroleum and natural gas are licensed under the Petroleum (Production) Act (Northern Ireland) 1964, and other minerals by the Department for the Economy under the Mineral Development Act (Northern Ireland) 1969. Under the Critical Raw Materials Act, Regulation (EU) 2024/1252, battery-grade graphite is a strategic raw material, and graphite and coking coal are critical raw materials; the Act applies in NI in part.</p><h3>Handling it</h3><p>Solid carbon is low hazard, but its dusts and gases are not. EH40/2005, approved for use with COSHH (NI) 2003, sets these limits: carbon monoxide 20 ppm (8-hour) and 100 ppm (15-minute); carbon dioxide 5,000 ppm and 15,000 ppm; carbon black 3.5 mg/m³ and 7 mg/m³. Carbon monoxide from faulty boilers and engines kills silently. Carbon dioxide (UN1013) and carbon monoxide (UN1016) are carried under the NI carriage regulations, and coal and carbon dusts need a DSEAR (NI) 2003 assessment. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Carbon forms four bonds and chains with itself, which is why it is the basis of all organic chemistry, fuels, plastics and solvents. The compounds that matter most in law are carbon dioxide and methane (climate), carbon monoxide (air and gas safety), fluorocarbons (F-gas and ozone rules) and persistent organic pollutants under Regulation (EU) 2019/1021, which applies in NI.</p><h3>Climate, carbon and the environment</h3><p>Carbon dioxide and methane are the main greenhouse gases. The Climate Change Act (Northern Ireland) 2022 requires net NI emissions in 2050 to be at least 100% below baseline, though the methane account need not fall more than 46%. Larger emitters are in the UK ETS (Greenhouse Gas Emissions Trading Scheme Order 2020), and UK CBAM prices embedded emissions in five goods from 1 January 2027. The Air Quality Standards Regulations (Northern Ireland) 2010 set a carbon monoxide limit of 10 mg/m³ (maximum daily 8-hour mean).</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nia/2022/31/section/1" target="_blank" rel="noopener">Climate Change Act (Northern Ireland) 2022, section 1 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2020/1265/contents/made" target="_blank" rel="noopener">Greenhouse Gas Emissions Trading Scheme Order 2020 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/188/schedule/2/made" target="_blank" rel="noopener">Air Quality Standards Regulations (Northern Ireland) 2010, Schedule 2 (legislation.gov.uk)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020 edition)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li></ul>'
N:
  z: 7
  name: Nitrogen
  html: '<h3>Where it comes from</h3><p>Nitrogen makes up most of the air. It is separated by cooling and distilling air, or by membranes and pressure-swing units on site; no specific licensing regime for this was identified beyond pressure and major-hazard law. Most industrial nitrogen goes into ammonia, made from nitrogen and hydrogen, which is the basis of nitrogen fertilisers.</p><h3>Handling it</h3><p>Nitrogen gas is not toxic but it is an asphyxiant: leaks in plant rooms, cold stores and tanks have killed workers. Liquid nitrogen also burns skin. Compressed nitrogen is UN1066 and anhydrous ammonia UN1005. Anhydrous ammonia is a named substance under the Control of Major Accident Hazards Regulations (Northern Ireland) 2015 (50 tonnes lower tier, 200 tonnes upper tier), and so is ammonium nitrate, with thresholds that depend on its grade. EH40/2005, approved for use with COSHH (NI) 2003, sets limits for ammonia (25 ppm, 8-hour; 35 ppm, 15-minute) and nitrogen dioxide (0.5 ppm; 1 ppm). Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Nitrogen usually forms three bonds, as in ammonia, and also gives nitrates, nitrites and oxides. Under the explosives precursors Regulation, Regulation (EU) 2019/1148, which applies in NI, ammonium nitrate above 16% nitrogen cannot be sold to the general public, and calcium ammonium nitrate and sodium, potassium and calcium nitrates are reportable. Fertilisers fall under Regulation (EU) 2019/1009 alongside the domestic regime.</p><h3>Climate, carbon and the environment</h3><p>Making ammonia is energy-intensive, and fertiliser is one of the five goods in UK CBAM from 1 January 2027; ammonia and nitric acid production are UK ETS activities, the latter for nitrous oxide too. On farms, nitrogen is managed under the Nutrient Action Programme Regulations (Northern Ireland) 2019 (check DAERA for later regulations). Drinking water must not exceed 50 mg/l nitrate, and air must not exceed 40 µg/m³ nitrogen dioxide as an annual mean.</p><h3>Not yet verified</h3><p>The current Nutrient Action Programme regulations; ammonia emission ceilings under the National Emission Ceilings Regulations 2018.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2015/325/schedule/1" target="_blank" rel="noopener">Control of Major Accident Hazards Regulations (Northern Ireland) 2015, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1148/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1148 on explosives precursors, Annexes I and II (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2019/81/contents" target="_blank" rel="noopener">Nutrient Action Programme Regulations (Northern Ireland) 2019 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (Northern Ireland) 2017, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/188/schedule/2/made" target="_blank" rel="noopener">Air Quality Standards Regulations (Northern Ireland) 2010, Schedule 2 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2020/1265/schedule/2" target="_blank" rel="noopener">Greenhouse Gas Emissions Trading Scheme Order 2020, Schedule 2 (legislation.gov.uk)</a></li></ul>'
O:
  z: 8
  name: Oxygen
  html: <h3>Where it comes from</h3><p>Oxygen is separated from air by cooling and distillation, or by pressure-swing units on site. No specific licensing regime for making it was identified beyond pressure and major-hazard law. Industry uses it in steelmaking, welding and cutting, water treatment, fish farming and hospitals.</p><h3>Handling it</h3><p>Oxygen does not burn, but it makes everything else burn faster and hotter. Clothing, grease or oil in oxygen-enriched air can catch fire violently, so never use oxygen to "freshen" air in a confined space. Compressed oxygen is UN1072 and refrigerated liquid oxygen UN1073 under the Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (Northern Ireland) 2010. Oxygen is a named substance under the Control of Major Accident Hazards Regulations (Northern Ireland) 2015, with thresholds of 200 tonnes (lower tier) and 2,000 tonnes (upper tier). Ozone, a related form, has a 15-minute exposure limit of 0.2 ppm in EH40/2005. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Oxygen forms two bonds and combines with almost every element, giving oxides, water, carbonates, sulphates and the oxygen-containing groups in organic chemicals. Strong oxidisers such as hydrogen peroxide and chlorates are controlled under the explosives precursors Regulation, Regulation (EU) 2019/1148, which applies in NI.</p><h3>Climate, carbon and the environment</h3><p>Every tonne of carbon burnt takes oxygen from the air to make carbon dioxide, so oxygen is in every carbon account. High in the atmosphere, ozone shields the earth; substances that destroy it are controlled by Regulation (EU) 2024/590, which applies directly in NI. In rivers and lakes, low dissolved oxygen is a sign of nutrient pollution and is part of water body classification under the Water Framework Directive (Classification, Priority Substances and Shellfish Waters) Regulations (Northern Ireland) 2015.</p><h3>Not yet verified</h3><p>The dissolved-oxygen standards in the 2015 NI water classification regulations.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2015/325/schedule/1" target="_blank" rel="noopener">Control of Major Accident Hazards Regulations (Northern Ireland) 2015, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (Northern Ireland) 2010 (legislation.gov.uk)</a></li><li><a href="https://www.daera-ni.gov.uk/articles/ozone-depleting-substances-ods" target="_blank" rel="noopener">Ozone-depleting substances (DAERA)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2015/351/contents/made" target="_blank" rel="noopener">Water Framework Directive (Classification, Priority Substances and Shellfish Waters) Regulations (Northern Ireland) 2015 (legislation.gov.uk)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020 edition)</a></li></ul>
F:
  z: 9
  name: Fluorine
  html: <h3>Where it comes from</h3><p>Fluorine comes from fluorspar (calcium fluoride), which is mined and turned into hydrogen fluoride, the starting point for almost all fluorine chemicals. Fluorspar is a critical raw material under the Critical Raw Materials Act, Regulation (EU) 2024/1252 (Annex II), which applies in NI in part. Fluorine chemicals imported into NI at 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Fluorine gas and hydrogen fluoride are among the most dangerous industrial chemicals. Hydrofluoric acid burns may not hurt at first but can do deep and fatal harm, so sites using it need a specific first-aid plan. EH40/2005, approved for use with COSHH (NI) 2003, sets limits for fluorine (1 ppm), hydrogen fluoride (1.8 ppm, 8-hour; 3 ppm, 15-minute) and inorganic fluorides (2.5 mg/m³ as F). Fluorine is UN1045 and anhydrous hydrogen fluoride UN1052. Fluorine is a named substance under the Control of Major Accident Hazards Regulations (Northern Ireland) 2015 (10 tonnes lower tier, 20 tonnes upper tier). Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Fluorine forms one very strong bond, and the carbon-fluorine bond is one of the strongest in chemistry. That gives refrigerants, PTFE and the PFAS "forever chemicals". In NI, fluorinated gases are controlled by Regulation (EU) 2024/573, ozone-depleting substances by Regulation (EU) 2024/590, and PFOS, PFOA and PFHxS by the POPs Regulation, Regulation (EU) 2019/1021. Regulation (EU) 2024/2462 adds a REACH restriction on PFHxA and related substances.</p><h3>Climate, carbon and the environment</h3><p>Many fluorinated gases, such as HFCs and sulphur hexafluoride in electrical switchgear, are very strong greenhouse gases, and perfluorocarbons from primary aluminium smelting are UK ETS gases. PFAS persist in water and soil. Drinking water in NI must not exceed 1.5 mg/l fluoride under the Water Supply (Water Quality) Regulations (Northern Ireland) 2017.</p><h3>Not yet verified</h3><p>The REACH Annex XVII entry number and application dates for the PFHxA restriction; the current POPs Annex I list.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/573/oj" target="_blank" rel="noopener">Regulation (EU) 2024/573 on fluorinated greenhouse gases (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1021/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1021 on persistent organic pollutants (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/2462/oj" target="_blank" rel="noopener">Commission Regulation (EU) 2024/2462, PFHxA restriction (EUR-Lex, 19 September 2024)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2015/325/schedule/1" target="_blank" rel="noopener">Control of Major Accident Hazards Regulations (Northern Ireland) 2015, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020 edition)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (Northern Ireland) 2017, Schedule 1 (legislation.gov.uk)</a></li></ul>
Ne:
  z: 10
  name: Neon
  html: '<h3>Where it comes from</h3><p>Neon is a by-product of separating air in large air-separation plants; it is a tiny fraction of air and costly to recover. No specific licensing regime for producing it was identified beyond pressure and major-hazard law. Neon is not on the Critical Raw Materials Act lists, but its supply has been tight at times because a few plants produce most of it, and the chip industry relies on it for the lasers used to make semiconductors.</p><h3>Handling it</h3><p>Neon is not toxic and does not burn. Like other inert gases, it can push out oxygen in a closed space and cause asphyxiation without warning. Compressed neon is UN1065 under the Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (Northern Ireland) 2010, and cylinders fall under pressure systems law. The risk assessment under COSHH (NI) 2003 or the general workplace rules should cover oxygen depletion where cylinders are used or stored indoors. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Neon is a noble gas with a full outer shell. It forms no stable compounds, so no compound rules apply.</p><h3>Climate, carbon and the environment</h3><p>Neon is not a greenhouse gas or a pollutant. Its footprint is the electricity used in air separation, which is high for each tonne because so little neon is in air. Old neon signs are a waste issue for their glass and electrical parts, and some contain mercury: discarded signs and lamps should go through the WEEE route under the Waste Electrical and Electronic Equipment Regulations 2013.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (Northern Ireland) 2010 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013 (legislation.gov.uk)</a></li><li><a href="https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/2024-04/ERG2024-Eng-Web-a.pdf" target="_blank" rel="noopener">Emergency Response Guidebook 2024, UN number index (US Department of Transportation, 2024)</a></li></ul>'
Na:
  z: 11
  name: Sodium
  html: '<h3>Where it comes from</h3><p>Sodium comes from salt, found as rock salt and in seawater. NI has a real angle here: salt beds in the Triassic rocks of south-east County Antrim have been mined since the mid-19th century, and Kilroot, near Carrickfergus, is now the only working mine; its rock salt goes mainly to road de-icing. Rock salt is not on the Mineral Development Act (Northern Ireland) 1969 list of excepted common rocks, so it falls within the Act''s licensing regime, and mine safety falls under the Mines Act (Northern Ireland) 1969. Sodium metal is made by electrolysis of molten salt.</p><h3>Handling it</h3><p>Sodium metal reacts violently with water, giving hydrogen that can ignite; it is stored under oil and carried as UN1428. Most people meet sodium as compounds: caustic soda (sodium hydroxide, UN1823 as a solid) is strongly corrosive, with a 15-minute limit of 2 mg/m³ in EH40/2005, approved for use with COSHH (NI) 2003. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Sodium gives up one electron to form Na⁺ salts: chloride, hydroxide, carbonate, bicarbonate, hypochlorite (bleach) and nitrate. Under Regulation (EU) 2019/1148, which applies in NI, sodium chlorate and sodium perchlorate above 40% cannot be sold to the general public, and sodium nitrate is reportable.</p><h3>Climate, carbon and the environment</h3><p>Making soda ash (sodium carbonate) and sodium bicarbonate is a UK ETS activity because it releases carbon dioxide. Road salt can raise chloride in streams and groundwater. Drinking water in NI must not exceed 200 mg/l sodium under the Water Supply (Water Quality) Regulations (Northern Ireland) 2017. Sodium-ion batteries fall under the Batteries Regulation, Regulation (EU) 2023/1542.</p><h3>Not yet verified</h3><p>Whether the Department for the Economy currently holds a mining licence for Kilroot.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/apni/1969/35/contents" target="_blank" rel="noopener">Mineral Development Act (Northern Ireland) 1969 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1148/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1148 on explosives precursors, Annexes I and II (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (Northern Ireland) 2017, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2020/1265/schedule/2" target="_blank" rel="noopener">Greenhouse Gas Emissions Trading Scheme Order 2020, Schedule 2 (legislation.gov.uk)</a></li><li><a href="https://earthwise.bgs.ac.uk/index.php/Bulk_minerals,_mineral_resources,_Northern_Ireland" target="_blank" rel="noopener">Bulk minerals, mineral resources, Northern Ireland (BGS Earthwise)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020 edition)</a></li></ul>'
Mg:
  z: 12
  name: Magnesium
  html: '<h3>Where it comes from</h3><p>Magnesium is made from dolomite, magnesite or seawater and brines, mostly by energy-intensive thermal reduction, with production concentrated in very few countries. Magnesium is a critical raw material and magnesium metal a strategic one under the Critical Raw Materials Act, Regulation (EU) 2024/1252, which applies in NI in part. Dolomitic limestone near Belcoo, County Fermanagh, is worked on a small scale for agriculture; as limestone it is a common rock excepted from the Mineral Development Act (Northern Ireland) 1969, and quarry safety falls under the Quarries Regulations (Northern Ireland) 2006.</p><h3>Handling it</h3><p>Solid magnesium is safe to handle, but fine powder, swarf and turnings can ignite and burn very hot, and water makes a magnesium fire worse. Machining shops need a DSEAR (NI) 2003 assessment for dust and the right fire extinguisher. Magnesium powder is carried as UN1418. Magnesium oxide has 8-hour limits of 10 mg/m³ (inhalable) and 4 mg/m³ (respirable) in EH40/2005, approved for use with COSHH (NI) 2003. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Magnesium gives up two electrons to form Mg²⁺: the oxide, hydroxide, carbonate, sulphate (Epsom salt) and chloride. It is a plant nutrient, found in fertilisers and agricultural lime. Under Regulation (EU) 2019/1148, which applies in NI, magnesium powders (particles below 200 µm, or 70% or more magnesium) and magnesium nitrate hexahydrate are reportable explosives precursors.</p><h3>Climate, carbon and the environment</h3><p>Primary magnesium has a high carbon footprint because of the heat and reductants used to make it. Production or processing of non-ferrous metals on a site with combustion units above 20 MW is a UK ETS activity. Light magnesium alloys cut vehicle weight. Magnesium is not one of the UK CBAM goods.</p><h3>Not yet verified</h3><p>The CLP harmonised classification codes for magnesium powder.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1148/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1148 on explosives precursors, Annex II (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020 edition)</a></li><li><a href="https://earthwise.bgs.ac.uk/index.php/Bulk_minerals,_mineral_resources,_Northern_Ireland" target="_blank" rel="noopener">Bulk minerals, mineral resources, Northern Ireland (BGS Earthwise)</a></li></ul>'
Al:
  z: 13
  name: Aluminium
  html: '<h3>Where it comes from</h3><p>Aluminium is refined from bauxite to alumina, then smelted by electrolysis, which uses a great deal of electricity. NI has a real history here: bauxite formed by weathering of the Antrim basalts was mined with iron ore until about 1934 and again in the Second World War, when 244,000 tonnes were extracted, but it could not compete with imports. Bauxite, alumina and aluminium are strategic and critical raw materials under the Critical Raw Materials Act, Regulation (EU) 2024/1252, which applies in NI in part.</p><h3>Handling it</h3><p>Solid aluminium is low hazard. Fine powder and dust can explode or catch fire, so dust from grinding and polishing needs a DSEAR (NI) 2003 assessment. Aluminium powder is carried as UN1309 (coated) or UN1396 (uncoated). Aluminium metal and oxides have 8-hour limits of 10 mg/m³ (inhalable) and 4 mg/m³ (respirable) in EH40/2005, approved for use with COSHH (NI) 2003. Molten metal and water explode on contact. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Aluminium gives up three electrons to form Al³⁺, most often as the oxide, which forms a thin protective skin on the metal. Aluminium sulphate and similar salts are used to treat drinking water. Under Regulation (EU) 2019/1148, which applies in NI, aluminium powders (particles below 200 µm, or 70% or more aluminium) are reportable explosives precursors.</p><h3>Climate, carbon and the environment</h3><p>Primary aluminium is a UK ETS activity for carbon dioxide and perfluorocarbons, and aluminium is one of the five goods in UK CBAM from 1 January 2027. Whether a product is caught depends on its commodity code: a customs specialist is needed. EU CBAM does not apply in NI. Recycled aluminium needs far less energy than primary metal. Most of the Packaging and Packaging Waste Regulation, Regulation (EU) 2025/40, applies in NI. Drinking water in NI must not exceed 200 µg/l aluminium.</p><h3>Not yet verified</h3><p>The current UK packaging extended producer responsibility instrument and its NI extent.</p><h3>Sources</h3><ul><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2020/1265/schedule/2" target="_blank" rel="noopener">Greenhouse Gas Emissions Trading Scheme Order 2020, Schedule 2 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1148/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1148 on explosives precursors, Annex II (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (Northern Ireland) 2017, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://earthwise.bgs.ac.uk/index.php/Bulk_minerals,_mineral_resources,_Northern_Ireland" target="_blank" rel="noopener">Bulk minerals, mineral resources, Northern Ireland (BGS Earthwise)</a></li></ul>'
Si:
  z: 14
  name: Silicon
  html: <h3>Where it comes from</h3><p>Silicon is the second most common element in the earth's crust, found in sand, sandstone and almost all rocks. Silicon metal is made by smelting quartz with carbon in electric furnaces. Silicon metal is a strategic and critical raw material under the Critical Raw Materials Act, Regulation (EU) 2024/1252, which applies in NI in part. In NI, sand, gravel and common rocks are excepted from the Mineral Development Act (Northern Ireland) 1969, so they are controlled through planning and quarry safety instead. Lough Neagh sand dredging received planning approval from the Department for Infrastructure, announced on 1 October 2020, subject to conditions and a planning agreement; the lough is a Special Protection Area and Ramsar site.</p><h3>Handling it</h3><p>The main hazard is respirable crystalline silica from cutting, drilling, crushing and blasting stone, concrete and engineered stone. It causes silicosis and lung cancer. EH40/2005, approved for use with COSHH (NI) 2003, sets a limit of 0.1 mg/m³ (8-hour) and marks it as a carcinogen where a work process generates it. Quarries also fall under the Quarries Regulations (Northern Ireland) 2006. Amorphous silicon powder is carried as UN1346. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Silicon forms four bonds, usually to oxygen, giving silica and silicates (glass, cement, clays). Silicones are silicon-oxygen chains with carbon groups, used in sealants, lubricants and cosmetics. Certain cyclic siloxanes are restricted under REACH Annex XVII, which applies in NI.</p><h3>Climate, carbon and the environment</h3><p>Silicon smelting uses a great deal of electricity. Silicon is the basis of solar panels and electronics, which become waste under the WEEE Regulations 2013. Glass and ceramics are not in UK CBAM scope.</p><h3>Not yet verified</h3><p>The Annex XVII entry number and scope of the cyclic siloxane (D4, D5, D6) restriction.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2006/205/contents/made" target="_blank" rel="noopener">Quarries Regulations (Northern Ireland) 2006 (legislation.gov.uk)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020 edition)</a></li><li><a href="https://www.legislation.gov.uk/apni/1969/35/contents" target="_blank" rel="noopener">Mineral Development Act (Northern Ireland) 1969 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://www.infrastructure-ni.gov.uk/news/mallon-announces-planning-approval-lough-neagh-sand-extraction" target="_blank" rel="noopener">Mallon announces planning approval for Lough Neagh sand extraction (Department for Infrastructure, 1 October 2020)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013 (legislation.gov.uk)</a></li></ul>
P:
  z: 15
  name: Phosphorus
  html: <h3>Where it comes from</h3><p>Phosphorus comes from phosphate rock, mined abroad. None is mined in Northern Ireland. The EU Critical Raw Materials Act (Regulation (EU) 2024/1252) lists both phosphate rock and phosphorus as critical raw materials (Annex II). It applies in NI only in part, and NI is outside the EU's strategic-project and stockpiling machinery. Anyone importing phosphorus chemicals into NI at 1 tonne or more a year needs an EU REACH registration; a GB registration does not count.</p><h3>Handling it</h3><p>White phosphorus is the dangerous form. Its harmonised CLP classification is Pyr. Sol. 1 (catches fire in air), Acute Tox. 2 (fatal if swallowed or inhaled), Skin Corr. 1A and Aquatic Acute 1. Red phosphorus is a flammable solid (Flam. Sol. 1). Under COSHH (NI) 2003, EH40/2005 sets limits for yellow phosphorus of 0.1 mg/m³ (8 hours) and 0.3 mg/m³ (15 minutes). For transport, white or yellow phosphorus is UN 1381 and red (amorphous) phosphorus is UN 1338. Phosphine, the gas used in grain fumigation, is a named COMAH substance (0.2 tonnes lower tier, 1 tonne upper tier). Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Phosphorus usually bonds to oxygen, as phosphate (PO₄³⁻) in fertilisers, bones and detergents. It also forms chlorides and organophosphorus pesticides. Some phosphorus chlorides are precursors listed under the Chemical Weapons Convention, which the Chemical Weapons Act 1996 enforces, including in NI. For CE-marked phosphate fertilisers, the Fertilising Products Regulation (EU) 2019/1009 caps cadmium at 60 mg/kg P₂O₅. Mixed NPK fertilisers appear on the UK CBAM goods list from 1 January 2027, but whether a product is caught turns on its commodity code. A customs specialist is needed.</p><h3>Climate, carbon and the environment</h3><p>Phosphorus is NI's main freshwater problem. Surplus phosphorus from slurry, chemical fertiliser and wastewater feeds algal blooms; DAERA published its Lough Neagh Report and Action Plan in July 2024. Farm use is controlled by the Nutrient Action Programme Regulations (NI) 2019, and river and lake standards sit under the Water Framework Directive (Classification, Priority Substances and Shellfish Waters) Regulations (NI) 2015.</p><h3>Not yet verified</h3><p>The specific CWC schedule entries for phosphorus chlorides; whether NAP 2019 has been replaced by a later programme.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2008/1272/oj" target="_blank" rel="noopener">Regulation (EC) No 1272/2008 (CLP), Annex VI (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2015/325/schedule/1/made" target="_blank" rel="noopener">Control of Major Accident Hazards Regulations (NI) 2015, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1009/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1009, Fertilising Products (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2019/81/contents" target="_blank" rel="noopener">Nutrient Action Programme Regulations (NI) 2019 (legislation.gov.uk)</a></li><li><a href="https://www.daera-ni.gov.uk/publications/lough-neagh-report-and-action-plan" target="_blank" rel="noopener">Lough Neagh Report and Action Plan (DAERA, July 2024)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li></ul>
S:
  z: 16
  name: Sulfur
  html: '<h3>Where it comes from</h3><p>Most sulfur is now recovered, not mined: it is stripped out of natural gas and crude oil during refining, and some comes from smelter gases. Most is turned into sulfuric acid. NI has no sulfur production; it is imported as sulfur, sulfuric acid, sulfate fertilisers and chemicals. Imports into NI of 1 tonne or more a year need an EU REACH registration.</p><h3>Handling it</h3><p>Solid sulfur burns and its dust can form explosive atmospheres, so DSEAR (NI) 2003 applies to milling and storage. For transport, sulfur is UN 1350 and molten sulfur UN 2448. The compounds are the bigger risk. Sulfur dioxide (UN 1079) is classified Acute Tox. 3 (toxic if inhaled) and Skin Corr. 1B; EH40/2005 sets 0.5 ppm (8 hours) and 1 ppm (15 minutes). Sulfuric acid (UN 1830) is Skin Corr. 1A, with a mist limit of 0.05 mg/m³. Hydrogen sulfide is a named COMAH substance (5 and 20 tonnes) and, on NI farms, the gas that makes slurry mixing deadly. Sulfur trioxide (15 and 75 tonnes) and sulfur dichloride (1 tonne upper tier) are also named. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Sulfur sits with oxygen in the periodic table and takes several oxidation states: sulfide (−2) in hydrogen sulfide and metal ores, and +4 and +6 in sulfur dioxide, sulfites, sulfuric acid and sulfates. Sulfuric acid is a restricted explosives precursor under Regulation (EU) 2019/1148: the public may not buy it above 15% unless licensed, and never above 40%. Sulfur hexafluoride, used in electrical switchgear, is a fluorinated greenhouse gas under the F-gas Regulation (EU) 2024/573, which applies in NI.</p><h3>Climate, carbon and the environment</h3><p>Burning sulfur-bearing fuels makes sulfur dioxide, which causes acid rain and harms lungs. It is controlled by the Air Quality Standards Regulations (NI) 2010 and the National Emission Ceilings Regulations 2018. Sulfur hexafluoride is the most potent greenhouse gas in common use, so leaks from switchgear matter in any carbon inventory.</p><h3>Not yet verified</h3><p>The harmonised CLP entry for elemental sulfur; the SF₆ global warming potential and switchgear phase-out dates.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2015/325/schedule/1/made" target="_blank" rel="noopener">Control of Major Accident Hazards Regulations (NI) 2015, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits, approved for COSHH (NI) (HSENI, 2020)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1148/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1148 on explosives precursors (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/573/oj" target="_blank" rel="noopener">Regulation (EU) 2024/573 on fluorinated greenhouse gases (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/188/contents/made" target="_blank" rel="noopener">Air Quality Standards Regulations (NI) 2010 (legislation.gov.uk)</a></li><li><a href="https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/2024-04/ERG2024-Eng-Web-a.pdf" target="_blank" rel="noopener">Emergency Response Guidebook, ID index (US DOT PHMSA, 2024)</a></li></ul>'
Cl:
  z: 17
  name: Chlorine
  html: '<h3>Where it comes from</h3><p>Chlorine is made by passing electricity through brine (salt water) in chlor-alkali plants, which also make sodium hydroxide. NI has the raw material: rock salt in the Triassic beds of south-east Antrim, worked today only at the Kilroot mine near Carrickfergus, mainly for road salt. Salt is not on the list of common rocks excepted by Schedule 1 to the Mineral Development Act (NI) 1969, so it is a vested mineral worked under a Department for the Economy licence. Chlorine itself is imported into NI as gas or in compounds; imports of 1 tonne or more a year need an EU REACH registration.</p><h3>Handling it</h3><p>Chlorine is a heavy, toxic, oxidising gas. Its harmonised CLP classification is Ox. Gas 1, Press. Gas, Acute Tox. 3 (toxic if inhaled), Skin Irrit. 2, Eye Irrit. 2, STOT SE 3 and Aquatic Acute 1. EH40/2005 sets a 15-minute limit of 0.5 ppm. It travels as UN 1017. It is a named COMAH substance: 10 tonnes for lower tier and 25 tonnes for upper tier; weak sodium hypochlorite mixtures are named separately (200 and 500 tonnes). Never mix hypochlorite bleach with acids. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Chlorine takes one electron to form chloride, as in table salt, or shares one in covalent compounds such as PVC, solvents and pesticides. Many organochlorines are controlled. Older pesticides and PCBs are persistent organic pollutants under Regulation (EU) 2019/1021. CFCs and HCFCs are ozone-depleting substances under Regulation (EU) 2024/590, which applies directly in NI. Several chlorinated solvents are restricted in REACH Annex XVII. Phosgene and some sulfur and phosphorus chlorides are chemical weapons precursors covered by the Chemical Weapons Act 1996.</p><h3>Climate, carbon and the environment</h3><p>Chlor-alkali electrolysis uses a great deal of electricity, so the carbon cost of chlorine follows the grid. Chlorine disinfects most public drinking water; quality is set by the Water Supply (Water Quality) Regulations (NI) 2017. Road salt and effluent raise chloride in rivers and groundwater.</p><h3>Not yet verified</h3><p>The Annex XVII entry numbers for chlorinated solvents; the drinking-water values for chlorination by-products; the Kilroot licence details.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2008/1272/oj" target="_blank" rel="noopener">Regulation (EC) No 1272/2008 (CLP), Annex VI (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2015/325/schedule/1/made" target="_blank" rel="noopener">Control of Major Accident Hazards Regulations (NI) 2015, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/apni/1969/35/contents" target="_blank" rel="noopener">Mineral Development Act (NI) 1969 (legislation.gov.uk)</a></li><li><a href="https://earthwise.bgs.ac.uk/index.php/Bulk_minerals,_mineral_resources,_Northern_Ireland" target="_blank" rel="noopener">Bulk minerals, mineral resources, Northern Ireland (BGS Earthwise)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/590/oj" target="_blank" rel="noopener">Regulation (EU) 2024/590 on ozone-depleting substances (EUR-Lex)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020)</a></li></ul>'
Ar:
  z: 18
  name: Argon
  html: '<h3>Where it comes from</h3><p>Argon makes up about 1% of air. It is made in air separation plants, which cool air until it liquefies and then distil off nitrogen, oxygen and argon. No specific licensing regime for producing argon has been identified; the plant is regulated through pressure, workplace and major-hazard law. Argon reaches NI users in cylinders and as a cryogenic liquid in bulk tanks, supplied by the industrial gas companies. NI engineering firms use it in welding, metal fabrication and food packaging.</p><h3>Handling it</h3><p>Argon is not toxic and does not burn. The danger is suffocation: it is heavier than air, collects in pits, tanks and enclosed rooms, and displaces oxygen without any warning smell. Leaks of liquid argon also cause severe cold burns. Suppliers classify cylinders as gases under pressure. For transport, compressed argon is UN 1006 and refrigerated liquid argon is UN 1951. Cylinder and bulk tank installations come under the pressure systems rules, and enclosed spaces need oxygen monitoring and a safe system of work. Argon has no workplace exposure limit in EH40/2005, because the risk is lack of oxygen, not toxicity. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Argon is a noble gas with a full outer shell of electrons, so it forms no stable compounds under ordinary conditions. That inertness is why welders and steelmakers use it to shield molten metal from air. No compound rules apply.</p><h3>Climate, carbon and the environment</h3><p>Argon has no direct climate effect and is not a pollutant. Its carbon cost is the electricity used by air separation plants, which counts as a Scope 3 emission for users in a carbon inventory. Empty cylinders go back to the supplier.</p><h3>Not yet verified</h3><p>The Pressure Systems Safety Regulations (NI) 2004 SR number; any NI confined-spaces instrument number.</p><h3>Sources</h3><ul><li><a href="https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/2024-04/ERG2024-Eng-Web-a.pdf" target="_blank" rel="noopener">Emergency Response Guidebook, ID index (US DOT PHMSA, 2024)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (NI) 2010 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020)</a></li></ul>'
K:
  z: 19
  name: Potassium
  html: '<h3>Where it comes from</h3><p>Potassium comes from potash, mainly potassium chloride, mined from ancient evaporite beds or extracted from brines abroad. Potassium metal is made by reducing the molten chloride and is a laboratory and specialist chemical. NI has no potash production; potash fertiliser and potassium chemicals are imported. Imports into NI of 1 tonne or more a year need an EU REACH registration.</p><h3>Handling it</h3><p>Potassium metal reacts violently with water, giving off hydrogen that can ignite. Its harmonised CLP classification is Water-react. 1 and Skin Corr. 1B. It is stored under oil and travels as UN 2257. Potassium hydroxide (caustic potash, UN 1813) is Skin Corr. 1A and Acute Tox. 4, with a 15-minute limit of 2 mg/m³ in EH40/2005, applied under COSHH (NI) 2003. Potassium nitrate is a named COMAH substance, with thresholds that depend on the grade. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Potassium gives up one electron to form the K⁺ ion, so its compounds are salts: chloride, sulfate, nitrate, hydroxide and carbonate. Several are controlled as explosives precursors under Regulation (EU) 2019/1148, as implemented in NI with licences from the Secretary of State for Northern Ireland. Potassium chlorate and potassium perchlorate are restricted above 40%, with no licence available. Potassium nitrate is reportable: suspicious transactions, disappearances and thefts must be reported. Nitrates of potassium and mixed NPK fertilisers appear on the UK CBAM goods list from 1 January 2027, but scope turns on the commodity code. A customs specialist is needed.</p><h3>Climate, carbon and the environment</h3><p>Potassium is an essential plant nutrient and is not itself a pollutant of concern. Mining, processing and shipping potash carry a carbon cost that belongs in Scope 3 for farms and food processors. Slurry and manure supply much of the potassium on NI grassland, so nutrient planning reduces bought fertiliser. Potassium has a natural radioactive isotope, potassium-40, but at levels that need no radiation controls in ordinary use.</p><h3>Not yet verified</h3><p>The COMAH notes on grades of potassium nitrate (thresholds stated only as "depend on the grade").</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2008/1272/oj" target="_blank" rel="noopener">Regulation (EC) No 1272/2008 (CLP), Annex VI (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1148/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1148 on explosives precursors (EUR-Lex)</a></li><li><a href="https://www.gov.uk/guidance/marketing-and-use-of-explosives-precursors-in-northern-ireland" target="_blank" rel="noopener">Marketing and use of explosives precursors in Northern Ireland (GOV.UK, updated 15 September 2026)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2015/325/schedule/1/made" target="_blank" rel="noopener">Control of Major Accident Hazards Regulations (NI) 2015, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li></ul>'
Ca:
  z: 20
  name: Calcium
  html: <h3>Where it comes from</h3><p>Calcium is everywhere in limestone and chalk, and NI has plenty. Antrim's Ulster White Limestone (chalk) is quarried, for example at Glenarm, for agricultural lime, fillers and whiteners. Limestone and chalk are on the list of common rocks in Schedule 1 to the Mineral Development Act (NI) 1969, so they are not vested minerals; quarrying needs planning permission, and the Quarries Regulations (NI) 2006 apply. Calcium metal is a specialist chemical made by reducing lime and is imported.</p><h3>Handling it</h3><p>Calcium metal reacts with water to release flammable hydrogen; its harmonised CLP classification is Water-react. 2, and it travels as UN 1401. Lime is the form most people meet. Quicklime (calcium oxide) heats up on contact with water and burns skin and eyes. EH40/2005 limits are 2 mg/m³ inhalable and 1 mg/m³ respirable for calcium oxide, and 5 and 1 mg/m³ for calcium hydroxide. Wet cement is alkaline and causes cement burns and dermatitis. Quarry dust is controlled under COSHH (NI) 2003. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Calcium gives up two electrons to form the Ca²⁺ ion, found in carbonate (limestone), oxide (quicklime), hydroxide (slaked lime), sulfate (gypsum) and phosphate (bone). REACH Annex XVII entry 47 limits hexavalent chromium in cement, to protect against allergic dermatitis. Calcium nitrate and calcium ammonium nitrate are reportable explosives precursors under Regulation (EU) 2019/1148.</p><h3>Climate, carbon and the environment</h3><p>Calcium is at the heart of a major carbon source. Heating limestone to make lime or cement clinker drives off carbon dioxide from the rock itself, on top of the fuel burned. Cement and lime making fall within the UK ETS. Cement, including cement clinker, is one of the five UK CBAM sectors from 1 January 2027, covering carbon dioxide. Any NI firm importing cement must check its commodity codes. A customs specialist is needed. Spreading agricultural lime also releases carbon dioxide, which farm carbon tools count.</p><h3>Not yet verified</h3><p>The UK ETS Order schedule wording for lime production; the chromium(VI) limit figure for cement.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/apni/1969/35/contents" target="_blank" rel="noopener">Mineral Development Act (NI) 1969, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://earthwise.bgs.ac.uk/index.php/Bulk_minerals,_mineral_resources,_Northern_Ireland" target="_blank" rel="noopener">Bulk minerals, mineral resources, Northern Ireland (BGS Earthwise)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2020/1265/contents/made" target="_blank" rel="noopener">Greenhouse Gas Emissions Trading Scheme Order 2020 (legislation.gov.uk)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1148/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1148 on explosives precursors (EUR-Lex)</a></li></ul>
Sc:
  z: 21
  name: Scandium
  html: <h3>Where it comes from</h3><p>Scandium is scarce in commerce. It is not mined on its own but recovered in small amounts as a by-product of processing titanium, uranium, nickel laterite and rare-earth ores, almost all outside Europe. It is used in aluminium-scandium alloys for aerospace and sports equipment, and in solid oxide fuel cells. The EU Critical Raw Materials Act (Regulation (EU) 2024/1252) lists scandium as a critical raw material (Annex II). The Act applies in NI only in part, and NI is outside its strategic-project and stockpiling machinery. Most NI businesses will meet scandium only inside alloys or components.</p><h3>Handling it</h3><p>Scandium metal is not radioactive. Fine powders can burn, so DSEAR (NI) 2003 applies where dust is handled. No harmonised CLP classification was found for the metal; rely on the supplier's classification. Work from the supplier's safety data sheet, under COSHH (NI) 2003.</p><h3>How it forms compounds</h3><p>Scandium almost always takes a +3 charge, forming the oxide Sc₂O₃ and salts such as the chloride and nitrate. No REACH Annex XVII restriction or other product rule specific to scandium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Scandium has no direct climate role. Recovery from low-grade residues is energy and chemical intensive, so its carbon footprint per kilogram is high, though the amounts used are tiny. Scrap alloys go through normal metal recycling.</p><h3>Not yet verified</h3><p>The absence of any harmonised CLP entry for scandium.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex II (EUR-Lex)</a></li><li><a href="https://assets.publishing.service.gov.uk/media/680ba70911d566056bcae8ef/JC_decision_2.2025_clean_for_signature_UK_EU.docx.pdf" target="_blank" rel="noopener">Joint Committee Decision No 2/2025 (GOV.UK, 29 April 2025)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (NI) 2003 (legislation.gov.uk)</a></li></ul>
Ti:
  z: 22
  name: Titanium
  html: <h3>Where it comes from</h3><p>Titanium comes from the minerals ilmenite and rutile, mined from beach sands and hard rock abroad. Most becomes titanium dioxide pigment; a smaller share is turned into titanium metal through titanium tetrachloride. The EU Critical Raw Materials Act (Regulation (EU) 2024/1252) lists titanium metal as both strategic (Annex I) and critical (Annex II). It applies in NI only in part. NI firms buy titanium as pigment in paints and plastics, and as metal for aerospace, medical and marine parts. Imports of 1 tonne or more a year need an EU REACH registration.</p><h3>Handling it</h3><p>Solid titanium is harmless, but fine powder and machining swarf can burn fiercely and form explosive dust clouds, so DSEAR (NI) 2003 applies. Dry titanium powder travels as UN 2546; powder wetted with at least 25% water is UN 1352. EH40/2005 sets limits for titanium dioxide of 10 mg/m³ inhalable and 4 mg/m³ respirable. The EU classification of titanium dioxide powder as a suspected carcinogen by inhalation was annulled by the General Court in 2022, and the Court of Justice upheld that ruling on 1 August 2025. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Titanium usually takes a +4 charge. Titanium dioxide is a stable white solid; titanium tetrachloride is a fuming liquid that reacts with moist air to give hydrochloric acid. In the published UK CBAM goods list, ferro-titanium is among the items carved out of the chapter 72 iron and steel entry. Classification of any alloy or product is a commodity-code question. A customs specialist is needed.</p><h3>Climate, carbon and the environment</h3><p>Making titanium metal is energy intensive, so recycled titanium scrap carries a much lower carbon footprint. Pigment plants produce acid and iron-rich wastes. Titanium dioxide is not covered by a drinking-water or air quality standard in NI.</p><h3>Not yet verified</h3><p>The current status of titanium dioxide (E 171) as a food additive in NI.</p><h3>Sources</h3><ul><li><a href="https://curia.europa.eu/jcms/upload/docs/application/pdf/2025-08/cp250099en.pdf" target="_blank" rel="noopener">Court of Justice press release, Joined Cases C-71/23 P and C-82/23 P (CURIA, 1 August 2025)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (NI) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li><li><a href="https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/2024-04/ERG2024-Eng-Web-a.pdf" target="_blank" rel="noopener">Emergency Response Guidebook, ID index (US DOT PHMSA, 2024)</a></li></ul>
V:
  z: 23
  name: Vanadium
  html: <h3>Where it comes from</h3><p>Vanadium is mostly recovered from slag made when iron is smelted from vanadium-bearing magnetite ores abroad, and from spent catalysts and oil residues. Most goes into steel as ferro-vanadium, to make it stronger. The EU Critical Raw Materials Act (Regulation (EU) 2024/1252) lists vanadium as a critical raw material (Annex II); it applies in NI only in part. There is no NI production. Imports of vanadium chemicals into NI of 1 tonne or more a year need an EU REACH registration.</p><h3>Handling it</h3><p>Vanadium pentoxide is the compound that matters. Commission Delegated Regulation (EU) 2022/692 reclassified it, from 23 November 2023, as Carc. 1B (may cause cancer), Muta. 2, Repr. 2, Lact. (may harm breast-fed children), Acute Tox. 2 by inhalation, Acute Tox. 3 if swallowed, STOT RE 1 and Aquatic Chronic 2. Because it is now a carcinogen, COSHH (NI) 2003 requires exposure to be kept as low as reasonably practicable, not just below the EH40/2005 limit of 0.05 mg/m³. It travels as UN 2862. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Vanadium takes several charges, from +2 to +5, which is why its solutions change colour and why it works as a catalyst, for example in making sulfuric acid. Vanadium redox flow batteries store grid energy using these states; they fall under the Batteries Regulation (EU) 2023/1542, which applies in NI. In the published UK CBAM goods list, ferro-vanadium is among the items carved out of the chapter 72 iron and steel entry. Product classification is a commodity-code question. A customs specialist is needed.</p><h3>Climate, carbon and the environment</h3><p>Vanadium helps make lighter, stronger steel, which can cut steel use. Burning heavy fuel oil releases vanadium to air. Spent vanadium catalysts are usually hazardous waste under the Hazardous Waste Regulations (NI) 2005.</p><h3>Not yet verified</h3><p>The waste classification codes for spent vanadium catalysts.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg_del/2022/692/oj" target="_blank" rel="noopener">Commission Delegated Regulation (EU) 2022/692 (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2023/1542/oj" target="_blank" rel="noopener">Regulation (EU) 2023/1542 on batteries (EUR-Lex)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li></ul>
Cr:
  z: 24
  name: Chromium
  html: <h3>Where it comes from</h3><p>Chromium comes from chromite ore, mined abroad and smelted into ferro-chromium for stainless steel, or processed into chromium chemicals for plating, pigments and leather tanning. There is no NI production. Imports of chromium chemicals of 1 tonne or more a year need an EU REACH registration, and several hexavalent chromium compounds also need REACH authorisation for most uses.</p><h3>Handling it</h3><p>The hazard depends on the form. Chromium metal and trivalent chromium are of low toxicity; EH40/2005 sets 0.5 mg/m³ for the metal. Hexavalent chromium, chromium(VI), is a different matter. Chromium trioxide is classified Carc. 1A (known human carcinogen), Muta. 1B, Ox. Sol. 1, Skin Corr. 1A, and a respiratory and skin sensitiser. EH40/2005 sets 0.01 mg/m³ for chromium(VI) compounds, with 0.025 mg/m³ for process-generated fume, such as from welding stainless steel. As carcinogens, exposure must be kept as low as reasonably practicable under COSHH (NI) 2003. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Chromium is usually +3, the stable form found in alloys and nutrition, or +6, as chromate and dichromate, which are strong oxidisers and carcinogens. Chromium(VI) is restricted in several ways. REACH Annex XVII entry 47 limits it in cement and in leather that touches the skin (3 mg/kg dry weight). RoHS (Directive 2011/65/EU) restricts it in electrical and electronic equipment, and the PPWR limits it in packaging. In the UK CBAM goods list, ferro-chromium falls within chapter 72 unless carved out. Product classification is a commodity-code question. A customs specialist is needed.</p><h3>Climate, carbon and the environment</h3><p>Ferro-chromium smelting is electricity intensive. Chromium plating effluent and tannery waste can pollute water. The Water Supply (Water Quality) Regulations (NI) 2017 set 50 µg/l for chromium in drinking water. Plating sludges are usually hazardous waste under the Hazardous Waste Regulations (NI) 2005.</p><h3>Not yet verified</h3><p>The current REACH Annex XIV list and sunset dates for chromium(VI) compounds; the Annex XVII cement limit figure; whether ferro-chromium codes are in UK CBAM scope.</p><h3>Sources</h3><ul><li><a href="https://legislation.gov.uk/eur/2014/301/data.pdf" target="_blank" rel="noopener">Commission Regulation (EU) No 301/2014, amending REACH Annex XVII entry 47 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2008/1272/oj" target="_blank" rel="noopener">Regulation (EC) No 1272/2008 (CLP), Annex VI (EUR-Lex)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (NI) 2017, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/dir/2011/65/oj" target="_blank" rel="noopener">Directive 2011/65/EU (RoHS) (EUR-Lex)</a></li></ul>
Mn:
  z: 25
  name: Manganese
  html: <h3>Where it comes from</h3><p>Manganese ore is mined abroad and smelted into ferro-manganese and silico-manganese for steelmaking, which takes most of it. Purer manganese chemicals go into batteries, fertilisers and animal feed. The EU Critical Raw Materials Act (Regulation (EU) 2024/1252) lists manganese as critical and battery-grade manganese as strategic; it applies in NI only in part. There is no NI production. Imports of manganese chemicals of 1 tonne or more a year need an EU REACH registration.</p><h3>Handling it</h3><p>The main workplace risk is fume and dust. Manganese in welding fume and fine dust, breathed over years, can damage the nervous system, with symptoms like Parkinson's disease. EH40/2005 sets limits for manganese and its inorganic compounds of 0.2 mg/m³ inhalable and 0.05 mg/m³ respirable, applied under COSHH (NI) 2003. Welding in fabrication shops needs effective fume extraction. Manganese dioxide is classified Acute Tox. 4 (harmful if swallowed or inhaled). Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Manganese takes charges from +2 to +7. Manganese dioxide (+4) is used in alkaline and other batteries; potassium permanganate (+7) is a strong oxidiser used in water treatment. Batteries containing manganese fall under the Batteries Regulation (EU) 2023/1542. In the published UK CBAM goods list, ferro-silico-manganese is among the items carved out of the chapter 72 iron and steel entry, while ferro-manganese is not named. Product classification is a commodity-code question. A customs specialist is needed.</p><h3>Climate, carbon and the environment</h3><p>Manganese alloy smelting is electricity and coke intensive, so it adds to the embedded carbon of steel. Manganese dissolves out of soils and peat into water, staining supplies black. The Water Supply (Water Quality) Regulations (NI) 2017 set 50 µg/l for manganese in drinking water, a national standard. Spent batteries go through battery collection, not general waste.</p><h3>Not yet verified</h3><p>Whether the manganese dioxide classification has been updated by a later CLP adaptation.</p><h3>Sources</h3><ul><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (NI) 2017, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2023/1542/oj" target="_blank" rel="noopener">Regulation (EU) 2023/1542 on batteries (EUR-Lex)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li></ul>
Fe:
  z: 26
  name: Iron
  html: '<h3>Where it comes from</h3><p>Iron is smelted from iron ore in blast furnaces or made from scrap and direct-reduced iron in electric furnaces. NI has history here. Iron ore formed by weathering of the Antrim basalts was mined in County Antrim from at least the 18th century until the 1920s, around Parkmore, Glenravel, Glenariff and Lyle''s Hill, with about 5 million tonnes taken out. The deposits are no longer economic. Ironstone is not on the Schedule 1 list of common rocks, so any new working would need a Department for the Economy mineral licence under the Mineral Development Act (NI) 1969. Today NI imports its steel and recycles a great deal of scrap.</p><h3>Handling it</h3><p>Solid iron and steel are not classified as hazardous. Fine iron powder can burn and form explosive dust, so DSEAR (NI) 2003 applies to powder handling. Cutting and welding make iron oxide fume: EH40/2005 sets 5 mg/m³ (8 hours) and 10 mg/m³ (15 minutes). Welding fume as a whole is a carcinogen risk, so controls should go beyond the iron limit. Work from the supplier''s safety data sheet, under COSHH (NI) 2003.</p><h3>How it forms compounds</h3><p>Iron is usually +2 (ferrous) or +3 (ferric). It forms oxides (rust, pigments), sulfate (moss killer, feed supplement) and chloride (water and sewage treatment). Ferric salts are corrosive in concentrated form.</p><h3>Climate, carbon and the environment</h3><p>Steel is one of the largest industrial carbon sources, and iron and steel is a UK CBAM sector from 1 January 2027. The scope covers most of customs chapter 72, agglomerated iron ore and many steel products, with carbon dioxide counted. Importers must register once their CBAM goods reach £50,000 in value. NI fabricators and builders'' merchants that import steel should check their codes now. A customs specialist is needed. Steelmaking is also within the UK ETS. The NI drinking-water standard for iron is 200 µg/l. Scrap steel recycling cuts emissions sharply.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li><li><a href="https://earthwise.bgs.ac.uk/index.php/Bulk_minerals,_mineral_resources,_Northern_Ireland" target="_blank" rel="noopener">Bulk minerals, mineral resources, Northern Ireland (BGS Earthwise)</a></li><li><a href="https://www.legislation.gov.uk/apni/1969/35/contents" target="_blank" rel="noopener">Mineral Development Act (NI) 1969 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2020/1265/contents/made" target="_blank" rel="noopener">Greenhouse Gas Emissions Trading Scheme Order 2020 (legislation.gov.uk)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (NI) 2017, Schedule 1 (legislation.gov.uk)</a></li></ul>'
Co:
  z: 27
  name: Cobalt
  html: <h3>Where it comes from</h3><p>Cobalt is mostly a by-product of copper and nickel mining abroad. It goes into lithium-ion battery cathodes, superalloys, hard metals and pigments. The EU Critical Raw Materials Act (Regulation (EU) 2024/1252) lists cobalt as strategic and critical; it applies in NI only in part. Cobalt is not one of the conflict minerals covered by Regulation (EU) 2017/821, which applies only to tin, tantalum, tungsten and gold. There is no NI production. Imports of cobalt chemicals of 1 tonne or more a year need an EU REACH registration.</p><h3>Handling it</h3><p>Cobalt metal has a harmonised CLP classification of Carc. 1B (may cause cancer), Muta. 2, Repr. 1B (may damage fertility), Resp. Sens. 1, Skin Sens. 1 and Aquatic Chronic 4. Dust from grinding hard metal tools and from battery materials is the main exposure route. EH40/2005 sets 0.1 mg/m³ for cobalt and its compounds, but as a carcinogen, exposure must be kept as low as reasonably practicable under COSHH (NI) 2003. Health surveillance may be needed for sensitisers. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Cobalt is usually +2 or +3. Its oxides and salts colour glass and ceramics blue, and lithium cobalt oxide and nickel-manganese-cobalt oxides form battery cathodes. Under the Batteries Regulation (EU) 2023/1542, which applies in NI, industrial, electric-vehicle and some other batteries must contain at least 16% recycled cobalt in their active materials from 18 August 2031, rising to 26% from 18 August 2036.</p><h3>Climate, carbon and the environment</h3><p>Cobalt has no direct climate effect, but mining and refining carry high carbon and human-rights costs, which battery due diligence rules address. Spent lithium-ion batteries must go through battery collection, never general waste, where they also cause fires. Electrical goods containing them fall under the WEEE Regulations 2013.</p><h3>Not yet verified</h3><p>The CLP adaptation that introduced the current cobalt classification (taken from a trade association table); the application date of the battery due diligence duties.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2023/1542/oj" target="_blank" rel="noopener">Regulation (EU) 2023/1542 on batteries, Article 8 (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2017/821/oj" target="_blank" rel="noopener">Regulation (EU) 2017/821 on conflict minerals (EUR-Lex)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020)</a></li><li><a href="https://www.cobaltinstitute.org/wp-content/uploads/2026/03/EU_CLP_classification_table_March_2026.pdf" target="_blank" rel="noopener">EU CLP classification table (Cobalt Institute, March 2026) (trade association)</a></li></ul>
Ni:
  z: 28
  name: Nickel
  html: <h3>Where it comes from</h3><p>Nickel is mined from sulfide and laterite ores abroad. Most goes into stainless steel; a growing share goes into battery cathodes. The EU Critical Raw Materials Act (Regulation (EU) 2024/1252) lists battery-grade nickel as strategic and critical; it applies in NI only in part. There is no NI production. Imports of nickel chemicals of 1 tonne or more a year need an EU REACH registration.</p><h3>Handling it</h3><p>Nickel metal is classified Carc. 2 (suspected of causing cancer), STOT RE 1 (lung damage from repeated exposure) and Skin Sens. 1. Nickel is the commonest cause of contact allergy. EH40/2005 sets 0.1 mg/m³ for water-soluble nickel compounds and 0.5 mg/m³ for nickel metal and insoluble compounds, applied under COSHH (NI) 2003. Nickel compounds in inhalable powder form are a named COMAH substance, with an upper-tier threshold of 1 tonne. Dry nickel catalyst travels as UN 2881. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Nickel is usually +2, forming the sulfate used in plating, oxides and the hydroxides in battery cathodes. REACH Annex XVII entry 27 limits nickel release from items in prolonged skin contact, such as jewellery, watch straps and zips, to 0.5 µg/cm² per week, and from piercing posts to 0.2 µg/cm² per week. Under the Batteries Regulation (EU) 2023/1542, certain batteries need at least 6% recycled nickel from 18 August 2031 and 15% from 18 August 2036. Nickel is not itself one of the UK CBAM sectors, but stainless steel and ferro-nickel can fall within the iron and steel chapter. A customs specialist is needed.</p><h3>Climate, carbon and the environment</h3><p>Nickel from laterite ores, often processed with coal power, has a high carbon footprint, so recycled content and supplier data matter. The Water Supply (Water Quality) Regulations (NI) 2017 set 20 µg/l for nickel in drinking water, often linked to taps and fittings. Nickel is a priority substance under the Water Framework Directive (Classification, Priority Substances and Shellfish Waters) Regulations (NI) 2015.</p><h3>Not yet verified</h3><p>The nickel CLP entry was confirmed from a supplier safety data sheet, not directly from Annex VI; the nickel environmental quality standard figures.</p><h3>Sources</h3><ul><li><a href="https://echa.europa.eu/documents/10162/13641/nickel_restriction_prolonged_contact_skin_en.pdf/b6f35357-da40-4a04-8085-fe42f6f543ab" target="_blank" rel="noopener">Guideline on the nickel restriction, REACH Annex XVII entry 27 (ECHA)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2015/325/schedule/1/made" target="_blank" rel="noopener">Control of Major Accident Hazards Regulations (NI) 2015, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2023/1542/oj" target="_blank" rel="noopener">Regulation (EU) 2023/1542 on batteries, Article 8 (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (NI) 2017, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://www.hseni.gov.uk/publications/eh402005-workplace-exposure-limits" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits (HSENI, 2020)</a></li><li><a href="https://vale.com/documents/d/guest/nickel-metal-2020-878-eng-323" target="_blank" rel="noopener">Nickel metal safety data sheet (Vale, 2020) (company statement)</a></li></ul>
Cu:
  z: 29
  name: Copper
  html: '<h3>Where it comes from</h3><p>Copper is mined as sulphide and oxide ores, smelted and refined, mostly by electrolysis. A large share of supply is recycled scrap. Copper is not mined in Northern Ireland at present. Any future prospecting would need a licence from the Department for the Economy under the Mineral Development Act (Northern Ireland) 1969. Copper is on both the strategic and the critical raw materials lists in the Critical Raw Materials Act, Regulation (EU) 2024/1252. Only parts of that Act apply in NI. Imports of copper compounds of 1 tonne or more a year need EU REACH registration, because EU REACH applies in NI under the Windsor Framework.</p><h3>Handling it</h3><p>Copper metal in sheet, pipe or wire is low risk. The hazards come from fume (welding, brazing, melting), dust and soluble salts. HSE''s EH40 sets workplace exposure limits of 0.2 mg/m³ for copper fume and 1 mg/m³ (8-hour) for copper dusts and mists. These apply through COSHH (NI) 2003; confirm the current figures with HSENI. Copper sulphate, copper(I) chloride and copper(I) oxide have harmonised CLP classifications as harmful if swallowed and very toxic to aquatic life. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Copper forms copper(I) and copper(II) compounds: oxides, sulphate, chloride and carbonate (the green patina). Copper is an essential trace element. It is listed as a micronutrient under the Fertilising Products Regulation (EU) 2019/1009, which applies in NI.</p><h3>Climate, carbon and the environment</h3><p>Copper is central to electrification: cables, motors, transformers and heat pumps. Mining and smelting are energy intensive. Recycling uses far less energy. Copper is not a UK CBAM good. It is toxic to aquatic life at low levels. NI''s environmental standard for copper in fresh water is 1 µg/l bioavailable as an annual mean. The drinking-water standard at the tap is 2.0 mg/l. Copper cables and equipment are recovered under the WEEE Regulations 2013.</p><h3>Not yet verified</h3><p>Whether HSENI applies the 2020 EH40 copper limits unchanged.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2008/1272/oj" target="_blank" rel="noopener">Regulation (EC) No 1272/2008 (CLP), Annex VI (EUR-Lex)</a></li><li><a href="https://www.hse.gov.uk/pubns/priced/eh40.pdf" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits, 4th edition (HSE, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2015/351/schedule/1/part/2/made" target="_blank" rel="noopener">Water Framework Directive (Classification, Priority Substances and Shellfish Waters) Regulations (NI) 2015, Schedule 1 Part 2 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (NI) 2017, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1009/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1009, Fertilising Products Regulation (EUR-Lex)</a></li></ul>'
Zn:
  z: 30
  name: Zinc
  html: <h3>Where it comes from</h3><p>Zinc is mined as sphalerite (zinc sulphide), usually with lead, and refined by electrolysis or smelting. Much is recovered from galvanising residues and steelmaking dust. Zinc is not mined in Northern Ireland at present. Any prospecting would need a Department for the Economy licence under the Mineral Development Act (Northern Ireland) 1969. Zinc is not on the Critical Raw Materials Act lists. Imports of zinc compounds of 1 tonne or more a year need EU REACH registration in NI.</p><h3>Handling it</h3><p>Solid zinc is low risk. Zinc powder is a different matter. Pyrophoric zinc powder has a harmonised CLP classification as water-reactive and pyrophoric. Stabilised zinc powder and zinc oxide are classified as very toxic to aquatic life. Zinc chloride is corrosive (Skin Corr. 1B), and zinc sulphate causes serious eye damage. Zinc powder travels as UN 1436 under the Carriage of Dangerous Goods Regulations (NI) 2010. EH40 sets a limit for zinc chloride fume of 1 mg/m³ (8-hour). Welding or cutting galvanised steel gives off zinc oxide fume, which can cause metal fume fever. Assess dust clouds under DSEAR (NI) 2003. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Zinc has one common oxidation state, +2. It forms zinc oxide (used in rubber, ceramics and sun cream), zinc sulphate (used in feed and fertiliser) and zinc chloride (used as a galvanising flux). It is an essential trace element and a listed micronutrient under the Fertilising Products Regulation (EU) 2019/1009.</p><h3>Climate, carbon and the environment</h3><p>Galvanising protects steel and extends its life. Galvanised steel is still steel, so UK CBAM iron and steel rules may reach imported galvanised products from 1 January 2027. A customs specialist is needed. Zinc pollution comes from mine drainage, roofs and pig slurry. NI's freshwater standard is 10.9 µg/l bioavailable plus a background of 1 µg/l, as an annual mean. Zinc-carbon and alkaline batteries fall under the Batteries Regulation (EU) 2023/1542.</p><h3>Not yet verified</h3><p>Whether particular galvanised goods fall within UK CBAM commodity codes.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2008/1272/oj" target="_blank" rel="noopener">Regulation (EC) No 1272/2008 (CLP), Annex VI (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (NI) 2010 (legislation.gov.uk)</a></li><li><a href="https://www.hse.gov.uk/pubns/priced/eh40.pdf" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits, 4th edition (HSE, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2015/351/schedule/1/part/2/made" target="_blank" rel="noopener">Water Framework Directive (Classification, Priority Substances and Shellfish Waters) Regulations (NI) 2015, Schedule 1 Part 2 (legislation.gov.uk)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2023/1542/oj" target="_blank" rel="noopener">Regulation (EU) 2023/1542, Batteries (EUR-Lex)</a></li></ul>
Ga:
  z: 31
  name: Gallium
  html: '<h3>Where it comes from</h3><p>Gallium is not mined for its own sake. It is recovered as a by-product of alumina refining (from bauxite) and, to a lesser extent, of zinc refining. Supply is concentrated in very few countries. Gallium is on both the strategic and the critical lists of the Critical Raw Materials Act, Regulation (EU) 2024/1252. NI takes that Act''s product rules but not its strategic-project and stockpiling machinery. There is no NI source. Imports of gallium compounds of 1 tonne or more a year need EU REACH registration in NI.</p><h3>Handling it</h3><p>Gallium metal melts at about body temperature and wets glass and skin. It attacks aluminium, so it must not be stored or shipped in aluminium containers. Most people meet it inside chips and LEDs, where it poses no handling risk. In semiconductor plants, gallium arsenide dust and arsine gas are the real hazards; the arsenic controls apply. Gallium has no EH40 limit of its own. Work from the supplier''s safety data sheet and assess under COSHH (NI) 2003.</p><h3>How it forms compounds</h3><p>Gallium is usually +3. Its important compounds are semiconductors: gallium arsenide (high-frequency and solar cells) and gallium nitride (LEDs, fast chargers, power electronics). Gallium oxide is an emerging power semiconductor.</p><h3>Climate, carbon and the environment</h3><p>Gallium nitride power electronics cut conversion losses in chargers, data centres and electric vehicles, and gallium sits inside most LED lighting. Recovery from scrap is poor, because the quantities in each device are tiny. End-of-life equipment falls under the WEEE Regulations 2013, and lighting and electronics are covered by RoHS, Directive 2011/65/EU, which applies in NI.</p><h3>Not yet verified</h3><p>The harmonised CLP classification of gallium arsenide.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH) (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/dir/2011/65/oj" target="_blank" rel="noopener">Directive 2011/65/EU, RoHS (EUR-Lex)</a></li></ul>'
Ge:
  z: 32
  name: Germanium
  html: <h3>Where it comes from</h3><p>Germanium is recovered as a by-product of zinc refining and from some coal fly ash. Supply is concentrated in very few countries. It is on both the strategic and the critical lists of the Critical Raw Materials Act, Regulation (EU) 2024/1252, parts of which apply in NI. There is no NI source. Imports of germanium compounds of 1 tonne or more a year need EU REACH registration in NI.</p><h3>Handling it</h3><p>Germanium metal and its oxide are of low toxicity in normal use. The serious hazard is germane (germanium tetrahydride), a toxic, flammable gas used in semiconductor manufacture. EH40 sets limits for germane of 0.2 ppm (8-hour) and 0.6 ppm (15-minute). Germane cylinders bring in the Carriage of Dangerous Goods Regulations (NI) 2010, DSEAR (NI) 2003 and pressure systems law. Germanium tetrachloride, used to make optical fibre, is corrosive and fumes in moist air. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Germanium is a semiconductor, usually +4. Germanium dioxide is used in optical fibre and in some catalysts. Germanium tetrachloride is the feedstock for fibre making. Silicon-germanium alloys are used in high-speed chips.</p><h3>Climate, carbon and the environment</h3><p>Germanium is used in optical fibre, infrared optics (thermal cameras), and some high-efficiency solar cells used in space. It is not a significant pollutant. Recovery from scrap is limited. End-of-life equipment falls under the WEEE Regulations 2013.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://www.hse.gov.uk/pubns/priced/eh40.pdf" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits, 4th edition (HSE, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (NI) 2010 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (NI) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013 (legislation.gov.uk)</a></li></ul>
As:
  z: 33
  name: Arsenic
  html: <h3>Where it comes from</h3><p>Arsenic is not mined for itself. It is recovered from the flue dust of copper, lead and gold smelting. It occurs naturally in many rocks, often as arsenopyrite, and in some groundwater. Arsenic is on the critical list (not the strategic list) of the Critical Raw Materials Act, Regulation (EU) 2024/1252. Imports of arsenic compounds of 1 tonne or more a year need EU REACH registration in NI.</p><h3>Handling it</h3><p>Arsenic has a harmonised CLP classification as toxic if swallowed and if inhaled, and very toxic to aquatic life. Most other arsenic compounds share that classification. EH40 sets a limit for arsenic and its compounds (except arsine) of 0.1 mg/m³ (8-hour), with a carcinogen notation. Arsine gas has its own limit of 0.05 ppm. Under COSHH (NI) 2003, a carcinogen must be substituted or enclosed where possible, not just kept below the limit. Arsenic travels as UN 1558 (class 6.1). Most people meet it in old CCA-treated timber, sheep dip sites and smelter residues. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Arsenic is a metalloid with +3 and +5 states. Arsenic trioxide, arsenates and arsine are the forms that matter. Its main lawful uses now are semiconductors (gallium arsenide) and some alloys. REACH Annex XVII restricts arsenic compounds in wood preservatives and antifouling.</p><h3>Climate, carbon and the environment</h3><p>The NI drinking-water standard is 10 µg/l at the tap. The surface-water standard is 50 µg/l in fresh water and 25 µg/l in estuaries and the sea (annual mean, dissolved). NI has no statutory contaminated land regime, because Part III of the Waste and Contaminated Land (NI) Order 1997 was never commenced. Arsenic-bearing ground is handled through planning conditions. Waste CCA timber is normally hazardous waste under the Hazardous Waste Regulations (NI) 2005.</p><h3>Not yet verified</h3><p>The REACH Annex XVII entry number for arsenic; whether the 2020 EH40 arsenic limit has since been lowered.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2008/1272/oj" target="_blank" rel="noopener">Regulation (EC) No 1272/2008 (CLP), Annex VI (EUR-Lex)</a></li><li><a href="https://www.hse.gov.uk/pubns/priced/eh40.pdf" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits, 4th edition (HSE, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (NI) 2017, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2015/351/schedule/1/part/2/made" target="_blank" rel="noopener">Water Framework Directive (Classification, Priority Substances and Shellfish Waters) Regulations (NI) 2015, Schedule 1 Part 2 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH), Annex XVII (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li></ul>
Se:
  z: 34
  name: Selenium
  html: <h3>Where it comes from</h3><p>Selenium is recovered from the anode slimes left by copper refining. It is not mined for itself, and there is no NI source. It is not on the Critical Raw Materials Act lists. Imports of selenium compounds of 1 tonne or more a year need EU REACH registration in NI.</p><h3>Handling it</h3><p>Selenium has a harmonised CLP classification as toxic if swallowed and if inhaled, and as causing organ damage through prolonged exposure. Selenium compounds carry the same classification plus very toxic to aquatic life. EH40 sets a limit for selenium and its compounds (except hydrogen selenide) of 0.1 mg/m³ (8-hour). Hydrogen selenide, a very toxic gas, has a limit of 0.02 ppm. Selenium compounds travel under UN 3283 (solid) or UN 3440 (liquid), class 6.1. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Selenium sits below sulphur and behaves like it, with -2, +4 and +6 states. Selenites and selenates are used in animal feed and supplements, selenium dioxide in chemistry, and selenium in glass making (to cancel the green tint) and in some solar cells. It is an essential nutrient with a narrow gap between too little and too much.</p><h3>Climate, carbon and the environment</h3><p>Selenium matters for water and food rather than climate. NI soils are generally low in selenium, so livestock feed is often supplemented, under feed law. The NI drinking-water standard is 10 µg/l at the tap. Selenium can leach from coal ash and some mine wastes. Selenium-bearing residues may be hazardous waste under the Hazardous Waste Regulations (NI) 2005.</p><h3>Not yet verified</h3><p>That NI soils are generally low in selenium (no primary source checked); the feed additive rules for selenium in NI.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2008/1272/oj" target="_blank" rel="noopener">Regulation (EC) No 1272/2008 (CLP), Annex VI (EUR-Lex)</a></li><li><a href="https://www.hse.gov.uk/pubns/priced/eh40.pdf" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits, 4th edition (HSE, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (NI) 2017, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (NI) 2010 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2005/300/contents/made" target="_blank" rel="noopener">Hazardous Waste Regulations (NI) 2005 (legislation.gov.uk)</a></li></ul>
Br:
  z: 35
  name: Bromine
  html: <h3>Where it comes from</h3><p>Bromine is extracted from brines and seawater, by oxidising bromide with chlorine and blowing out the bromine. Production is concentrated at a few large brine sources abroad. There is no NI source. It is not on the Critical Raw Materials Act lists. Imports of 1 tonne or more a year need EU REACH registration in NI.</p><h3>Handling it</h3><p>Bromine is a dense, red-brown liquid that gives off a choking vapour. It has a harmonised CLP classification as fatal if inhaled (Acute Tox. 2), causing severe skin burns (Skin Corr. 1A) and very toxic to aquatic life. EH40 sets limits of 0.1 ppm (8-hour) and 0.2 ppm (15-minute). It travels as UN 1744 (class 8, with a 6.1 toxic subsidiary hazard). Store it away from metals and organic material. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Bromine is a halogen. It forms bromides (-1), bromates (+5) and many carbon-bromine compounds. Brominated compounds include flame retardants, drilling fluids, pool and spa biocides, and some medicines.</p><h3>Climate, carbon and the environment</h3><p>Bromine compounds destroy ozone. Halons and methyl bromide are controlled under the ozone-depleting substances Regulation (EU) 2024/590, which applies in NI. Several brominated flame retardants, including polybrominated diphenyl ethers and HBCDD, are persistent organic pollutants under Regulation (EU) 2019/1021. RoHS limits PBB and PBDE in electrical goods. Plastics from old electronics and furniture can be POPs waste and must not be recycled into new products. When water containing bromide is ozonated, bromate forms; the NI drinking-water standard for bromate is 10 µg/l.</p><h3>Not yet verified</h3><p>The current POPs Annex I list of brominated substances (not re-read).</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2008/1272/oj" target="_blank" rel="noopener">Regulation (EC) No 1272/2008 (CLP), Annex VI (EUR-Lex)</a></li><li><a href="https://www.hse.gov.uk/pubns/priced/eh40.pdf" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits, 4th edition (HSE, 2020)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/590/oj" target="_blank" rel="noopener">Regulation (EU) 2024/590, ozone-depleting substances (EUR-Lex)</a></li><li><a href="https://www.daera-ni.gov.uk/articles/ozone-depleting-substances-ods" target="_blank" rel="noopener">Ozone-depleting substances (DAERA)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1021/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1021, persistent organic pollutants (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (NI) 2017, Schedule 1 (legislation.gov.uk)</a></li></ul>
Kr:
  z: 36
  name: Krypton
  html: <h3>Where it comes from</h3><p>Krypton is made from air. It is a by-product of large air separation plants that liquefy air and distil it. Only large plants recover it, because air holds about one part per million. No specific licensing regime for producing it has been identified. As a substance it falls under REACH, but noble gases are generally outside the registration duty.</p><h3>Handling it</h3><p>Krypton is not toxic, but it displaces oxygen. In a confined space it can kill by asphyxiation without warning. It travels as compressed gas, UN 1056, or as a refrigerated liquid, UN 1970 (class 2.2). Cylinders bring in the Carriage of Dangerous Goods Regulations (NI) 2010 and pressure systems law, and cryogenic liquid brings cold burns. Use oxygen monitoring where large volumes are stored indoors. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Krypton is a noble gas and almost never reacts. A few compounds, such as krypton difluoride, have been made in laboratories, but they have no commercial use and no specific law.</p><h3>Climate, carbon and the environment</h3><p>Krypton is used to fill the gap in some high-performance double and triple glazing, where it insulates better than argon in a thin cavity. It is also used in some lamps and in lasers for chip-making. It is not a greenhouse gas. Production is electricity intensive, so its carbon footprint follows the grid that runs the air separation plant. Krypton-85 is a radioactive isotope released by nuclear fuel reprocessing; its discharge is controlled under radiation law, not ordinary chemicals law.</p><h3>Not yet verified</h3><p>Whether krypton falls outside the REACH registration duty under Annex IV or V (stated generally only); the Pressure Systems Safety Regulations (NI) 2004 citation.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (NI) 2010 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH) (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li></ul>
Rb:
  z: 37
  name: Rubidium
  html: <h3>Where it comes from</h3><p>Rubidium is recovered in small amounts from lithium and caesium ores, such as lepidolite and pollucite. World production is tiny. It is not on the Critical Raw Materials Act lists, and there is no NI source.</p><h3>Handling it</h3><p>Rubidium metal is a soft alkali metal that ignites in air and reacts violently with water, releasing hydrogen. It is stored under oil or inert gas in sealed ampoules. It travels as UN 1423 (class 4.3, dangerous when wet). Ordinary businesses are unlikely to meet the metal; laboratories and makers of atomic clocks may. DSEAR (NI) 2003 applies to the fire and hydrogen risk. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Rubidium is always +1. Its salts, such as rubidium chloride and carbonate, behave much like potassium salts. They are used in specialist glass, research and some medical imaging.</p><h3>Climate, carbon and the environment</h3><p>Rubidium has no significant climate or pollution role. Its main modern use is in atomic clocks, which keep time for satellite navigation and telecoms networks. Natural rubidium is very slightly radioactive (rubidium-87), at a level too low to bring it within radiation law in normal use.</p><h3>Not yet verified</h3><p>That natural rubidium falls below the levels that trigger radiation law (stated generally).</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (NI) 2010 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (NI) 2003 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH) (EUR-Lex)</a></li></ul>
Sr:
  z: 38
  name: Strontium
  html: '<h3>Where it comes from</h3><p>Strontium is mined mainly as celestine (strontium sulphate). It is on the critical list (not the strategic list) of the Critical Raw Materials Act, Regulation (EU) 2024/1252, parts of which apply in NI. There is no NI source. Imports of strontium compounds of 1 tonne or more a year need EU REACH registration in NI.</p><h3>Handling it</h3><p>Strontium metal reacts with water and air, but few people meet the metal. Most strontium arrives as carbonate, nitrate or ferrite. Strontium nitrate is an oxidiser and travels as UN 1507 (class 5.1); keep it away from fuels and organic material. Strontium chromate is a different matter: as a hexavalent chromium compound, it is a carcinogen and is managed as such under COSHH (NI) 2003. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Strontium is always +2. Its compounds behave much like calcium compounds. Strontium carbonate is used in ferrite magnets and glass; strontium nitrate gives the red colour in fireworks and flares.</p><h3>Climate, carbon and the environment</h3><p>Stable strontium is not a significant pollutant. Strontium ferrite magnets are used in motors and loudspeakers and contain no rare earths. Strontium-90 is a radioactive fission product from nuclear weapons testing and accidents. It is taken up like calcium, into bone and milk, and is monitored under radiation law. Any work with strontium-90 sources falls under the Ionising Radiations Regulations (NI) 2017 and the Radioactive Substances Act 1993.</p><h3>Not yet verified</h3><p>The harmonised CLP classification and any REACH authorisation entry for strontium chromate.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex II (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (NI) 2010 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (NI) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003 (legislation.gov.uk)</a></li></ul>'
Y:
  z: 39
  name: Yttrium
  html: '<h3>Where it comes from</h3><p>Yttrium is mined with the rare earth elements, mainly from ionic clays and from monazite and xenotime ores, and separated by solvent extraction. Supply is concentrated in very few countries. The Critical Raw Materials Act, Regulation (EU) 2024/1252, lists heavy and light rare earth elements as critical, but does not name yttrium. There is no NI source. Imports of yttrium compounds of 1 tonne or more a year need EU REACH registration in NI.</p><h3>Handling it</h3><p>Yttrium metal and its oxide are of moderate hazard. Fine metal powder can burn, so assess dust under DSEAR (NI) 2003. EH40 sets limits for yttrium of 1 mg/m³ (8-hour) and 3 mg/m³ (15-minute). Rare earth ores, especially monazite, can contain thorium and uranium, and their processing can fall under radiation law. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Yttrium is +3 and behaves like the heavier rare earths. Yttrium oxide is used in phosphors for LEDs and screens. Yttria-stabilised zirconia is used for oxygen sensors, solid oxide fuel cells and thermal barrier coatings on turbine blades. Yttrium aluminium garnet (YAG) is used in lasers and white LEDs.</p><h3>Climate, carbon and the environment</h3><p>Yttrium has a quiet climate role: in white LED phosphors, solid oxide fuel cells and electrolysers, and in coatings that let gas turbines run hotter and more efficiently. Rare earth separation creates large volumes of acidic and sometimes radioactive waste in the producing countries. Recovery from scrap lamps and electronics is very low. Waste lamps and equipment fall under the WEEE Regulations 2013.</p><h3>Not yet verified</h3><p>Whether yttrium counts as a heavy rare earth element for the purposes of the Critical Raw Materials Act.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex II (EUR-Lex)</a></li><li><a href="https://www.hse.gov.uk/pubns/priced/eh40.pdf" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits, 4th edition (HSE, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (NI) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (NI) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013 (legislation.gov.uk)</a></li></ul>'
Zr:
  z: 40
  name: Zirconium
  html: <h3>Where it comes from</h3><p>Zirconium comes from zircon (zirconium silicate), recovered from mineral sands along with titanium minerals. Zircon is used as it is in foundry sand, ceramics and refractories, or processed into zirconia and zirconium metal. Zirconium is not on the Critical Raw Materials Act lists. There is no NI source. Imports of zirconium compounds of 1 tonne or more a year need EU REACH registration in NI.</p><h3>Handling it</h3><p>Solid zirconium is inert, but the powder is a serious fire hazard. Pyrophoric zirconium powder has a harmonised CLP classification as water-reactive and pyrophoric, and dry non-pyrophoric powder as self-heating. Dry zirconium powder travels as UN 2008 (class 4.2). Assess dust and fines from machining under DSEAR (NI) 2003. EH40 sets limits for zirconium compounds of 5 mg/m³ (8-hour) and 10 mg/m³ (15-minute). Zircon sand contains traces of uranium and thorium and may need a radiation assessment under the Ionising Radiations Regulations (NI) 2017 where large amounts are handled. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Zirconium is +4. Zircon and zirconia (zirconium dioxide) are the compounds that matter. Zirconia is used in ceramics, dental crowns, sensors and fuel cells. Zirconium compounds are also used as crosslinkers in coatings.</p><h3>Climate, carbon and the environment</h3><p>Zirconium alloys clad the fuel in most nuclear reactors, because they let neutrons pass. Zirconia ceramics support solid oxide fuel cells and electrolysers. Zircon is not a significant pollutant. Foundry sand and refractory waste is usually non-hazardous, but check radioactivity where zircon is used in bulk.</p><h3>Not yet verified</h3><p>Export control listings for nuclear-grade zirconium; the level at which zircon use needs a radiation assessment in NI.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2008/1272/oj" target="_blank" rel="noopener">Regulation (EC) No 1272/2008 (CLP), Annex VI (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (NI) 2010 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (NI) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.hse.gov.uk/pubns/priced/eh40.pdf" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits, 4th edition (HSE, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (NI) 2017 (legislation.gov.uk)</a></li></ul>
Nb:
  z: 41
  name: Niobium
  html: <h3>Where it comes from</h3><p>Niobium is mined mainly as pyrochlore, with most world supply from a few mines. It is also found with tantalum in columbite-tantalite ("coltan"). It is on the critical list (not the strategic list) of the Critical Raw Materials Act, Regulation (EU) 2024/1252. Niobium is not itself a conflict mineral, but tantalum is. Mixed tantalum-niobium ores may fall under the Conflict Minerals Regulation (EU) 2017/821, which applies in NI but not in GB. A customs specialist is needed. There is no NI source.</p><h3>Handling it</h3><p>Niobium metal and its alloys are of low hazard in solid form. Fine powder can burn, so assess dust under DSEAR (NI) 2003. Niobium pentachloride is corrosive and reacts with moisture. There is no EH40 limit for niobium. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Niobium is usually +5. It forms a tough oxide film, which makes it resist corrosion. The forms that matter are ferroniobium (added to steel), niobium-titanium and niobium-tin superconductors, and lithium niobate in optics.</p><h3>Climate, carbon and the environment</h3><p>A small addition of niobium makes high-strength steel, so less steel is needed for the same job in pipelines, bridges and vehicles. That cuts embodied carbon. Imported steel products fall under UK CBAM iron and steel rules from 1 January 2027, whatever their alloying elements; whether a particular ferroalloy is in scope is a question for a customs specialist. Niobium-titanium wire makes the superconducting magnets in MRI scanners. Niobium is not a significant pollutant.</p><h3>Not yet verified</h3><p>Whether ferroniobium is a UK CBAM good; whether the CN heading listed in Annex I of the Conflict Minerals Regulation covers niobium ores.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex II (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2017/821/oj" target="_blank" rel="noopener">Regulation (EU) 2017/821, conflict minerals (EUR-Lex)</a></li><li><a href="https://www.gov.uk/guidance/importing-conflict-minerals-into-northern-ireland" target="_blank" rel="noopener">Importing conflict minerals into Northern Ireland (GOV.UK)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (NI) 2003 (legislation.gov.uk)</a></li></ul>
Mo:
  z: 42
  name: Molybdenum
  html: <h3>Where it comes from</h3><p>Molybdenum is mined as molybdenite (molybdenum sulphide), either from dedicated mines or as a by-product of copper mining. The concentrate is roasted to molybdenum trioxide. It is not on the Critical Raw Materials Act lists. There is no NI source. Imports of molybdenum compounds of 1 tonne or more a year need EU REACH registration in NI.</p><h3>Handling it</h3><p>Molybdenum metal is of low hazard. Molybdenum trioxide, the main traded form, has a harmonised CLP classification that includes serious eye irritation and respiratory irritation. EH40 sets limits for soluble molybdenum compounds of 5 mg/m³ (8-hour) and for insoluble compounds of 10 mg/m³. Molybdenum pentachloride is corrosive and travels as UN 2508 (class 8). Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Molybdenum has several states, most commonly +6 and +4. Molybdenum disulphide is a dry lubricant. Molybdates are used in corrosion inhibitors and catalysts, and in trace amounts in fertiliser. Molybdenum is an essential trace element for plants and is a listed micronutrient under the Fertilising Products Regulation (EU) 2019/1009.</p><h3>Climate, carbon and the environment</h3><p>Most molybdenum goes into steel. It makes stainless and alloy steels resist corrosion and heat, which extends the life of plant and pipework. Imported steel products fall under UK CBAM iron and steel rules from 1 January 2027; for any ferroalloy, a customs specialist is needed. Molybdenum catalysts remove sulphur from fuels, which cuts sulphur dioxide emissions. In livestock, too much molybdenum locks up copper, which matters on some grazing land. Molybdenum-99 is the parent of technetium-99m, the most used medical imaging isotope.</p><h3>Not yet verified</h3><p>Whether molybdenum trioxide's harmonised CLP classification includes a carcinogen category (the copy read was unclear); whether ferromolybdenum is a UK CBAM good.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2008/1272/oj" target="_blank" rel="noopener">Regulation (EC) No 1272/2008 (CLP), Annex VI (EUR-Lex)</a></li><li><a href="https://www.hse.gov.uk/pubns/priced/eh40.pdf" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits, 4th edition (HSE, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (NI) 2010 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1009/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1009, Fertilising Products Regulation (EUR-Lex)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li></ul>
Tc:
  z: 43
  name: Technetium
  html: <h3>Where it comes from</h3><p>Technetium has no stable isotopes and is made artificially. Technetium-99m, the most used isotope in medical imaging, is eluted in hospitals from generators containing molybdenum-99, which is made in research reactors. Technetium-99 is a long-lived product of nuclear fission. Ordinary businesses will never meet it.</p><h3>Handling it</h3><p>All technetium is radioactive. Hospital use is controlled under the Ionising Radiations Regulations (NI) 2017, the Ionising Radiation (Medical Exposure) Regulations (NI) 2018 and the Radioactive Substances Act 1993.</p><h3>How it forms compounds</h3><p>Technetium sits below manganese. Pertechnetate is the form eluted from generators, and it is bound to carrier molecules to target bones, the heart or other organs.</p><h3>Climate, carbon and the environment</h3><p>Technetium-99 is a long-lived component of nuclear waste and reprocessing discharges, regulated under radioactive substances law.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (NI) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2018/17/contents/made" target="_blank" rel="noopener">Ionising Radiation (Medical Exposure) Regulations (NI) 2018 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li></ul>
Ru:
  z: 44
  name: Ruthenium
  html: <h3>Where it comes from</h3><p>Ruthenium is one of the platinum group metals. It is recovered as a by-product of platinum and nickel refining, and supply is concentrated in a few countries. Platinum group metals are on both the strategic and the critical lists of the Critical Raw Materials Act, Regulation (EU) 2024/1252. There is no NI source. Imports of ruthenium compounds of 1 tonne or more a year need EU REACH registration in NI.</p><h3>Handling it</h3><p>Ruthenium metal is of low hazard in solid form. The danger is ruthenium tetroxide, a volatile, toxic and strongly oxidising compound that can form when ruthenium is treated with strong oxidisers. Ruthenium compounds used as catalysts can sensitise skin. There is no EH40 limit specific to ruthenium. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Ruthenium has many oxidation states, from +2 to +8. Its compounds are used as catalysts, in electrode coatings for chlor-alkali and water electrolysis, and in thick-film resistors and hard-disk layers.</p><h3>Climate, carbon and the environment</h3><p>Ruthenium-coated electrodes are used in chlorine production and in some electrolysers for green hydrogen. Ruthenium catalysts are being developed for ammonia synthesis and cracking. Recovery from spent catalysts and electronics is worthwhile, because the metal is valuable. End-of-life electronics fall under the WEEE Regulations 2013. Ruthenium-106 is a radioactive fission product, controlled under radiation law.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH) (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013 (legislation.gov.uk)</a></li></ul>
Rh:
  z: 45
  name: Rhodium
  html: <h3>Where it comes from</h3><p>Rhodium is a platinum group metal, recovered as a by-product of platinum and nickel refining. Supply is concentrated in a few countries, and the price swings wildly. Platinum group metals are on both the strategic and the critical lists of the Critical Raw Materials Act, Regulation (EU) 2024/1252. There is no NI source. A large share of supply comes from recycled catalytic converters.</p><h3>Handling it</h3><p>Rhodium metal is of low hazard. Its soluble salts are much more toxic and can sensitise. EH40 sets limits for rhodium metal fume and dust of 0.1 mg/m³ (8-hour), and for soluble rhodium salts of 0.001 mg/m³, a hundred times lower. Plating shops and catalyst recyclers should assess under COSHH (NI) 2003. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Rhodium is usually +3. Rhodium chloride and rhodium complexes are used as catalysts, for example in making acetic acid and some fine chemicals. Rhodium plating gives a hard, bright finish on jewellery and electrical contacts.</p><h3>Climate, carbon and the environment</h3><p>Most rhodium goes into vehicle catalytic converters, where it removes nitrogen oxides from petrol engine exhaust. That makes it central to air quality, under the Air Quality Standards Regulations (NI) 2010. Spent converters are valuable and are recycled. Demand will fall as cars switch to electric drives. Rhodium is not a significant pollutant.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://www.hse.gov.uk/pubns/priced/eh40.pdf" target="_blank" rel="noopener">EH40/2005 Workplace exposure limits, 4th edition (HSE, 2020)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/188/contents/made" target="_blank" rel="noopener">Air Quality Standards Regulations (NI) 2010 (legislation.gov.uk)</a></li></ul>
Pd:
  z: 46
  name: Palladium
  html: '<h3>Where it comes from</h3><p>Palladium is a platinum-group metal, mined with nickel and platinum ores, mainly in Russia and South Africa, and increasingly recovered from scrap catalytic converters and electronics. There is no palladium mining in Northern Ireland. Any palladium compound imported into NI at 1 tonne or more a year needs registration under EU REACH, which applies in NI under the Windsor Framework; a GB registration under UK REACH does not count in NI. The EU Critical Raw Materials Act applies in NI only in part, and NI is outside its strategic-project and stockpiling machinery.</p><h3>Handling it</h3><p>The solid metal is of low hazard. Fine palladium powder and palladium-on-carbon catalysts are a different matter: they can ignite solvents and air, so DSEAR (NI) 2003 applies where they are used. Some palladium salts are skin and eye sensitisers. Work from the supplier''s safety data sheet and assess under COSHH (NI) 2003; check HSE''s EH40 for any workplace exposure limit.</p><h3>How it forms compounds</h3><p>Palladium usually forms compounds in the +2 state, such as palladium chloride and acetate, and binds readily to carbon in organic molecules, which is why it is the workhorse catalyst for coupling reactions in pharmaceuticals. It also absorbs large volumes of hydrogen. No REACH Annex XVII restriction specific to palladium was identified.</p><h3>Climate, carbon and the environment</h3><p>Primary palladium carries a high carbon footprint per kilogram because ore grades are very low. Its main use, in vehicle catalytic converters, cuts emissions of carbon monoxide, hydrocarbons and nitrogen oxides. Spent catalysts are valuable and are recovered through the waste and scrap system; catalyst wastes may be hazardous waste under the Hazardous Waste Regulations (NI) 2005. Electronics containing palladium fall under the WEEE Regulations 2013.</p><h3>Not yet verified</h3><p>Whether palladium is on the CRMA critical list (as part of platinum-group metals); any UK sanctions on Russian palladium; EH40 values.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH) (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (NI) 2003, SR 2003/152 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2005/300/contents/made" target="_blank" rel="noopener">Hazardous Waste Regulations (NI) 2005, SR 2005/300 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013, SI 2013/3113 (legislation.gov.uk)</a></li></ul>'
Ag:
  z: 47
  name: Silver
  html: '<h3>Where it comes from</h3><p>Most silver is a by-product of lead, zinc, copper and gold mining; the rest comes from recycling jewellery, electronics and old photographic material. In Northern Ireland the Mineral Development Act (NI) 1969 vests mines and minerals in the Department for the Economy, but silver, like gold, is a royal metal: the Act does not name it, and section 4 excepts minerals vested in the Crown. Anyone exploring for silver in NI should take advice on which licence they need. Silver compounds imported at 1 tonne or more a year need EU REACH registration in NI.</p><h3>Handling it</h3><p>The metal is of low hazard. Soluble silver compounds, such as silver nitrate, are corrosive and very toxic to aquatic life, and long exposure can stain the skin grey-blue (argyria). Silver nitrate is also an oxidiser. Work from the supplier''s safety data sheet, assess under COSHH (NI) 2003 and check HSE''s EH40 for workplace exposure limits.</p><h3>How it forms compounds</h3><p>Silver almost always forms compounds in the +1 state: silver nitrate, silver chloride and the light-sensitive halides once used in photography. It tarnishes to silver sulfide in air. Silver and its compounds kill bacteria, so they are used as biocides in coatings, textiles and water treatment. HSE confirms that Northern Ireland must comply with the EU Biocidal Products Regulation (EU) No 528/2012, so silver-treated articles and products placed on the NI market follow the EU rules.</p><h3>Climate, carbon and the environment</h3><p>Silver is used in solar panels and electronics, so demand rises with electrification. Its main environmental concern is toxicity to aquatic organisms, including from nanosilver. Old photographic fixer and some silver residues are hazardous waste under the Hazardous Waste Regulations (NI) 2005. Silver-bearing electronics and panels fall under the WEEE Regulations 2013.</p><h3>Not yet verified</h3><p>The Crown Estate''s role as licensor of silver in NI; EH40 values; any harmonised CLP classification for silver nitrate.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/apni/1969/35/contents" target="_blank" rel="noopener">Mineral Development Act (NI) 1969 (legislation.gov.uk)</a></li><li><a href="https://www.hse.gov.uk/Biocides/northern-ireland-overview.htm" target="_blank" rel="noopener">Biocides regulation: Northern Ireland overview (HSE, updated 28 November 2025)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2012/528/oj" target="_blank" rel="noopener">Regulation (EU) No 528/2012, Biocidal Products (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003, SR 2003/34 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2005/300/contents/made" target="_blank" rel="noopener">Hazardous Waste Regulations (NI) 2005, SR 2005/300 (legislation.gov.uk)</a></li></ul>'
Cd:
  z: 48
  name: Cadmium
  html: '<h3>Where it comes from</h3><p>Cadmium is a by-product of zinc smelting; it is not mined on its own. It also turns up as an impurity in phosphate rock, and so in phosphate fertilisers. Imports of cadmium and its compounds into NI at 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Cadmium is one of the most tightly controlled metals. Cadmium and many of its compounds carry harmonised CLP classifications as carcinogens and as toxic by inhalation, and long exposure damages the kidneys and bones. The main workplace risks are fume from welding, brazing or cutting cadmium-plated or cadmium-bearing metal, and dust. Assess under COSHH (NI) 2003, use local exhaust ventilation and health surveillance where the assessment calls for it, and work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Cadmium forms compounds in the +2 state: cadmium oxide, sulfide (once a common yellow pigment), chloride and telluride. Product law is extensive. REACH Annex XVII entry 23 restricts cadmium in plastics, paints, brazing alloys and jewellery. RoHS restricts cadmium in electrical and electronic equipment; the GOV.UK guidance on the RoHS Regulations 2012 has a separate Northern Ireland version. The Batteries Regulation (EU) 2023/1542 limits cadmium in batteries. The Fertilising Products Regulation (EU) 2019/1009, which applies in NI, sets cadmium limits for CE-marked phosphate fertilisers.</p><h3>Climate, carbon and the environment</h3><p>Cadmium matters for pollution, not climate. It is a priority hazardous substance in water, with standards set under the Water Framework Directive (Classification, Priority Substances and Shellfish Waters) Regulations (NI) 2015. The drinking-water standard in the Water Supply (Water Quality) Regulations (NI) 2017 is 5.0 µg/l (as made). Ambient air targets sit in the Air Quality Standards Regulations (NI) 2010. Nickel-cadmium batteries and cadmium-bearing waste are hazardous waste.</p><h3>Not yet verified</h3><p>The fertiliser cadmium limit figure; RoHS and battery limit figures; EQS and air target values; the PPWR heavy-metals limit for packaging.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH), Annex XVII (EUR-Lex)</a></li><li><a href="https://www.gov.uk/government/publications/restriction-of-hazardous-substances-rohs-regulations/rohs-regulations-2012-as-amended-northern-ireland" target="_blank" rel="noopener">RoHS Regulations 2012 as amended: Northern Ireland (GOV.UK)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (NI) 2017, SR 2017/212, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1009/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1009, Fertilising Products (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2023/1542/oj" target="_blank" rel="noopener">Regulation (EU) 2023/1542, Batteries (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2015/351/contents/made" target="_blank" rel="noopener">Water Framework Directive (Classification, Priority Substances and Shellfish Waters) Regulations (NI) 2015, SR 2015/351 (legislation.gov.uk)</a></li></ul>'
In:
  z: 49
  name: Indium
  html: '<h3>Where it comes from</h3><p>Indium is recovered as a by-product of zinc refining and, in smaller amounts, from tin and copper processing. Much of the supply comes from refineries in East Asia. Recycling of manufacturing scrap from screen production is significant; recovery from end-of-life screens is still limited. There is no NI production. Indium compounds imported into NI at 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>The metal is soft and of low acute hazard. The concern is inhaled dust of indium compounds, especially indium tin oxide (ITO): workers in ITO production have developed serious lung disease. Any process that grinds, sprays or sputters indium compounds needs a COSHH (NI) 2003 assessment with good dust control. Work from the supplier''s safety data sheet and check HSE''s EH40 for a workplace exposure limit.</p><h3>How it forms compounds</h3><p>Indium forms compounds mainly in the +3 state: indium oxide, indium phosphide (used in fast electronics and lasers) and indium tin oxide, the transparent conductor in touch screens and flat-panel displays. It is also used in low-melting solders. No REACH Annex XVII restriction specific to indium was identified.</p><h3>Climate, carbon and the environment</h3><p>Indium is used in some thin-film solar cells (copper indium gallium selenide) and in LED and display technology. Because it is a by-product, supply depends on zinc output rather than indium demand. Screens and electronics containing indium fall under the WEEE Regulations 2013, and recovery of indium is one of the arguments for better treatment of waste displays.</p><h3>Not yet verified</h3><p>Whether indium is on the CRMA critical list; any harmonised CLP classification for indium compounds; EH40 values.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH) (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003, SR 2003/34 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013, SI 2013/3113 (legislation.gov.uk)</a></li></ul>'
Sn:
  z: 50
  name: Tin
  html: '<h3>Where it comes from</h3><p>Tin is mined as cassiterite, mainly in China, Indonesia, Myanmar and parts of Africa and South America, and is heavily recycled. Tin is a conflict mineral. Regulation (EU) 2017/821 applies in Northern Ireland, though not in GB, through the Conflict Minerals (Compliance) (Northern Ireland) (EU Exit) Regulations 2020. Importers into NI of tin ores, concentrates and metal above the Annex I volume thresholds must carry out supply-chain due diligence; the competent authority is at the FCDO. Tin compounds imported at 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Metallic tin and its inorganic compounds are of fairly low toxicity, although long inhalation of tin oxide dust causes a benign lung change (stannosis). Organotin compounds are a different class: many are highly toxic. Assess under COSHH (NI) 2003, check HSE''s EH40 for workplace exposure limits, and work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Tin forms compounds in the +2 and +4 states, such as tin(II) chloride and tin(IV) oxide, and bonds to carbon to make organotins, used as PVC stabilisers and once as antifouling paints. REACH Annex XVII entry 20 restricts organostannic compounds, and entry 21 a dibutyltin borate. Tin replaced lead in most solders because RoHS restricts lead in electrical and electronic equipment.</p><h3>Climate, carbon and the environment</h3><p>Tin''s largest use is solder for electronics; its second is tinplate, which is tin-coated steel for food and drink cans. Tinplate is a steel product, and iron and steel are within UK CBAM from 1 January 2027. Whether a given tinplate good is covered depends on its commodity code: a customs specialist is needed. Tin cans are packaging, so packaging law applies, and solder-bearing electronics fall under the WEEE Regulations 2013.</p><h3>Not yet verified</h3><p>The Annex I import thresholds for tin; EH40 values; which tinplate commodity codes fall within UK CBAM.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2017/821/oj" target="_blank" rel="noopener">Regulation (EU) 2017/821, Conflict Minerals (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2020/1664/contents/made" target="_blank" rel="noopener">Conflict Minerals (Compliance) (Northern Ireland) (EU Exit) Regulations 2020, SI 2020/1664 (legislation.gov.uk)</a></li><li><a href="https://www.gov.uk/guidance/importing-conflict-minerals-into-northern-ireland" target="_blank" rel="noopener">Importing conflict minerals into Northern Ireland (GOV.UK)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH), Annex XVII (EUR-Lex)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">CBAM policy summary (GOV.UK, updated 2 November 2026)</a></li></ul>'
Sb:
  z: 51
  name: Antimony
  html: '<h3>Where it comes from</h3><p>Antimony is mined mainly as stibnite (antimony sulfide), with China the dominant producer and refiner, and is also recovered from lead-acid battery recycling. Supply is concentrated and has been disrupted by export restrictions. There is no NI production. Antimony compounds imported into NI at 1 tonne or more a year need EU REACH registration. The EU Critical Raw Materials Act applies in NI only in part.</p><h3>Handling it</h3><p>Antimony and its compounds are toxic by ingestion and inhalation. Antimony trioxide, the main commercial compound, is a suspected carcinogen. Stibine, a gas that can form when antimony alloys meet acid, is very toxic. Assess dust and fume under COSHH (NI) 2003, check HSE''s EH40 for workplace exposure limits, and work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Antimony forms compounds mostly in the +3 and +5 states. Antimony trioxide is used with brominated chemicals as a flame retardant in plastics, textiles and cables, and as a catalyst in making PET plastic. Antimony also hardens lead in battery grids and ammunition. Some brominated flame retardants used alongside it are restricted as persistent organic pollutants under Regulation (EU) 2019/1021, which applies in NI.</p><h3>Climate, carbon and the environment</h3><p>Antimony''s growing climate link is in solar glass and in battery technology. Its pollution concerns are leaching from waste and plastics, and drinking water: the Water Supply (Water Quality) Regulations (NI) 2017 set a standard of 5.0 µg/l (as made). Flame-retarded plastics in waste electrical equipment can be POPs waste and need separate handling under the WEEE Regulations 2013 and hazardous waste rules.</p><h3>Not yet verified</h3><p>Whether antimony is on the CRMA critical list; the harmonised CLP classification of antimony trioxide; EH40 values; details of current Chinese export restrictions.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2017/212/schedule/1/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (NI) 2017, SR 2017/212, Schedule 1 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2019/1021/oj" target="_blank" rel="noopener">Regulation (EU) 2019/1021, Persistent Organic Pollutants (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH) (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003, SR 2003/34 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li></ul>'
Te:
  z: 52
  name: Tellurium
  html: <h3>Where it comes from</h3><p>Tellurium is one of the rarest stable elements in the Earth's crust. Almost all of it is recovered from the slimes left after copper is refined electrolytically, so supply follows copper production. There is no NI production. Tellurium compounds imported into NI at 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Tellurium and its compounds are toxic. Even small exposures give a garlic smell on the breath, and hydrogen telluride is a very toxic gas. Fine powder is combustible. Assess under COSHH (NI) 2003, check HSE's EH40 for a workplace exposure limit, and work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Tellurium sits below sulfur and selenium and behaves like them, forming tellurides with metals (−2) and oxides and acids in the +4 and +6 states. The compounds that matter are cadmium telluride, used in thin-film solar panels, and bismuth telluride, used in thermoelectric devices that turn heat into electricity. Cadmium telluride brings cadmium law into play, including RoHS and REACH Annex XVII entry 23 on cadmium.</p><h3>Climate, carbon and the environment</h3><p>Tellurium's climate role is through cadmium telluride solar panels, one of the main thin-film technologies. End-of-life solar panels fall under the WEEE Regulations 2013, and recovering tellurium and cadmium from them is both a resource and a pollution issue. Tellurium is also used as an additive in steel and copper alloys to improve machining.</p><h3>Not yet verified</h3><p>Any harmonised CLP classification for tellurium compounds; EH40 values; whether tellurium is on the CRMA lists.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH), Annex XVII (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003, SR 2003/34 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013, SI 2013/3113 (legislation.gov.uk)</a></li></ul>
I:
  z: 53
  name: Iodine
  html: '<h3>Where it comes from</h3><p>Iodine is extracted mainly from Chilean nitrate deposits (caliche) and from underground brines in Japan and the United States. Seaweed was once the main source. There is no current NI production. Iodine and iodine compounds imported into NI at 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Solid iodine gives off a violet vapour that irritates the eyes, skin and lungs, and long exposure affects the thyroid. It is very toxic to aquatic life. Assess under COSHH (NI) 2003, check HSE''s EH40 for a workplace exposure limit, and work from the supplier''s safety data sheet. Radioactive iodine-131, used in hospitals to treat thyroid disease, is controlled under the Ionising Radiations Regulations (NI) 2017 and the Radioactive Substances Act 1993.</p><h3>How it forms compounds</h3><p>Iodine is a halogen. It forms iodides (−1), such as potassium iodide, and iodates, and bonds to carbon in contrast agents and pharmaceuticals. Iodine and iodophors kill microbes. HSE confirms that NI must comply with the EU Biocidal Products Regulation (EU) No 528/2012, so iodine disinfectants sold as biocides in NI, including some used in dairy hygiene, follow the EU rules. Products that count as veterinary or human medicines follow medicines law instead.</p><h3>Climate, carbon and the environment</h3><p>Iodine has a small part in atmospheric chemistry: iodine compounds released from seaweed and the ocean help destroy ozone in the lower atmosphere and form particles. In accidents at nuclear plants, radioactive iodine is one of the first releases of concern, which is why stable iodine tablets feature in emergency plans. Iodine-containing contrast media are detected in waste water.</p><h3>Not yet verified</h3><p>The harmonised CLP classification of iodine; the UN number; EH40 values; how teat-dip products are classed in NI.</p><h3>Sources</h3><ul><li><a href="https://www.hse.gov.uk/Biocides/northern-ireland-overview.htm" target="_blank" rel="noopener">Biocides regulation: Northern Ireland overview (HSE, updated 28 November 2025)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2012/528/oj" target="_blank" rel="noopener">Regulation (EU) No 528/2012, Biocidal Products (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (NI) 2017, SR 2017/229 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003, SR 2003/34 (legislation.gov.uk)</a></li></ul>'
Xe:
  z: 54
  name: Xenon
  html: '<h3>Where it comes from</h3><p>Xenon is made from air. It is a trace component, recovered as a by-product of large air separation plants that make oxygen and nitrogen, so supply is small and the price is high. No specific licensing regime for producing it was identified; air separation plants are controlled mainly as pressure and process plant. NI buys its xenon in cylinders from gas suppliers.</p><h3>Handling it</h3><p>Xenon is non-toxic and non-flammable, but like any inert gas it can displace oxygen in a confined space and cause asphyxiation. Cylinders are high-pressure equipment. Carriage is under the Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (NI) 2010. Work from the supplier''s safety data sheet and include oxygen depletion in the risk assessment. Radioactive xenon-133, used in lung imaging, is controlled under the Ionising Radiations Regulations (NI) 2017.</p><h3>How it forms compounds</h3><p>Xenon was long thought to form no compounds. It does: with fluorine and oxygen it forms xenon fluorides and oxides, but these are laboratory chemicals with no commercial importance. In practice xenon is used as a gas: in high-intensity lamps, car headlights, ion thrusters for satellites, semiconductor etching, and as an anaesthetic, where medicines law applies.</p><h3>Climate, carbon and the environment</h3><p>Xenon is not a greenhouse gas and causes no pollution. Its footprint lies in the electricity needed to separate it from air, since it is about one part in eleven million of the atmosphere and huge volumes must be processed. Radioactive xenon isotopes are released by nuclear fission, and monitoring stations detect them to verify the nuclear test ban.</p><h3>Not yet verified</h3><p>The UN number; the exact atmospheric concentration; Pressure Systems Safety Regulations (NI) 2004 SR number.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (NI) 2010, SR 2010/160 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (NI) 2017, SR 2017/229 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003, SR 2003/34 (legislation.gov.uk)</a></li></ul>'
Cs:
  z: 55
  name: Caesium
  html: '<h3>Where it comes from</h3><p>Caesium is mined in small quantities from the mineral pollucite, with very few working deposits worldwide, and is also recovered from some lithium-bearing ores. There is no NI production. Caesium compounds imported into NI at 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Caesium metal is among the most reactive metals: it ignites in air and reacts explosively with water, so it is stored sealed under inert gas or oil, and DSEAR (NI) 2003 applies. Caesium hydroxide is strongly corrosive. Most businesses will meet caesium only as caesium-137, a radioactive isotope used in sealed sources for industrial gauges, moisture and density meters, and some older medical and research irradiators. These are controlled under the Radioactive Substances Act 1993, the Ionising Radiations Regulations (NI) 2017 and, for high-activity sources, the High-activity Sealed Radioactive Sources and Orphan Sources Regulations 2005. Work from the supplier''s safety data sheet or source certificate.</p><h3>How it forms compounds</h3><p>Caesium is an alkali metal and forms compounds in the +1 state, such as caesium chloride and caesium formate. Caesium formate brines are used as dense drilling fluids in oil and gas wells. Caesium-133 defines the second: atomic clocks count its radiation.</p><h3>Climate, carbon and the environment</h3><p>Caesium has no direct climate role. Its environmental importance is caesium-137 from nuclear weapons tests, the Chernobyl accident and discharges from the Sellafield site into the Irish Sea; it is long-lived and taken up by plants and animals. Radioactivity in food and the environment, including in NI, is monitored and reported each year. Disused caesium sources must be returned or disposed of as radioactive waste, never placed in general waste or scrap.</p><h3>Not yet verified</h3><p>NIEA as the RSA 1993 regulator in NI; whether HASS 2005 has been amended for NI; current caesium-137 levels in the Irish Sea.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (NI) 2017, SR 2017/229 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2005/2686/contents/made" target="_blank" rel="noopener">High-activity Sealed Radioactive Sources and Orphan Sources Regulations 2005, SI 2005/2686 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (NI) 2003, SR 2003/152 (legislation.gov.uk)</a></li></ul>'
Ba:
  z: 56
  name: Barium
  html: <h3>Where it comes from</h3><p>Barium comes mainly from the mineral baryte (barium sulfate), mined in China, India, Morocco and elsewhere. Most baryte goes into drilling mud for oil and gas wells, where its weight holds down well pressure. In NI, baryte is not among the common rocks excepted by Schedule 1 of the Mineral Development Act (NI) 1969, so any working of it would fall under the Act's licensing system. Barium compounds imported into NI at 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Toxicity depends on solubility. Barium sulfate is insoluble and so safe that patients drink it for X-ray imaging. Soluble barium compounds, such as barium chloride, carbonate and nitrate, are poisonous if swallowed and affect the heart and muscles. Barium metal reacts with water and air, so DSEAR (NI) 2003 applies where it is used. Assess under COSHH (NI) 2003, check HSE's EH40 for workplace exposure limits, and work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Barium is an alkaline earth metal and forms compounds in the +2 state. Barium sulfate is a filler and white pigment in paints and plastics; barium carbonate is used in glass, ceramics and bricks to stop efflorescence; barium nitrate gives fireworks their green colour; barium titanate is used in capacitors. No REACH Annex XVII restriction specific to barium was identified.</p><h3>Climate, carbon and the environment</h3><p>Barium has no direct climate role. Its link is through oil and gas drilling, where large volumes of baryte mud are used and disposed of. Spent drilling mud and soluble barium wastes may need handling as hazardous waste under the Hazardous Waste Regulations (NI) 2005. Barium is a parameter commonly monitored around landfill and industrial sites.</p><h3>Not yet verified</h3><p>Whether baryte is on the CRMA critical list; harmonised CLP classifications for barium compounds; EH40 values; any historic baryte working in NI.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/apni/1969/35/contents" target="_blank" rel="noopener">Mineral Development Act (NI) 1969 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH) (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (NI) 2003, SR 2003/34 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2005/300/contents/made" target="_blank" rel="noopener">Hazardous Waste Regulations (NI) 2005, SR 2005/300 (legislation.gov.uk)</a></li></ul>
La:
  z: 57
  name: Lanthanum
  html: <h3>Where it comes from</h3><p>Lanthanum is a light rare earth element, mined with the other rare earths from bastnäsite and monazite, mainly in China, which also dominates separation and refining. Monazite contains thorium, so mining and processing it creates naturally radioactive residues that fall under radiation law. There is no NI production. Lanthanum compounds imported into NI at 1 tonne or more a year need EU REACH registration. The EU Critical Raw Materials Act applies in NI in part; NI takes its product rules but is outside the strategic-project and stockpiling machinery.</p><h3>Handling it</h3><p>Lanthanum compounds are of fairly low toxicity, though dusts should be controlled. Lanthanum metal and fine powders can ignite in air and react with water, so DSEAR (NI) 2003 applies where metal powder is handled. Assess under COSHH (NI) 2003 and work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Lanthanum forms compounds in the +3 state, like all the rare earths, which is why they are so hard to separate. Lanthanum oxide goes into optical glass for camera lenses; lanthanum is used in the catalysts that crack crude oil and in nickel-metal hydride batteries; lanthanum carbonate is a medicine for kidney patients. Lanthanum-modified clay is used to lock up phosphorus in lakes.</p><h3>Climate, carbon and the environment</h3><p>Rare earth production is energy- and chemical-intensive, with acid wastes and radioactive tailings. Lanthanum-based clays are one tool for treating phosphorus pollution in lakes, which is relevant to NI's nutrient problems, though their use in open water is debated. Nickel-metal hydride batteries in hybrid cars fall under the Batteries Regulation (EU) 2023/1542, which applies in NI.</p><h3>Not yet verified</h3><p>Whether lanthanum-clay treatments have been used in NI waters; any harmonised CLP classification for lanthanum compounds.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://assets.publishing.service.gov.uk/media/680ba70911d566056bcae8ef/JC_decision_2.2025_clean_for_signature_UK_EU.docx.pdf" target="_blank" rel="noopener">Joint Committee Decision No 2/2025 (GOV.UK)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2023/1542/oj" target="_blank" rel="noopener">Regulation (EU) 2023/1542, Batteries (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (NI) 2017, SR 2017/229 (legislation.gov.uk)</a></li></ul>
Ce:
  z: 58
  name: Cerium
  html: '<h3>Where it comes from</h3><p>Cerium is the most abundant rare earth element. It is mined with the others from bastnäsite and monazite, mainly in China, and separated by solvent extraction. Monazite processing creates thorium-bearing residues, which fall under radiation law. There is no NI production. Cerium compounds imported into NI at 1 tonne or more a year need EU REACH registration. The EU Critical Raw Materials Act applies in NI in part.</p><h3>Handling it</h3><p>Cerium metal is pyrophoric: scraped or powdered, it sparks and ignites, which is why it is used in lighter flints. DSEAR (NI) 2003 applies where metal or powder is handled. Cerium oxide powder used for polishing is of low toxicity, but dust should be controlled under COSHH (NI) 2003. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Cerium is unusual among the rare earths because it forms stable compounds in the +4 state as well as +3. Cerium(IV) oxide (ceria) stores and releases oxygen, which makes it central to vehicle catalytic converters and to diesel fuel additives. Ceria is also the standard polish for glass, lenses and silicon wafers, and cerium is used to decolourise glass.</p><h3>Climate, carbon and the environment</h3><p>Cerium''s main environmental role is positive: in catalytic converters it helps cut emissions of carbon monoxide, hydrocarbons and nitrogen oxides. The concerns lie upstream, in the energy, acid use and radioactive tailings of rare earth processing, and downstream, in the release of nanoparticle ceria. Spent catalysts are recovered through the scrap and waste system.</p><h3>Not yet verified</h3><p>Any harmonised CLP classification for cerium compounds; whether cerium is separately listed in the CRMA (as a light rare earth).</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH) (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (NI) 2003, SR 2003/152 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (NI) 2017, SR 2017/229 (legislation.gov.uk)</a></li></ul>'
Pr:
  z: 59
  name: Praseodymium
  html: <h3>Where it comes from</h3><p>Praseodymium is a light rare earth, mined and separated with neodymium, mainly in China. The two are often sold together as "didymium" or praseodymium-neodymium oxide for magnet making. Processing creates thorium-bearing residues that fall under radiation law. There is no NI production. Praseodymium compounds imported into NI at 1 tonne or more a year need EU REACH registration. The EU Critical Raw Materials Act applies in NI in part, including its product rules such as the permanent-magnet provisions.</p><h3>Handling it</h3><p>Praseodymium compounds are of fairly low toxicity, but dust should be controlled under COSHH (NI) 2003. The metal oxidises in air and fine powder can ignite, so DSEAR (NI) 2003 applies where powder is handled, as in magnet production. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Like the other rare earths, praseodymium forms compounds mainly in the +3 state. Its most important use is alloyed with neodymium, iron and boron in permanent magnets. Its oxide gives a yellow-green colour to glass and ceramics, and it is used in the didymium glass of welders' and glassblowers' goggles.</p><h3>Climate, carbon and the environment</h3><p>Praseodymium matters to the energy transition through permanent magnets in wind turbine generators and electric vehicle motors. Rare earth production is energy- and chemical-intensive. Magnets in end-of-life equipment fall under the WEEE Regulations 2013, but recovery rates are low, which is the gap the CRMA's magnet provisions aim to close.</p><h3>Not yet verified</h3><p>The CRMA article numbers and dates for permanent magnets; any harmonised CLP classification.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://assets.publishing.service.gov.uk/media/680ba70911d566056bcae8ef/JC_decision_2.2025_clean_for_signature_UK_EU.docx.pdf" target="_blank" rel="noopener">Joint Committee Decision No 2/2025 (GOV.UK)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013, SI 2013/3113 (legislation.gov.uk)</a></li></ul>
Nd:
  z: 60
  name: Neodymium
  html: '<h3>Where it comes from</h3><p>Neodymium is a light rare earth mined with the others from bastnäsite and monazite. China dominates mining, separation and, above all, magnet manufacture. Processing produces thorium- and uranium-bearing residues that fall under radiation law. There is no NI production. Neodymium compounds imported into NI at 1 tonne or more a year need EU REACH registration. The EU Critical Raw Materials Act applies in NI in part: under Joint Committee Decision No 2/2025, NI takes the Act''s product rules, including the permanent-magnet provisions, but is outside the strategic-project, monitoring and stockpiling machinery.</p><h3>Handling it</h3><p>Neodymium compounds are of low toxicity, but dust should be controlled under COSHH (NI) 2003. Neodymium magnets are a hazard in their own right: they are very strong, can trap fingers and shatter, and are dangerous if swallowed. Magnet swarf and powder can ignite, so DSEAR (NI) 2003 applies in machining and production. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Neodymium forms compounds in the +3 state. The compound that matters is the alloy Nd2Fe14B, the neodymium-iron-boron magnet, the strongest permanent magnet in common use. Small amounts of dysprosium or terbium are added for heat resistance. Neodymium is also used in lasers and to colour glass.</p><h3>Climate, carbon and the environment</h3><p>Neodymium is central to the energy transition: direct-drive wind turbines and most electric vehicle motors use neodymium magnets. That makes supply concentration a strategic risk, and the CRMA magnet provisions aim to improve the labelling and recovery of magnets. Magnets in end-of-life electrical equipment fall under the WEEE Regulations 2013. Production is energy-intensive and creates acid and radioactive wastes.</p><h3>Not yet verified</h3><p>The CRMA article numbers and dates for permanent-magnet labelling and recycled content; any harmonised CLP classification.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://assets.publishing.service.gov.uk/media/680ba70911d566056bcae8ef/JC_decision_2.2025_clean_for_signature_UK_EU.docx.pdf" target="_blank" rel="noopener">Joint Committee Decision No 2/2025 (GOV.UK)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006 (REACH) (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013, SI 2013/3113 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (NI) 2017, SR 2017/229 (legislation.gov.uk)</a></li></ul>'
Pm:
  z: 61
  name: Promethium
  html: <h3>Where it comes from</h3><p>Promethium has no stable isotopes and is almost absent from nature. Small amounts are made in nuclear reactors or separated from spent nuclear fuel. Ordinary businesses will never meet it.</p><h3>Handling it</h3><p>Promethium-147 was once used in luminous paint and in small long-life batteries, and may still be found in old gauges and instruments. Any promethium source is radioactive and is controlled under the Radioactive Substances Act 1993 and the Ionising Radiations Regulations (NI) 2017. Anyone who finds an old luminous instrument should not open it and should seek advice from the radiation regulator.</p><h3>How it forms compounds</h3><p>Promethium behaves like the other rare earths, forming compounds in the +3 state. It has no commercial compounds.</p><h3>Climate, carbon and the environment</h3><p>No climate role. Disused sources must be disposed of as radioactive waste.</p><h3>Not yet verified</h3><p>NIEA as the RSA 1993 regulator in NI.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (NI) 2017, SR 2017/229 (legislation.gov.uk)</a></li></ul>
Sm:
  z: 62
  name: Samarium
  html: <h3>Where it comes from</h3><p>Samarium is a rare earth recovered with the others from monazite and bastnäsite, mainly in China, with the same thorium-bearing processing residues. There is no NI production. Samarium compounds imported into NI at 1 tonne or more a year need EU REACH registration. The EU Critical Raw Materials Act applies in NI in part, including its permanent-magnet provisions.</p><h3>Handling it</h3><p>Samarium compounds are of fairly low toxicity, but dust should be controlled under COSHH (NI) 2003. The metal and fine powders can ignite, so DSEAR (NI) 2003 applies where powder is handled. Samarium-153, a radioactive isotope, is used in hospitals to relieve bone pain from cancer and is controlled under the Ionising Radiations Regulations (NI) 2017 and the Radioactive Substances Act 1993. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Samarium forms compounds mainly in the +3 state, and some in the +2 state; samarium(II) iodide is a well-known laboratory reagent. The important material is samarium-cobalt, a permanent magnet that keeps its strength at high temperatures better than neodymium magnets. It is used in aerospace, defence and precision motors. Samarium also absorbs neutrons and is used in nuclear reactor control.</p><h3>Climate, carbon and the environment</h3><p>Samarium-cobalt magnets are a smaller part of the magnet market than neodymium magnets, but valued where heat resistance matters. Supply concentration is a strategic risk. Magnets in end-of-life equipment fall under the WEEE Regulations 2013. Rare earth production is energy- and chemical-intensive.</p><h3>Not yet verified</h3><p>Export-control status of samarium-cobalt magnets; any harmonised CLP classification.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (NI) 2017, SR 2017/229 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013, SI 2013/3113 (legislation.gov.uk)</a></li></ul>
Eu:
  z: 63
  name: Europium
  html: '<h3>Where it comes from</h3><p>Europium is a rare earth element. It is mined with the other rare earths from minerals such as bastnäsite and monazite, then separated by long solvent-extraction trains. Most separation capacity is in China. Monazite carries thorium, so processing leaves radioactive residues. There is no rare earth mine in NI. Imports of europium compounds into NI of 1 tonne or more a year need registration under EU REACH, Regulation (EC) No 1907/2006; a GB registration does not count. The Critical Raw Materials Act, Regulation (EU) 2024/1252, lists heavy and light rare earths as critical raw materials. It applies in NI only in part: the product rules apply, the strategic-project and stockpiling machinery does not.</p><h3>Handling it</h3><p>Europium metal is reactive. It oxidises quickly in air and reacts with water, giving off hydrogen, and fine powder can ignite. Where powder or hydrogen could form an explosive atmosphere, the Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 apply. Oxides and salts are handled under the Control of Substances Hazardous to Health Regulations (Northern Ireland) 2003. Work from the supplier''s safety data sheet, which carries the classification under EU CLP, Regulation (EC) No 1272/2008.</p><h3>How it forms compounds</h3><p>Europium usually forms +3 compounds, such as the oxide Eu2O3, but it is unusual among the rare earths in also forming stable +2 compounds. Its ions glow red or blue. Its main uses are red phosphors in older lamps and screens and the anti-forgery inks in banknotes. No REACH Annex XVII restriction specific to europium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Rare earth mining and separation use a lot of energy, acids and water, and leave acidic and radioactive wastes. Fluorescent lamps hold europium phosphors and mercury; spent lamps are WEEE under the Waste Electrical and Electronic Equipment Regulations 2013 and are normally hazardous waste under the Hazardous Waste Regulations (Northern Ireland) 2005. Europium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>Whether the EU critical raw materials assessment places europium in the heavy or the light rare earth group.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006, REACH (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2005/300/contents/made" target="_blank" rel="noopener">Hazardous Waste Regulations (Northern Ireland) 2005 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013 (legislation.gov.uk)</a></li></ul>'
Gd:
  z: 64
  name: Gadolinium
  html: '<h3>Where it comes from</h3><p>Gadolinium is a rare earth element, mined and separated with the others, mostly in China. There is no NI production. Under the Critical Raw Materials Act, Regulation (EU) 2024/1252, gadolinium is named in Annex I among the "rare earth elements for permanent magnets", so it is a strategic raw material. The Act applies in NI only in part: the product rules apply, the strategic-project and stockpiling machinery does not. Importers into NI of 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Most people meet gadolinium in a hospital. Gadolinium-based contrast agents are injected for MRI scans, and they are regulated as medicines, not as industrial chemicals. In industry, gadolinium metal powder is flammable, so the Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 can apply. Compounds fall under COSHH (Northern Ireland) 2003. Work from the supplier''s safety data sheet. Gadolinium absorbs neutrons strongly and is used in nuclear fuel and shielding; that use sits under nuclear and radiation law, including the Ionising Radiations Regulations (Northern Ireland) 2017.</p><h3>How it forms compounds</h3><p>Gadolinium forms +3 compounds, such as the oxide Gd2O3. Free gadolinium ions are toxic, so contrast agents lock the ion inside a large organic "chelate" molecule. It is also used in magnets. No REACH Annex XVII restriction specific to gadolinium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Contrast agents pass through patients and through sewage works largely unchanged. Researchers now find "anthropogenic gadolinium" in rivers and tap water in many countries. There is no NI water quality standard for it. Mining and separation carry the energy, chemical and radioactive-waste burden common to rare earths. Under Article 28 of the Critical Raw Materials Act, products such as MRI machines, wind generators, heat pumps and motor vehicles must in time be labelled to say whether they contain permanent magnets and of which type. Gadolinium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex I and Article 28 (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006, REACH (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li></ul>'
Tb:
  z: 65
  name: Terbium
  html: '<h3>Where it comes from</h3><p>Terbium is one of the scarcer rare earths. Much of the world''s supply comes from ionic-adsorption clays in southern China and Myanmar, where it is leached out with chemical solutions. There is no NI production. The Critical Raw Materials Act, Regulation (EU) 2024/1252, names terbium in Annex I among the rare earth elements for permanent magnets, making it a strategic raw material. The Act applies in NI only in part: the product rules apply, the strategic-project and stockpiling machinery does not. Importers into NI of 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Terbium metal and its compounds are of low to moderate hazard in the forms businesses meet. Fine metal powder can burn, so dust control and the Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 matter where powder is handled. Compounds are assessed under COSHH (Northern Ireland) 2003. Work from the supplier''s safety data sheet, which gives the EU CLP classification.</p><h3>How it forms compounds</h3><p>Terbium mostly forms +3 compounds, and can reach +4 in some oxides. Terbium ions give a bright green glow, used in lamp and screen phosphors. Its main modern use is as a small addition, with dysprosium, to neodymium-iron-boron magnets so they keep their strength at the high temperatures inside electric-vehicle motors and wind generators. No REACH Annex XVII restriction specific to terbium has been identified.</p><h3>Climate, carbon and the environment</h3><p>In-situ leaching of ionic clays has caused soil and water pollution where it was poorly controlled. Under Article 28 of the Critical Raw Materials Act, products such as electric motors, wind generators, heat pumps and washing machines must in time be labelled to say whether they contain permanent magnets and of which type. Magnets in scrapped electrical goods are handled under the WEEE Regulations 2013. Terbium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex I and Article 28 (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006, REACH (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013 (legislation.gov.uk)</a></li></ul>'
Dy:
  z: 66
  name: Dysprosium
  html: '<h3>Where it comes from</h3><p>Dysprosium is a heavy rare earth, mined mainly from ionic-adsorption clays in southern China and Myanmar and separated by solvent extraction. There is no NI production. The Critical Raw Materials Act, Regulation (EU) 2024/1252, names dysprosium in Annex I among the rare earth elements for permanent magnets, so it is a strategic raw material. The Act applies in NI only in part: the product rules apply, the strategic-project and stockpiling machinery does not. Imports into NI of 1 tonne or more a year need EU REACH registration; a GB registration does not count.</p><h3>Handling it</h3><p>Dysprosium metal and oxide are of low acute toxicity, but fine metal powder is flammable. Magnet grinding and machining create fine, easily ignited swarf and dust, so the Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 and COSHH (Northern Ireland) 2003 both apply. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Dysprosium forms +3 compounds, such as the oxide Dy2O3 and the fluoride. A few per cent is alloyed into neodymium-iron-boron magnets to stop them losing magnetism when hot. That is its main use, in electric-vehicle motors, wind generators, industrial motors and robots. No REACH Annex XVII restriction specific to dysprosium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Dysprosium is a low-carbon material, but its mining is not clean. In-situ leaching has polluted soil and water, and separation uses large volumes of acid and energy. Article 28 of the Critical Raw Materials Act will require products such as wind generators, motor vehicles, heat pumps, electric motors and household appliances to be labelled for permanent-magnet content, with data on how to remove the magnets. The labelling applies two years after a Commission implementing act, due by 24 November 2026; for MRI machines and motor vehicles it applies from 24 May 2029. Scrapped electrical goods fall under the WEEE Regulations 2013. Dysprosium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>Whether the Commission implementing act on magnet labels has been adopted.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex I and Article 28 (EUR-Lex)</a></li><li><a href="https://assets.publishing.service.gov.uk/media/680ba70911d566056bcae8ef/JC_decision_2.2025_clean_for_signature_UK_EU.docx.pdf" target="_blank" rel="noopener">Joint Committee Decision No 2/2025 on Regulation (EU) 2024/1252 (GOV.UK, 29 April 2025)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006, REACH (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013 (legislation.gov.uk)</a></li></ul>'
Ho:
  z: 67
  name: Holmium
  html: '<h3>Where it comes from</h3><p>Holmium is a heavy rare earth, recovered in small amounts during rare earth separation, mostly in China. There is no NI production. The Critical Raw Materials Act, Regulation (EU) 2024/1252, lists heavy rare earth elements as critical raw materials; the Act applies in NI only in part. Importers into NI of 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Few businesses meet holmium outside medicine and research. Holmium:YAG lasers are used in urology and surgery, and are controlled under laser-safety practice and medical device law. Metal powder is flammable, so DSEAR (Northern Ireland) 2003 applies where dust could form, and compounds fall under COSHH (Northern Ireland) 2003. Work from the supplier''s safety data sheet. Radioactive holmium-166 is used in some cancer treatments; it is controlled under the Ionising Radiations Regulations (Northern Ireland) 2017 and the Radioactive Substances Act 1993.</p><h3>How it forms compounds</h3><p>Holmium forms +3 compounds, such as the oxide Ho2O3, which colours glass and cubic zirconia yellow. Holmium has the highest magnetic moment of any element and is used in pole pieces for very strong magnets. No REACH Annex XVII restriction specific to holmium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Holmium shares the environmental burden of rare earth mining and separation: energy, acid and radioactive tailings. Volumes are tiny. Scrap lasers and electronic equipment are handled under the WEEE Regulations 2013. Holmium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex II (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li></ul>'
Er:
  z: 68
  name: Erbium
  html: '<h3>Where it comes from</h3><p>Erbium is a heavy rare earth, separated from mixed rare earth concentrates, mostly in China. There is no NI production. The Critical Raw Materials Act, Regulation (EU) 2024/1252, lists heavy rare earth elements as critical raw materials; the Act applies in NI only in part. Importers into NI of 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Erbium and its oxide are of low hazard in normal use. Metal powder is flammable, so DSEAR (Northern Ireland) 2003 applies where dust clouds could form; compounds fall under COSHH (Northern Ireland) 2003. Work from the supplier''s safety data sheet. Erbium lasers used in dentistry and skin treatment are high-power devices covered by laser-safety rules and medical device law.</p><h3>How it forms compounds</h3><p>Erbium forms +3 compounds. Erbium oxide gives glass and glazes a pink colour. Its most important use is in optical fibre: erbium-doped fibre amplifiers boost light signals in long-distance telecoms cables, so every broadband connection depends on it. No REACH Annex XVII restriction specific to erbium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Erbium shares the energy, acid and waste burden of rare earth separation, but quantities used are very small. Telecoms equipment containing erbium is handled at end of life under the WEEE Regulations 2013. Erbium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex II (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006, REACH (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013 (legislation.gov.uk)</a></li></ul>'
Tm:
  z: 69
  name: Thulium
  html: '<h3>Where it comes from</h3><p>Thulium is one of the least abundant rare earths. It is separated in small amounts from rare earth concentrates, mostly in China. There is no NI production. Heavy rare earths are critical raw materials under Regulation (EU) 2024/1252, which applies in NI in part. Imports into NI of 1 tonne or more a year need EU REACH registration, a threshold few users will reach.</p><h3>Handling it</h3><p>Most businesses will never meet thulium. Where they do, it is usually as radioactive thulium-170 in portable X-ray sources for inspecting welds and castings, or in thulium fibre lasers used in surgery. Thulium-170 sources are controlled under the Ionising Radiations Regulations (Northern Ireland) 2017 and the Radioactive Substances Act 1993. Stable thulium metal and compounds fall under COSHH (Northern Ireland) 2003, and metal powder under DSEAR (Northern Ireland) 2003. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Thulium forms +3 compounds, such as the oxide Tm2O3. Its uses are niche: lasers, X-ray sources and some phosphors. No REACH Annex XVII restriction specific to thulium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Thulium carries the general rare earth burden of energy, acid and tailings, in very small volumes. Spent radioactive sources must be returned to the supplier or disposed of through an authorised route under radioactive substances law. Thulium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li></ul>'
Yb:
  z: 70
  name: Ytterbium
  html: <h3>Where it comes from</h3><p>Ytterbium is a heavy rare earth separated from mixed concentrates, mostly in China. There is no NI production. Heavy rare earths are critical raw materials under Regulation (EU) 2024/1252, which applies in NI in part. Imports into NI of 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Ytterbium metal is fairly soft and stable but tarnishes in air; fine powder is flammable, so DSEAR (Northern Ireland) 2003 applies where dust clouds could form. Compounds fall under COSHH (Northern Ireland) 2003. Work from the supplier's safety data sheet. The form most manufacturers meet is the ytterbium fibre laser used for cutting and welding metal. These are Class 4 industrial lasers and need proper guarding and laser-safety management under general health and safety law. Radioactive ytterbium-169 is used in some radiography sources and is controlled under the Ionising Radiations Regulations (Northern Ireland) 2017.</p><h3>How it forms compounds</h3><p>Ytterbium forms +3 compounds and, unusually, some stable +2 compounds. It is used as a dopant in fibre lasers, in stress gauges, in some steel additions and in experimental atomic clocks. No REACH Annex XVII restriction specific to ytterbium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Ytterbium fibre lasers are far more energy-efficient than the older CO2 lasers they replaced, which cuts electricity use in metal fabrication. Its mining shares the general rare earth burden. Lasers and electronics at end of life fall under the WEEE Regulations 2013. Ytterbium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013 (legislation.gov.uk)</a></li></ul>
Lu:
  z: 71
  name: Lutetium
  html: <h3>Where it comes from</h3><p>Lutetium is the last and one of the rarest of the rare earths, separated in small amounts, mostly in China. There is no NI production. Heavy rare earths are critical raw materials under Regulation (EU) 2024/1252, which applies in NI in part. Natural lutetium contains a small share of lutetium-176, which is very weakly radioactive with an extremely long half-life.</p><h3>Handling it</h3><p>Most people who meet lutetium meet it in a hospital. Radioactive lutetium-177 is now used in targeted cancer treatments, and lutetium-based crystals detect radiation in PET scanners. Lutetium-177 is controlled under the Ionising Radiations Regulations (Northern Ireland) 2017 and the Radioactive Substances Act 1993, and as a medicine under medicines law. Stable lutetium compounds fall under COSHH (Northern Ireland) 2003, and metal powder under DSEAR (Northern Ireland) 2003. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Lutetium forms +3 compounds, such as the oxide Lu2O3 and lutetium silicates used in scintillator crystals. It is also used as a catalyst in oil refining. In radiopharmaceuticals the lutetium-177 ion is held in a chelate attached to a molecule that seeks out tumour cells. No REACH Annex XVII restriction specific to lutetium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Volumes are tiny, so the climate footprint is small, though it shares the rare earth mining burden. Hospital wastes containing lutetium-177 are radioactive waste and are managed under authorisations issued under the Radioactive Substances Act 1993. Lutetium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>Which NI body issues Radioactive Substances Act 1993 authorisations (believed to be NIEA).</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li></ul>
Hf:
  z: 72
  name: Hafnium
  html: <h3>Where it comes from</h3><p>Hafnium has no ore of its own. It occurs with zirconium in the mineral zircon, and is separated as a by-product when nuclear-grade zirconium is made, because zirconium used in reactors must be free of hafnium. Production is concentrated in France and the United States. There is no NI production. Hafnium is listed in Annex II of the Critical Raw Materials Act, Regulation (EU) 2024/1252, as a critical raw material; the Act applies in NI only in part. Imports into NI of 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Solid hafnium is inert, but fine powder is highly flammable and can ignite on its own when dry. Handling hafnium powder needs a DSEAR (Northern Ireland) 2003 assessment and careful dust control. Compounds such as hafnium tetrachloride react with moisture to release hydrogen chloride and fall under COSHH (Northern Ireland) 2003. Work from the supplier's safety data sheet for the CLP classification and any UN number for transport.</p><h3>How it forms compounds</h3><p>Hafnium forms +4 compounds. The oxide HfO2 is a "high-k" insulator used in modern microchips, and hafnium carbide is among the most heat-resistant materials known. Hafnium absorbs neutrons well, so it is used in reactor control rods. Because of that nuclear use, hafnium metal and some products may need an export licence.</p><h3>Climate, carbon and the environment</h3><p>Hafnium is part of the supply chain for advanced semiconductors, aerospace superalloys and nuclear power. Its production depends on zirconium chemistry, which uses chlorination and solvent extraction and creates chemical wastes. Scrap chips and electronics fall under the WEEE Regulations 2013. Hafnium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>Export-control listing for hafnium, and whether the EU Dual-Use Regulation (EU) 2021/821 or the UK Export Control Order 2008 governs NI exports.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex II (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006, REACH (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li></ul>
Ta:
  z: 73
  name: Tantalum
  html: '<h3>Where it comes from</h3><p>Tantalum is mined mainly as coltan (columbite-tantalite) in Central Africa, especially the Democratic Republic of Congo and Rwanda, and in Brazil and Australia. Artisanal coltan mining in eastern Congo has funded armed groups. For that reason tantalum is one of the four "conflict minerals". Regulation (EU) 2017/821 applies in NI, implemented by the Conflict Minerals (Compliance) (Northern Ireland) (EU Exit) Regulations 2020. Importers into NI of tantalum ores, concentrates and metal above the volume thresholds must carry out supply-chain due diligence, have it audited and report each year. The competent authority is the Conflict Minerals National Competent Authority at the FCDO. The rules do not apply in GB. Tantalum is also a critical raw material under Annex II of Regulation (EU) 2024/1252, which applies in NI in part. There is no NI production.</p><h3>Handling it</h3><p>Tantalum metal is very inert and is used in surgical implants. Fine tantalum powder, as used to make capacitors, is flammable and can form explosive dust clouds, so a DSEAR (Northern Ireland) 2003 assessment is needed. Compounds such as tantalum pentachloride react with moisture to give corrosive fumes and fall under COSHH (Northern Ireland) 2003. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Tantalum usually forms +5 compounds. Its oxide film, Ta2O5, is a very good insulator, which is why tantalum capacitors are small and reliable; most phones, laptops and car electronics contain them. No REACH Annex XVII restriction specific to tantalum has been identified.</p><h3>Climate, carbon and the environment</h3><p>The main concern is social rather than climate: human rights and conflict in the supply chain. Processing uses hydrofluoric acid and creates fluoride wastes, and some tantalum ores carry uranium and thorium. Recovery from scrap electronics is limited; electronic equipment is handled under the WEEE Regulations 2013. Tantalum is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>The Annex I volume thresholds of Regulation (EU) 2017/821.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2017/821/oj" target="_blank" rel="noopener">Regulation (EU) 2017/821, conflict minerals (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2020/1664/contents/made" target="_blank" rel="noopener">Conflict Minerals (Compliance) (Northern Ireland) (EU Exit) Regulations 2020 (legislation.gov.uk)</a></li><li><a href="https://www.gov.uk/guidance/importing-conflict-minerals-into-northern-ireland" target="_blank" rel="noopener">Importing conflict minerals into Northern Ireland (GOV.UK)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annex II (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li></ul>'
W:
  z: 74
  name: Tungsten
  html: '<h3>Where it comes from</h3><p>Tungsten is mined from wolframite and scheelite, with China producing most of the world''s supply. Tungsten is a conflict mineral: Regulation (EU) 2017/821 applies in NI through the Conflict Minerals (Compliance) (Northern Ireland) (EU Exit) Regulations 2020. Importers into NI of tungsten ores, concentrates and metal above the volume thresholds must carry out supply-chain due diligence, have it audited and report each year to the Conflict Minerals National Competent Authority at the FCDO. These rules do not apply in GB. Tungsten is also both a strategic raw material (Annex I) and a critical raw material (Annex II) under Regulation (EU) 2024/1252. That Act applies in NI only in part: the product rules apply, the strategic-project and stockpiling machinery does not. There is no tungsten mine in NI.</p><h3>Handling it</h3><p>Solid tungsten is of low hazard. The real exposure in industry is to hard-metal dust, tungsten carbide bonded with cobalt, from grinding and sharpening cutting tools, drills and saw tips. Cobalt in that dust is a skin and respiratory sensitiser, so control under COSHH (Northern Ireland) 2003, with extraction and health surveillance, is essential. Fine tungsten powder can burn, so a DSEAR (Northern Ireland) 2003 assessment applies. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Tungsten forms compounds from +2 to +6; the oxide WO3 and the tungstate ion are the common forms. Tungsten carbide, WC, is one of the hardest materials made and dominates cutting tools and mining bits. Its very high melting point suits welding electrodes and furnace parts. No REACH Annex XVII restriction specific to tungsten has been identified.</p><h3>Climate, carbon and the environment</h3><p>Tungsten mining and refining are energy-intensive, and tailings can carry arsenic and other metals. Tungsten carbide scrap is valuable and widely recycled. Tungsten is not one of the UK CBAM sectors as such; where a tungsten-containing item may fall under an iron and steel code, a customs specialist is needed.</p><h3>Not yet verified</h3><p>The Annex I volume thresholds of Regulation (EU) 2017/821.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2017/821/oj" target="_blank" rel="noopener">Regulation (EU) 2017/821, conflict minerals (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2020/1664/contents/made" target="_blank" rel="noopener">Conflict Minerals (Compliance) (Northern Ireland) (EU Exit) Regulations 2020 (legislation.gov.uk)</a></li><li><a href="https://www.gov.uk/guidance/importing-conflict-minerals-into-northern-ireland" target="_blank" rel="noopener">Importing conflict minerals into Northern Ireland (GOV.UK)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">Carbon border adjustment mechanism (CBAM): policy summary (GOV.UK, updated 2 November 2026)</a></li></ul>'
Re:
  z: 75
  name: Rhenium
  html: <h3>Where it comes from</h3><p>Rhenium is one of the rarest elements in the Earth's crust. It is recovered as a by-product of molybdenum roasting, which itself comes from copper mining, mainly in Chile, the United States and Poland. Rhenium is also recycled from spent catalysts and alloy scrap. There is no NI production. Rhenium is not on the EU strategic or critical raw materials lists in Regulation (EU) 2024/1252. Imports into NI of 1 tonne or more a year would need EU REACH registration, which few users reach.</p><h3>Handling it</h3><p>Rhenium metal is of low hazard. Ammonium perrhenate and rhenium heptoxide are oxidising and irritant, and fine metal powder can burn. Compounds fall under COSHH (Northern Ireland) 2003, and powders under DSEAR (Northern Ireland) 2003. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Rhenium forms compounds across a wide range of oxidation states, most commonly +7 in perrhenate (ReO4-) and the oxide Re2O7. Its two main uses are nickel superalloys for jet-engine turbine blades and platinum-rhenium catalysts used to make high-octane petrol in oil refineries. No REACH Annex XVII restriction specific to rhenium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Rhenium's use is tied to aviation and fossil-fuel refining. Spent refinery catalysts are hazardous waste in many cases and are sent for metal recovery because rhenium and platinum are valuable; in NI the Hazardous Waste Regulations (Northern Ireland) 2005 govern their movement. Rhenium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2005/300/contents/made" target="_blank" rel="noopener">Hazardous Waste Regulations (Northern Ireland) 2005 (legislation.gov.uk)</a></li></ul>
Os:
  z: 76
  name: Osmium
  html: <h3>Where it comes from</h3><p>Osmium is a platinum group metal, recovered in tiny amounts from the refining of platinum and nickel ores, mainly in South Africa and Russia. There is no NI production. Platinum group metals are both strategic and critical raw materials under Regulation (EU) 2024/1252, which applies in NI in part.</p><h3>Handling it</h3><p>The metal itself is inert, but finely divided osmium slowly oxidises in air to osmium tetroxide, OsO4. Osmium tetroxide is volatile and highly toxic. Its vapour attacks the eyes and lungs, and it can cause blindness. It is used in laboratories to stain samples for electron microscopy and in some chemical syntheses, and it must only be handled in a fume cupboard under a COSHH (Northern Ireland) 2003 assessment, with emergency arrangements for spills. Work from the supplier's safety data sheet, which gives the EU CLP classification and transport details.</p><h3>How it forms compounds</h3><p>Osmium forms compounds in many oxidation states, up to +8 in osmium tetroxide. Its alloys with iridium are very hard and were used in pen nibs and instrument pivots. No REACH Annex XVII restriction specific to osmium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Volumes are tiny, so osmium has no real climate footprint of its own; it shares the high energy use of platinum group metal mining. Laboratory waste containing osmium tetroxide is hazardous waste under the Hazardous Waste Regulations (Northern Ireland) 2005 and needs a specialist contractor. Osmium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>The harmonised CLP classification and UN number for osmium tetroxide.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2005/300/contents/made" target="_blank" rel="noopener">Hazardous Waste Regulations (Northern Ireland) 2005 (legislation.gov.uk)</a></li></ul>
Ir:
  z: 77
  name: Iridium
  html: '<h3>Where it comes from</h3><p>Iridium is a platinum group metal, recovered as a by-product of platinum and nickel refining, mostly in South Africa. Annual world output is only a few tonnes. There is no NI production. Platinum group metals are both strategic (Annex I) and critical (Annex II) raw materials under Regulation (EU) 2024/1252. The Act applies in NI only in part: the product rules apply, the strategic-project and stockpiling machinery does not.</p><h3>Handling it</h3><p>Iridium metal is one of the most corrosion-resistant metals and is of low hazard. The form that matters most for safety is radioactive iridium-192, the workhorse of industrial radiography. Contractors use it to X-ray welds in pipelines, pressure vessels and steel structures, including on NI fabrication sites. These sources are controlled under the Ionising Radiations Regulations (Northern Ireland) 2017 and the Radioactive Substances Act 1993. Radiography sources can also fall within the High-activity Sealed Radioactive Sources and Orphan Sources Regulations 2005, which require security, records and financial provision for disposal. Iridium compounds fall under COSHH (Northern Ireland) 2003; work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Iridium forms compounds mostly at +3 and +4, such as iridium oxide, IrO2. Iridium oxide is the catalyst at the oxygen side of PEM electrolysers that split water to make hydrogen. Iridium is also used in spark-plug tips. No REACH Annex XVII restriction specific to iridium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Iridium supply could limit the growth of PEM electrolysis for green hydrogen, so research aims to cut iridium loadings and recycle it. Platinum group metal mining is energy-intensive, mainly from deep mining and ore processing. Spent electrolysers, catalysts and electronics should go to precious metal recovery; electronic items fall under the WEEE Regulations 2013. Iridium is not in UK CBAM scope, although hydrogen is.</p><h3>Not yet verified</h3><p>Which activity levels of iridium-192 sources bring them within the HASS 2005 Regulations, and whether those Regulations have been amended for NI.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2005/2686/contents/made" target="_blank" rel="noopener">High-activity Sealed Radioactive Sources and Orphan Sources Regulations 2005 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">Carbon border adjustment mechanism (CBAM): policy summary (GOV.UK, updated 2 November 2026)</a></li></ul>'
Pt:
  z: 78
  name: Platinum
  html: '<h3>Where it comes from</h3><p>Platinum is mined mainly in South Africa''s Bushveld Complex and in Russia and Zimbabwe, and is also recovered in large amounts from scrap catalytic converters, jewellery and electronics. There is no NI production. Platinum group metals are both strategic (Annex I) and critical (Annex II) raw materials under the Critical Raw Materials Act, Regulation (EU) 2024/1252. The Act applies in NI only in part: the product rules apply, the strategic-project and stockpiling machinery does not. Imports into NI of 1 tonne or more a year of platinum substances need EU REACH registration.</p><h3>Handling it</h3><p>Platinum metal is inert and is used in medical implants and jewellery. The serious workplace hazard is soluble platinum salts, such as chloroplatinates, made in catalyst manufacture and refining. They are potent respiratory and skin sensitisers: once a worker is sensitised, very small exposures can trigger asthma. Control under COSHH (Northern Ireland) 2003 means enclosure, extraction and health surveillance. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Platinum forms compounds mainly at +2 and +4, often with chloride or ammonia attached. Its key value is as a catalyst. It cleans exhaust gases in catalytic converters, turns ammonia into nitric acid for fertiliser, upgrades petrol in refineries, and drives fuel cells and PEM electrolysers. No REACH Annex XVII restriction specific to platinum has been identified.</p><h3>Climate, carbon and the environment</h3><p>Platinum cuts pollution in use: catalytic converters remove carbon monoxide, hydrocarbons and nitrogen oxides from vehicle exhaust. Mining it is energy-intensive and, in South Africa, relies on coal-fired power. In nitric acid plants, platinum-rhodium gauze also produces nitrous oxide, a strong greenhouse gas, which is why those plants fit abatement catalysts. Fuel cells and electronics at end of life fall under the WEEE Regulations 2013. Platinum is not in UK CBAM scope; fertiliser and hydrogen, which platinum helps make, are.</p><h3>Not yet verified</h3><p>Whether nitrous oxide from nitric acid production is a listed activity under the UK ETS Order 2020 (believed to be).</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2024/1252/oj" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006, REACH (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2020/1265/contents/made" target="_blank" rel="noopener">Greenhouse Gas Emissions Trading Scheme Order 2020 (legislation.gov.uk)</a></li><li><a href="https://www.gov.uk/government/publications/carbon-border-adjustment-mechanism-cbam-policy-summary/carbon-border-adjustment-mechanism-cbam-policy-summary" target="_blank" rel="noopener">Carbon border adjustment mechanism (CBAM): policy summary (GOV.UK, updated 2 November 2026)</a></li></ul>'
Au:
  z: 79
  name: Gold
  html: <h3>Where it comes from</h3><p>Gold is mined worldwide, and much of each year's supply is recycled. The Sperrin Mountains in Co Tyrone hold gold-bearing quartz veins. There was a small mine at Cavanacaw near Omagh, and a large mine has been proposed at Curraghinalt, near Gortin. In NI, gold and silver are not vested in the Department for the Economy under the Mineral Development Act (Northern Ireland) 1969. They are excepted as Crown minerals (section 4), the old "mines royal", so they need a Crown licence as well as planning permission. Gold is a conflict mineral. Regulation (EU) 2017/821 applies in NI through the Conflict Minerals (Compliance) (Northern Ireland) (EU Exit) Regulations 2020. Importers into NI of gold above the volume thresholds must carry out supply-chain due diligence and report to the Conflict Minerals National Competent Authority at the FCDO. This does not apply in GB.</p><h3>Handling it</h3><p>Gold metal is inert and non-toxic. The hazards lie in processing. Mines extract gold with sodium cyanide, artisanal miners use mercury, and plating uses cyanide baths. Cyanides are acutely toxic and fall under COSHH (Northern Ireland) 2003; a large stock can bring a site within COMAH (Northern Ireland) 2015. Work from the supplier's safety data sheet.</p><h3>How it forms compounds</h3><p>Gold is the least reactive metal, forming compounds mainly at +1 and +3, such as gold cyanide complexes and gold chloride. Electronics use thin gold coatings for reliable contacts. No REACH Annex XVII restriction specific to gold has been identified.</p><h3>Climate, carbon and the environment</h3><p>Gold has one of the highest carbon footprints per kilogram of any metal, because each tonne of ore holds only a few grams. Tailings can contain cyanide, arsenic and heavy metals, and artisanal gold mining is the largest source of man-made mercury emissions. Recycling gold from electronics, under the WEEE Regulations 2013, has a much lower footprint. Gold is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>The Crown Estate's role as licensor of gold and silver in NI; the current status of the Curraghinalt planning application; the Annex I thresholds of Regulation (EU) 2017/821; COMAH thresholds for cyanide.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/apni/1969/35/contents" target="_blank" rel="noopener">Mineral Development Act (Northern Ireland) 1969 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2017/821/oj" target="_blank" rel="noopener">Regulation (EU) 2017/821, conflict minerals (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2020/1664/contents/made" target="_blank" rel="noopener">Conflict Minerals (Compliance) (Northern Ireland) (EU Exit) Regulations 2020 (legislation.gov.uk)</a></li><li><a href="https://www.gov.uk/guidance/importing-conflict-minerals-into-northern-ireland" target="_blank" rel="noopener">Importing conflict minerals into Northern Ireland (GOV.UK)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2015/325/contents/made" target="_blank" rel="noopener">Control of Major Accident Hazards Regulations (Northern Ireland) 2015 (legislation.gov.uk)</a></li></ul>
Hg:
  z: 80
  name: Mercury
  html: '<h3>Where it comes from</h3><p>Mercury is produced from cinnabar (mercury sulphide) and as a by-product of zinc, gold and copper refining and of cleaning natural gas. In NI, Regulation (EU) 2017/852 on mercury applies under the Windsor Framework, with NIEA as competent authority. It restricts mercury exports and imports, and an importer needs written NIEA consent before mercury is moved. It has been amended by Regulation (EU) 2024/1849, which also applies in NI and ends most dental amalgam use and more mercury-added products. Imports into NI of 1 tonne or more a year also need EU REACH registration.</p><h3>Handling it</h3><p>Mercury is a liquid metal that gives off toxic vapour at room temperature. Breathing that vapour over time damages the nervous system and kidneys, and organic mercury compounds are even more toxic. Use, storage and spill clean-up fall under COSHH (Northern Ireland) 2003, with workplace exposure limits and, where needed, biological monitoring. For transport, liquid mercury is UN 2809, Class 8, under the Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (Northern Ireland) 2010. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Mercury forms compounds at +1 and +2, such as mercury(II) chloride and mercury sulphide. In water and sediment, bacteria turn it into methylmercury, which builds up in fish. EU REACH Annex XVII restricts mercury in measuring devices and some mercury compounds. RoHS, Directive 2011/65/EU, restricts it in electrical equipment; Regulation (EU) 2023/1542 limits it in batteries.</p><h3>Climate, carbon and the environment</h3><p>Mercury is a persistent, global pollutant. Coal burning, cement kilns and incineration release it, and permits under the Pollution Prevention and Control (Industrial Emissions) Regulations (Northern Ireland) 2013 set controls. It is a priority hazardous substance under the Water Framework Directive (Classification, Priority Substances and Shellfish Waters) Regulations (Northern Ireland) 2015. Old fluorescent lamps, thermometers and amalgam waste are hazardous waste under the Hazardous Waste Regulations (Northern Ireland) 2005. Mercury is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>In-force dates of Regulation (EU) 2024/1849; the exact Annex XVII entries; mercury''s water EQS values and workplace exposure limit.</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/eli/reg/2017/852/oj" target="_blank" rel="noopener">Regulation (EU) 2017/852 on mercury (EUR-Lex)</a></li><li><a href="https://www.daera-ni.gov.uk/articles/mercury-regulation" target="_blank" rel="noopener">Mercury Regulation (DAERA)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2010/160/contents/made" target="_blank" rel="noopener">Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations (Northern Ireland) 2010 (legislation.gov.uk)</a></li><li><a href="https://inchem.org/documents/icsc/icsc/eics0056.htm" target="_blank" rel="noopener">International Chemical Safety Card 0056: Mercury (ILO/WHO, November 2019)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2005/300/contents/made" target="_blank" rel="noopener">Hazardous Waste Regulations (Northern Ireland) 2005 (legislation.gov.uk)</a></li></ul>'
Tl:
  z: 81
  name: Thallium
  html: <h3>Where it comes from</h3><p>Thallium is recovered in small amounts from the flue dusts of zinc, lead and copper smelting and of roasting pyrite. World production is a few tonnes a year. There is no NI production. Thallium is not on the EU strategic or critical raw materials lists in Regulation (EU) 2024/1252. Imports into NI of 1 tonne or more a year would need EU REACH registration.</p><h3>Handling it</h3><p>Thallium and its compounds are among the most toxic metals. They are absorbed through the skin as well as by swallowing and breathing, and poisoning causes nerve damage and hair loss. Any work with thallium compounds needs a strict COSHH (Northern Ireland) 2003 assessment, enclosure and good hygiene. Work from the supplier's safety data sheet, which gives the EU CLP classification and transport details. Radioactive thallium-201 is used in heart imaging and is controlled under the Ionising Radiations Regulations (Northern Ireland) 2017.</p><h3>How it forms compounds</h3><p>Thallium forms compounds at +1 and +3; the +1 compounds behave like potassium in the body, which is why they are so toxic. Thallium is used in specialist optical glass, infrared detectors, some electronics and high-temperature superconductor research. No REACH Annex XVII restriction specific to thallium has been identified.</p><h3>Climate, carbon and the environment</h3><p>Thallium is a pollutant rather than a climate issue. It is released from smelters, coal burning and cement kilns that use pyrite-bearing raw materials. Waste incineration and co-incineration plants permitted under the Pollution Prevention and Control (Industrial Emissions) Regulations (Northern Ireland) 2013 have an emission limit for cadmium and thallium together. Thallium wastes are hazardous waste under the Hazardous Waste Regulations (Northern Ireland) 2005. Thallium is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>The CLP classification and UN numbers of thallium compounds; the combined cadmium and thallium limit value.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2003/34/contents/made" target="_blank" rel="noopener">Control of Substances Hazardous to Health Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2013/160/contents/made" target="_blank" rel="noopener">Pollution Prevention and Control (Industrial Emissions) Regulations (Northern Ireland) 2013 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2005/300/contents/made" target="_blank" rel="noopener">Hazardous Waste Regulations (Northern Ireland) 2005 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li></ul>
Pb:
  z: 82
  name: Lead
  html: '<h3>Where it comes from</h3><p>Lead is mined mainly as galena (lead sulphide), often with zinc and silver. Most supply is now recycled, mainly from lead-acid batteries. NI has a real mining history: lead was worked at Conlig and Whitespots near Newtownards, Co Down, until the nineteenth century, and spoil from those workings remains. Lead is a mineral under the Mineral Development Act (Northern Ireland) 1969, so the Department for the Economy licenses prospecting and mining. Part III of the Waste and Contaminated Land (Northern Ireland) Order 1997 has never been commenced, so NI has no statutory contaminated land regime for old mine sites. Imports into NI of 1 tonne or more a year need EU REACH registration.</p><h3>Handling it</h3><p>Lead is a cumulative poison. It harms the nervous system, kidneys and blood, and lead and its compounds are classified under EU CLP as toxic to reproduction. Work with lead, such as battery recycling or cutting old painted steel, falls under the Control of Lead at Work Regulations (Northern Ireland) 2003, which require risk assessment, control of dust and fume, and blood-lead monitoring where exposure is significant. Work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Lead forms compounds at +2 and +4, such as lead oxide, lead carbonate and lead sulphate in batteries. Under EU REACH Annex XVII, lead is restricted in consumer articles that children may mouth, in PVC (Regulation (EU) 2023/923) and in gunshot used in or around wetlands (Regulation (EU) 2021/57). RoHS restricts lead in electrical equipment, and Regulation (EU) 2023/1542 governs lead-acid batteries.</p><h3>Climate, carbon and the environment</h3><p>Recycled lead needs far less energy than primary lead, but pollution is the bigger issue: lead pipes remain in older NI homes. Drinking water must meet the Water Supply (Water Quality) Regulations (Northern Ireland) 2017, and lead is a priority substance under the 2015 NI water regulations. Lead-acid batteries must be collected and recycled; they and lead wastes are hazardous waste under the Hazardous Waste Regulations (Northern Ireland) 2005. Lead is not in UK CBAM scope.</p><h3>Not yet verified</h3><p>The exact CLP Annex VI entries for lead metal and compounds; the drinking-water value and EQS for lead; the dates when mining at Conlig and Whitespots ended.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2003/35/contents/made" target="_blank" rel="noopener">Control of Lead at Work Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2023/923/oj" target="_blank" rel="noopener">Regulation (EU) 2023/923 on lead and its compounds in PVC (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2021/57/oj" target="_blank" rel="noopener">Regulation (EU) 2021/57 on lead in gunshot in or around wetlands (EUR-Lex)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2023/1542/oj" target="_blank" rel="noopener">Regulation (EU) 2023/1542 on batteries (EUR-Lex)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/212/contents/made" target="_blank" rel="noopener">Water Supply (Water Quality) Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/apni/1969/35/contents" target="_blank" rel="noopener">Mineral Development Act (Northern Ireland) 1969 (legislation.gov.uk)</a></li></ul>'
Bi:
  z: 83
  name: Bismuth
  html: '<h3>Where it comes from</h3><p>Bismuth is almost never mined for itself. It is recovered as a by-product of refining lead, copper and tungsten ores. No bismuth is produced in Northern Ireland, so local firms meet it as an imported metal, alloy or compound. Any importer bringing in 1 tonne or more a year of a bismuth substance into NI needs an EU REACH registration (Regulation (EC) No 1907/2006); a GB registration does not count. Bismuth is listed in the Critical Raw Materials Act (Regulation (EU) 2024/1252) as both a strategic raw material (Annex I) and a critical raw material (Annex II). Only part of that Act applies in NI; the strategic-project and stockpiling articles do not.</p><h3>Handling it</h3><p>Bismuth is one of the least toxic heavy metals, which is why it replaces lead in shot, fishing weights, plumbing brass, free-machining steel and low-temperature solders. Fine powder can still form a combustible dust, so DSEAR (Northern Ireland) 2003 may apply where dust is made. Some compounds, such as bismuth nitrate, are oxidisers or irritants. Assess them under COSHH (Northern Ireland) 2003 and work from the supplier''s safety data sheet.</p><h3>How it forms compounds</h3><p>Bismuth usually forms compounds in the +3 state: the oxide, the oxychloride used in cosmetics, bismuth vanadate (a yellow pigment) and bismuth subsalicylate in stomach remedies. Natural bismuth is very slightly radioactive, but its half-life is so long that it is treated as stable. Its main legal role is indirect: restrictions on lead push manufacturers towards bismuth. In electrical equipment, lead is restricted under the RoHS rules that apply in NI.</p><h3>Climate, carbon and the environment</h3><p>Because bismuth comes from lead and copper smelting, its carbon footprint is shared with those metals, and supply is concentrated in a few countries. It is not a UK CBAM good. Bismuth-bearing electronics go through the WEEE Regulations 2013.</p><h3>Not yet verified</h3><p>CLP classification of individual bismuth compounds; NI water quality standards for bismuth (none found).</p><h3>Sources</h3><ul><li><a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R1252" target="_blank" rel="noopener">Regulation (EU) 2024/1252, Critical Raw Materials Act, Annexes I and II (EUR-Lex, 2024)</a></li><li><a href="https://eur-lex.europa.eu/eli/reg/2006/1907/oj" target="_blank" rel="noopener">Regulation (EC) No 1907/2006, REACH (EUR-Lex)</a></li><li><a href="https://www.gov.uk/government/publications/restriction-of-hazardous-substances-rohs-regulations/rohs-regulations-2012-as-amended-northern-ireland" target="_blank" rel="noopener">RoHS Regulations 2012 as amended: Northern Ireland (GOV.UK)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2003/152/contents/made" target="_blank" rel="noopener">Dangerous Substances and Explosive Atmospheres Regulations (Northern Ireland) 2003 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2013/3113/contents/made" target="_blank" rel="noopener">Waste Electrical and Electronic Equipment Regulations 2013 (legislation.gov.uk)</a></li></ul>'
Po:
  z: 84
  name: Polonium
  html: <h3>Where it comes from</h3><p>Polonium occurs in tiny traces in uranium ores. The polonium that is used is made in nuclear reactors. Ordinary businesses will never handle it in the open.</p><h3>Handling it</h3><p>Polonium-210 is intensely radioactive and is a severe hazard if swallowed or inhaled. Its one industrial use is in sealed sources, such as some anti-static devices. Keeping or using it needs registration under the Radioactive Substances Act 1993, which the Industrial Pollution and Radiochemical Inspectorate (IPRI) of NIEA enforces in NI, unless the Radioactive Substances Exemption (Northern Ireland) Order 2011 applies. Work with it falls under the Ionising Radiations Regulations (Northern Ireland) 2017. It travels as Class 7 (radioactive) goods.</p><h3>How it forms compounds</h3><p>Polonium is chemically like tellurium, but its compounds matter only in research.</p><h3>Climate, carbon and the environment</h3><p>Polonium-210 forms naturally from radon decay. Radioactive waste is controlled under the 1993 Act.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.daera-ni.gov.uk/articles/radiation-overview" target="_blank" rel="noopener">Radiation overview (DAERA)</a></li></ul>
At:
  z: 85
  name: Astatine
  html: <h3>Where it comes from</h3><p>Astatine is the rarest naturally occurring element. Only fleeting traces exist in uranium and thorium ores. Usable amounts are made, a few atoms at a time, in cyclotrons. Ordinary businesses will never meet it.</p><h3>Handling it</h3><p>Astatine-211 is being studied for targeted cancer therapy. Any work with it is radiation work under the Ionising Radiations Regulations (Northern Ireland) 2017, and the keeping and disposal of the material is controlled under the Radioactive Substances Act 1993.</p><h3>How it forms compounds</h3><p>It is the heaviest halogen, below iodine, and behaves partly like a metal. Its chemistry is known only from tracer experiments.</p><h3>Climate, carbon and the environment</h3><p>No environmental role. Its half-lives are hours, so waste decays quickly but is still controlled radioactive waste.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li></ul>
Rn:
  z: 86
  name: Radon
  html: '<h3>Where it comes from</h3><p>Radon is a colourless, odourless radioactive gas. It forms continuously as uranium in rocks and soils decays, and it seeps into buildings through floors. Nobody mines or sells it. Northern Ireland has a real radon issue: some areas have far higher levels than others, depending on geology. NIEA works with the UK Health Security Agency to map radon in homes; the latest NI report (2015) drew on results from over 23,000 homes. The Geological Survey of Northern Ireland''s Tellus survey measured uranium in the ground from the air, and that data supports radon mapping.</p><h3>Handling it</h3><p>The hazard is lung cancer from breathing radon and its decay products over years. For workplaces, the Ionising Radiations Regulations (Northern Ireland) 2017 apply to work in an atmosphere containing radon-222 above an annual average of 300 Bq/m³ (regulation 3(1)(b)). HSENI expects all workplaces in Radon Affected Areas, and all occupied below-ground workplaces anywhere, to be measured; ground floors and basements are most at risk. Employers must also assess radon under the general risk assessment duty. For homes, the action level is 200 Bq/m³. New buildings, extensions and conversions in parts of NI with a 1% or greater chance of exceeding that level must include basic radon protection under building rules.</p><h3>How it forms compounds</h3><p>Radon is a noble gas and forms almost no compounds. No product law applies to it.</p><h3>Climate, carbon and the environment</h3><p>Radon is not a greenhouse gas and plays no part in carbon accounting. It matters for indoor air and for the design of new buildings and remediation (membranes and sumps). Its decay products include lead-210 and polonium-210.</p><h3>Not yet verified</h3><p>The building regulation provision by number (taken from NI Direct, not the regulations themselves).</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2017/229/regulation/3/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017, regulation 3 (legislation.gov.uk)</a></li><li><a href="https://hseni.gov.uk/sites/hseni.gov.uk/files/radon-information-leaflet_0.pdf" target="_blank" rel="noopener">Radon information leaflet (HSENI)</a></li><li><a href="https://nidirect.gov.uk/articles/radon-gas-your-home" target="_blank" rel="noopener">Radon gas in your home (NI Direct)</a></li><li><a href="https://admin.opendatani.gov.uk/dataset/gsni-tellus-regional-airborne-geophysical-survey-radiometrics" target="_blank" rel="noopener">GSNI Tellus regional airborne geophysical survey: radiometrics (OpenDataNI)</a></li><li><a href="https://nora.nerc.ac.uk/id/eprint/511253/1/Appleton%20et%20al%20Radon%20potential%20and%20geology%20in%20Northern%20Ireland_revised_June_2014_ACCEPTED%20VERSION.pdf" target="_blank" rel="noopener">Radon potential and geology in Northern Ireland, Appleton et al. (BGS, 2014)</a></li></ul>'
Fr:
  z: 87
  name: Francium
  html: <h3>Where it comes from</h3><p>Francium exists only fleetingly in uranium ores; its longest-lived isotope has a half-life of about 22 minutes. A few thousand atoms at a time have been made in accelerators. Ordinary businesses will never meet it, and it has no commercial use.</p><h3>Handling it</h3><p>Any laboratory work is radiation work under the Ionising Radiations Regulations (Northern Ireland) 2017, with the material controlled under the Radioactive Substances Act 1993.</p><h3>How it forms compounds</h3><p>It is an alkali metal, below caesium, and would form +1 compounds. Too little has ever existed to study them.</p><h3>Climate, carbon and the environment</h3><p>No environmental role.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li></ul>
Ra:
  z: 88
  name: Radium
  html: <h3>Where it comes from</h3><p>Radium forms naturally from the decay of uranium and thorium. It is no longer extracted for sale. People meet it today in old luminous paint on pre-1960s watches, clocks, compasses and aircraft instruments, and in scale and sludge from some industries (naturally occurring radioactive material).</p><h3>Handling it</h3><p>Radium-226 is radioactive and, once inside the body, settles in bone. Old luminous items should not be opened, sanded or broken. Collectors, museums and dealers holding radium items may need registration under the Radioactive Substances Act 1993 (enforced in NI by NIEA's Industrial Pollution and Radiochemical Inspectorate) unless an exemption in the Radioactive Substances Exemption (Northern Ireland) Order 2011 applies. Work with it falls under the Ionising Radiations Regulations (Northern Ireland) 2017.</p><h3>How it forms compounds</h3><p>Radium is an alkaline earth metal, like barium, and forms +2 salts.</p><h3>Climate, carbon and the environment</h3><p>Radium in groundwater decays to radon. Radioactive waste, including radium-contaminated items, is controlled under the 1993 Act, not ordinary waste law.</p><h3>Not yet verified</h3><p>Whether a given small collection is exempt (depends on the 2011 Order's conditions).</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.daera-ni.gov.uk/articles/radiation-overview" target="_blank" rel="noopener">Radiation overview (DAERA)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li></ul>
Ac:
  z: 89
  name: Actinium
  html: <h3>Where it comes from</h3><p>Actinium occurs in traces in uranium ore. The small amounts used are made in reactors or accelerators. Ordinary businesses will never meet it.</p><h3>Handling it</h3><p>Actinium-225 is being developed for targeted cancer treatment, so it may appear in specialist hospital and research settings. There it is controlled under the Ionising Radiations Regulations (Northern Ireland) 2017 and the Radioactive Substances Act 1993.</p><h3>How it forms compounds</h3><p>It forms +3 compounds, much like lanthanum.</p><h3>Climate, carbon and the environment</h3><p>No environmental role. Waste is controlled radioactive waste under the 1993 Act.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li></ul>
Th:
  z: 90
  name: Thorium
  html: '<h3>Where it comes from</h3><p>Thorium is a weakly radioactive metal found mainly in monazite, a mineral in heavy mineral sands that are mined for rare earths, zirconium and titanium. It is not mined in Northern Ireland. The Geological Survey of Northern Ireland''s Tellus airborne survey (2005 to 2006) mapped thorium, uranium and potassium in the ground across NI, which is the main local data on it. Under the Nuclear Safeguards Act 2018, thorium metal, alloys and compounds, and ores from which they can be derived, are "qualifying nuclear material" for civil safeguards.</p><h3>Handling it</h3><p>People meet thorium in thoriated tungsten welding electrodes (used in TIG welding), older gas mantles and some optical glass. The main risk is breathing dust, for example when grinding thoriated electrodes. Assess it under COSHH (Northern Ireland) 2003; where the radiation dose could be significant, the Ionising Radiations Regulations (Northern Ireland) 2017 apply. Keeping larger amounts may need registration under the Radioactive Substances Act 1993 unless the Radioactive Substances Exemption (Northern Ireland) Order 2011 covers it. Radioactive goods travel as Class 7 under the Carriage of Dangerous Goods Regulations (Northern Ireland) 2010. Work from the supplier''s safety data sheet; non-thoriated electrodes avoid the issue.</p><h3>How it forms compounds</h3><p>Thorium is almost always in the +4 state. Thorium dioxide has one of the highest melting points of any oxide, which is why it was used in mantles and crucibles. Thorium is "fertile": in a reactor it can be turned into fissile uranium-233, which is why it is covered by safeguards law.</p><h3>Climate, carbon and the environment</h3><p>Thorium reactors are proposed as a low-carbon power source, but none operates commercially in the UK. Thorium in mineral processing residues is a naturally occurring radioactive material issue. Thorium waste is controlled under the 1993 Act.</p><h3>Not yet verified</h3><p>Harmonised CLP classification for thorium compounds; the NI exemption thresholds for thoriated electrodes.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/2018/15/section/1" target="_blank" rel="noopener">Nuclear Safeguards Act 2018, section 1 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.daera-ni.gov.uk/articles/radiation-overview" target="_blank" rel="noopener">Radiation overview (DAERA)</a></li><li><a href="https://admin.opendatani.gov.uk/dataset/gsni-tellus-regional-airborne-geophysical-survey-radiometrics" target="_blank" rel="noopener">GSNI Tellus regional airborne geophysical survey: radiometrics (OpenDataNI)</a></li></ul>'
Pa:
  z: 91
  name: Protactinium
  html: <h3>Where it comes from</h3><p>Protactinium occurs in tiny traces in uranium ore and is one of the rarest natural elements. Ordinary businesses will never meet it.</p><h3>Handling it</h3><p>It is highly radiotoxic. The little that exists is used only in research, under the Ionising Radiations Regulations (Northern Ireland) 2017 and the Radioactive Substances Act 1993.</p><h3>How it forms compounds</h3><p>It forms mainly +5 compounds, which readily hydrolyse in water.</p><h3>Climate, carbon and the environment</h3><p>Geologists use protactinium-231 to date ocean sediments. It has no pollution or carbon role.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li></ul>
U:
  z: 92
  name: Uranium
  html: '<h3>Where it comes from</h3><p>Uranium is mined from ores such as uraninite, then refined and enriched for nuclear fuel. There is no uranium mining in Northern Ireland, and uranium is not one of the common rocks excepted from the Mineral Development Act (Northern Ireland) 1969, so any prospecting would need a Department for the Economy licence. Uranium in NI rocks matters for a different reason: it is the source of radon. The Geological Survey of Northern Ireland''s Tellus airborne survey (2005 to 2006) mapped uranium across NI. Under the Nuclear Safeguards Act 2018, uranium metal, alloys and compounds, and ores from which they can be derived, are "qualifying nuclear material" subject to civil safeguards.</p><h3>Handling it</h3><p>Uranium is both chemically toxic (it damages the kidneys) and radioactive. Natural and depleted uranium are weakly radioactive; the main risks are swallowing or inhaling dust. Businesses meet it as depleted uranium in counterweights and radiation shielding, and as uranium compounds in old glazes and laboratory stock. Keeping or using it needs registration under the Radioactive Substances Act 1993, enforced in NI by NIEA''s Industrial Pollution and Radiochemical Inspectorate, unless the Radioactive Substances Exemption (Northern Ireland) Order 2011 applies. Work with it falls under the Ionising Radiations Regulations (Northern Ireland) 2017 and COSHH (Northern Ireland) 2003. It travels as Class 7 radioactive goods under the Carriage of Dangerous Goods Regulations (Northern Ireland) 2010.</p><h3>How it forms compounds</h3><p>Uranium is usually +4 or +6. The compounds that matter are uranium dioxide (reactor fuel), uranium hexafluoride (the gas used in enrichment, which also releases hydrofluoric acid with moisture) and uranyl salts. Nuclear safeguards and export controls govern fuel-cycle materials.</p><h3>Climate, carbon and the environment</h3><p>Nuclear power has very low operational carbon emissions, though mining, enrichment and construction add life-cycle emissions. Uranium is not a UK CBAM good. Its legacy issue is long-lived radioactive waste, controlled under the 1993 Act.</p><h3>Not yet verified</h3><p>CLP harmonised classification for uranium compounds; UN numbers for uranium consignments; the export control regime applying in NI.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/2018/15/section/1" target="_blank" rel="noopener">Nuclear Safeguards Act 2018, section 1 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/apni/1969/35/contents" target="_blank" rel="noopener">Mineral Development Act (Northern Ireland) 1969 (legislation.gov.uk)</a></li><li><a href="https://www.daera-ni.gov.uk/articles/radiation-overview" target="_blank" rel="noopener">Radiation overview (DAERA)</a></li><li><a href="https://admin.opendatani.gov.uk/dataset/gsni-tellus-regional-airborne-geophysical-survey-radiometrics" target="_blank" rel="noopener">GSNI Tellus regional airborne geophysical survey: radiometrics (OpenDataNI)</a></li></ul>'
Np:
  z: 93
  name: Neptunium
  html: <h3>Where it comes from</h3><p>Neptunium is made in nuclear reactors as a by-product of uranium fuel. Ordinary businesses will never meet it.</p><h3>Handling it</h3><p>It is handled only at nuclear sites and research laboratories, under the Ionising Radiations Regulations (Northern Ireland) 2017 and the Radioactive Substances Act 1993, with nuclear safeguards rules where they apply.</p><h3>How it forms compounds</h3><p>It shows several oxidation states, from +3 to +7, and its chemistry resembles that of uranium and plutonium.</p><h3>Climate, carbon and the environment</h3><p>Neptunium-237 is a long-lived part of spent nuclear fuel and so a concern for long-term waste disposal.</p><h3>Not yet verified</h3><p>Whether neptunium is specified as fissionable material in UK safeguards regulations.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/2018/15/contents" target="_blank" rel="noopener">Nuclear Safeguards Act 2018 (legislation.gov.uk)</a></li></ul>
Pu:
  z: 94
  name: Plutonium
  html: '<h3>Where it comes from</h3><p>Plutonium is made in nuclear reactors from uranium-238. The UK holds a large civil stockpile at Sellafield in Cumbria. There is none in Northern Ireland, and ordinary businesses will never meet it.</p><h3>Handling it</h3><p>Plutonium is highly radiotoxic if inhaled and is a nuclear weapons material, so it is among the most tightly controlled substances there are. Civil holdings fall under nuclear safeguards law: the Nuclear Safeguards Act 2018 lets regulations specify fissionable material for safeguards. Work with it falls under the Ionising Radiations Regulations (Northern Ireland) 2017 in NI and the equivalent law in GB, alongside the Radioactive Substances Act 1993.</p><h3>How it forms compounds</h3><p>It shows +3 to +6 states. Plutonium dioxide is the form stored and used in mixed-oxide fuel.</p><h3>Climate, carbon and the environment</h3><p>Plutonium is a long-term waste and security problem rather than a carbon one.</p><h3>Not yet verified</h3><p>The text of the safeguards regulations specifying plutonium.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/2018/15/section/1" target="_blank" rel="noopener">Nuclear Safeguards Act 2018, section 1 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/nisr/2017/229/contents/made" target="_blank" rel="noopener">Ionising Radiations Regulations (Northern Ireland) 2017 (legislation.gov.uk)</a></li></ul>'
Am:
  z: 95
  name: Americium
  html: '<h3>Where it comes from</h3><p>Americium is made in nuclear reactors. It is the one synthetic element most people own: a tiny sealed americium-241 source sits in each ionisation smoke alarm.</p><h3>Handling it</h3><p>In a smoke alarm, the source is sealed and the risk in normal use is negligible. Do not open or break one. Larger americium sources, used in some industrial gauges, need registration under the Radioactive Substances Act 1993 (enforced in NI by NIEA''s Industrial Pollution and Radiochemical Inspectorate) unless the Radioactive Substances Exemption (Northern Ireland) Order 2011 applies. High-activity sources fall under the High-activity Sealed Radioactive Sources and Orphan Sources Regulations 2005. Use of sources at work comes under the Ionising Radiations Regulations (Northern Ireland) 2017.</p><h3>How it forms compounds</h3><p>It is usually +3, as americium dioxide in sources.</p><h3>Climate, carbon and the environment</h3><p>Old smoke alarms are electrical waste; check your council''s arrangements rather than binning them.</p><h3>Not yet verified</h3><p>The exemption conditions for disposing of ionisation smoke alarms in NI.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.daera-ni.gov.uk/articles/radiation-overview" target="_blank" rel="noopener">Radiation overview (DAERA)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2005/2686/contents/made" target="_blank" rel="noopener">High-activity Sealed Radioactive Sources and Orphan Sources Regulations 2005 (legislation.gov.uk)</a></li></ul>'
Cm:
  z: 96
  name: Curium
  html: <h3>Where it comes from</h3><p>Curium is made in nuclear reactors. Ordinary businesses will never meet it.</p><h3>Handling it</h3><p>Curium-244 has been used as a source in scientific instruments, including spacecraft analysers. Any source is controlled under the Radioactive Substances Act 1993, the Ionising Radiations Regulations (Northern Ireland) 2017 and, for high-activity sources, the High-activity Sealed Radioactive Sources and Orphan Sources Regulations 2005.</p><h3>How it forms compounds</h3><p>It is mostly +3, like the lanthanide gadolinium.</p><h3>Climate, carbon and the environment</h3><p>It contributes to the heat and radioactivity of spent nuclear fuel.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/uksi/2005/2686/contents/made" target="_blank" rel="noopener">High-activity Sealed Radioactive Sources and Orphan Sources Regulations 2005 (legislation.gov.uk)</a></li></ul>
Bk:
  z: 97
  name: Berkelium
  html: '<h3>Where it comes from</h3><p>Berkelium is made in milligram amounts in high-flux research reactors. Ordinary businesses will never meet it; its main use is as a target for making heavier elements.</p><h3>Handling it</h3><p>Only specialist laboratories handle it, under radiation law: in the UK, the Radioactive Substances Act 1993 and the Ionising Radiations Regulations (in NI, the 2017 NI Regulations).</p><h3>How it forms compounds</h3><p>It forms +3 and +4 compounds.</p><h3>Climate, carbon and the environment</h3><p>No environmental role.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li></ul>'
Cf:
  z: 98
  name: Californium
  html: <h3>Where it comes from</h3><p>Californium is made in high-flux research reactors. Ordinary businesses will rarely meet it.</p><h3>Handling it</h3><p>Californium-252 is a strong neutron emitter, used in sealed sources to start up reactors, to inspect materials, and in some borehole and moisture logging tools. Sources are controlled under the Radioactive Substances Act 1993, the Ionising Radiations Regulations (Northern Ireland) 2017 and, for high-activity sources, the High-activity Sealed Radioactive Sources and Orphan Sources Regulations 2005.</p><h3>How it forms compounds</h3><p>It is mostly +3.</p><h3>Climate, carbon and the environment</h3><p>No environmental role.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/uksi/2005/2686/contents/made" target="_blank" rel="noopener">High-activity Sealed Radioactive Sources and Orphan Sources Regulations 2005 (legislation.gov.uk)</a></li><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li></ul>
Es:
  z: 99
  name: Einsteinium
  html: '<h3>Where it comes from</h3><p>Einsteinium was first found in debris from the 1952 hydrogen bomb test. Microgram amounts are now made in research reactors. Ordinary businesses will never meet it, and it has no use outside research.</p><h3>Handling it</h3><p>Controlled under radiation law in the laboratories that handle it: in the UK, the Radioactive Substances Act 1993 and the Ionising Radiations Regulations.</p><h3>How it forms compounds</h3><p>It is mostly +3.</p><h3>Climate, carbon and the environment</h3><p>No environmental role.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li></ul>'
Fm:
  z: 100
  name: Fermium
  html: '<h3>Where it comes from</h3><p>Fermium was also found in 1952 bomb-test debris. Only tiny amounts have ever been made, in reactors. Ordinary businesses will never meet it, and it has no use outside research.</p><h3>Handling it</h3><p>Controlled under radiation law in the laboratories that handle it: in the UK, the Radioactive Substances Act 1993 and the Ionising Radiations Regulations.</p><h3>How it forms compounds</h3><p>It is mostly +3, studied only in trace experiments.</p><h3>Climate, carbon and the environment</h3><p>No environmental role.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li></ul>'
Md:
  z: 101
  name: Mendelevium
  html: <h3>Where it comes from</h3><p>Mendelevium is made a few atoms at a time in particle accelerators. Ordinary businesses will never meet it, and it has no use outside research.</p><h3>Handling it</h3><p>Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>It is mostly +3, with a stable +2 state, known only from tracer experiments.</p><h3>Climate, carbon and the environment</h3><p>No environmental role.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li></ul>
'No':
  z: 102
  name: Nobelium
  html: <h3>Where it comes from</h3><p>Nobelium is made a few atoms at a time in particle accelerators. Ordinary businesses will never meet it, and it has no use outside research.</p><h3>Handling it</h3><p>Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>Unusually for an actinide, its most stable state is +2. Its chemistry is known only from single-atom experiments.</p><h3>Climate, carbon and the environment</h3><p>No environmental role.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li></ul>
Lr:
  z: 103
  name: Lawrencium
  html: <h3>Where it comes from</h3><p>Lawrencium, the last actinide, is made a few atoms at a time in particle accelerators. Ordinary businesses will never meet it, and it has no use outside research.</p><h3>Handling it</h3><p>Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>It is expected to be +3; very little chemistry has been done.</p><h3>Climate, carbon and the environment</h3><p>No environmental role.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://www.legislation.gov.uk/ukpga/1993/12/contents" target="_blank" rel="noopener">Radioactive Substances Act 1993 (legislation.gov.uk)</a></li></ul>
Rf:
  z: 104
  name: Rutherfordium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. Its name was confirmed by IUPAC in 1997.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>Expected to behave like hafnium (+4); only single-atom chemistry exists.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noopener">Periodic table of elements (IUPAC)</a></li></ul>
Db:
  z: 105
  name: Dubnium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. It is named after Dubna in Russia, home of the Joint Institute for Nuclear Research.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>Expected to resemble tantalum (+5); only single-atom chemistry exists.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noopener">Periodic table of elements (IUPAC)</a></li></ul>
Sg:
  z: 106
  name: Seaborgium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. It is named after the American chemist Glenn Seaborg.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>Expected to resemble tungsten (+6); single-atom experiments support this.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noopener">Periodic table of elements (IUPAC)</a></li></ul>
Bh:
  z: 107
  name: Bohrium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. It is named after the physicist Niels Bohr.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>Expected to resemble rhenium (+7).</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noopener">Periodic table of elements (IUPAC)</a></li></ul>
Hs:
  z: 108
  name: Hassium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. It is named after the German state of Hesse.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>Like osmium, it forms a volatile tetroxide, shown in single-atom experiments.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noopener">Periodic table of elements (IUPAC)</a></li></ul>
Mt:
  z: 109
  name: Meitnerium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. It is named after the physicist Lise Meitner.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>No chemistry has been done; it is expected to resemble iridium.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noopener">Periodic table of elements (IUPAC)</a></li></ul>
Ds:
  z: 110
  name: Darmstadtium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. It is named after Darmstadt in Germany, where it was first made.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>No chemistry has been done; it is expected to resemble platinum.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noopener">Periodic table of elements (IUPAC)</a></li></ul>
Rg:
  z: 111
  name: Roentgenium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. It is named after Wilhelm Röntgen, who discovered X-rays.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>No chemistry has been done; it is expected to resemble gold.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noopener">Periodic table of elements (IUPAC)</a></li></ul>
Cn:
  z: 112
  name: Copernicium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. It is named after the astronomer Nicolaus Copernicus.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>Single-atom experiments suggest it behaves like a volatile relative of mercury.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noopener">Periodic table of elements (IUPAC)</a></li></ul>
Nh:
  z: 113
  name: Nihonium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators, at RIKEN in Japan. IUPAC approved the name in 2016; "Nihon" is Japanese for Japan.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>Expected to sit below thallium; almost no chemistry has been done.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/iupac-announces-the-names-of-the-elements-113-115-117-and-118/" target="_blank" rel="noopener">IUPAC announces the names of the elements 113, 115, 117 and 118 (IUPAC, 2016)</a></li></ul>
Fl:
  z: 114
  name: Flerovium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. It is named after the Flerov Laboratory of Nuclear Reactions in Dubna, Russia.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>Single-atom experiments suggest it is more volatile than lead, the element above it.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noopener">Periodic table of elements (IUPAC)</a></li></ul>
Mc:
  z: 115
  name: Moscovium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. IUPAC approved the name, after the Moscow region, in 2016.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>Expected to sit below bismuth; almost no chemistry has been done.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/iupac-announces-the-names-of-the-elements-113-115-117-and-118/" target="_blank" rel="noopener">IUPAC announces the names of the elements 113, 115, 117 and 118 (IUPAC, 2016)</a></li></ul>
Lv:
  z: 116
  name: Livermorium
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. It is named after the Lawrence Livermore National Laboratory in California.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>Expected to sit below polonium; no chemistry has been done.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noopener">Periodic table of elements (IUPAC)</a></li></ul>
Ts:
  z: 117
  name: Tennessine
  html: <h3>Where it comes from</h3><p>A few atoms have been made in particle accelerators. IUPAC approved the name, after the US state of Tennessee, in 2016.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>It sits in the halogen group, but is expected to behave more like a metal; no chemistry has been done.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/iupac-announces-the-names-of-the-elements-113-115-117-and-118/" target="_blank" rel="noopener">IUPAC announces the names of the elements 113, 115, 117 and 118 (IUPAC, 2016)</a></li></ul>
Og:
  z: 118
  name: Oganesson
  html: <h3>Where it comes from</h3><p>Only a handful of atoms have been made in particle accelerators. IUPAC approved the name, after the physicist Yuri Oganessian, in 2016. It is the heaviest element known.</p><h3>Handling it</h3><p>No commercial use. Controlled under radiation law in the laboratories that make it.</p><h3>How it forms compounds</h3><p>It sits in the noble gas group, but theory suggests it may not be a gas; no chemistry has been done.</p><h3>Climate, carbon and the environment</h3><p>None.</p><h3>Not yet verified</h3><p>None.</p><h3>Sources</h3><ul><li><a href="https://iupac.org/iupac-announces-the-names-of-the-elements-113-115-117-and-118/" target="_blank" rel="noopener">IUPAC announces the names of the elements 113, 115, 117 and 118 (IUPAC, 2016)</a></li></ul>
