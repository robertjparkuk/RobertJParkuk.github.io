# Dashboards shown on /dashboards/ as a grid, in this order within each group.
# Each card: title, page, thumb (640x400 JPEG in assets/dashboards/), summary (keep to about 40 words),
# as_at (the date line readers see), and an optional related link.
# Add a dashboard here when its page in tools/dashboards/ goes live; take a new thumbnail at the same time.

- group: "Rules and deadlines"
  intro: "Dated rule changes, carbon border charges and consultations that Northern Ireland firms and councils need to act on."
  items:
    - title: "NI Regulatory Horizon"
      page: /tools/dashboards/ni-regulatory-horizon.html
      thumb: /assets/dashboards/ni-regulatory-horizon.jpg
      summary: "Every dated rule change, deadline and consultation close that matters to NI businesses and councils, from November 2026 to December 2028. Who it affects, where it applies, how firm it is and what to do, each with its official source."
      as_at: "Dates checked 11 November 2026"
      related_title: "Two-Regime Readiness Review"
      related: /cbam-desk/
    - title: "CBAM Exposure Tracker"
      page: /tools/dashboards/cbam-exposure-tracker.html
      thumb: /assets/dashboards/cbam-exposure-tracker.jpg
      summary: "Who in Northern Ireland pays a carbon border charge, from when and at what price. The EU and UK CBAMs side by side, quarterly EU certificate prices, NI goods trade with the EU, and goods arriving in NI from Ireland."
      as_at: "Rules checked 11 November 2026; trade figures as at 22 October 2026"
      related_title: "CBAM and CSRD: what NI manufacturers need to know"
      related: /blog/2026/10/cbam-and-csrd-for-ni-manufacturers/
    - title: "EU Law and the Windsor Framework"
      page: /tools/dashboards/eu-law-windsor-framework.html
      thumb: /assets/dashboards/eu-law-windsor-framework.jpg
      summary: "Which EU laws apply in Northern Ireland, every Stormont Brake case and new EU act added since 2024, how NI rules reach businesses in Great Britain, and open UK, Commission and Irish government consultations."
      as_at: "Checked 11 November 2026"
    - title: "NI Consultations Monitor"
      page: /tools/dashboards/ni-consultations-monitor.html
      thumb: /assets/dashboards/ni-consultations-monitor.jpg
      summary: "Every open public consultation at the 11 councils, the nine Stormont departments and UK Government where NI is in scope, with closing dates and how often each body publishes a response to what it was told."
      as_at: "Updated every Friday"
      related_title: "Consultation responses"
      related: /public-sector/consultation-responses/

