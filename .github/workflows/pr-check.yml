# Builds the site for every pull request, exactly as GitHub Pages does,
# and fails on things the house rules forbid. Runs on pull requests into main
# and again on every push to main, so a direct push that breaks a rule still
# shows a failed check (and GitHub emails the owner). It never publishes anything.

name: PR check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Jekyll (same action as GitHub Pages), future posts included
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          future: true

      - name: Build again as GitHub Pages does on a normal day (future posts hidden)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site_today
          future: false

      - name: Fail on YAML front-matter warnings
        run: |
          # jekyll-build-pages prints "YAML Exception reading" for a page whose front matter does not parse
          python3 - <<'PY'
          import glob,re,sys,yaml
          bad=[]
          for f in glob.glob('**/*.md',recursive=True)+glob.glob('*.html'):
              t=open(f,encoding='utf-8').read()
              if not t.startswith('---'): continue
              fm=t.split('---',2)[1]
              try: yaml.safe_load(fm)
              except Exception as e: bad.append(f"{f}: {e}")
          if bad: print("::error::Front matter does not parse:\n"+"\n".join(bad)); sys.exit(1)
          print("front matter parses")
          PY

      - name: House-rule checks on the built site
        run: |
          fail=0
          check() { if grep -rIl --include='*.html' -E "$1" _site >/dev/null; then echo "::error::Found forbidden pattern: $2"; grep -rIl --include='*.html' -E "$1" _site | head; fail=1; fi; }
          check 'robertjparkuk\.github\.io' "old github.io address"
          check 'fonts\.googleapis|fonts\.gstatic' "Google Fonts request"
          check '<script[^>]+src="https?://' "external script"
          exit $fail

      - name: Personal mobile check (number stored only as a hash)
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python3 - <<'PY'
          import glob,hashlib,re,subprocess,sys
          H="40cb74e35292ac81c85c58804c7ca9a986d48a29be24d8392f3f539364026e4e"
          pat=re.compile(r'(?:\+44\s?\(?0?\)?\s?|\b0)7\d{3}[\s.-]?\d{3}[\s.-]?\d{3}\b')
          def hit(text):
              for m in pat.finditer(text):
                  d=re.sub(r'\D','',m.group(0))
                  if d.startswith('44'): d='0'+d[2:]
                  d=d[-11:]
                  if hashlib.sha256(b'rjp-house-rule:'+d.encode()).hexdigest()==H: return True
              return False
          bad=[]
          for f in glob.glob('_site/**/*',recursive=True):
              if f.endswith(('.html','.xml','.txt','.json','.csv','.md')):
                  try:
                      if hit(open(f,encoding='utf-8',errors='ignore').read()): bad.append(f)
                  except IsADirectoryError: pass
          for f in [x for x in glob.glob('**/*.pdf',recursive=True) if not x.startswith(('_site','_site_today','vendor'))]:
              t=subprocess.run(['pdftotext',f,'-'],capture_output=True,text=True).stdout
              if hit(t): bad.append(f)
          if bad: print("::error::The personal mobile number appears in:\n"+"\n".join(bad)); sys.exit(1)
          print("personal mobile not found")
          PY

      - name: House-rule checks on PDFs and data files
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          fail=0
          for f in $(find . -name '*.pdf' -not -path './_site*' -not -path './.git/*' -not -path './vendor/*'); do
            if pdftotext "$f" - 2>/dev/null | grep -qE 'robertjparkuk\.github\.io'; then echo "::error::$f carries the old address"; fail=1; fi
          done
          python3 - <<'PY' || fail=1
          import glob,json,sys,collections,re
          bad=[]
          for f in glob.glob('data/**/*.json',recursive=True):
              try: rows=json.load(open(f,encoding='utf-8'))
              except Exception as e: bad.append(f"{f}: {e}"); continue
              if isinstance(rows,list) and rows and isinstance(rows[0],dict) and 'title' in rows[0] and 'body' in rows[0]:
                  norm=lambda t: re.sub(r'[^a-z0-9]+',' ',str(t).lower()).strip()
                  c=collections.Counter((r.get('body'),norm(r.get('title'))) for r in rows)
                  for k,n in c.items():
                      if n>1: bad.append(f"{f}: same body and title listed {n} times: {k}")
          if bad: print("::error::Data checks failed:\n"+"\n".join(bad)); sys.exit(1)
          print("PDF and data checks pass")
          PY
          exit $fail

      - name: Check the home page has one fixed hero
        run: |
          h1=$(grep -c '<h1' _site/index.html); echo "h1 on home page: $h1"
          test "$h1" -eq 1 || { echo "::error::Home page should have exactly one h1"; exit 1; }
          grep -q 'across two regimes' _site/index.html || { echo "::error::Fixed hero line missing"; exit 1; }
          if grep -q 'Math.random' _site/index.html; then echo "::error::Hero rotation script is back"; exit 1; fi
          echo "Latest thinking items: $(grep -o 'class="post-list latest-list"' -c _site/index.html)"
