# Builds the site for every pull request, exactly as GitHub Pages does,
# and fails on things the house rules forbid. Runs on pull requests only;
# it never publishes anything.

name: PR check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Jekyll (same action as GitHub Pages), future posts included
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          future: true

      - name: House-rule checks on the built site
        run: |
          fail=0
          check() { if grep -rIl --include='*.html' -E "$1" _site >/dev/null; then echo "::error::Found forbidden pattern: $2"; grep -rIl --include='*.html' -E "$1" _site | head; fail=1; fi; }
          check '07595 ?157 ?825|07595157825' "personal mobile number"
          check 'robertjparkuk\.github\.io' "old github.io address"
          check 'fonts\.googleapis|fonts\.gstatic' "Google Fonts request"
          check '<script[^>]+src="https?://' "external script"
          exit $fail

      - name: Check the home page has one fixed hero
        run: |
          h1=$(grep -c '<h1' _site/index.html); echo "h1 on home page: $h1"
          test "$h1" -eq 1 || { echo "::error::Home page should have exactly one h1"; exit 1; }
          grep -q 'across two regimes' _site/index.html || { echo "::error::Fixed hero line missing"; exit 1; }
          if grep -q 'Math.random' _site/index.html; then echo "::error::Hero rotation script is back"; exit 1; fi
          echo "Latest thinking items: $(grep -o 'class="post-list latest-list"' -c _site/index.html)"
